# Local test override — NOT for VPS deployment
# Usage: docker compose -f docker-compose.yml -f docker-compose.local.yml up -d

services:
  cliproxy:
    image: eceasy/cli-proxy-api:latest
    pull_policy: always
    build: !reset null
    ports:
      - "8317:8317"
    volumes:
      - ./cliproxy/config.yaml:/CLIProxyAPI/config.yaml.tpl:ro
      - cliproxy_auth:/root/.cli-proxy-api
    environment:
      CLIPROXY_KEY: ${CLIPROXY_KEY}
    entrypoint: ["/bin/sh", "-c", "sed 's/CLIPROXY_KEY_PLACEHOLDER/'\"$$CLIPROXY_KEY\"'/' /CLIProxyAPI/config.yaml.tpl > /CLIProxyAPI/config.yaml && ./CLIProxyAPI"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8317"]

  openclaw:
    build: !reset null
    image: ghcr.io/openclaw/openclaw:latest
    pull_policy: always
    user: root
    ports:
      - "18789:18789"
    volumes:
      - ~/.openclaw:/root/.openclaw
      - ~/.openclaw-auth-profile-secrets:/root/.config/openclaw
      - shared_videos:/videos
      - ./openclaw/entrypoint.sh:/entrypoint.sh:ro
    environment:
      HOME: /root
      OPENCLAW_HOME: /root
      OPENCLAW_STATE_DIR: /root/.openclaw
      OPENCLAW_CONFIG_PATH: /root/.openclaw/openclaw.json
      OPENCLAW_CONFIG_DIR: /root/.openclaw
      OPENCLAW_WORKSPACE_DIR: /root/.openclaw/workspace
      OPENCLAW_DISABLE_BONJOUR: "1"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_PASSWORD: ${OPENCLAW_PASSWORD}
      OPENCLAW_TELEGRAM_BOT_TOKEN_FOR_REELBOT: ${OPENCLAW_TELEGRAM_BOT_TOKEN_FOR_REELBOT:-}
      OPENCLAW_TELEGRAM_OWNER_ID_FOR_REELBOT: ${OPENCLAW_TELEGRAM_OWNER_ID_FOR_REELBOT:-}
      CLIPROXY_URL: ${CLIPROXY_URL:-http://cliproxy:8317/v1}
      CLIPROXY_KEY: ${CLIPROXY_KEY}
      OPENCLAW_DEFAULT_MODEL: ${OPENCLAW_DEFAULT_MODEL:-cliproxy/gpt-5-nano}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["node", "dist/index.js", "gateway", "--bind", "lan", "--port", "18789"]

  arcreel:
    ports:
      - "1241:1241"
    environment:
      DATABASE_URL: postgresql+asyncpg://admin:${POSTGRES_PASSWORD}@postgres:5432/arcreel
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - NET_ADMIN

  pipeline-api:
    ports:
      - "8000:8000"

  nginx:
    profiles: [vps-only]

  certbot:
    profiles: [vps-only]

volumes:
  cliproxy_auth:
    name: content-stack-cliproxy-auth
