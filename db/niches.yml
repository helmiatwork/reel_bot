# Niche matrix — 3 tier: vertikal (root) → niche → micro-niche
# Sumber tier-2: db/niches.sql (106 niche). Tier-3 (micro) di-author.
version: 1
verticals:
  - slug: v-alam
    name: Alam
    description: Konten alam, hewan, dan satwa liar dengan visual relaksasi atau fakta.
    niches:
      - slug: pet-animals
        name: "Hewan / Pet"
        description: Footage hewan lucu + cerita.
        faceless: true
        difficulty: menengah
        rpm: rendah
        formats: footage + caption + musik
        example_hook: "Kucing ini tiap hari nungguin..."
        micro:
          - slug: pet-animals-kucing-viral
            name: Kucing Viral Indonesia
            description: Momen lucu dan menggemaskan kucing peliharaan lokal, dirangkum dari konten viral untuk penonton pecinta kucing.
            example_hook: "Kucing ini tiap hari nungguin majikannya pulang kerja, sampai suatu hari..."
          - slug: pet-animals-anjing-golden
            name: Anjing Golden & Labrador
            description: Footage anjing ras populer yang setia dan lucu, menyasar penonton keluarga muda yang tertarik punya anjing peliharaan.
            example_hook: "Anjing ini nangis setiap kali bayinya dibawa masuk, bukan karena cemburu..."
          - slug: pet-animals-hewan-exotic
            name: Hewan Peliharaan Eksotik
            description: Konten hewan peliharaan tidak biasa seperti musang, landak, atau reptil, untuk penonton yang tertarik dunia pet di luar kucing-anjing.
            example_hook: "Dia pelihara ular di apartemen, dan tetangganya gak pernah tahu..."

      - slug: wildlife
        name: "Satwa Liar / Fakta Hewan"
        description: Fakta & footage satwa.
        faceless: true
        difficulty: menengah
        rpm: sedang
        formats: footage + voiceover
        example_hook: "Hewan ini bisa hidup tanpa kepala..."
        micro:
          - slug: wildlife-predator-ekstrem
            name: Predator Paling Mematikan
            description: Fakta mengejutkan tentang predator puncak di darat dan laut, untuk penonton yang suka konten sains alam yang menegangkan.
            example_hook: "Buaya ini gak butuh makan selama 2 tahun, tapi tetap berbahaya..."
          - slug: wildlife-hewan-indonesia
            name: Satwa Liar Endemik Indonesia
            description: Fakta dan footage satwa yang hanya ada di Indonesia seperti komodo, anoa, dan babirusa, menyasar kebanggaan lokal.
            example_hook: "Hewan ini cuma ada di satu pulau di Indonesia, dan hampir punah..."
          - slug: wildlife-adaptasi-ekstrem
            name: Adaptasi Hewan di Habitat Ekstrem
            description: Satwa yang berevolusi bertahan di kondisi ekstrem — gurun, kutub, laut dalam — untuk penonton sains kasual yang suka fakta mengejutkan.
            example_hook: "Ikan ini hidup di 8.000 meter di bawah laut, tempat manusia gak bisa bertahan..."

      - slug: nature-relax
        name: "Alam / Relaxing"
        description: Footage alam + lo-fi.
        faceless: true
        difficulty: pemula
        rpm: rendah
        formats: footage sinematik + musik
        example_hook: "Berhenti scroll, tarik napas..."
        micro:
          - slug: nature-relax-hutan-indonesia
            name: Hutan Tropis Indonesia ASMR
            description: Footage sinematik hutan hujan Indonesia dengan suara alam asli dan musik lo-fi, untuk penonton yang butuh jeda dari hiruk-pikuk kota.
            example_hook: "Berhenti scroll sebentar. Dengarkan ini..."
          - slug: nature-relax-pantai-sunset
            name: Pantai & Sunset Nusantara
            description: Timelapse dan footage pantai-pantai Indonesia saat golden hour, cocok untuk penonton yang merindukan suasana laut.
            example_hook: "5 menit ini akan reset mood kamu yang rusak seharian..."
          - slug: nature-relax-gunung-kabut
            name: Pegunungan & Kabut Pagi
            description: Footage pegunungan Indonesia dengan kabut pagi dan suara alam, menyasar penonton urban yang kangen suasana dingin dan tenang.
            example_hook: "Kalau kamu lelah, tonton ini dulu sebelum tidur..."

      - slug: aquarium
        name: "Aquascape / Ikan"
        description: Aquascape, ikan hias, setup.
        faceless: true
        difficulty: menengah
        rpm: rendah
        formats: close-up + ASMR + time-lapse
        example_hook: "Tank kosong ini jadi surga bawah air..."
        micro:
          - slug: aquarium-build-timelapse
            name: Build Aquascape Timelapse
            description: Proses membangun aquascape dari tank kosong hingga jadi dalam format timelapse, untuk komunitas hobi ikan hias Indonesia.
            example_hook: "Tank kosong ini jadi surga bawah air dalam 7 hari..."
          - slug: aquarium-ikan-lokal
            name: Ikan Hias Lokal Indonesia
            description: Showcase ikan hias endemik Indonesia seperti arwana, cupang, dan louhan, menyasar penggemar ikan yang bangga produk lokal.
            example_hook: "Ikan ini asli Indonesia, harganya bisa capai puluhan juta..."
          - slug: aquarium-troubleshoot
            name: Masalah Umum Aquarium & Solusinya
            description: Konten edukatif membahas masalah nyata aquarium seperti air keruh, alga meledak, dan ikan sakit, untuk pemula yang baru mulai hobi.
            example_hook: "Air aquarium kamu hijau terus? Ini penyebab yang sering diabaikan..."

  - slug: v-berita
    name: Berita
    description: Konten berita, analisis, dan komentar peristiwa terkini di Indonesia dan dunia.
    niches:
      - slug: explainer
        name: "Explainer / \"Kenapa\""
        description: Jelasin kenapa X terjadi.
        faceless: true
        difficulty: menengah
        rpm: sedang
        formats: motion-graphic + voiceover
        example_hook: "Kenapa harga telur tiba-tiba naik..."
        micro:
          - slug: explainer-ekonomi-sehari-hari
            name: Explainer Ekonomi Sehari-hari
            description: Menjelaskan fenomena ekonomi yang dirasakan langsung masyarakat seperti inflasi, harga BBM, dan kurs rupiah dalam bahasa yang mudah dipahami.
            example_hook: "Kenapa harga telur tiba-tiba naik padahal gaji kamu gak naik-naik..."
          - slug: explainer-kebijakan-pemerintah
            name: Bedah Kebijakan Pemerintah
            description: Mengurai kebijakan publik baru dalam format visualisasi sederhana, untuk warga yang ingin paham tanpa baca dokumen panjang.
            example_hook: "Aturan baru ini berlaku bulan depan, dan kamu pasti kena dampaknya..."
          - slug: explainer-konflik-global
            name: Konflik Global Dijelaskan Singkat
            description: Memetakan konflik internasional yang ramai dibicarakan dalam narasi kronologis 60 detik, untuk penonton yang ingin konteks tanpa baca berita panjang.
            example_hook: "Kenapa dua negara ini tiba-tiba perang setelah 50 tahun damai..."

      - slug: news-commentary
        name: "Berita / Komentar"
        description: Bahas berita terkini + opini.
        faceless: false
        difficulty: sulit
        rpm: sedang
        formats: footage + voiceover + caption
        example_hook: "Yang gak diberitakan soal kejadian ini..."
        micro:
          - slug: news-commentary-viral-sosmed
            name: Komentar Isu Viral Sosmed
            description: Membahas isu yang sedang trending di Twitter/X dan TikTok Indonesia dengan analisis singkat yang tidak memihak, untuk penonton yang ingin perspektif lebih dalam.
            example_hook: "Semua orang ribut soal ini, tapi gak ada yang bahas sisi ini..."
          - slug: news-commentary-politik-lokal
            name: Politik Lokal & Pilkada
            description: Komentar dan analisis singkat tentang dinamika politik daerah dan pemilihan kepala daerah, menyasar pemilih muda yang baru melek politik.
            example_hook: "Calon ini viral karena janji ini, tapi rekam jejaknya bilang lain..."
          - slug: news-commentary-isu-lingkungan
            name: Isu Lingkungan Indonesia
            description: Komentar atas kejadian lingkungan nyata — banjir, kebakaran hutan, sampah laut — dengan data dan konteks yang sering hilang dari berita utama.
            example_hook: "Bencana ini sudah diprediksi 5 tahun lalu, tapi gak ada yang dengarkan..."

  - slug: v-cerita
    name: Cerita
    description: Konten narasi, horor, misteri, dan recap untuk penonton yang suka cerita pendek.
