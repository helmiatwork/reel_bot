        example_hook: "Mantanku kira aku gak tahu, sampai..."
        micro:
          - slug: ai-story-hubungan-toxic
            name: Cerita Hubungan Toxic & Manipulatif
            description: Narasi cerita pendek tentang hubungan beracun dari sudut pandang orang pertama, diangkat dari Reddit-style confession, untuk penonton yang suka drama relatable.
            example_hook: "Mantanku kira aku gak tahu, sampai aku temukan ini di HP-nya..."
          - slug: ai-story-keluarga-rahasia
            name: Rahasia Gelap Keluarga
            description: Cerita keluarga dengan twist mengejutkan yang diungkap perlahan, menyasar penonton yang suka drama keluarga dengan akhir yang tidak terduga.
            example_hook: "Baru setelah ayah meninggal, aku tahu siapa dia sebenarnya..."
          - slug: ai-story-kerja-absurd
            name: Kisah Absurd di Tempat Kerja
            description: Cerita lucu sekaligus miris tentang drama kantor dan atasan gila dari perspektif karyawan, untuk penonton pekerja muda yang butuh validasi.
            example_hook: "Atasan ini minta aku kerja lembur di hari pernikahanku sendiri..."

