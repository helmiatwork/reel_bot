            description: Cerita pengalaman horor nyata yang dikirim penonton atau dikurasi dari forum lokal, diformat ulang dengan narasi dramatis dan ambiens suara.
            example_hook: "Kameranya terus mati setiap kali diarahkan ke sudut itu..."
          - slug: scary-story-rumah-angker
            name: Rumah Angker & Tempat Terlarang
            description: Narasi tentang lokasi angker terkenal di Indonesia dengan sejarah kelam di baliknya, untuk penonton horor yang suka konteks historis.
            example_hook: "Rumah ini sudah 20 tahun kosong, dan siapa yang masuk gak pernah sama lagi..."

