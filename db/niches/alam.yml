        - slug: aquarium-troubleshoot
          name: Masalah Umum Aquarium & Solusinya
          description: Konten edukatif membahas masalah nyata aquarium seperti air keruh, alga meledak, dan ikan sakit, untuk pemula yang baru mulai hobi.
          example_hook: "Air aquarium kamu hijau terus? Ini penyebab yang sering diabaikan..."
          guide:
            audience: "Pemula aquarium berusia 18–40 yang sedang frustrasi dengan masalah di tank mereka; penonton yang baru mulai hobi dan mencari panduan praktis; mereka yang hampir menyerah karena masalah berulang yang tidak tahu cara selesaikannya."
            tone: "Empatik dan problem-solving. Penonton datang dengan frustrasi — konten harus langsung validasi masalah mereka dan berikan solusi yang actionable. Tone guru yang sabar, bukan ahli yang menghakimi."
            format: "60–90 detik. Identifikasi masalah visual (foto/video kondisi bermasalah) → penjelasan penyebab singkat → solusi step-by-step yang bisa langsung diterapkan → hasil setelah solusi diterapkan. Teks pendukung untuk setiap langkah. Vertikal 9:16."
            boleh:
              - "Tampilkan kondisi bermasalah yang 'relatable' — penonton harus langsung mengenali masalah mereka"
              - "Solusi dengan produk yang tersedia di toko ikan lokal Indonesia — bukan produk impor yang susah dicari"
              - "Format 'sebelum-sesudah' untuk kondisi air atau kesehatan ikan sangat efektif"
              - "Jawab pertanyaan lanjutan yang pasti muncul di benak penonton sebelum mereka tanyakan di comment"
            hindari:
              - "Jangan berikan solusi yang tidak diverifikasi atau bisa membahayakan ikan — komunitas aquarium sangat kritis"
              - "Jangan terlalu teknis dengan terminologi tanpa penjelasan — target audiens adalah pemula"
              - "Jangan tampilkan kondisi ikan yang menderita terlalu lama tanpa context positif"
              - "Jangan pakai musik ber-hak-cipta"
            pola_hook: "Detik 0: tampilkan kondisi bermasalah yang paling umum dan relatable (air hijau, ikan mengapung, alga meledak) + teks 'ini penyebab yang kebanyakan pemula tidak tahu'. Penonton yang punya masalah sama harus langsung merasa 'ini untuk saya'."
            contoh_judul:
              - "Air aquarium hijau terus padahal sudah ganti air? Ini penyebab yang sering diabaikan"
              - "Ikan cupang ini tiba-tiba tidak mau makan 3 hari — ternyata ini penyebabnya"
              - "Alga meledak di tank dalam seminggu — ini yang salah dan cara benarkan dalam 24 jam"
              - "Filter aquarium ini sudah nyala tapi air tetap keruh — cek bagian ini dulu"
              - "Ikan baru masuk tank langsung mati? Hampir pasti karena satu kesalahan ini"
            content_runway: "Masalah aquarium hampir tidak terbatas — setiap kombinasi spesies ikan, tanaman, ukuran tank, sistem filter, dan kualitas air menghasilkan masalah yang berbeda; komunitas terus menghadapi masalah baru seiring perkembangan hobi."
