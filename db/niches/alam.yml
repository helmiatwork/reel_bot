          - "Ikan ini asli Indonesia dan harganya bisa bikin kamu tidak percaya"
          - "Air aquarium ini hijau terus? Ini penyebab yang 90% pemula tidak tahu"

      micro:
        - slug: aquarium-build-timelapse
          name: Build Aquascape Timelapse
          description: Proses membangun aquascape dari tank kosong hingga jadi dalam format timelapse, untuk komunitas hobi ikan hias Indonesia.
          example_hook: "Tank kosong ini jadi surga bawah air dalam 7 hari..."
          guide:
            audience: "Penghobi aquarium pemula hingga menengah berusia 20–40; penonton yang ingin tahu proses build tapi tidak mau nonton video 1 jam penuh; mereka yang punya tank kosong di rumah dan mencari inspirasi untuk mulai."
            tone: "Antusias dan detail. Setiap keputusan dalam build ada alasannya — penonton bukan hanya ingin melihat hasil, tapi ingin belajar prosesnya secara implisit melalui visual. Suara air yang mulai mengalir di akhir adalah momen klimaks."
            format: "60–90 detik. Timelapse seluruh proses build: substrate → hardscape (batu/kayu) → plant → fill water → equipment on → livestock masuk → mature tank. Suara air mulai mengalir sebagai audio klimaks di akhir. Teks singkat yang menjelaskan tiap fase. Vertikal 9:16."
            boleh:
              - "Tampilkan budget total di akhir video — pertanyaan paling banyak dan meningkatkan rewatch"
              - "Teks penjelasan singkat per fase (2–3 kata) tanpa mengganggu alur timelapse"
              - "Reveal kondisi tank 2–4 minggu setelah build sebagai bonus footage di akhir"
              - "Close-up detail hardscape dan tanaman untuk penonton yang ingin replikasi"
            hindari:
              - "Jangan skip fase penting (substrate, cycling) demi mempercepat video — penonton ingin proses lengkap"
              - "Jangan pakai musik ber-hak-cipta; lo-fi instrumental sangat cocok untuk genre ini"
              - "Jangan tampilkan hasil akhir yang tidak setara dengan klaim di judul — menurunkan kepercayaan"
              - "Jangan cut audio suara air saat equipment pertama kali nyala — itu momen yang paling dinantikan"
            pola_hook: "Detik 0: close-up tank kosong yang benar-benar kosongan + teks 'ini akan jadi aquascape dalam 7 hari'. Detik 2: flash 1 detik kondisi jadi sebagai preview, lalu kembali ke proses. Penonton harus ingin tonton sampai reveal."
            contoh_judul:
              - "Tank kosong ini aku ubah jadi aquascape penuh tanaman dalam 7 hari, ini prosesnya"
              - "Build aquascape nature aquarium dari nol dengan budget Rp500rb"
              - "Iwagumi aquascape yang aku build ini butuh 48 batu yang diposisikan ulang berkali-kali"
              - "Dari substrate sampai ikan pertama masuk — timelapse build lengkap 14 hari"
              - "Aquascape ini gagal di percobaan pertama, ini yang diperbaiki di build kedua"
            content_runway: "Setiap style aquascape (Nature Aquarium, Dutch, Biotope, Iwagumi, Jungle) menghasilkan video berbeda; setiap ukuran tank, pemilihan tanaman, dan ikan menghasilkan build unik; tank bisa di-redo dengan layout berbeda untuk konten baru."

