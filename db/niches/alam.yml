        format: "45–120 detik. Close-up ikan dan tanaman air, timelapse proses build, dan footage underwater tank yang meditatif. Suara air diperkuat — sangat memuaskan. Musik lo-fi instrumental atau ambient air. Vertikal 9:16."
        boleh:
          - "Boost suara air dari filter dan gelembung — ini adalah ASMR natural aquarium yang sangat efektif"
          - "Timelapse pertumbuhan tanaman air selalu menarik — dari kecil sampai penuh dalam 30 detik"
          - "Close-up ikan dengan detail warna dan gerakan yang tidak bisa dilihat dengan mata biasa"
