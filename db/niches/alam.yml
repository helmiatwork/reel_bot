version: 1
vertical:
  slug: v-alam
  name: Alam
  description: Konten alam, hewan, dan satwa liar dengan visual relaksasi atau fakta.
  guide:
    audience: "Penonton 16–40 dari semua gender yang menikmati konten alam sebagai pelarian dari kehidupan urban; campuran pecinta hewan, penonton relaksasi malam hari, dan penggemar sains kasual; banyak yang menonton dari kota besar tapi rindu alam dan kehidupan liar."
    tone: "Tenang dan penuh rasa ingin tahu. Dunia alam berbicara sendiri — creator hanya jadi jembatan antara penonton dan keajaiban yang sudah ada. Tidak perlu dramatisasi berlebihan; realitas alam sudah cukup memukau."
    format: "Video 30–120 detik tergantung sub-format. Visual utama adalah footage alam berkualitas tinggi — sinematik, close-up, atau b-roll yang breathtaking. Vertikal 9:16. Musik ambient atau suara alam asli lebih diutamakan daripada musik pop. Teks minimal dan tidak mengalihkan dari visual."
    boleh:
      - "Gunakan footage sinematik berkualitas tinggi — kualitas visual adalah reputasi channel"
      - "Suara alam asli (kicau burung, gemericik air, deburan ombak) diboost sebagai aset audio utama"
      - "Teks fakta singkat yang memperkaya tanpa mengalihkan dari visual"
      - "Slow-motion untuk momen puncak — terbang burung, predator menyerang, air terjun"
      - "Format before-reveal: tampilkan pertanyaan atau situasi, lalu ungkap jawabannya di akhir"
    hindari:
      - "Jangan gunakan footage stok generik yang bisa ditemukan di mana saja tanpa nilai unik"
      - "Jangan pakai musik ber-hak-cipta; pilih royalty-free ambient atau suara alam asli"
      - "Jangan tambahkan narasi berlebihan yang mengalihkan dari keindahan visual"
      - "Jangan tampilkan konten penyiksaan hewan — platform akan hapus dan reputasi hancur"
      - "Jangan klaim fakta tanpa sumber — konten edukasi alam harus akurat"
    pola_hook: "Detik 0–2: visual paling memukau atau fakta paling mengejutkan langsung ditampilkan, tanpa intro. Teks singkat yang membangun rasa ingin tahu ('ternyata hewan ini...', 'lokasi ini ada di Indonesia'). Penonton harus merasa merugi jika tidak lanjut tonton."
    contoh_judul:
      - "Hutan ini ada di Indonesia dan hampir tidak ada yang tahu keberadaannya"
      - "Berhenti scroll sebentar — alam mau tunjukkan sesuatu yang jarang terlihat"
      - "Hewan ini cuma ada di satu pulau, dan populasinya tinggal ratusan"

  niches:
    - slug: pet-animals
      name: "Hewan / Pet"
      description: Footage hewan lucu + cerita.
      faceless: true
      difficulty: menengah
      rpm: rendah
      formats: footage + caption + musik
      example_hook: "Kucing ini tiap hari nungguin..."
      guide:
        audience: "Pemilik hewan peliharaan dan pecinta binatang berusia 18–40; dominan perempuan tapi laki-laki signifikan; penonton yang mudah terpaut secara emosional dengan cerita hewan; banyak yang belum punya hewan peliharaan tapi ingin."
        tone: "Hangat, menyentuh, dan kadang lucu. Setiap video harus membangun koneksi emosional — penonton harus merasa 'hewan ini seperti teman'. Tidak perlu dramatis berlebihan; tingkah hewan autentik selalu lebih kuat dari yang direkayasa."
        format: "30–90 detik. Footage hewan dengan caption teks yang menceritakan momen atau konteks. Musik latar ceria atau sentimental sesuai mood. Close-up wajah hewan untuk koneksi emosional. Vertikal 9:16."
        boleh:
          - "Tampilkan ekspresi wajah hewan dalam close-up — itu sumber koneksi emosional terkuat"
          - "Caption teks yang 'menyuarakan' pikiran hewan selalu performatif untuk engagement"
          - "Cerita singkat dengan twist atau resolusi emosional di akhir meningkatkan watch time"
          - "Gunakan musik yang cocok dengan mood — ceria untuk konten lucu, sentimental untuk cerita mengharukan"
        hindari:
          - "Jangan rekam hewan dalam kondisi stres atau ketakutan demi konten — platform dan penonton akan bereaksi negatif"
          - "Jangan gunakan musik ber-hak-cipta; pilih royalty-free yang sesuai mood"
          - "Jangan caption yang terlalu panjang atau font yang tidak mudah dibaca di mobile"
          - "Jangan paksakan cerita yang tidak ada — biarkan tingkah hewan sendiri yang cerita"
        pola_hook: "Detik 0: tampilkan hewan dalam momen paling ekspresif atau situasi paling unik + caption singkat yang membangun pertanyaan ('kenapa dia lakuin ini tiap hari?'). Penonton harus penasaran dengan kelanjutan cerita."
        contoh_judul:
          - "Kucing ini tiap hari nungguin pemiliknya pulang, sampai suatu hari tidak ada yang datang"
          - "Dia pelihara hewan ini karena dianggap buang sial, ini yang terjadi setahun kemudian"
          - "Anjing ini tidak mau makan selama 3 hari, baru sadar alasannya setelah ini"

      micro:
        - slug: pet-animals-kucing-viral
          name: Kucing Viral Indonesia
          description: Momen lucu dan menggemaskan kucing peliharaan lokal, dirangkum dari konten viral untuk penonton pecinta kucing.
          example_hook: "Kucing ini tiap hari nungguin majikannya pulang kerja, sampai suatu hari..."
          guide:
            audience: "Pencinta kucing Indonesia berusia 16–35, mayoritas perempuan; penonton yang sudah punya kucing atau ingin adopsi; pengguna aktif TikTok dan Instagram yang sering share konten kucing ke sesama."
            tone: "Gemas, menyentuh, dan sering absurd. Kucing Indonesia punya karakter khas — bisa liar, bisa manja, sering dramatis. Caption yang 'ngomongin' tingkah kucing dengan Bahasa Indonesia kasual sangat efektif."
            format: "30–60 detik. Footage tunggal atau kompilasi 2–3 momen lucu atau mengharukan. Caption teks kasual yang menarasikan pikiran kucing. Musik ceria atau lo-fi. Close-up wajah dan reaksi kucing. Vertikal 9:16."
            boleh:
              - "Caption yang menyuarakan 'pikiran' kucing dengan bahasa kasual Indonesia — sangat viral"
              - "Momen kucing yang tertangkap basah melakukan sesuatu aneh atau lucu tanpa sadar"
              - "Format 'cerita' dengan setup dan punchline — penonton suka struktur naratif singkat"
              - "Kucing kampung Indonesia seringkali lebih relatable daripada ras mahal"
            hindari:
              - "Jangan rekam kucing yang jelas tidak nyaman atau ketakutan demi 'reaksi lucu'"
              - "Jangan gunakan musik ber-hak-cipta yang langsung kena copyright strike"
              - "Jangan caption terlalu banyak teks sekaligus — maksimal 2 baris per frame"
              - "Jangan edit terlalu agresif dengan jump cut yang menghilangkan ekspresi terbaik"
            pola_hook: "Detik 0: tampilkan momen paling menggemaskan atau aneh dari kucing + caption singkat yang memicu pertanyaan. Jangan tunjukkan punchline di awal — bangun dulu konteks selama 5 detik."
            contoh_judul:
              - "Kucing ini tiap hari nungguin majikannya pulang kerja, sampai suatu hari dia tidak datang lagi"
              - "Kucing liar ini masuk rumah sendiri dan memutuskan tinggal selamanya"
              - "Dia anggap kucingnya tidak punya perasaan, sampai rekaman ini mengubah pikirannya"
              - "Kucing kampung ini punya ritual harian yang baru ketahuan setelah dipasang kamera"
              - "Tiga kucing ini nunggu makan bareng setiap hari — tapi ada satu yang selalu terlambat"
            content_runway: "Setiap kucing punya kepribadian unik dan momen berbeda setiap hari; komunitas pecinta kucing Indonesia sangat besar dan aktif berbagi konten, menjamin pasokan momen baru tanpa henti."

        - slug: pet-animals-anjing-golden
          name: Anjing Golden & Labrador
          description: Footage anjing ras populer yang setia dan lucu, menyasar penonton keluarga muda yang tertarik punya anjing peliharaan.
          example_hook: "Anjing ini nangis setiap kali bayinya dibawa masuk, bukan karena cemburu..."
          guide:
            audience: "Keluarga muda dan pasangan 22–40 yang sedang mempertimbangkan punya anjing; pemilik Golden/Labrador yang mencari konten relatable; penonton yang tergerak oleh cerita kesetiaan dan ikatan manusia-hewan."
            tone: "Hangat dan keluarga. Golden Retriever dan Labrador identik dengan kesetiaan dan kelucuan — konten yang menonjolkan sifat ini selalu perform. Cerita tentang ikatan anjing dengan bayi atau lansia sangat emosional."
            format: "45–90 detik. Footage sehari-hari dengan momen yang mengungkap karakter anjing. Caption atau voiceover singkat yang memberikan konteks emosional. Musik sentimental atau ceria. Close-up ekspresi dan interaksi. Vertikal 9:16."
            boleh:
              - "Rekam momen spontan — reaksi pertama anjing terhadap sesuatu yang baru selalu terbaik"
              - "Interaksi anjing dengan bayi atau anak kecil hampir selalu viral di Indonesia"
              - "Format 'sebelum-sesudah': anjing kecil vs sudah dewasa, penonton suka timeline"
              - "Caption yang menjelaskan 'kenapa anjing lakukan ini' memberikan nilai edukasi sekaligus emosi"
            hindari:
              - "Jangan rekam anjing yang terlihat tidak nyaman atau diposisikan paksa untuk lucu"
              - "Jangan gunakan musik ber-hak-cipta — Golden Retriever videos kena strike banyak"
              - "Jangan konten yang mempromosikan pembelian anjing tanpa mention adopsi sebagai opsi"
              - "Jangan tampilkan wajah pemilik jika channel faceless — fokus pada anjingnya"
            pola_hook: "Detik 0: tampilkan momen paling ekspresif anjing (ekspresi menunggu, reaksi kejutan, atau interaksi dengan manusia) + caption yang membangun misteri kecil. Emosi harus terasa di 3 detik pertama."
            contoh_judul:
              - "Anjing ini nangis setiap kali bayinya dibawa masuk, ternyata bukan karena cemburu"
              - "Golden Retriever ini sudah 3 tahun tunggu pemiliknya yang pergi kuliah ke luar kota"
              - "Anjing ini dibesarkan sama kucing, dan sekarang dia pikir dia juga kucing"
              - "Labrador ini punya cara memberitahu pemilik saat ada bahaya — dan terbukti dua kali"
              - "Pertama kali anjing ini lihat bayi baru lahir — reaksinya tidak ada yang duga"
            content_runway: "Setiap tahap kehidupan anjing (puppy, dewasa, senior) menghasilkan konten berbeda; interaksi dengan anggota keluarga baru, musim yang berbeda, dan kebiasaan unik tiap anjing memastikan ide video tidak habis."

        - slug: pet-animals-hewan-exotic
          name: Hewan Peliharaan Eksotik
          description: Konten hewan peliharaan tidak biasa seperti musang, landak, atau reptil, untuk penonton yang tertarik dunia pet di luar kucing-anjing.
          example_hook: "Dia pelihara ular di apartemen, dan tetangganya gak pernah tahu..."
          guide:
            audience: "Penonton 18–35 yang penasaran dengan dunia hewan peliharaan non-mainstream; calon pemilik hewan eksotik yang sedang riset; penonton yang suka konten 'tidak biasa' dan mau berbagi ke lingkaran sosialnya sebagai conversation starter."
            tone: "Penuh rasa ingin tahu dan sedikit edgy. Hewan eksotik selalu menghadirkan elemen kejutan — perilaku yang tidak terduga, penampilan yang unik, atau mitos yang dipatahkan. Tone edukatif ringan tapi menghibur."
            format: "45–90 detik. Fokus pada satu hewan dengan momen yang mengungkap karakter atau perilaku uniknya. Teks informatif singkat yang menjawab pertanyaan yang penonton pasti punya ('apa ini bisa dipegang?', 'ini legal dipelihara?'). Vertikal 9:16."
            boleh:
              - "Tampilkan momen pertama interaksi hewan dengan lingkungan baru — selalu menarik"
              - "Jawab pertanyaan umum yang penonton penasaran: 'apakah aman?', 'makan apa?' — nilai edukatif"
              - "Momen hewan eksotik berinteraksi dengan hewan peliharaan lain sangat shareable"
              - "Format 'mitos vs fakta' tentang hewan tersebut meningkatkan credibility dan engagement"
            hindari:
              - "Jangan tampilkan hewan yang statusnya dilindungi atau ilegal dipelihara tanpa disclaimer jelas"
              - "Jangan rekam interaksi yang membahayakan hewan atau manusia demi konten sensasional"
              - "Jangan klaim semua hewan eksotik aman dipelihara tanpa konteks perawatan yang dibutuhkan"
              - "Jangan gunakan musik ber-hak-cipta"
            pola_hook: "Detik 0: tampilkan hewan eksotik dalam situasi yang langsung bikin penonton terperangah atau penasaran + teks yang trigger rasa ingin tahu ('hewan ini boleh dipelihara di Indonesia?'). Buat penonton merasa akan belajar sesuatu yang jarang diketahui."
            contoh_judul:
              - "Dia pelihara ular di apartemen Jakarta, dan tetangganya tidak pernah tahu selama 2 tahun"
              - "Musang peliharaan ini lebih setia dari anjing, pemiliknya baru sadar setelah ini"
              - "Landak pygmy ini tampak menyeramkan tapi ini yang terjadi saat dipegang pertama kali"
              - "Biawak peliharaan ini besar lebih cepat dari yang pemiliknya perkirakan — ini kondisinya sekarang"
              - "Hewan ini ilegal dipelihara di banyak negara, tapi di Indonesia kamu bisa — ini faktanya"
            content_runway: "Ratusan spesies hewan eksotik bisa jadi konten berbeda; setiap fase pertumbuhan, perilaku musiman, dan interaksi dengan lingkungan baru menghasilkan video unik; komunitas hewan eksotik Indonesia tumbuh dan aktif."

    - slug: wildlife
      name: "Satwa Liar / Fakta Hewan"
      description: Fakta & footage satwa.
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: footage + voiceover
      example_hook: "Hewan ini bisa hidup tanpa kepala..."
      guide:
        audience: "Penonton 16–40 yang suka konten sains dan alam; pria sedikit lebih dominan; penonton yang terpukau oleh fakta mengejutkan tentang hewan; tidak harus berlatar sains — cukup penasaran dan suka 'wow moment'."
        tone: "Informatif tapi tidak membosankan. Seperti teman yang baru dapat fakta menarik dan antusias menceritakannya. Tidak perlu formal seperti dokumenter — bisa kasual tapi tetap akurat."
        format: "45–90 detik. Footage satwa berkualitas tinggi sebagai visual utama. Voiceover atau teks yang menyampaikan fakta secara bertahap. Struktur: fakta mengejutkan di awal → konteks dan penjelasan → implikasi atau 'twist' di akhir. Vertikal 9:16."
        boleh:
          - "Fakta yang counter-intuitive selalu perform lebih baik — cari yang membalik asumsi umum"
          - "Kombinasikan footage yang dramatis dengan fakta yang mengejutkan untuk sinergi maksimal"
          - "Bandingkan dengan skala manusia untuk membuat fakta lebih mudah dicerna ('sekuat 100 manusia')"
          - "Akhiri dengan pertanyaan retoris yang buat penonton berpikir — meningkatkan comment rate"
        hindari:
          - "Jangan sebar fakta yang tidak terverifikasi — satu fakta salah bisa hancurkan credibility channel"
          - "Jangan gunakan footage yang menampilkan penyiksaan atau kondisi hewan yang tidak manusiawi"
          - "Jangan voiceover yang terlalu panjang dan padat — penonton short-form tidak mau kuliah"
          - "Jangan pakai musik ber-hak-cipta atau musik yang mengalahkan voiceover"
        pola_hook: "Detik 0: fakta paling mengejutkan langsung diucapkan atau ditampilkan sebagai teks + footage yang mendukung. 'Hewan ini bisa [hal yang tidak masuk akal]' — penonton harus merasa tidak bisa skip karena ingin verifikasi."
        contoh_judul:
          - "Hewan ini secara teknis tidak bisa mati — dan itu bukan mitos"
          - "Predator ini tidak berburu dengan kecepatan tapi dengan sesuatu yang lebih menakutkan"
          - "Satwa ini ada di Indonesia dan hampir punah sebelum kita sempat mengenalnya"

      micro:
        - slug: wildlife-predator-ekstrem
          name: Predator Paling Mematikan
          description: Fakta mengejutkan tentang predator puncak di darat dan laut, untuk penonton yang suka konten sains alam yang menegangkan.
          example_hook: "Buaya ini gak butuh makan selama 2 tahun, tapi tetap berbahaya..."
          guide:
            audience: "Pria 18–35 yang suka konten sains alam yang menegangkan; penonton yang tertarik dengan 'siapa yang bisa mengalahkan siapa' di alam liar; penggemar dokumenter alam tapi ingin format yang lebih singkat dan punchy."
            tone: "Menegangkan dan impressed. Setiap fakta tentang predator harus membuat penonton sadar betapa berbahayanya hewan ini — tapi dengan kekaguman, bukan ketakutan berlebihan."
            format: "45–75 detik. Fakta mematikan sebagai hook → penjelasan mekanisme biologis atau perilaku → satu fakta bonus yang lebih mengejutkan sebagai penutup. Footage close-up predator dengan slow-motion di momen kritis. Vertikal 9:16."
            boleh:
              - "Bandingkan kemampuan predator dengan skala manusia untuk dampak yang lebih nyata"
              - "Struktur 'fakta 1 → lebih mengejutkan → paling mengejutkan' untuk retention hook"
              - "Footage momen berburu yang dramatis sebagai visual pendukung fakta"
              - "Akhiri dengan pertanyaan 'kalau begini, apa yang bisa lawan predator ini?' untuk trigger comment"
            hindari:
              - "Jangan tampilkan footage berburu yang terlalu grafis atau brutal tanpa blur/cut yang tepat"
              - "Jangan sebar fakta yang tidak terverifikasi — komunitas wildlife sangat aktif meluruskan"
              - "Jangan sensasionalisasi berlebihan yang membuat konten terlihat clickbait murahan"
              - "Jangan pakai musik ber-hak-cipta; ambient tegang royalty-free sangat tersedia"
            pola_hook: "Detik 0: fakta paling mengejutkan tentang predator ini langsung disampaikan (voiceover atau teks) + footage predator dalam posisi mengancam. Penonton harus langsung bertanya 'masa iya?' di 3 detik pertama."
            contoh_judul:
              - "Buaya tidak butuh makan 2 tahun dan tetap bisa membunuh dalam satu gerakan"
              - "Predator ini tidak menggunakan kecepatan — dia pakai sesuatu yang lebih mematikan"
              - "Ikan ini tidak punya gigi, tapi tidak ada yang selamat dari gigitannya"
              - "Komodo tidak berbisa tapi cara dia membunuh jauh lebih mengerikan dari itu"
              - "Hewan terkecil ini membunuh lebih banyak manusia per tahun dari singa dan harimau digabung"
            content_runway: "Ratusan spesies predator di darat, laut, dan udara masing-masing punya mekanisme berburu yang unik; setiap perbandingan antar predator menghasilkan konten baru; penemuan ilmiah tentang predator terus bertambah."

        - slug: wildlife-hewan-indonesia
          name: Satwa Liar Endemik Indonesia
          description: Fakta dan footage satwa yang hanya ada di Indonesia seperti komodo, anoa, dan babirusa, menyasar kebanggaan lokal.
          example_hook: "Hewan ini cuma ada di satu pulau di Indonesia, dan hampir punah..."
          guide:
            audience: "Penonton Indonesia 17–40 yang peduli alam dan bangga akan kekayaan biodiversitas lokal; pelajar dan mahasiswa yang suka konten edukatif dengan nuansa nasionalisme positif; penonton internasional yang tertarik Indonesia."
            tone: "Bangga dan prihatin sekaligus. Kekayaan satwa Indonesia luar biasa — tapi ancamannya nyata. Tone yang balance antara kekaguman pada keunikan satwa dan kesadaran bahwa konservasi penting."
            format: "45–90 detik. Fokus satu spesies per video. Fakta keunikan mengejutkan → status konservasi → apa yang bisa penonton lakukan atau ketahui. Footage sinematik berkualitas tinggi atau animasi jika footage langka. Vertikal 9:16."
            boleh:
              - "Mulai dengan fakta yang bikin penonton bangga ('hanya ada di Indonesia')"
              - "Tampilkan peta pulau lokasi satwa untuk konteks geografis yang kuat"
              - "Ceritakan ancaman nyata spesifik yang dihadapi satwa tersebut — membuat isu jadi konkret"
              - "Akhiri dengan call-to-action ringan: 'share kalau kamu bangga hewan ini dari Indonesia'"
            hindari:
              - "Jangan gunakan fakta yang sudah outdated — status populasi satwa berubah tiap tahun"
              - "Jangan hanya tampilkan satwa yang sudah terkenal (orangutan, komodo) — satwa tidak terkenal lebih menarik"
              - "Jangan tone yang terlalu doom — keseimbangan antara masalah dan harapan penting untuk engagement"
              - "Jangan pakai musik ber-hak-cipta"
            pola_hook: "Detik 0: tampilkan satwa dalam visual paling memukau + teks 'hewan ini cuma ada di Indonesia' atau 'kamu tidak akan temukan ini di negara lain'. Rasa bangga dan rasa ingin tahu harus hadir bersamaan."
            contoh_judul:
              - "Hewan ini cuma ada di satu pulau Indonesia dan populasinya tinggal ratusan ekor"
              - "Anoa adalah kerbau mini yang cuma hidup di Sulawesi dan hampir tidak ada yang kenal"
              - "Babirusa Indonesia punya taring yang menembus kepalanya sendiri — ini alasannya"
              - "Maleo bertelur di tanah panas dan tidak pernah mengerami — mekanismenya luar biasa"
              - "Tarsius Indonesia matanya lebih besar dari otaknya sendiri — ini fakta lainnya"
            content_runway: "Indonesia memiliki lebih dari 700 spesies mamalia, 1600 spesies burung, dan ribuan reptil dan amfibi endemik; setiap spesies menghasilkan minimal satu video; penemuan spesies baru terus terjadi di Indonesia."

        - slug: wildlife-adaptasi-ekstrem
          name: Adaptasi Hewan di Habitat Ekstrem
          description: Satwa yang berevolusi bertahan di kondisi ekstrem — gurun, kutub, laut dalam — untuk penonton sains kasual yang suka fakta mengejutkan.
          example_hook: "Ikan ini hidup di 8.000 meter di bawah laut, tempat manusia gak bisa bertahan..."
          guide:
            audience: "Penonton 16–35 yang suka sains kasual dan konten 'fakta tidak masuk akal tapi nyata'; penonton yang menyukai perspektif baru tentang batas kemampuan kehidupan; cocok untuk penonton yang suka National Geographic tapi mau format lebih pendek."
            tone: "Takjub dan sedikit filosofis. Adaptasi ekstrem selalu menginspirasi rasa kagum pada evolusi dan kehidupan. Sampaikan dengan antusias tapi tidak berlebihan — biarkan faktanya sendiri yang memukau."
            format: "45–75 detik. Satu hewan, satu habitat ekstrem, satu atau dua adaptasi paling menakjubkan. Struktur: kondisi habitat yang mustahil → penjelasan bagaimana hewan ini survive → fakta yang paling mengejutkan tentang adaptasinya. Vertikal 9:16."
            boleh:
              - "Bandingkan kondisi habitat dengan kondisi yang manusia bisa pahami ('tekanan ini setara 1000 kali tekanan di permukaan')"
              - "Fokus pada satu mekanisme adaptasi dan jelaskan secara visual — lebih efektif dari banyak fakta sekaligus"
              - "Akhiri dengan fakta bahwa adaptasi ini menginspirasi teknologi manusia — engagement tinggi"
              - "Gunakan analogi sederhana untuk membuat sains mudah dicerna"
            hindari:
              - "Jangan sebar fakta sains yang tidak terverifikasi atau sudah dipatahkan oleh penelitian terbaru"
              - "Jangan terlalu teknis dengan terminologi ilmiah tanpa penjelasan — ini konten kasual"
              - "Jangan gunakan footage yang jelas tidak sesuai dengan spesies atau habitat yang dimaksud"
              - "Jangan pakai musik ber-hak-cipta"
