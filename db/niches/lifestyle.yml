version: 1
vertical:
  slug: v-lifestyle
  name: Lifestyle
  description: Konten gaya hidup, produktivitas, minimalism, dan estetika untuk generasi muda Indonesia.
  guide:
    audience: "Penonton 18–35 tahun, campuran pria dan wanita urban Indonesia, yang sedang membentuk identitas dan gaya hidup; tertarik pada produktivitas, estetika ruang, kemandirian, dan perbaikan diri; banyak nonton di pagi hari atau malam hari sebelum tidur."
    tone: "Autentik, jujur, dan relatable — bukan sempurna. Bahasa kasual Indonesia tanpa pretensi. Boleh serius tapi tidak menggurui; boleh aspirasional tapi tetap membumi. Penonton ingin merasa 'aku juga bisa'."
    format: "Video 30–90 detik, vertikal 9:16. Campuran b-roll estetik, teks overlay singkat, dan voiceover ringan atau narasi on-screen. Musik lo-fi atau ambient sebagai latar. Struktur: hook relatable → isi padat → CTA lembut atau cliffhanger."
    boleh:
      - "Gunakan momen personal dan jujur sebagai hook — kelemahan dan kegagalan lebih engaging dari kesempurnaan"
      - "Tampilkan lingkungan nyata Indonesia (kos, warung, KRL) untuk resonansi lokal"
      - "Teks overlay pendek di atas b-roll agar pesan tersampaikan meski ditonton tanpa suara"
      - "Sertakan angka konkret (budget Rp500rb, 30 potong baju, 15 menit) untuk kredibilitas"
      - "Akhiri dengan pertanyaan ke penonton untuk mendorong komentar"
    hindari:
      - "Jangan gunakan voiceover dengan intonasi formal atau 'siaran berita' — membunuh vibe personal"
      - "Jangan tunjukkan gaya hidup mewah yang tidak terjangkau audiens Indonesia rata-rata"
      - "Jangan pakai musik ber-hak-cipta; pilih royalty-free lo-fi atau ambient"
      - "Jangan hook lebih dari 5 detik tanpa informasi value — penonton akan skip"
      - "Jangan klaim hasil universal ('pasti berhasil') — niche ini sangat sensitif terhadap over-promise"
    pola_hook: "Detik 0–3: pernyataan jujur atau situasi relatable yang langsung menyentuh titik nyeri audiens (mis. 'HP penuh, pikiran penuh, tapi berat buat mulai bebersih'). Tidak ada intro nama atau salam pembuka."
    contoh_judul:
      - "Hari di mana semuanya berubah setelah satu keputusan kecil"
      - "Kenapa aku berhenti optimasi hidup dan mulai sekadar hidup"
      - "Rutinitas pagi yang aku jaga 6 bulan dan ini yang benar-benar berubah"

  niches:
    - slug: vlog
      name: "Vlog / Day-in-life"
      description: Dokumentasi keseharian.
      faceless: false
      difficulty: menengah
      rpm: sedang
      formats: handheld + b-roll + voiceover
      example_hook: "Hari di mana semuanya berubah..."
      guide:
        audience: "Penonton 18–28 yang suka merasa 'ikut' dalam kehidupan orang lain; mencari inspirasi atau validasi bahwa pengalaman mereka normal; tertarik pada vlog kehidupan nyata Indonesia tanpa filter berlebihan."
        tone: "Intim dan jujur seperti bercerita ke teman dekat. Tidak harus selalu positif — momen canggung, ragu, dan gagal justru yang paling engaging. Voiceover bisa informal dan sedikit mengalir."
        format: "60–90 detik. Campuran footage handheld dan b-roll suasana. Voiceover naratif di atas footage, atau talking-head pendek diseling b-roll. Musik lo-fi sebagai latar. Struktur: setup situasi → momen kunci → refleksi atau punchline. Vertikal 9:16."
        boleh:
          - "Tampilkan momen awkward atau tidak sempurna — itu yang membuat penonton merasa terhubung"
          - "Gunakan b-roll lingkungan nyata Indonesia: stasiun, warung, jalan kecil, kos"
          - "Voiceover bisa direkam ulang dengan narasi lebih reflektif dari footage aslinya"
          - "Tambahkan teks overlay singkat untuk konteks tanggal atau lokasi"
        hindari:
          - "Jangan buka vlog dengan 'halo guys, welcome back' — langsung ke momen"
          - "Jangan gunakan pencahayaan atau editing yang terlalu halus sehingga terlihat dibuat-buat"
          - "Jangan pakai musik ber-hak-cipta"
          - "Jangan overshare informasi pribadi yang bisa menimbulkan masalah keamanan"
        pola_hook: "Detik 0: langsung ke footage momen paling intens atau emosional hari itu + voiceover satu kalimat yang membuat penonton bertanya 'kenapa?'. Tidak ada intro."
        contoh_judul:
          - "Hari di mana semuanya berubah dan aku tidak menyangka itu akan terjadi"
          - "Satu minggu tinggal sendiri di kota baru — ini kejujurannya"
          - "Day in the life yang lebih jujur dari yang biasanya ditampilkan"
      micro:
        - slug: vlog-pindah-kota-baru
          name: Vlog Pindah Kerja ke Kota yang Belum Dikenal
          description: Dokumentasi pengalaman nyata pindah ke kota baru untuk kerja — mencari kos, adaptasi budaya lokal, dan membangun lingkaran sosial dari nol — untuk penonton yang sedang merencanakan hal serupa.
          example_hook: "Hari pertama di kota baru, tidak kenal siapapun, dan ini yang terjadi dalam 7 hari..."
          guide:
            audience: "Anak muda 20–27 yang sedang merencanakan atau baru menjalani pindah kota untuk kerja; pencari kerja fresh graduate yang belum pernah hidup jauh dari orang tua; penonton yang butuh gambaran realistis tentang relocating."
            tone: "Sedikit nervous tapi antusias. Jujur tentang kesulitan tanpa mendramatisasi. Gaya naratif seperti jurnal harian yang dibaca ke teman."
            format: "75–90 detik. Struktur per hari: hari 1 (tiba, cari kos) → hari 3-4 (adaptasi kerja, cari makan) → hari 7 (refleksi jujur). Footage handheld + b-roll lokasi. Voiceover naratif. Vertikal 9:16."
            boleh:
              - "Tampilkan angka nyata: biaya kos, harga makan sehari, biaya transport pertama"
              - "Tunjukkan momen awkward atau salah navigasi — itu yang paling relatable"
              - "Sertakan footage suasana kota baru yang khas dan berbeda dari kota asal"
              - "Gunakan text overlay untuk tandai hari ke berapa"
            hindari:
              - "Jangan hanya tunjukkan sisi positif — penonton ingin tahu juga tantangannya"
              - "Jangan rekam orang lain tanpa izim implisit atau explicit di tempat pribadi"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan skip momen bingung atau tidak tahu arah — itu inti konten ini"
            pola_hook: "Detik 0: footage tiba di stasiun atau terminal baru dengan koper + voiceover 'hari pertama di kota baru, tidak kenal siapapun'. Langsung ke aktivitas pertama di detik 4."
            contoh_judul:
              - "Hari pertama di Jakarta sendirian, tidak kenal siapapun — ini yang terjadi dalam seminggu"
              - "Pindah ke Surabaya untuk kerja pertama kali — biaya, kos, dan kejutan"
              - "7 hari pertama di Bandung tanpa kenal siapapun — jujur dan apa adanya"
              - "Fresh graduate pindah kota untuk kerja: semua yang tidak ada di buku panduan"
              - "Relocating ke Jogja dengan tabungan Rp5jt — breakdown realistisnya"
            content_runway: "Setiap kota tujuan di Indonesia menghasilkan vlog unik karena biaya, budaya, dan tantangan berbeda; ditambah variasi industri kerja dan latar belakang asal pembuat konten, kombinasi hampir tidak terbatas."

        - slug: vlog-hari-hidup-freelancer
          name: Day in the Life Freelancer Indonesia
          description: Dokumentasi jujur satu hari penuh kehidupan freelancer Indonesia — jam kerja sebenarnya, tantangan income tidak tetap, dan kebebasan yang sering disalahpahami.
          example_hook: "Freelancer bukan berarti santai, ini jam 6 pagi sampai tengah malam hari ini..."
          guide:
            audience: "Pria dan wanita 20–30 yang mempertimbangkan atau sudah menjadi freelancer; karyawan yang penasaran dengan kehidupan di luar kantor; penonton yang punya ekspektasi keliru tentang freelancing."
            tone: "Jujur dan sedikit ironis — ada momen capek dan chaos yang diakui dengan humor. Bukan promosi gaya hidup, tapi eksplorasi realistis."
            format: "75–90 detik. Time-stamp dari pagi hingga malam, footage aktivitas nyata kerja dan non-kerja. Voiceover reflektif. Sesekali screen-recording tools yang dipakai. Vertikal 9:16."
            boleh:
              - "Tunjukkan jam kerja sebenarnya termasuk yang tidak produktif atau distracted"
              - "Sertakan angka income bulan ini atau project rate (bisa disamarkan sebagai range)"
              - "Tampilkan setup kerja nyata — tidak harus estetik"
              - "Ceritakan satu tantangan spesifik hari itu (klien susah, invoice telat)"
            hindari:
              - "Jangan pura-pura setiap hari selalu produktif dan menyenangkan"
              - "Jangan rekam detail klien atau proyek yang bersifat rahasia"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan over-glorify kebebasan freelance tanpa mengakui ketidakpastiannya"
            pola_hook: "Detik 0: footage bangun atau mulai kerja jam tidak normal (sangat pagi atau sangat malam) + voiceover 'freelancer bukan berarti santai'. Langsung ke aktivitas."
            contoh_judul:
              - "Day in the life freelancer Indonesia yang jujur: jam berapa aku mulai dan selesai"
              - "Hari paling chaos sebagai freelancer — klien minta revisi jam 11 malam"
              - "Berapa yang aku hasilkan bulan ini sebagai freelancer desain grafis"
              - "Freelancer vs karyawan: ini sisi yang tidak pernah ditampilkan di konten motivasi"
              - "Hari kerja freelancer dari jam 7 pagi sampai jam 1 dini hari — ini kenapa"
            content_runway: "Setiap bidang freelance (desain, penulis, programmer, fotografer) menghasilkan daily life yang berbeda; variasi hari kerja, tantangan klien, dan income bulan menghasilkan konten berkelanjutan tanpa repetisi."

        - slug: vlog-bulan-pertama-hidup-sendiri
          name: Bulan Pertama Hidup Mandiri Pertama Kali
          description: Dokumentasi jujur bulan pertama tinggal sendiri jauh dari orang tua — biaya tak terduga, rasa sepi, dan pelajaran yang tidak ada di buku — untuk yang sedang merencanakan kemandirian.
          example_hook: "Bulan pertama hidup sendiri, ini yang tidak pernah diceritakan siapapun kepada aku sebelumnya..."
          guide:
            audience: "Anak muda 19–25 yang akan atau baru saja hidup mandiri; yang dibesarkan di rumah orang tua dan belum punya pengalaman tinggal sendiri; penonton yang ingin tahu realita finansial dan emosional hidup mandiri."
            tone: "Rentan dan jujur. Momen kesepian dan kewalahan diakui, bukan ditutupi. Ada pelajaran yang didapat tapi tidak terkesan ceramah."
            format: "75–90 detik. Rekap per minggu atau per kategori (keuangan, masak sendiri, kebersihan, sosial). Footage kos atau apartemen sehari-hari. Voiceover naratif. Teks overlay untuk angka dan fakta. Vertikal 9:16."
            boleh:
              - "Tampilkan breakdown pengeluaran nyata bulan pertama dengan angka"
              - "Ceritakan momen paling kesepian atau kewalahan dengan jujur"
              - "Tunjukkan hal yang ternyata lebih sulit dari ekspektasi (masak, laundry, belanja)"
              - "Akhiri dengan satu hal yang tidak disangka justru menyenangkan"
            hindari:
              - "Jangan tampilkan kos atau apartemen yang tidak realistis secara finansial untuk audiens target"
              - "Jangan skip momen negatif atau buat semuanya terlihat mudah"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan beri saran yang terkesan menggurui di akhir"
            pola_hook: "Detik 0: footage kondisi kos pertama kali masuk (kosong atau berantakan) + voiceover 'ini yang tidak pernah ada yang ceritakan sebelumnya'. Langsung masuk cerita."
            contoh_judul:
              - "Bulan pertama hidup sendiri — pengeluaran asli, tantangan asli, sepi asli"
              - "Ini yang tidak pernah diceritakan soal hidup mandiri pertama kali"
              - "Berapa habis di bulan pertama kos di Jakarta dari nol"
              - "Hal yang bikin aku hampir nyerah di bulan pertama hidup sendiri"
              - "Minggu pertama sendiri setelah 22 tahun tinggal sama orang tua — jujur"
            content_runway: "Setiap kota, latar belakang finansial, dan konteks (kuliah vs kerja) menghasilkan pengalaman yang berbeda; konten bisa diperpanjang ke update bulan ke-3, ke-6, dan ke-12 sebagai seri."

    - slug: productivity
      name: Produktivitas
      description: "Rutinitas, habit, time-management."
      faceless: true
      difficulty: pemula
      rpm: sedang
      formats: b-roll + teks + voiceover
      example_hook: "Rutinitas pagi yang ubah hidupku..."
      guide:
        audience: "Mahasiswa dan profesional muda 20–30 yang merasa hidupnya tidak cukup produktif; penonton yang suka baca buku self-help tapi kesulitan implementasi; mereka yang ingin sistem kerja lebih baik tapi tidak mau overcomplicating."
        tone: "Praktis dan langsung ke intinya. Tidak filosofis berlebihan. Penonton ingin tahu 'apa yang harus dilakukan' bukan 'kenapa ini penting'. Bahasa sederhana, tidak jargon berat."
        format: "45–75 detik. B-roll tangan, meja kerja, layar, atau notebook. Voiceover langsung dan padat. Teks overlay untuk langkah-langkah atau angka kunci. Tidak perlu tampil wajah. Vertikal 9:16."
        boleh:
          - "Berikan 1–3 langkah konkret yang bisa langsung dicoba hari ini"
          - "Gunakan angka spesifik (15 menit, 3 task, 1 notifikasi) untuk membuat saran terasa nyata"
          - "Tampilkan tools nyata yang digunakan (Notion, Obsidian, buku fisik)"
          - "Akui keterbatasan metode — tidak ada sistem yang cocok untuk semua orang"
        hindari:
          - "Jangan gunakan jargon seperti 'PKS', 'SMART goals', atau buzzword berlebihan tanpa penjelasan"
          - "Jangan klaim metode ini 'mengubah hidup' tanpa konteks yang jujur"
          - "Jangan pakai musik ber-hak-cipta"
          - "Jangan buat konten terlalu panjang — produktivitas audience adalah produk"
        pola_hook: "Detik 0: pernyataan yang langsung menyentuh masalah umum ('kamu kerja 10 jam tapi hasilnya cuma 3 jam') + transisi langsung ke inti solusi di detik 3."
        contoh_judul:
          - "Rutinitas pagi 20 menit yang bikin harian lebih terarah"
          - "Kenapa to-do list kamu tidak pernah berhasil — dan cara fiksinya"
          - "Sistem ini bikin aku selesai kerja lebih cepat tanpa lembur"
      micro:
        - slug: productivity-sistem-catatan-second-brain
          name: Sistem Catatan Digital yang Benar-benar Dipakai
          description: Panduan membangun sistem pencatatan digital sederhana yang sustainable — bukan yang terlalu kompleks dan akhirnya ditinggalkan — untuk knowledge worker dan mahasiswa.
          example_hook: "Sistem catatan ini aku pakai 2 tahun tanpa berhenti, dan ini yang berbeda dari yang lain..."
          guide:
            audience: "Mahasiswa dan knowledge worker 20–28 yang suka mencoba sistem pencatatan tapi selalu berhenti dalam sebulan; pengguna Notion yang membuat template kompleks lalu tidak dipakai; penonton yang mau second brain tapi tidak tahu mulai dari mana."
            tone: "Empatis dan anti-hype. Akui bahwa sistem yang terlalu kompleks justru tidak dipakai. Rekomendasikan yang simpel dan pragmatis untuk mayoritas orang."
            format: "60–75 detik. Screen-recording singkat aplikasi atau tampilan notebook. Voiceover naratif. Teks overlay untuk prinsip utama. B-roll tangan menulis atau mengetik. Vertikal 9:16."
            boleh:
              - "Tunjukkan tampilan nyata sistem yang dipakai (bukan template kosong yang terlalu cantik)"
              - "Jelaskan satu prinsip utama yang membedakan sistem ini dengan yang gagal sebelumnya"
              - "Sebutkan tools spesifik dengan kelebihan dan keterbatasannya"
              - "Sertakan satu contoh use case konkret (mencatat meeting, belajar buku)"
            hindari:
              - "Jangan promosikan satu tools seolah satu-satunya pilihan"
              - "Jangan tunjukkan Notion workspace dengan 50 database — itu intimidating bukan inspiratif"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan beri terlalu banyak langkah — maksimal 3 prinsip per video"
            pola_hook: "Detik 0: akui bahwa sistem catatan yang indah tapi tidak dipakai itu umum + langsung sebut apa yang berbeda dari sistem ini."
            contoh_judul:
              - "Sistem catatan yang aku pakai 2 tahun tanpa berhenti — dan ini yang membuatnya berbeda"
              - "Kenapa Notion template cantikmu tidak pernah dipakai setelah hari pertama"
              - "Second brain versi simpel yang cocok untuk orang Indonesia yang sibuk"
              - "Cara aku simpan semua info penting tanpa harus ingat di mana menyimpannya"
              - "3 aturan sistem catatan yang bikin aku tidak pernah kehilangan info penting lagi"
            content_runway: "Setiap tools (Notion, Obsidian, Logseq, buku fisik, Apple Notes), use case (kuliah, kerja, riset, baca buku), dan tingkat kompleksitas menghasilkan video berbeda; ekosistem produktivitas digital terus berkembang dan menghadirkan topik baru."

        - slug: productivity-deep-work-indonesia
          name: Deep Work di Era Distraksi Digital Indonesia
          description: Teknik konkret membangun sesi kerja fokus mendalam di tengah distraksi WhatsApp, Instagram, dan lingkungan kerja Indonesia yang interruptif.
          example_hook: "Aku bekerja 4 jam per hari dan hasilkan lebih banyak dari orang yang kerja 10 jam, ini caranya..."
          guide:
            audience: "Profesional dan mahasiswa 21–30 yang sering merasa sibuk tapi output tidak setimpal; pengguna smartphone aktif yang sadar distraksi tapi belum tahu cara konkret mengelolanya; penonton yang pernah baca tentang deep work tapi belum implementasi."
            tone: "Pragmatis dan sedikit provokatif. Tantang asumsi bahwa lebih lama kerja = lebih banyak hasil. Fokus pada teknik yang bisa diterapkan dalam konteks Indonesia (notif WA, open office, budaya rapat)."
            format: "60–75 detik. B-roll tangan di keyboard, layar fokus, atau notifikasi yang dimatikan. Voiceover langsung. Teks overlay untuk langkah atau data. Vertikal 9:16."
            boleh:
              - "Sertakan contoh konkret cara handle notifikasi WA dari grup kantor"
              - "Berikan jadwal spesifik yang bisa langsung dicoba (mis. '2 jam pertama no-interrupt')"
              - "Akui bahwa deep work bukan untuk setiap jenis pekerjaan — kontekstualisasi"
              - "Tampilkan screen-recording tools fokus yang dipakai (Forest, Freedom, mode senyap)"
            hindari:
              - "Jangan sarankan 'matikan semua notifikasi' tanpa address konsekuensi sosial Indonesia"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan buat terkesan hanya orang super disiplin yang bisa lakukan ini"
              - "Jangan over-klaim angka produktivitas tanpa konteks"
            pola_hook: "Detik 0: tampilkan angka kontras ('kerja 4 jam vs 10 jam, output lebih banyak') + transisi langsung ke penjelasan kenapa."
            contoh_judul:
              - "Aku kerja 4 jam sehari dan hasilkan lebih banyak — ini caranya bukan tipu"
              - "Cara matikan distraksi WA tanpa bikin kantor panik tidak bisa dihubungi"
              - "Deep work di Indonesia — teknik fokus yang bisa diterapkan tanpa resign"
              - "Satu perubahan ini bikin sesi kerja 2 jam lebih produktif dari 8 jam biasa"
              - "Kenapa kamu merasa sibuk tapi tidak ada yang selesai — dan cara mengatasinya"
            content_runway: "Setiap aspek lingkungan kerja Indonesia (WA grup, meeting tiba-tiba, open office, kerja dari kafe) menghasilkan video tersendiri; topik ini relevan untuk semua industri dan terus menjadi masalah aktual."

        - slug: productivity-review-mingguan-sederhana
          name: Review Mingguan 15 Menit yang Benar-benar Efektif
          description: Template review mingguan yang bisa diselesaikan dalam 15 menit dan cukup untuk menjaga progres tujuan jangka panjang, tanpa harus menjadi perfeksionis perencanaan.
          example_hook: "15 menit setiap Minggu malam yang bikin Senin paginya selalu dimulai dengan benar..."
          guide:
            audience: "Penonton 20–30 yang pernah coba weekly review tapi berhenti karena terlalu lama atau tidak konsisten; profesional yang ingin tahu apakah minggu ini produktif atau tidak; pengguna kalender dan todo list yang tidak pernah dievaluasi."
            tone: "Sederhana dan anti-perfeksionis. Tegaskan bahwa 15 menit yang dilakukan konsisten lebih baik dari 2 jam yang hanya dilakukan sekali. Template yang disajikan harus benar-benar bisa selesai dalam waktu itu."
            format: "60–75 detik. Screen-recording template atau notebook review. Voiceover menjelaskan tiap bagian. Teks overlay untuk 3–4 pertanyaan utama template. Vertikal 9:16."
            boleh:
              - "Tampilkan contoh pengisian template yang nyata, bukan template kosong"
              - "Berikan 3–5 pertanyaan konkret yang menjadi inti review"
              - "Jelaskan kapan dan di mana melakukan review (hari apa, jam berapa, di mana)"
              - "Akui bahwa minggu tidak sempurna tetap bisa di-review tanpa drama"
            hindari:
              - "Jangan tampilkan template review yang punya 20+ field — tidak akan dipakai"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan buat review terkesan hanya untuk orang dengan tujuan besar — ini untuk semua orang"
              - "Jangan skip penjelasan 'apa yang dilakukan saat review menunjukkan minggu buruk'"
            pola_hook: "Detik 0: tampilkan momen Senin pagi yang terasa kacau karena tidak ada rencana + langsung transisi ke 'ini yang aku lakukan Minggu malam'."
            contoh_judul:
              - "Review 15 menit setiap Minggu malam yang bikin Senin tidak pernah overwhelming"
              - "Template weekly review yang benar-benar bisa selesai dalam 15 menit — ini pertanyaannya"
              - "Cara aku tahu setiap minggu produktif atau tidak dalam 15 menit"
              - "Berhenti buat weekly review yang panjang dan tidak pernah diisi — coba yang ini"
              - "5 pertanyaan sederhana yang menjaga aku tetap on track setiap minggu"
            content_runway: "Setiap siklus perencanaan (harian, mingguan, bulanan, tahunan), tools yang berbeda (digital vs analog), dan konteks berbeda (mahasiswa, karyawan, freelancer) menghasilkan video tersendiri dengan audiens spesifik."

    - slug: minimalism
      name: "Minimalism / Declutter"
      description: "Hidup minimalis, rapikan barang."
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: b-roll + before-after
      example_hook: "Aku buang 100 barang dan..."
      guide:
        audience: "Penonton 20–35 yang merasa ruangan atau hidupnya terlalu penuh; pemilik kos atau apartemen kecil yang ingin hidup lebih ringan; penonton yang terinspirasi Marie Kondo atau minimalism aesthetics tapi butuh pendekatan Indonesia."
        tone: "Reflektif dan praktis. Minimalism bukan soal estetika putih bersih tapi soal fungsi dan ketenangan. Jujur tentang hambatan (orang tua yang tidak setuju, attachment emosional terhadap barang)."
        format: "60–90 detik. Before-after footage ruangan atau lemari. B-roll proses sortir dan membuang. Voiceover naratif yang jujur. Teks overlay untuk angka (100 barang, Rp0 budget). Vertikal 9:16."
        boleh:
          - "Tampilkan kondisi sebelum yang benar-benar berantakan — kontras adalah kunci"
          - "Akui attachment emosional terhadap barang sebagai hal yang normal, bukan kelemahan"
          - "Berikan tips donasi atau jual barang bekas yang relevan di Indonesia (Carousell, donasi masjid)"
