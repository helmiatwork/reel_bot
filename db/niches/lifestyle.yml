          name: Study With Me Malam Sebelum Deadline
          description: Sesi belajar intensitas tinggi untuk malam sebelum ujian atau deadline, dengan energi yang mencerminkan kondisi nyata — kopi, meja berantakan, dan fokus penuh.
          example_hook: "Tinggal 12 jam sebelum deadline, belajar bareng dari sekarang sampai selesai..."
          guide:
            audience: "Mahasiswa 17–24 yang sedang krisis deadline atau malam sebelum ujian; penonton yang butuh teman belajar yang juga merasakan tekanan yang sama; mereka yang belajar lebih baik dalam suasana urgensi yang dirasakan bersama."
            tone: "Urgent tapi tidak panik. Ada acknowledgment bahwa ini situasi crunch, tapi energinya fokus bukan dramatis. Kopi dan meja tidak sempurna adalah visual yang jujur dan relatable."
            format: "2–6 jam. Timer countdown ke deadline terlihat di layar. Musik lebih energik dari sesi Pomodoro biasa — lo-fi dengan tempo lebih cepat. Visual boleh sedikit lebih 'chaos' (meja penuh buku). Tidak ada voiceover. Landscape 16:9 atau vertikal 9:16."
            boleh:
              - "Tampilkan countdown ke deadline di layar sebagai motivasi bersama"
              - "Pilih playlist yang sedikit lebih energik untuk kondisi deadline night"
              - "Visual meja sedikit berantakan lebih autentik daripada meja terlalu rapi"
              - "Judul dan thumbnail yang communicate urgency tanpa sensationalism"
            hindari:
              - "Jangan tambahkan narasi tentang betapa stresnya situasi ini"
              - "Jangan gunakan musik yang terlalu loud atau dengan lirik"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan tampilkan konten yang bisa dianggap mempromosikan ketidakdisiplinan akademis"
            pola_hook: "Detik 0: tampilkan countdown '12 jam lagi' + meja buku dan kopi + musik fade in. Tidak ada intro — langsung suasana malam deadline."
            contoh_judul:
              - "Tinggal 12 jam sebelum deadline — belajar bareng dari sekarang sampai selesai"
              - "Malam sebelum ujian, belajar bareng sampai jam 3 pagi kalau perlu"
              - "Study with me deadline night — kopi, panik terkontrol, dan fokus"
              - "UTS besok jam 8 pagi — belajar bareng malam ini dari nol"
              - "Sprint belajar 6 jam untuk materi yang belum sempat dibaca"
            content_runway: "Setiap semester, setiap musim ujian, dan setiap mata kuliah atau topik deadline menghasilkan konteks yang berbeda; audiens mahasiswa selalu ada dan siklus akademik menjamin relevansi konten ini."

        - slug: study-with-me-cafe-ambience
          name: Work With Me dengan Ambience Kafe Indonesia
          description: Sesi kerja bersama dengan latar suara kafe Indonesia yang autentik — mesin kopi, obrolan samar, dan musik akustik — untuk yang tidak bisa ke kafe tapi butuh suasananya.
          example_hook: "Tidak perlu keluar rumah untuk kerja dengan suasana kafe, belajar bareng di sini..."
          guide:
            audience: "Penonton 20–30 yang produktif di kafe tapi tidak selalu bisa ke sana; remote worker yang suka suasana kafe tapi budget atau waktu tidak memungkinkan; penonton yang tahu mereka lebih fokus dengan white noise kafe."
            tone: "Hangat dan nyaman. Suasana kafe Indonesia yang familiar — mesin kopi manual, obrolan samar Bahasa Indonesia, musik akustik lokal — menciptakan koneksi emosional lebih dari ambient asing."
            format: "1–4 jam. Campuran rekaman kafe nyata dan footage working setup. Suara kafe ambience sebagai audio utama. Visual: laptop di meja kafe, cangkir kopi, atau luar jendela kafe. Tidak ada timer eksplisit — lebih bebas dari Pomodoro. Vertikal atau landscape."
            boleh:
              - "Rekam suara kafe Indonesia yang autentik dengan mic eksternal untuk kualitas audio lebih baik"
              - "Pilih kafe dengan karakter audio yang berbeda dari sesi ke sesi (kafe sunyi vs kafe ramai)"
              - "Tampilkan visual kafe dari berbagai kota Indonesia untuk variasi"
              - "Sisipkan ambient sound natural (hujan di luar kafe) untuk dimensi audio tambahan"
            hindari:
              - "Jangan gunakan ambience kafe asing yang tidak relevan secara budaya untuk penonton Indonesia"
              - "Jangan rekam suara percakapan yang cukup jelas hingga privasi orang lain terekspos"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan overprocess audio sehingga kehilangan karakter autentik kafe Indonesia"
            pola_hook: "Detik 0: langsung masuk suara kafe — mesin kopi atau obrolan samar — + footage meja kafe + teks durasi sesi. Tidak ada intro verbal."
            contoh_judul:
              - "Kerja bareng di kafe Bandung — 3 jam ambience dan lo-fi untuk fokus"
              - "Work with me suasana kafe Jakarta yang autentik — tidak perlu keluar rumah"
              - "Belajar bareng di kafe dengan suara mesin kopi dan hujan ringan di luar"
              - "Ambience kafe Indonesia 2 jam untuk yang butuh suasana tapi malas keluar"
              - "Study session di kafe indie Yogyakarta — musik akustik dan kopi pagi"
            content_runway: "Setiap kota (Jakarta, Bandung, Jogja, Surabaya, Bali), jenis kafe (kopi specialty, kafe pinggir sawah, kafe coworking), waktu (pagi, sore, malam), dan kondisi cuaca menghasilkan ambience yang berbeda."

    - slug: aesthetic
      name: "Aesthetic / Mood"
      description: "Visual estetik + musik, vibe."
      faceless: true
      difficulty: pemula
      rpm: rendah
      formats: footage estetik + musik
      example_hook: "Hidup slow living kayak gini..."
      guide:
        audience: "Penonton 16–28 yang menghargai keindahan visual dan momen tenang; pengikut aesthetic content di Instagram dan TikTok; penonton yang butuh konten 'reset' untuk memperlambat tempo hari mereka."
        tone: "Puitis dan penuh perasaan. Tidak ada informasi — hanya suasana. Penonton datang untuk merasakan sesuatu, bukan belajar sesuatu. Caption bisa singkat atau tidak ada sama sekali."
        format: "30–90 detik. Footage estetik: detail visual kecil, cahaya, tekstur, alam, atau kota. Musik sebagai emosi utama — instrumental atau lo-fi. Editing lambat dan disengaja. Tidak ada voiceover. Teks minimal atau tidak ada. Vertikal 9:16."
        boleh:
          - "Pilih musik yang benar-benar mewakili mood yang ingin diciptakan"
          - "Edit dalam ritme musik — setiap cut seharusnya terasa disengaja"
          - "Fokus pada detail kecil yang biasanya tidak disadari — titik cahaya, uap kopi, hujan di kaca"
          - "Gunakan color grading konsisten yang menjadi identitas visual channel"
        hindari:
          - "Jangan tampilkan wajah secara jelas — menjaga misteri visual lebih kuat"
          - "Jangan pakai musik ber-hak-cipta"
          - "Jangan berlebihan dalam teks overlay — merusak suasana"
          - "Jangan rekam dengan tangan goyang tanpa stabilizer atau teknik handheld yang disengaja"
        pola_hook: "Detik 0: shot paling visual indah atau emosional langsung di frame pertama + musik fade in. Tidak ada setup atau penjelasan."
        contoh_judul:
          - "Hidup slow living seperti ini seharusnya menjadi standar"
          - "Momen-momen kecil yang bikin hari terasa cukup"
          - "Tonton ini kalau kamu butuh 60 detik untuk berhenti sejenak"
      micro:
        - slug: aesthetic-pagi-slow-living
          name: Pagi Hari yang Tenang dan Tidak Terburu-buru
          description: Footage estetik rutinitas pagi yang lambat dan penuh kesadaran — kopi, cahaya matahari pagi, dan sarapan sederhana — menginspirasi penonton untuk memperlambat tempo.
          example_hook: "Pagi seperti ini seharusnya menjadi standar, bukan pengecualian..."
          guide:
            audience: "Penonton 19–30 yang sering bangun terburu-buru dan merindukan pagi yang tenang; audiens aesthetic yang terinspirasi slow living tapi sibuk dalam keseharian; mereka yang menonton konten ini sebagai bentuk self-care vikarial."
            tone: "Tenang dan aspirasional. Tidak ada pretensi — momen yang ditampilkan bisa sederhana, yang penting autentik. Cahaya pagi dan suara yang minimal adalah karakter utama."
            format: "45–75 detik. Footage golden hour pagi, uap kopi, cahaya masuk jendela, tangan membuka buku. Musik instrumental tenang atau tidak ada. Editing sangat lambat. Tidak ada teks atau minimal. Vertikal 9:16."
            boleh:
              - "Rekam dalam cahaya pagi alami — tidak perlu ring light"
              - "Tampilkan detail kecil: butir kopi, uap teh, cahaya di lantai kayu"
              - "Gunakan color grading warm-tone yang konsisten"
              - "Edit mengikuti ritme musik — jangan cut terlalu cepat"
            hindari:
              - "Jangan tampilkan wajah secara jelas — ini konten faceless"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan tambahkan teks motivasi panjang — merusak suasana"
              - "Jangan rekam pagi yang sebenarnya terburu-buru lalu buat terlihat tenang"
            pola_hook: "Detik 0: shot cahaya pagi pertama masuk jendela atau uap kopi naik + musik fade in lembut. Tidak ada teks."
            contoh_judul:
              - "Pagi seperti ini seharusnya standar, bukan pengecualian yang langka"
              - "Slow morning yang bikin hari terasa lebih panjang dengan cara yang baik"
              - "Rutinitas pagi yang tidak terburu-buru — footage untuk yang butuh rehat"
              - "Cahaya pagi ini terlalu indah untuk tidak diabadikan"
              - "60 detik pagi yang tenang untuk reset sebelum hari dimulai"
            content_runway: "Setiap musim, cuaca pagi, lokasi (kota, desa, pegunungan, pantai), dan elemen pagi (kopi, teh, buku, tanaman) menghasilkan footage yang berbeda; rutinitas pagi adalah universal dan bisa diproduksi setiap hari."

        - slug: aesthetic-malam-hujan-indoor
          name: Suasana Malam Hujan di Dalam Ruangan
          description: Footage estetik malam hujan dari dalam rumah atau kafe — suara hujan, lilin, dan buku — menciptakan mood yang nyaman dan mendorong penonton untuk menikmati momen sepi.
          example_hook: "Hujan di luar, hangat di dalam, dan waktu yang akhirnya hanya untuk dirimu sendiri..."
          guide:
            audience: "Penonton 17–28 yang merasakan koneksi emosional kuat dengan suasana hujan; audiens yang menggunakan konten ini untuk relaksasi atau menemani malam; penonton Indonesia yang memiliki hubungan budaya kuat dengan suara hujan."
            tone: "Melankolis dan nyaman sekaligus. Ada rasa protected dari dunia luar. Tidak sentimental berlebihan — biarkan visual dan audio menciptakan emosi tanpa narasi."
            format: "60–90 detik. Footage jendela berhujan, lilin menyala, buku di tangan, cangkir hangat. Suara hujan asli sebagai audio utama, bisa dikombinasikan dengan musik ambient lembut. Tidak ada voiceover. Vertikal 9:16."
            boleh:
              - "Rekam suara hujan asli dengan mic eksternal untuk kualitas audio lebih baik"
              - "Tampilkan kontras dalam-luar: hangat di dalam, gelap basah di luar"
              - "Gunakan lighting warm (lilin atau lampu kuning) untuk suasana cozy"
              - "Slow-motion tetes hujan di kaca untuk detail visual yang menarik"
            hindari:
              - "Jangan pakai suara hujan efek yang terlalu artificial — autentisitas adalah nilainya"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan rekam dengan pencahayaan yang terlalu terang — hancurkan suasana cozy"
            pola_hook: "Detik 0: langsung suara hujan + shot jendela berhujan dari dalam. Tidak ada intro. Biarkan suara dan visual berbicara dari frame pertama."
            contoh_judul:
              - "Hujan di luar, hangat di dalam — momen yang jarang bisa dinikmati"
              - "Suasana malam hujan untuk yang butuh waktu sendirian"
              - "Malam hujan dan lilin — aesthetic yang belum pernah membosankan"
              - "Footage hujan malam ini untuk teman rebahan yang tenang"
              - "Dalam ruangan saat hujan lebat adalah satu-satunya tempat yang ingin aku tuju"
            content_runway: "Setiap intensitas hujan, lokasi (kos, rumah desa, kafe), elemen indoor (lilin, buku, kopi, tanaman), dan waktu malam menghasilkan footage berbeda; musim hujan Indonesia menjamin pasokan konten hampir setengah tahun."

        - slug: aesthetic-golden-hour-kota
          name: Golden Hour di Kota-kota Indonesia
          description: Kompilasi footage golden hour dari berbagai kota Indonesia — jalanan Jakarta, sawah Jogja, pantai Bali — sebagai konten estetik yang merayakan keindahan lokal yang sering terabaikan.
          example_hook: "Kota yang sama setiap hari, tapi jam 6 sore dia berubah jadi ini..."
          guide:
            audience: "Penonton 18–30 yang tinggal di kota Indonesia dan sering lupa melihat keindahan di sekitar mereka; fotografer dan videografer amatir yang terinspirasi; penonton yang menghargai representasi estetik Indonesia yang tidak selalu Bali."
            tone: "Bangga lokal dan penuh rasa kagum. Setiap kota Indonesia punya golden hour-nya sendiri. Tujuan konten ini adalah membuat penonton berhenti sejenak dan sadar keindahan yang ada."
            format: "45–75 detik. Kompilasi 5–8 shot golden hour dari satu kota atau beberapa kota. Edit mengikuti ritme musik. Tidak ada teks atau minimal (nama kota saja). Musik sebagai emosi. Vertikal 9:16."
            boleh:
              - "Variasikan sudut: street level, rooftop, dari dalam kendaraan, tepi sawah"
              - "Sertakan elemen khas kota masing-masing (bajaj Jakarta, becak Jogja, kapal Makassar)"
              - "Color grading yang memaksimalkan warm tone golden hour"
              - "Edit yang lambat dengan occasional cut cepat di peak moment"
            hindari:
              - "Jangan hanya rekam Bali atau Jakarta — Indonesia jauh lebih luas"
              - "Jangan pakai musik ber-hak-cipta"
              - "Jangan rekam golden hour dengan handphone tanpa stabilizer kecuali memang disengaja untuk efek"
              - "Jangan tambahkan teks motivasi panjang — golden hour bicara sendiri"
            pola_hook: "Detik 0: shot golden hour paling dramatis langsung di frame pertama + nama kota minimal + musik. Tidak ada build-up."
            contoh_judul:
              - "Kota yang sama setiap hari tapi jam 6 sore dia berubah jadi seperti ini"
              - "Golden hour Jakarta yang tidak pernah ada di foto Instagram siapapun"
              - "Yogyakarta saat golden hour adalah alasan untuk tidak pernah pindah"
              - "5 kota Indonesia di jam paling indah dalam sehari"
              - "Indonesia terlalu cantik saat golden hour untuk hanya dilihat dari feed orang lain"
            content_runway: "Setiap kota besar dan kecil di Indonesia (ratusan), setiap musim, setiap cuaca berbeda (berawan vs cerah), dan setiap sudut yang belum pernah direkam menjamin pasokan konten golden hour yang hampir tidak terbatas."
