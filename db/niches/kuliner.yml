version: 1
vertical:
  slug: v-kuliner
  name: Kuliner
  description: Konten masakan, resep, review makanan, dan jajanan untuk pecinta kuliner Indonesia.
  guide:
    audience: "Penonton Indonesia 18–40 yang suka masak, makan, dan eksplorasi kuliner lokal; campuran ibu rumah tangga, anak kos, foodie muda, dan pencinta jajanan tradisional; aktif di TikTok dan Shorts untuk inspirasi resep dan rekomendasi tempat makan."
    tone: "Hangat, autentik, dan menggugah selera. Konten tidak perlu sempurna — dapur rumahan, tangan yang sedikit kotor bumbu, dan plating sederhana justru membuat penonton merasa relevan. Bahasa kasual, kadang pakai kata-kata nostalgia."
    format: "Video 30–90 detik. Kombinasi close-up bahan dan proses masak, POV tangan, dan reveal makanan jadi. Suara proses (tumis, goreng, aduk) diutamakan. Teks overlay singkat untuk langkah-langkah atau fakta menarik. Vertikal 9:16."
    boleh:
      - "Tampilkan bumbu dan bahan asli Indonesia — bawang merah, cabai rawit, kemiri — sebagai elemen visual"
      - "Gunakan suara proses memasak asli (tumis, goreng, ulek) sebagai asmr ringan"
      - "Sertakan konteks emosional: resep nenek, makanan waktu kecil, jajanan yang hampir punah"
      - "Close-up texture makanan jadi untuk reveal yang menggugah selera"
      - "Teks overlay singkat nama bahan atau langkah kunci tanpa penjelasan panjang"
    hindari:
      - "Jangan pakai musik ber-hak-cipta — gunakan royalty-free atau instrumental"
      - "Jangan tampilkan proses yang terlihat tidak higienis tanpa konteks"
      - "Jangan skip langkah kritis yang membuat penonton tidak bisa mereplikasi"
      - "Jangan klaim 'paling enak' atau 'resep rahasia' tanpa bukti — terasa clickbait murahan"
      - "Jangan gunakan bahan yang tidak tersedia di pasar lokal Indonesia tanpa alternatif"
    pola_hook: "Detik 0–2: tampilkan hasil akhir makanan yang menggugah selera ATAU close-up proses paling dramatis (sambal diulek, kue didekorasi, ayam digoreng) + teks singkat konteks. Langsung masuk proses di detik 3."
    contoh_judul:
      - "Resep ini cuma 3 bahan tapi selalu habis dalam 10 menit"
      - "Makanan ini hampir punah dan hanya satu penjual yang masih bisa bikinnya"
      - "POV masak makan malam untuk diri sendiri waktu lapar banget"

  niches:
    - slug: kuliner-pov
      name: Kuliner POV
      description: "Masak/makan POV tangan, ASMR."
      faceless: true
      difficulty: pemula
      rpm: sedang
      formats: POV + ASMR + hard-sub
      example_hook: "Resep viral Korea 3 bahan..."
      guide:
        audience: "Penonton 16–35 yang suka konten masak santai dan ASMR; anak kos dan pekerja muda yang sering lapar tapi malas keluar; penonton yang ingin nonton proses masak dari sudut pandang si pemasak."
        tone: "Intim dan personal. Kamera ada di posisi mata pembuat konten — penonton merasa seolah memasak sendiri. Suara proses mendominasi, teks overlay minimal, dan tidak ada narasi panjang."
        format: "45–75 detik. Full POV tangan dari awal sampai makanan jadi. Suara bumbu masuk wajan, adukan, dan plating diboost ringan. Teks overlay nama bahan atau waktu masak jika relevan. Vertikal 9:16, stabil dan terang."
        boleh:
          - "Gunakan angle overhead atau chest-mount agar tangan selalu terlihat natural"
          - "Boost suara tumis bawang dan reaksi panas minyak untuk ASMR effect"
          - "Tampilkan hasil akhir didekatkan ke kamera — warna dan steam makanan sangat menarik"
          - "Teks overlay singkat nama bahan kunci saat pertama kali dimasukkan"
        hindari:
          - "Jangan ada wajah di frame — channel ini faceless"
          - "Jangan narasi panjang atau voiceover penjelasan — biarkan visual dan suara bicara"
          - "Jangan pakai music terlalu dominan yang kalahkan suara masak"
          - "Jangan rekam dengan pencahayaan buruk — warna makanan harus terlihat segar dan menggugah"
        pola_hook: "Detik 0: POV tangan langsung mengambil bahan pertama atau memanas wajan + teks singkat nama masakan dan waktu masak ('Tumis kangkung — 5 menit'). Tidak ada intro."
        contoh_judul:
          - "POV kamu masak ini sambil lapar dan ternyata jadi dalam 5 menit"
          - "POV bangun jam 5 pagi ke pasar sebelum jajanan ini habis"
          - "Resep warisan nenek yang belum pernah ditulis — tangan yang ingat caranya"

      micro:
        - slug: kuliner-pov-tumisan-5-menit
          name: POV Tumisan Lezat dalam 5 Menit
          description: POV hands-on memasak tumisan nusantara yang lezat dalam waktu singkat, difilmkan dari sudut mata burung dengan suara ASMR bumbu yang memuaskan.
          example_hook: "POV kamu masak ini sambil lapar banget dan ternyata jadi dalam 5 menit..."
          guide:
            audience: "Anak kos dan pekerja 18–30 yang lapar setelah pulang kerja atau kuliah dan butuh solusi masak cepat; penonton yang tertarik masak tapi terintimidasi proses panjang."
            tone: "Cepat, efisien, dan memuaskan. Setiap gerakan tangan terlihat purposeful. Suara bawang masuk minyak dan tumisan sizzle menjadi ritme video."
            format: "45–60 detik. Urutan: bahan sudah disiapkan → tumis bumbu (suara masuk ke minyak panas) → masukkan bahan utama → aduk → plating → close-up final. POV overhead stabil. Vertikal 9:16."
            boleh:
              - "Pilih masakan yang punya suara tumisan paling kuat — kangkung, bayam, atau tauge sangat ASMR"
              - "Boost suara minyak panas dan bawang tumis"
              - "Teks waktu nyata di sudut video ('2:34') untuk membuktikan memang cepat"
              - "Close-up akhir makanan dalam piring dengan uap tipis yang terlihat"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan pakai bahan yang susah dicari atau mahal tanpa alternatif"
              - "Jangan edit terlalu cepat sampai proses tidak terlihat realistis"
              - "Jangan musik keras yang dominan — suara masak adalah bintangnya"
            pola_hook: "Detik 0: tangan langsung mengambil bawang dan memasukkan ke minyak panas + suara sizzle langsung terdengar + teks 'Tumis [nama] — 5 menit'. Tidak ada intro."
            contoh_judul:
              - "POV masak tumis kangkung waktu lapar banget dan hasilnya dalam 5 menit"
              - "Tumisan ini cuma butuh 4 bahan dan satu wajan, anak kos wajib tahu"
              - "Suara bawang masuk minyak panas ini bikin lapar setiap kali dengar"
              - "POV masak makan malam sendiri setelah pulang kerja pukul 9 malam"
              - "Resep tumis yang nasi putih 2 piring habis karena ini terlalu enak"
            content_runway: "Setiap jenis sayuran, protein (tempe, tahu, ayam, udang), dan variasi bumbu (saus tiram, terasi, bawang putih) menghasilkan video berbeda; ada ratusan tumisan nusantara yang belum terdokumentasi."

        - slug: kuliner-pov-jajan-pasar-pagi
          name: POV Jajan Pasar Pagi Tradisional
          description: POV berkeliling pasar tradisional Indonesia pagi hari, membeli dan mencicipi jajanan pasar yang makin langka, memadukan nostalgia dan dokumentasi kuliner lokal.
          example_hook: "POV kamu bangun jam 5 pagi ke pasar dan cari jajanan ini sebelum habis..."
          guide:
            audience: "Penonton 20–45 yang rindu suasana pasar tradisional dan jajanan masa kecil; diaspora Indonesia yang kangen suasana pasar pagi; generasi muda yang ingin mengenal kuliner lokal yang menghilang."
            tone: "Nostalgik dan hangat. Suasana pasar pagi — suara pedagang, aroma jajanan kukus, dan warna-warni kue basah — menjadi karakter utama. Tidak perlu banyak kata; visual pasar bicara sendiri."
            format: "60–90 detik. POV berjalan di pasar → fokus satu-dua jajanan menarik → transaksi singkat (tangan mengambil, membayar) → close-up detail jajanan → cicip (tangan saja, bukan wajah). Vertikal 9:16, handheld stabil."
            boleh:
              - "Tampilkan suasana pasar pagi — asap kukusan, lampu pagi, dan pedagang veteran"
              - "Close-up detail jajanan: warna, tekstur, dan packaging daun pisang atau anyaman bambu"
              - "Suara pasar asli: tawar-menawar samar, sendok di wajan, dan suara jajanan dibungkus"
              - "Teks overlay nama jajanan dan harga untuk konteks yang informatif"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan pakai musik keras yang bunuh suasana pasar autentik"
              - "Jangan rekam di pasar modern yang sudah kehilangan karakter tradisionalnya"
              - "Jangan klaim satu jajanan sebagai 'terenak' tanpa konteks — terlalu subjektif"
            pola_hook: "Detik 0: close-up warna-warni kue basah atau kukusan pagi di lapak pasar + teks 'POV ke pasar jam 05:30 sebelum habis'. Tangan langsung menunjuk atau mengambil jajanan pertama di detik 2."
            contoh_judul:
              - "POV ke pasar jam 5 pagi dan ini yang ditemukan sebelum habis semua"
              - "Jajanan pasar ini sudah langka — aku dokumentasikan sebelum benar-benar hilang"
              - "Warna-warni kue basah ini sudah jarang terlihat, pasar ini masih punya semuanya"
              - "POV beli 10 jajanan pasar pagi dengan Rp50rb — ini isinya"
              - "Nenek ini jual jajanan yang sama sejak 1978, aku beli semuanya"
            content_runway: "Setiap daerah Indonesia punya jajanan pasar berbeda (lebih dari 300 jenis kue basah nusantara); setiap pasar tradisional menawarkan suasana dan produk yang unik, dan konten dokumentasi ini semakin langka seiring pasar modern berkembang."

        - slug: kuliner-pov-masak-warisan-nenek
          name: POV Masak Resep Warisan Nenek
          description: POV memasak resep tradisional keluarga yang diturunkan turun-temurun dengan teknik dan bumbu asli, memadukan nostalgia dengan pelestarian kuliner lokal.
          example_hook: "Resep ini tidak pernah aku tulis, aku cuma ingat tangan nenek yang lakukannya..."
          guide:
            audience: "Penonton 22–45 yang rindu masakan rumah dan tradisi keluarga; generasi muda yang ingin belajar masak dari warisan leluhur; penonton diaspora Indonesia yang kangen rasa kampung halaman."
            tone: "Nostalgik dan penuh rasa hormat. Setiap langkah terasa seperti menjaga sesuatu yang berharga. Suara cobek, ulek, dan wajan tradisional menjadi melodi yang menghubungkan generasi."
            format: "75–90 detik. Mulai dari bahan-bahan asli (rempah, daun, bumbu yang unik) → proses tradisional (ulek bukan blender, masak di wajan besi) → proses memasak bertahap → hasil akhir yang autentik. Teks overlay nama masakan dan asal daerah. Vertikal 9:16."
            boleh:
              - "Gunakan alat masak tradisional — cobek, wajan besi, kukusan bambu — untuk visual dan suara autentik"
              - "Tampilkan bahan-bahan unik yang mungkin tidak dikenal penonton muda dengan teks nama"
              - "Boost suara ulek cobek dan tetesan di wajan besi"
              - "Teks singkat asal daerah masakan dan konteks kapan biasanya dimakan"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan ganti teknik tradisional dengan alat modern tanpa mencatat perbedaannya"
              - "Jangan pakai musik modern yang tidak cocok dengan vibe nostalgia"
              - "Jangan skip langkah yang tidak familiar — itu justru bagian paling berharga dari video"
            pola_hook: "Detik 0: close-up bahan rempah yang unik atau alat masak tradisional + teks 'Resep [nama masakan] — warisan dari [nama daerah]'. Tangan langsung mulai ulek atau siapkan bahan di detik 2."
            contoh_judul:
              - "Resep ini tidak pernah ditulis, aku rekonstruksi dari ingatan tangan nenek"
              - "Gulai ini cuma bisa dibuat kalau punya 7 rempah ini — ini cara membuatnya"
              - "POV masak opor ayam kampung dengan cara yang sudah 60 tahun tidak berubah"
              - "Bumbu dapur ini tidak dijual di supermarket tapi nenek selalu punya stoknya"
              - "Masakan ini cuma muncul saat lebaran di keluarga aku — ini resep aslinya"
            content_runway: "Indonesia punya ribuan resep tradisional per daerah yang belum terdokumentasi; setiap suku, setiap keluarga, dan setiap musim menghasilkan variasi yang hampir tak terbatas untuk seri konten masak warisan."

    - slug: recipe
      name: Resep Cepat
      description: Resep step-by-step time-lapse.
      faceless: true
      difficulty: pemula
      rpm: sedang
      formats: time-lapse + hard-sub
      example_hook: "Sarapan 5 menit anti ribet..."
      guide:
        audience: "Pekerja dan mahasiswa 18–35 yang ingin masak sendiri tapi tidak punya banyak waktu; ibu rumah tangga yang mencari variasi menu harian yang simpel; anak kos yang bosan mie instan dan mau hemat dari beli makanan."
        tone: "Praktis dan efisien. Setiap langkah terlihat mudah dan mungkin dilakukan siapa saja. Tidak ada istilah teknis memasak — semua dijelaskan dalam bahasa sehari-hari."
        format: "45–75 detik. Struktur: bahan ditampilkan (1–2 detik) → proses step-by-step dengan teks hard-sub di setiap langkah kunci → reveal hasil akhir. Time-lapse untuk proses yang panjang. Close-up hasil akhir. Vertikal 9:16."
        boleh:
          - "Tampilkan bahan dengan teks nama dan estimasi harga untuk relevansi budget"
          - "Time-lapse bagian yang repetitif (aduk, tunggu mendidih) untuk mempersingkat durasi"
          - "Teks hard-sub dengan waktu estimasi per langkah ('tumis 2 menit')"
          - "Reveal akhir close-up makanan yang sudah diplating dengan rapi"
        hindari:
          - "Jangan tampilkan wajah — channel ini faceless"
          - "Jangan gunakan bahan impor yang susah dicari tanpa alternatif lokal"
          - "Jangan skip langkah — penonton harus bisa mereplikasi persis"
          - "Jangan pakai musik keras; ambient ringan atau suara memasak cukup"
        pola_hook: "Detik 0: reveal hasil akhir makanan yang sudah jadi + teks nama masakan dan durasi masak. Langsung potong ke bahan-bahan di detik 2."
        contoh_judul:
          - "Sarapan 5 menit ini lebih enak dari yang dijual di kafe"
          - "Masakan satu wajan 15 menit untuk makan malam yang tidak instan"
          - "Resep ini murah, cepat, dan tidak ada yang percaya kamu masak sendiri"

      micro:
        - slug: recipe-satu-wajan
          name: Resep Lengkap Satu Wajan Satu Malam
          description: Resep makan malam penuh yang dimasak dalam satu wajan saja — minim cuci piring, waktu masak di bawah 20 menit — menyasar pekerja yang pulang malam dan tetap ingin masak sendiri.
          example_hook: "Masakan ini butuh satu wajan dan 15 menit, lebih murah dari delivery dan lebih enak..."
          guide:
            audience: "Pekerja 22–35 yang pulang malam dan malas cuci banyak peralatan; pasangan muda yang ingin masak bersama tanpa drama membersihkan dapur; siapapun yang menghindari pesan makanan tapi tidak mau ribet."
            tone: "Santai dan reassuring. Nada 'ini gampang banget, percaya deh.' Setiap langkah terlihat tidak menakutkan. Masak satu wajan adalah solusi, bukan kompromi."
            format: "50–70 detik. Urutan: semua bahan terlihat dalam satu frame → satu wajan dipanaskan → proses bertahap dalam satu wajan → makanan jadi disajikan dari wajan langsung. Teks langkah kunci. Vertikal 9:16."
            boleh:
              - "Tampilkan bahan dalam satu tray atau meja untuk visual 'ini saja bahan yang dibutuhkan'"
              - "Tunjukkan bahwa tidak ada panci atau wajan kedua yang dipakai"
              - "Reveal akhir: makan langsung dari wajan atau plating sederhana — tidak perlu mewah"
              - "Tambahkan teks total biaya bahan jika di bawah Rp30rb untuk relevansi"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan pakai lebih dari satu wajan meskipun tergoda untuk hasil lebih baik"
              - "Jangan gunakan alat dapur yang jarang ada di rumah orang (immersion blender, dsb)"
              - "Jangan skip tahap menumis bumbu — itu inti rasa masakan Indonesia"
            pola_hook: "Detik 0: close-up satu wajan di atas kompor dengan teks 'Makan malam — 1 wajan — 15 menit'. Bahan pertama masuk langsung di detik 2."
            contoh_judul:
              - "Makan malam satu wajan 15 menit yang lebih enak dari delivery manapun"
              - "Aku pulang jam 10 malam dan masih masak ini, dan hasilnya ini"
              - "Satu wajan, 4 bahan, 12 menit — resep yang selalu aku ulang setiap minggu"
              - "Nasi goreng ayam telur satu wajan yang tidak pernah gagal walau ngantuk"
              - "Cuci piring setelah masak ini cuma 2 menit karena cuma satu wajan yang kotor"
            content_runway: "Setiap jenis protein (ayam, telur, tempe, tahu, ikan), setiap variasi bumbu nusantara, dan setiap jenis karbohidrat (nasi, mie, pasta) menghasilkan kombinasi satu wajan yang berbeda; ada ratusan variasi yang bisa dibuat tanpa pengulangan."

        - slug: recipe-sisa-bahan-kulkas
          name: Masak dari Sisa Bahan Kulkas yang Mau Kadaluarsa
          description: Serial resep kreatif menggunakan kombinasi sisa bahan yang ada di kulkas sebelum kadaluarsa, mengurangi food waste sekaligus mengajarkan improvisasi memasak.
          example_hook: "Ada telur, tempe, dan wortel sisa, ini yang aku masak dan hasilnya..."
          guide:
            audience: "Penonton 20–40 yang sering buang bahan makanan karena tidak tahu mau dimasak apa; ibu rumah tangga yang berhemat; penonton yang tertarik zero-waste living dan pengurangan food waste."
            tone: "Kreatif dan problem-solving. Nada 'lihat, bahan yang hampir kamu buang ini bisa jadi makan siang yang layak.' Improvisasi dirayakan, bukan dimaafkan."
            format: "50–75 detik. Urutan: tampilkan bahan sisa di kulkas (dengan kondisi realnya) → proses memasak cepat → hasil yang mengejutkan mengingat bahan yang terbatas → reveal. Teks kunci bahan di awal. Vertikal 9:16."
            boleh:
              - "Tunjukkan kondisi bahan yang hampir habis atau mendekati kadaluarsa — autentisitas kuncinya"
              - "Tampilkan proses improvisiasi yang terlihat natural, bukan terencana"
              - "Tambahkan teks 'estimasi waktu kadaluarsa bahan' untuk konteks urgensi"
              - "Reveal akhir yang mengesankan mengingat bahan yang tidak ideal"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan bahan yang terlihat sudah benar-benar busuk atau tidak layak makan"
              - "Jangan hasilkan masakan yang tidak realistis bisa dibuat dari bahan tersebut"
              - "Jangan pakai bahan tambahan banyak yang mengalahkan konsep 'sisa kulkas'"
            pola_hook: "Detik 0: buka kulkas tampilkan bahan sisa + teks bahan yang ada dan batas waktu. Langsung ambil wajan di detik 2."
            contoh_judul:
              - "Sisa wortel, telur, dan tempe di kulkas — ini yang bisa jadi makan siang"
              - "Bahan hampir kadaluarsa ini aku masak sebelum dibuang dan hasilnya diluar dugaan"
              - "Tiga bahan sisa ini jadi sarapan yang lebih enak dari yang dibeli"
              - "Zero waste kitchen — kulkas hampir kosong tapi makan malam tetap ada"
              - "Isi kulkas yang memalukan ini ternyata bisa jadi ini kalau tahu caranya"
            content_runway: "Kombinasi bahan sisa di kulkas hampir tidak terbatas — protein, sayur, dan karbohidrat apapun bisa dikombinasikan; ditambah variasi teknik memasak dan bumbu, seri ini bisa berjalan ratusan episode tanpa pengulangan."

        - slug: recipe-anak-kos-gas-terbatas
          name: Resep Anak Kos dengan Kompor Satu Tungku
          description: Resep lengkap dan bergizi yang dirancang khusus untuk keterbatasan anak kos — satu kompor, satu wajan, bahan dari warung terdekat, budget di bawah Rp20rb per porsi.
          example_hook: "Makan bergizi Rp15rb sekali masak, bukan mie instan, dan ini caranya..."
          guide:
            audience: "Mahasiswa dan fresh graduate 18–25 yang tinggal di kos; siapapun yang baru pertama kali hidup mandiri dan belajar masak; penonton yang ingin hemat tapi juga makan layak."
            tone: "Memberdayakan dan realistis. Nada 'kamu bisa masak makanan sehat dengan kondisi kos yang terbatas.' Tidak ada judgment soal peralatan seadanya — justru keterbatasan itu yang membuat konten ini relevan."
            format: "45–65 detik. Urutan: tampilkan setup kos (kompor satu tungku, wajan kecil) → bahan dari warung (tunjukkan harganya) → proses cepat → makan bergizi siap. Teks total biaya di akhir. Vertikal 9:16."
            boleh:
              - "Tampilkan setup kos yang realistis — kompor portable, meja sempit, peralatan minimal"
              - "Tunjukkan bahan dari warung atau minimarket terdekat dengan harga nyata"
              - "Teks total biaya bahan per porsi di akhir video"
              - "Pilih masakan yang bergizi dan mengenyangkan, bukan hanya 'bisa dimakan'"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan pakai bahan yang hanya ada di supermarket besar atau harganya tidak kos-friendly"
              - "Jangan gunakan lebih dari dua peralatan masak — kompor satu tungku, satu wajan/panci"
              - "Jangan rekomendasikan resep yang tidak realistis diselesaikan di dapur kos sempit"
            pola_hook: "Detik 0: tampilkan kompor satu tungku kos yang familiar + teks 'Makan bergizi Rp[harga] — bukan mie instan'. Bahan masuk langsung di detik 2."
            contoh_judul:
              - "Makan bergizi Rp15rb di kos satu kompor — bukan mie instan, ini resepnya"
              - "Menu kos seminggu dengan Rp100rb yang tidak membosankan — ini plannya"
              - "Telur, tahu, dan bawang dari warung — jadi ini dan kenyang sampai malam"
              - "Anak kos ini masak nasi ayam dari nol dalam 20 menit dengan satu wajan"
              - "Resep ini bisa dibuat di kamar kos tanpa membuat asap yang ketahuan ibu kos"
            content_runway: "Ada ratusan kombinasi masakan bergizi dengan budget di bawah Rp25rb per porsi menggunakan bahan dari warung Indonesia; ditambah variasi masakan dari berbagai daerah yang bisa diadaptasi untuk setup kos, seri ini bisa berjalan sangat panjang."

    - slug: food-review
      name: Review Makanan
      description: "Cobain/review tempat & jajanan."
      faceless: false
      difficulty: menengah
      rpm: sedang
      formats: POV makan + reaksi + caption
      example_hook: "Mie terpedas di kota ini..."
      guide:
        audience: "Penonton 18–35 yang suka cari rekomendasi tempat makan sebelum pergi; foodie lokal yang ingin tahu hidden gem di kota mereka; penonton yang menikmati reaksi jujur terhadap makanan, bukan review endorsement."
