            tone: "Kritis tapi fair. Bukan cynical atau terlalu negatif — tapi tidak membungkus kekecewaan dengan basa-basi endorsement. Penonton harus merasa 'ini review yang bisa dipercaya.'"
            format: "60–90 detik. Struktur: tampilkan hype tempat (caption viral, foto Instagram) → kedatangan dan kesan pertama → order → first bite dan reaksi jujur → breakdown: apa yang sesuai ekspektasi vs tidak → verdict worth it atau skip. Vertikal 9:16."
            boleh:
              - "Tampilkan harga menu secara jelas — konteks value for money sangat penting"
              - "Bandingkan foto menu di Instagram vs kenyataannya jika ada perbedaan signifikan"
              - "Akui hal positif jika ada — review yang sepenuhnya negatif terlihat unfair"
              - "Verdict di akhir harus spesifik: 'worth it jika...' atau 'skip jika kamu...'"
            hindari:
              - "Jangan terlalu personal menyerang pemilik atau staf tempat makan"
              - "Jangan review tempat tanpa datang dan mencoba sendiri"
