        format: "45–90 detik. Struktur: tampilkan lokasi atau makanan sekilas → first bite dengan reaksi jujur → komentar singkat rasa, tekstur, dan value for money → verdict. Caption di setiap momen kunci. Vertikal 9:16."
        boleh:
