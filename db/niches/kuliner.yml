          - "Tampilkan harga dengan jelas untuk konteks value"
          - "Bandingkan dengan ekspektasi ('viral di sini, kenyataannya...')"
          - "Caption pendek yang jujur: 'rasa: 7/10, harga: worth it / gak worth'"
        hindari:
