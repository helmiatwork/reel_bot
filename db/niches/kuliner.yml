        - slug: food-review-perbandingan-harga
          name: "Harga Mahal vs Murah — Mana yang Lebih Enak?"
          description: Blind test atau perbandingan langsung versi premium dan versi murah dari makanan yang sama, mengungkap apakah harga selalu berbanding lurus dengan rasa.
          example_hook: "Ayam geprek Rp15rb vs Rp80rb — matanya tertutup, pilih yang mana..."
          guide:
            audience: "Penonton 18–35 yang sering bertanya-tanya apakah makanan mahal benar-benar lebih enak; orang yang ingin makan enak tanpa harus mahal; penonton yang suka konten 'myth busting' seputar food."
            tone: "Eksperimental dan fun. Nada 'mari kita buktikan bersama.' Hasilnya tidak boleh diprediksi — jika murah menang, katakan; jika mahal menang, katakan juga dengan alasan spesifik."
            format: "60–90 detik. Struktur: tampilkan dua versi berdampingan dengan harga → blind test atau perbandingan terbuka → reaksi per versi → reveal pemenang dengan alasan spesifik (rasa, tekstur, value). Teks harga di setiap frame. Vertikal 9:16."
            boleh:
              - "Format blind test (tanpa tahu mana yang mana) menambah kredibilitas"
              - "Tampilkan harga keduanya dengan jelas di setiap shot"
              - "Berikan penilaian per dimensi: rasa, porsi, value for money — bukan sekedar 'lebih enak'"
              - "Hasil yang mengejutkan (murah menang) membuat konten lebih viral"
            hindari:
              - "Jangan dibayar oleh salah satu brand tanpa disclosure — hancurkan kepercayaan"
              - "Jangan verdict yang terlalu fence-sitting ('dua-duanya sama enaknya') tanpa alasan"
              - "Jangan bandingkan produk yang kategorinya berbeda jauh"
              - "Jangan pakai musik ber-hak-cipta"
            pola_hook: "Detik 0: tampilkan dua porsi makanan sama berdampingan dengan harga kontras + teks 'Rp[harga murah] vs Rp[harga mahal] — mana yang lebih enak?'. Langsung mulai test di detik 3."
            contoh_judul:
              - "Ayam geprek Rp15rb vs Rp80rb — blind test dan hasilnya mengejutkan"
              - "Kopi kafe Rp50rb vs kopi sachetan Rp2rb — tes rasa yang jujur"
              - "Sate kambing Rp100rb vs sate pinggir jalan Rp25rb — pemenangnya siapa?"
              - "Nasi padang warung vs restoran padang premium — beda apa selain harga?"
              - "Es teh manis Rp3rb vs Rp35rb — bayar 10x lipat untuk apa sebenarnya?"
            content_runway: "Setiap jenis makanan Indonesia punya versi murah dan premium (warteg vs restoran, angkringan vs kafe); kombinasi makanan dan rentang harga hampir tidak terbatas; format perbandingan ini selalu relevan karena penonton selalu ingin tahu apakah harga mahal worth it."

