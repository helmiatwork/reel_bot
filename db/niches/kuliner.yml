          - "Jangan tampilkan lokasi tanpa harga — penonton ingin tahu budget yang dibutuhkan"
          - "Jangan review tempat yang sudah terlalu mainstream tanpa angle baru"
          - "Jangan pakai musik ber-hak-cipta sebagai latar"
        pola_hook: "Detik 0: close-up makanan yang paling menarik atau kontroversial + teks klaim yang mau diverifikasi ('katanya terpedas di kota ini...'). Langsung gigit di detik 3."
        contoh_judul:
          - "Mie ini katanya terpedas di kota ini — ini reaksi jujurku"
          - "Warteg tersembunyi ini tidak ada di Google Maps tapi selalu antre"
          - "Review jujur tempat yang 10.000 foto di Instagram vs kenyataannya"

