            contoh_judul:
              - "Tahukah kamu asal-usul rendang yang jarang diajarkan di sekolah"
              - "Tahukah kamu nasi goreng sebenarnya punya sejarah yang lebih tua dari yang kamu kira"
              - "Fakta di balik tempe yang membuat ilmuwan dunia tertarik riset ke Indonesia"
              - "Tahukah kamu sate ayam dan sate kambing punya asal-usul yang berbeda daerah"
              - "Tahukah kamu bakso sebenarnya punya kemiripan historis dengan hidangan dari Tiongkok"
            content_runway: "Kuliner Indonesia memiliki ratusan makanan tradisional dari 34 provinsi, masing-masing dengan sejarah, asal-usul, dan fakta unik; setiap perayaan dan musim juga menghadirkan makanan khas yang relevan."

        - slug: did-you-know-teknologi-sehari
          name: Tahukah Kamu Teknologi yang Kamu Pakai
          description: Fakta mengejutkan tentang teknologi yang digunakan sehari-hari — smartphone, internet, GPS — yang pengguna jarang menyadarinya.
          example_hook: "Tahukah kamu GPS yang kamu pakai melibatkan relativitas Einstein setiap detik..."
          guide:
            audience: "Penonton 16–35 yang pakai teknologi tapi jarang tahu cara kerjanya; tech-curious tapi bukan tech-savvy; siapa saja yang pernah ingin tahu 'kok bisa HP tahu lokasi aku?'."
            tone: "Kagum dan sedikit mind-blown — seperti tahu cara sulap untuk pertama kali. Mengungkap magis di balik teknologi yang terlihat biasa."
            format: "30–60 detik. Satu teknologi dengan satu fakta mengejutkan per video. Voiceover + visual teknologi yang relevan + animasi cara kerja sederhana + hard-sub."
            boleh:
              - "Gunakan analogi sederhana untuk menjelaskan konsep teknologi yang kompleks"
              - "Tunjukkan implikasi jika teknologi tersebut tidak ada atau tidak bekerja"
              - "Sebutkan nama prinsip atau teknologi yang bisa dicari lebih lanjut"
              - "Pilih teknologi yang benar-benar digunakan sehari-hari oleh penonton Indonesia"
            hindari:
              - "Jangan oversimplify cara kerja teknologi sampai tidak akurat"
              - "Jangan gunakan jargon teknis tanpa penjelasan"
              - "Jangan klaim fakta teknologi yang sudah kadaluarsa atau tidak akurat"
              - "Jangan buat konten yang terkesan mempertanyakan privasi tanpa konteks yang adil"
            pola_hook: "Detik 0: nama teknologi yang sangat familiar + klaim fakta di baliknya yang mengejutkan. Contoh: 'GPS di HP kamu melibatkan persamaan relativitas Einstein setiap saat'."
            contoh_judul:
              - "GPS di HP kamu menggunakan relativitas Einstein dan tanpa itu lokasimu akan meleset kilometer"
              - "Tahukah kamu bagaimana foto di HP kamu langsung masuk ke server tanpa kabel"
              - "Cara kerja sidik jari di smartphone yang sangat berbeda dari yang kebanyakan orang bayangkan"
              - "Fakta di balik Wi-Fi yang akan ubah cara kamu lihat sinyal di pojok ruangan"
              - "Tahukah kamu enkripsi WhatsApp kamu lebih kuat dari sistem militer era 1990"
            content_runway: "Setiap perangkat, aplikasi, dan layanan digital yang digunakan sehari-hari menyimpan fakta teknis yang mengejutkan; teknologi terus berkembang menghasilkan fakta baru setiap tahun."

        - slug: did-you-know-tubuh-tidur
          name: Tahukah Kamu Apa Terjadi Saat Kamu Tidur
          description: Trivia sains tentang proses yang terjadi di tubuh dan otak manusia selama tidur, disajikan dalam format satu fakta per video yang mengejutkan.
          example_hook: "Tahukah kamu otak aktif membuang racun hanya saat kamu tidur nyenyak..."
          guide:
            audience: "Penonton 17–35 yang penasaran tentang tidur dan kesehatan; penonton yang sering begadang dan butuh motivasi tidur cukup; siapa saja yang pernah heran kenapa mereka mimpi atau susah bangun."
            tone: "Ingin tahu dan sedikit mengkhawatirkan — 'selama ini kamu tidak tahu ini terjadi setiap malam'. Membuat penonton lebih menghargai tidur tanpa menggurui."
            format: "25–45 detik. Satu fakta tentang tidur per video. Voiceover + visual orang tidur + animasi proses biologis sederhana + hard-sub."
            boleh:
              - "Pilih fakta yang relevan dengan masalah tidur yang umum di Indonesia (begadang, insomnia)"
              - "Sertakan implikasi kesehatan yang konkret dari fakta tersebut"
              - "Gunakan animasi otak sederhana untuk proses neurologis"
              - "Hubungkan ke kebiasaan sehari-hari yang bisa diubah berdasarkan fakta ini"
            hindari:
              - "Jangan buat klaim medis atau diagnosis tentang gangguan tidur"
              - "Jangan gunakan fakta yang belum terverifikasi atau dari studi yang tidak direplikasi"
              - "Jangan oversimplify proses biologis kompleks sampai tidak akurat"
              - "Jangan buat konten yang bisa meningkatkan kecemasan tentang tidur tanpa solusi"
            pola_hook: "Detik 0: 'Tahukah kamu bahwa saat kamu tidur, otakmu...' + klaim yang mengejutkan. Visual orang tidur atau animasi otak langsung di detik pertama."
            contoh_judul:
              - "Tahukah kamu otak aktif buang racun berbahaya hanya saat tidur nyenyak"
              - "Proses ini terjadi di otakmu tiap malam dan tanpanya kamu tidak bisa belajar apapun"
              - "Tahukah kamu fase tidur REM yang satu ini yang bikin kamu bisa kreatif saat bangun"
              - "Kenapa kamu lebih mudah ingat mimpi kalau langsung ditulis saat bangun: neurosains"
              - "Tahukah kamu jantung kamu melambat signifikan saat fase tidur tertentu malam ini"
            content_runway: "Sains tidur adalah bidang yang terus berkembang dengan ratusan fenomena yang terjadi di tubuh dan otak selama tidur; penelitian baru tentang memori, imun, metabolisme, dan regenerasi saat tidur terus menghasilkan fakta baru."

    - slug: life-hack
      name: Life Hack
      description: Trik praktis sehari-hari yang bikin hidup lebih mudah.
      faceless: true
      difficulty: pemula
      rpm: sedang
      formats: demo + teks + voiceover
      example_hook: "Trik dapur ini gak ada yang kasih tahu kamu..."
      guide:
        audience: "Penonton 18–35 yang suka konten praktis dan langsung bisa diterapkan; ibu rumah tangga, anak kos, dan pekerja muda yang ingin hidup lebih efisien; konten yang sangat shareable karena value langsung."
        tone: "Helpful dan sedikit conspiratorial — 'kenapa tidak ada yang kasih tahu aku ini dari dulu'. Nada penemuan yang bikin penonton merasa dapat insider knowledge."
        format: "30–60 detik. 1–3 trik per video. Voiceover + demonstrasi visual langsung + teks step-by-step + hard-sub. Demonstrasi harus jelas dan mudah ditiru."
        boleh:
          - "Demonstrasikan trik secara visual — show don't tell"
          - "Gunakan bahan atau tools yang tersedia di Indomaret/Alfamart atau rumah biasa"
          - "Tunjukkan hasil sebelum dan sesudah untuk membuktikan trik berhasil"
          - "Akhiri dengan 'coba hari ini' untuk mendorong action"
        hindari:
          - "Jangan publish trik yang tidak benar-benar diverifikasi bekerja dulu"
          - "Jangan rekomendasikan trik yang membutuhkan alat mahal tanpa alternatif murah"
          - "Jangan buat life hack yang berpotensi berbahaya tanpa disclaimer"
          - "Jangan ajarkan trik yang sudah sangat umum diketahui — nilai ada di novelty"
        pola_hook: "Detik 0: masalah sehari-hari yang relatable + klaim ada cara lebih mudah yang tidak diketahui umum. Langsung demonstrasi di detik 5."
        contoh_judul:
          - "Cara potong bawang yang tidak bikin nangis dan 3x lebih cepat"
          - "Trik HP yang 90% orang tidak pernah tahu padahal ada dari dulu"
          - "Cara hemat listrik ini jarang diketahui padahal tagihan bisa turun signifikan"
      micro:
        - slug: life-hack-dapur-masak
          name: Life Hack Dapur & Memasak
          description: Trik memasak dan menyimpan bahan makanan yang praktis dan menghemat waktu, didemonstrasikan secara visual untuk ibu rumah tangga dan anak kos.
          example_hook: "Cara potong bawang ini gak bikin nangis dan 3x lebih cepat..."
          guide:
            audience: "Ibu rumah tangga 25–45 dan anak kos 18–28 yang masak sendiri; siapa saja yang mencari cara lebih efisien di dapur; konten yang sangat shareable di grup keluarga dan teman kos."
            tone: "Praktis dan sedikit mengejutkan — 'ternyata cara ini ada dan lebih mudah'. Sangat helpful tanpa basa-basi."
            format: "30–60 detik. Satu trik dapur per video. Demonstrasi visual langsung + voiceover + teks step singkat + hard-sub. Pastikan tangan dan bahan terlihat jelas."
            boleh:
              - "Demonstrasikan dengan close-up tangan dan bahan yang jelas"
              - "Gunakan bahan yang ada di dapur Indonesia tipikal"
              - "Tunjukkan hasil trik vs cara biasa untuk membuktikan efektivitas"
              - "Sertakan tip penyimpanan bahan makanan yang relevan untuk iklim Indonesia"
            hindari:
