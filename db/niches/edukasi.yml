            boleh:
              - "Pilih makanan yang sangat familiar sehingga faktanya terasa lebih mengejutkan"
              - "Sertakan konteks sejarah atau budaya singkat"
              - "Gunakan visual makanan yang menarik dan menggiurkan sebagai hook visual"
              - "Verifikasi fakta dengan sumber kuliner atau sejarah yang dapat dipercaya"
            hindari:
              - "Jangan klaim fakta sejarah kuliner yang masih diperdebatkan sebagai kepastian"
              - "Jangan gunakan visual makanan yang tidak relevan atau terlihat tidak fresh"
              - "Jangan buat konten yang secara tidak sengaja menyinggung budaya tertentu"
              - "Jangan publish fakta makanan yang tidak bisa diverifikasi dari sumber credible"
