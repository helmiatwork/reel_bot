              - "POV kamu yang paling junior jadi yang paling banyak kerjaan"
              - "POV presentasi ke klien tapi slide masih direvisi 10 menit sebelum meeting"
              - "POV lembur sampai jam 10 tapi tidak ada di slip gaji manapun"
              - "POV ide kamu dipakai tapi kredit diberikan ke orang lain di depan semua"
