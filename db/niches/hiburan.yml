version: 1
vertical:
  slug: v-hiburan
  name: Hiburan
  description: Konten hiburan ringan — komedi, reaksi, meme, dan konten relatable untuk penonton yang ingin tertawa dan terhibur.
  guide:
    audience: "Penonton 15–35 tahun yang scroll untuk hiburan cepat; campuran pelajar, mahasiswa, dan pekerja muda yang butuh tawa setelah hari panjang; tertarik pada konten relatable kehidupan Indonesia sehari-hari."
    tone: "Ringan, energik, dan relatable. Humor yang tidak perlu dijelaskan — langsung ngena di momen pertama. Gaya kasual anak muda Indonesia, tidak formal, tidak lecturing."
    format: "Video 15–60 detik, vertikal 9:16. Hook wajib dalam 2 detik pertama. Punchline atau payoff sebelum detik 15 agar tidak di-skip. Caption dan teks overlay penting — banyak penonton nonton tanpa suara."
    boleh:
      - "Gunakan situasi kehidupan nyata Indonesia yang langsung dikenali penonton"
      - "Teks overlay besar dan kontras untuk penonton tanpa suara"
      - "Sound effect komedi atau musik trending sebagai amplifier humor"
      - "Format POV, split-screen, atau punchline cut sangat efektif"
    hindari:
      - "Jangan gunakan humor yang menghina suku, agama, ras, atau gender tertentu"
      - "Jangan hook lebih dari 3 detik — penonton hiburan paling cepat skip"
      - "Jangan gunakan musik ber-hak-cipta tanpa lisensi"
      - "Jangan punchline yang butuh penjelasan panjang — kalau perlu dijelaskan, tidak lucu"
    pola_hook: "Detik 0–2: tunjukkan situasi yang langsung dikenali penonton ('POV:', 'pas kamu...', 'ketika...') atau visual absurd yang memancing penasaran. Langsung ke konflik di detik 3."
    contoh_judul:
      - "POV kamu yang paling kalem di grup tapi selalu disalahin"
      - "Kenapa ini terjadi persis sama aku setiap minggu"

  niches:
    - slug: comedy-skit
      name: "Komedi / Skit"
      description: Sketsa lucu, butuh akting.
      faceless: false
      difficulty: menengah
      rpm: rendah
      formats: skit + punchline cepat
      example_hook: "Pas kamu minta tolong istri..."
      guide:
        audience: "Remaja dan dewasa muda 17–30 yang suka humor situasional Indonesia; penonton yang ingin validasi bahwa pengalaman sehari-hari mereka memang lucu; fans konten kreator komedi lokal."
        tone: "Ekspresif dan over-the-top tapi tetap grounded di realita Indonesia. Akting tidak perlu sempurna — keaslian dan timing lebih penting dari teknik. Humor yang memancing komentar 'gue banget'."
        format: "20–45 detik. Struktur: setup singkat (situasi familiar) → eskalasi absurd → punchline tajam. Satu skit = satu situasi, tidak perlu subplot. Ekspresi wajah adalah senjata utama."
        boleh:
          - "Gunakan setting yang sangat spesifik Indonesia (kos, kantor, warteg, angkot)"
          - "Exaggerate reaksi untuk efek komedi maksimal — ini bukan film realis"
          - "Casting diri sendiri sebagai beberapa karakter berbeda dengan kostum minimal"
          - "Teks caption besar untuk punchline — banyak yang nonton tanpa suara"
        hindari:
          - "Jangan skit yang butuh lebih dari 5 detik untuk setup — langsung ke konflik"
          - "Jangan gunakan humor yang merendahkan satu pihak secara tidak adil"
          - "Jangan rekam di lokasi dengan pencahayaan buruk — ekspresi harus jelas terlihat"
          - "Jangan punchline yang terlalu panjang — kurang dari 3 kata lebih kuat"
        pola_hook: "Detik 0: teks 'POV:' atau 'pas kamu...' + langsung masuk ke situasi yang dikenali. Penonton harus bisa predict skenario dan penasaran bagaimana ending-nya dalam 2 detik."
        contoh_judul:
          - "Pas kamu minta tolong teman sekali dan tiba-tiba jadi panitia tetap"
          - "Tipe orang yang selalu ada di setiap grup chat dan tidak pernah berguna"
          - "Skit ini terlalu akurat untuk tidak di-share ke orang yang kamu maksud"
      micro:
        - slug: comedy-skit-anak-kos
          name: Drama Kehidupan Anak Kos
          description: Skit komedi pendek tentang situasi absurd sehari-hari anak kos — tagihan listrik mendadak, kompor meledak, dan drama sama pemilik kos — menyasar mahasiswa dan perantau.
          example_hook: "Pas kamu lagi tidur nyenyak tiba-tiba pemilik kos ketuk pintu jam 7 pagi..."
          guide:
            audience: "Mahasiswa dan perantau 18–25 yang tinggal di kos; siapapun yang pernah merasakan drama kos-kosan Indonesia; penonton yang ingin validasi bahwa penderitaan anak kos itu universal."
            tone: "Melodramatis dan sarkas. Situasi yang sebenarnya sepele di-treat seperti bencana nasional — itulah sumber humornya. Penonton harus merasa 'persis banget situasi gue'."
            format: "20–40 detik. Setup: situasi kos yang familiar → eskalasi absurd → reaksi lebay → punchline relatable. Satu situasi per video — tidak perlu bercerita panjang. Ekspresi wajah close-up sangat penting."
            boleh:
              - "Gunakan props kos yang langsung dikenal: ember, magic jar, kabel colokan panjang"
              - "Setting kamar kos nyata lebih efektif dari set yang terlalu rapi"
              - "Suara ketukan pintu atau notif HP bisa jadi sound effect yang langsung dikenali"
              - "Caption overlay dengan font besar untuk dialog punchline"
            hindari:
              - "Jangan setup lebih dari 5 detik sebelum konflik mulai"
              - "Jangan rekam kamar yang terlalu rapi — autentisitas kos adalah bagian dari charm"
              - "Jangan humor yang merendahkan pemilik kos atau profesi tertentu secara kasar"
              - "Jangan resolusi yang terlalu panjang setelah punchline — cut langsung setelah payoff"
            pola_hook: "Detik 0: teks situasi kos yang universal ('pas mau bayar listrik...' atau 'jam 7 pagi pintu diketuk') + ekspresi tidur atau santai. Langsung ke konflik di detik 2."
            contoh_judul:
              - "Pas kamu lagi tidur nyenyak tiba-tiba pemilik kos ketuk pintu jam 7 pagi"
              - "Tagihan listrik kos naik Rp200rb dan investigasi dimulai"
              - "Drama nyalain kompor kos yang sudah minta pensiun sejak semester 1"
              - "Teman sekos pinjam charger 'sebentar' dan ini adalah hari ke-14"
              - "Pemilik kos tiba-tiba mau masuk kamar dan kondisi kamarnya seperti ini"
            content_runway: "Kehidupan kos memiliki ratusan situasi unik (tagihan, fasilitas rusak, tetangga berisik, pemilik kos, teman sekos) yang terus berulang dan selalu relevan selama mahasiswa Indonesia masih kos."

        - slug: comedy-skit-meeting-kantor
          name: Meeting Kantor yang Bisa Jadi Email
          description: Skit relatable tentang rapat kerja yang tidak produktif, atasan yang minta revisi tidak jelas, dan drama zoom meeting, untuk pekerja kantoran yang butuh validasi.
          example_hook: "Meeting 2 jam ini bisa jadi satu kalimat email, tapi bos tetap minta hadir semua..."
          guide:
            audience: "Pekerja kantoran 22–35 yang frustrasi dengan budaya rapat Indonesia; fresh graduate yang baru masuk dunia kerja dan culture shock; siapapun yang pernah duduk di meeting dan bertanya 'kenapa aku di sini'."
            tone: "Sinis tapi lucu — bukan keluhan, tapi validasi kolektif. Penonton harus merasa lega karena ada yang akhirnya bilang apa yang mereka rasakan. Humor kantor Indonesia yang sangat spesifik."
            format: "25–45 detik. Setup: meeting yang bisa jadi email → eskalasi absurd (atasan minta 'feedback', tapi tidak ada yang berani bicara) → punchline yang tepat sasaran. Bisa pakai format POV atau skit dengan 2 karakter."
            boleh:
              - "Referensikan budaya kantor Indonesia yang sangat spesifik: 'jangan lupa cc atasan'"
              - "Gunakan laptop atau kamera sebagai prop Zoom meeting untuk relevansi"
              - "Caption teks di layar sebagai 'isi pikiran' karakter yang tidak bisa diucapkan"
              - "Ekspresi pasrah dan smile palsu adalah visual utama humor ini"
            hindari:
              - "Jangan sindir perusahaan atau individu nyata secara spesifik"
              - "Jangan setup terlalu panjang — penonton sudah tahu konteks kantor Indonesia"
              - "Jangan humor yang bisa diinterpretasikan sebagai sabotase atau ketidakprofesionalan serius"
              - "Jangan resolusi yang terlalu panjang — cut setelah punchline"
            pola_hook: "Detik 0: teks 'meeting 2 jam ini bisa jadi...' atau visual notifikasi meeting tiba-tiba. Langsung masuk ke situasi meeting absurd di detik 2."
            contoh_judul:
              - "Meeting 2 jam ini bisa jadi satu kalimat email dan semua tahu itu"
              - "Atasan minta revisi tapi tidak bisa jelaskan mau direvisi apa"
              - "Zoom meeting dan semua orang matikan kamera 'karena koneksi'"
              - "POV kamu yang kasih ide bagus tapi atasan anggap ide dia sendiri"
              - "5 menit pertama meeting diisi perkenalan meskipun semua sudah kenal 3 tahun"
            content_runway: "Budaya kerja kantoran Indonesia menawarkan ratusan situasi absurd yang terus berulang — meeting, revisi, cc email, deadline, senioritas, finger pointing — dan selalu relevan selama budaya kerja ini tidak berubah."

        - slug: comedy-skit-bucin-toxic
          name: Skit Pasangan Bucin & Red Flag
          description: Komedi pendek yang satirkan perilaku bucin dan hubungan penuh red flag dengan cara yang mengundang tawa tapi tetap relatable untuk anak muda.
          example_hook: "Dia bilang 'bebas mau ke mana', tapi ini yang terjadi kalau kamu pergi..."
          guide:
            audience: "Remaja dan dewasa muda 17–27 yang aktif di media sosial dan familiar dengan istilah bucin dan red flag; penonton yang bisa ketawa pada diri sendiri tentang dinamika hubungan; siapapun yang pernah atau sedang bucin."
            tone: "Sarkas dan self-aware. Humor yang tidak menghakimi — semua pernah bucin, dan itulah yang membuatnya lucu. Karakter harus terasa bodoh tapi simpatik, bukan villain."
            format: "20–40 detik. Setup: situasi pasangan yang familiar → keputusan yang jelas red flag → reaksi yang lebay tapi predictable → punchline yang memvalidasi pengalaman penonton. Format POV atau dua karakter."
            boleh:
              - "Gunakan istilah yang viral di kalangan anak muda Indonesia (bucin, red flag, ghosting)"
              - "Caption overlay sebagai 'inner monologue' karakter yang kontras dengan aksinya"
              - "Sound effect dramatis (musik sinetron, suara hati hancur) sebagai komentar komedi"
              - "Format 'ekspektasi vs realita' sangat efektif untuk niche ini"
            hindari:
              - "Jangan glorifikasi perilaku controlling atau toxic sebagai hal yang romantis"
              - "Jangan humor yang merendahkan salah satu gender secara sistematis"
              - "Jangan setup panjang — penonton harus bisa connect dalam 3 detik"
              - "Jangan punchline yang membutuhkan pengetahuan meme spesifik yang cepat basi"
            pola_hook: "Detik 0: dialog atau situasi yang langsung dikenal sebagai red flag + ekspresi yang terlalu polos. 'Dia bilang bebas mau ke mana, tapi...' — tension langsung terbentuk."
            contoh_judul:
              - "Dia bilang bebas mau ke mana, tapi ini yang terjadi kalau kamu pergi"
              - "POV kamu yang bilang tidak bucin tapi cek HP dia 10 menit sekali"
              - "Red flag yang tetap kamu abaikan karena dia perhatian di hari pertama"
              - "Ekspektasi vs realita pas akhirnya chat duluan setelah 3 hari ghosting"
              - "Cara dia bilang maaf yang entah kenapa tetap berhasil setiap kali"
            content_runway: "Dinamika hubungan muda Indonesia menawarkan variasi tanpa habis — bucin, red flag, ghosting, orbiting, situationship — dan terus diperbarui dengan istilah baru yang viral setiap bulan."

    - slug: reaction
      name: Reaction
      description: Reaksi ke konten lain.
      faceless: false
      difficulty: pemula
      rpm: rendah
      formats: split-screen + ekspresi
      example_hook: "Pertama kali nonton ini..."
      guide:
        audience: "Penonton 16–32 yang menikmati melihat reaksi orang lain sebagai validasi atau hiburan; penggemar konten autentik yang tidak terskenario; penonton yang ingin discover konten lama atau ekstrem melalui perspektif orang baru."
        tone: "Jujur dan spontan. Nilai utama channel ini adalah reaksi yang tidak dibuat-buat — tawa, kaget, atau ngeri yang genuine. Narasi minimal; biarkan ekspresi berbicara."
        format: "30–60 detik. Split-screen: konten yang direaksi di satu sisi, wajah reaktor di sisi lain. Atau: full frame wajah dengan audio konten. Reaksi harus tampil dominan — bukan konten aslinya."
        boleh:
          - "Pilih konten yang memancing reaksi ekstrem — sangat kocak, sangat mengejutkan, atau sangat nostalgia"
          - "Potong langsung ke momen reaksi paling intense untuk hook"
          - "Tambahkan caption teks untuk konteks konten yang direaksi"
          - "Pause dan komentar singkat setelah momen kunci untuk menambah lapisan humor"
        hindari:
          - "Jangan reaksi yang dipaksakan atau terlalu dibuat-buat — penonton bisa baca itu"
          - "Jangan gunakan konten yang bisa kena copyright strike tanpa permisi"
          - "Jangan reaksi yang merendahkan pembuat konten asli — komentari konten, bukan orangnya"
          - "Jangan over-explain — reaksi cukup, analisis panjang bunuh ritme"
        pola_hook: "Detik 0: potong langsung ke momen reaksi paling ekstrem dari video, bukan awal kronologis. Penonton harus langsung merasakan energi dan penasaran konteksnya."
        contoh_judul:
          - "Pertama kali nonton ini dan reaksi aku gak bisa aku kendalikan"
          - "Video ini viral 10 tahun lalu dan baru sekarang aku lihat, ini reaksiku"
          - "Challenge yang terlihat mudah ini ternyata membuat semua orang gagal total"
      micro:
        - slug: reaction-makanan-ekstrem
          name: Reaksi Cobain Makanan Ekstrem Pertama Kali
          description: Rekaman reaksi jujur saat mencoba makanan ekstrem — durian montong, pete mentah, ceker pedas level 100 — format yang autentik dan mudah dibuat ulang.
          example_hook: "Pertama kali cobain ini, dan reaksi aku gak bisa bohong..."
          guide:
            audience: "Penonton 15–30 yang suka konten food challenge; penonton yang menikmati melihat ekspresi orang kesakitan atau terkejut secara aman; foodie yang penasaran tentang makanan ekstrem Indonesia."
            tone: "Jujur dan sedikit dramatis. Reaksi yang genuine — kesakitan, kagum, atau ngeri — adalah kontennya. Tidak perlu akting, ekspresi asli selalu lebih baik dari yang dibuat-buat."
            format: "30–60 detik. Tampilkan makanan dulu (2 detik) → tunjukkan reaksi pertama kali gigit/cicip → biarkan reaksi berkembang tanpa dipotong terlalu cepat → komentar singkat setelah. Close-up wajah, vertikal 9:16."
            boleh:
              - "Pilih makanan yang divisualisasikan dengan jelas sebelum dicoba"
              - "Biarkan jeda setelah gigitan pertama — penonton menunggu reaksi itu"
              - "Slow replay momen reaksi paling extreme sebelum komentar"
              - "Bandingkan ekspektasi vs sensasi aktual dalam caption singkat"
            hindari:
              - "Jangan makan sesuatu yang benar-benar berbahaya atau menjijikkan tanpa konteks"
              - "Jangan pura-pura reaksi lebih ekstrem dari aslinya — langsung terasa palsu"
              - "Jangan potong reaksi terlalu cepat — biarkan penonton menikmati momen itu"
              - "Jangan tampilkan makanan yang bisa dianggap melanggar norma agama tanpa disclaimer"
            pola_hook: "Detik 0: close-up makanan ekstrem + ekspresi sebelum makan yang antara penasaran dan takut. Tidak perlu narasi — langsung gigit di detik 3."
            contoh_judul:
              - "Pertama kali cobain pete mentah dan ini reaksi aku yang tidak bisa dibohongi"
              - "Durian montong paling legit yang pernah ada masuk mulut untuk pertama kalinya"
              - "Ceker pedas level 100 di warung ini dan aku gak bisa bicara 5 menit setelahnya"
              - "Jengkol goreng pertama kali di umur 25 tahun dan ini pendapat jujurku"
              - "Makanan ini tidak ada gambar di warungnya dan ini alasannya setelah aku coba"
            content_runway: "Makanan ekstrem Indonesia sangat beragam — pedas, fermentasi, tekstur unik, bau kuat — dan terus berkembang dengan tren makanan baru; setiap daerah Indonesia punya makanan khas yang bisa jadi konten reaksi."

        - slug: reaction-video-nostalgia
          name: Reaksi Nonton Video Viral Lawas
          description: Reaksi terhadap video viral Indonesia dari 10-15 tahun lalu yang mungkin sudah dilupakan generasi baru, memancing nostalgia dan komentar.
          example_hook: "Baru pertama kali nonton video ini yang viral tahun 2010, dan ternyata..."
          guide:
            audience: "Penonton 20–35 yang hidup di era YouTube awal Indonesia dan ingin nostalgia; penonton muda 15–20 yang penasaran dengan internet culture sebelum mereka lahir; siapapun yang menikmati konten yang memancing memori."
            tone: "Nostalgia hangat campur tawa. Reaktor harus autentik — kalau memang sudah pernah lihat, sampaikan emosi nostalgia; kalau belum, ekspresikan shock atau keheranan terhadap era itu."
            format: "30–60 detik. Buka dengan konteks singkat video asli (tahun, kenapa viral) → putar klip pendek dengan reaksi → pause untuk komentar atau nostalgia → closing yang memancing komentar penonton."
            boleh:
              - "Sertakan tahun dan konteks sosial saat video itu viral untuk dimensi historis"
              - "Minta penonton di caption: 'siapa yang masih ingat ini?'"
              - "Bandingkan internet Indonesia tahun itu vs sekarang sebagai lapisan humor tambahan"
              - "Gunakan reaksi campur nostalgia — tawa tapi ada rasa rindu era itu"
            hindari:
              - "Jangan gunakan video yang menyinggung, melecehkan, atau melanggar privasi seseorang"
              - "Jangan reaksi yang meremehkan kreator asli — mereka pelopor di zamannya"
              - "Jangan copyright penuh video lama — potong pendek sebagai fair use"
              - "Jangan memalsukan tidak tahu jika memang sudah tahu — penonton bisa baca itu"
            pola_hook: "Detik 0: sebutkan tahun dan judul video langsung ('video ini viral 2010 dan...') + ekspresi penasaran atau nostalgia. Langsung putar klip pendeknya di detik 3."
            contoh_judul:
              - "Video viral Indonesia 2010 ini baru aku tonton sekarang dan ini reaksiku"
              - "Siapa yang masih ingat ini? Aku baru nonton dan ternyata lebih bagus dari yang diingat"
              - "Meme Indonesia pertama yang pernah ada, dan reaksiku setelah lihat konteksnya"
              - "Video ini dapat jutaan views di era dial-up dan ini alasannya masih relevan"
              - "Internet Indonesia tahun 2008 itu seperti ini, dan generasi sekarang perlu tahu"
            content_runway: "Arsip konten viral Indonesia dari 2005–2020 sangat besar — video musik, meme pertama, konten kreator awal, berita viral — dan terus relevan karena penonton muda selalu penasaran tentang masa lalu internet Indonesia."

        - slug: reaction-challenge-gagal
          name: Reaksi Lihat Challenge yang Gagal Total
          description: Komentar dan reaksi terhadap challenge media sosial yang gagal lucu tanpa menyakiti siapapun, format split-screen yang mengundang tawa bersama.
          example_hook: "Challenge ini terlihat mudah sampai giliran mereka coba sendiri..."
          guide:
            audience: "Penonton 14–28 yang suka fail compilation dan challenge content; penonton yang menikmati Schadenfreude ringan tanpa ada yang terluka; pengikut tren challenge media sosial yang senang lihat orang gagal dengan cara lucu."
            tone: "Geli dan empati sekaligus. Tawa bersama, bukan tawa menghina — tone harus 'ini lucu karena kita semua pasti akan gagal juga'. Komentar singkat reaktor menambah lapisan humor, bukan penghakiman."
            format: "30–60 detik. Split-screen: challenge original di satu sisi, reaksi di sisi lain. Atau sekuensial: klip gagal → reaksi → komentar → klip gagal berikutnya. Potong ke momen gagal paling epic dulu."
            boleh:
              - "Pilih challenge yang gagalnya tidak menyakiti siapapun secara serius"
              - "Komentar singkat reaktor harus memperkuat humor, bukan menjelaskan yang sudah jelas"
              - "Slow replay momen gagal paling epic — visual itu sendiri sudah lucu"
              - "Tambahkan teks overlay untuk timing komentar yang lebih presisi"
            hindari:
              - "Jangan gunakan klip yang menunjukkan cedera serius atau memalukan seseorang secara berlebihan"
              - "Jangan tertawa terlalu lama pada satu orang — tone tidak boleh jadi bullying"
              - "Jangan paksa komentar yang tidak lucu — silence setelah gagal sering lebih efektif"
              - "Jangan gunakan klip tanpa izin kreator atau dari sumber yang tidak jelas"
            pola_hook: "Detik 0: potong langsung ke momen gagal paling lucu, bukan awal challenge — penonton langsung tertawa sebelum tahu konteksnya, lalu penasaran bagaimana awalnya."
            contoh_judul:
              - "Challenge ini terlihat mudah sampai mereka coba sendiri dan ini hasilnya"
              - "Semua orang di video ini yakin berhasil dan tidak ada yang benar"
              - "Challenge yang sudah gagal 100 kali tapi orang masih percaya mereka beda"
              - "Reaksi aku nonton fail challenge yang tidak ada satupun sukses di video ini"
              - "Tantangan Rp0 yang ternyata butuh bakat yang tidak dimiliki satupun orang di sini"
            content_runway: "Challenge media sosial baru muncul setiap minggu di Indonesia, dan sebagian besar selalu ada yang gagal dengan cara lucu — sumber konten yang tidak akan pernah habis selama tren challenge terus ada."

    - slug: memes
      name: "Meme / Relatable"
      description: Meme video, momen relatable.
      faceless: true
      difficulty: pemula
      rpm: rendah
      formats: klip + caption + musik
      example_hook: "POV: kamu anak terakhir..."
      guide:
        audience: "Penonton 15–30 yang aktif di media sosial Indonesia; gen Z dan millennial yang familiar dengan internet culture lokal; penonton yang ingin feel 'gue banget' dan langsung share ke teman."
        tone: "Singkat, tajam, dan langsung ngena. Tidak ada penjelasan — kalau relatable, penonton langsung tahu. Gaya bahasa sangat kasual, sering pakai singkatan dan bahasa gaul Indonesia terkini."
        format: "10–30 detik. Format POV, ekspektasi vs realita, atau klip singkat + caption yang jadi punchline. Musik trending atau sound viral sebagai latar. Teks overlay besar dan jelas adalah kunci karena banyak nonton tanpa suara."
        boleh:
          - "Gunakan sound atau musik yang sedang trending untuk boost distribusi"
          - "Teks overlay besar, kontras, dan singkat — maksimal satu frasa per frame"
          - "Format POV langsung tanpa setup — 'POV: kamu yang...' dan penonton langsung ada di sana"
          - "Tag situasi yang sangat spesifik — semakin spesifik, semakin relatable"
        hindari:
          - "Jangan pakai meme format yang sudah expired lebih dari 2 bulan"
          - "Jangan caption yang terlalu panjang — potong sampai hanya yang esensial"
          - "Jangan gunakan musik ber-hak-cipta tanpa clearance"
          - "Jangan terlalu berusaha lucu — yang organik selalu menang"
        pola_hook: "Detik 0: teks POV atau situasi langsung tampil tanpa intro — penonton harus langsung bisa kategorikan diri mereka ('itu aku' atau 'itu teman aku') dalam 1 detik."
        contoh_judul:
          - "POV kamu anak terakhir dan semua keputusan keluarga sudah dibuat sebelum kamu lahir"
          - "Ekspektasi vs realita yang terlalu akurat untuk tidak di-share"
          - "Situasi ini terjadi setiap minggu dan semua orang pura-pura tidak tahu kenapa"
      micro:
        - slug: memes-pov-kerja-indonesia
          name: POV Kerja di Indonesia
