            format: "10–25 detik. Teks besar 'POV:' + situasi spesifik → klip singkat atau gambar diam yang mewakili ekspresi pasrah/shock → musik atau sound yang cocok dengan mood. Teks adalah kontennya, klip hanya backdrop."
