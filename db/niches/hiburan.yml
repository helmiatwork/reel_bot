        - slug: memes-mahasiswa-semester-akhir
          name: Momen Paling Relatable Mahasiswa Tingkat Akhir
          description: Meme video khusus penderitaan mahasiswa skripsi dan semester akhir — dosen pembimbing ghosting, sidang ditunda, dan wisuda yang terasa mustahil.
