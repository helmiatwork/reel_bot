      formats: tur + voiceover + reveal-harga
      example_hook: "Tebak harga rumah ini..."
      guide:
        audience: "Anak muda dan dewasa muda 25–45 yang mulai memikirkan properti — baik untuk tinggal maupun investasi; generasi yang merasa rumah semakin tidak terjangkau dan butuh informasi benchmark harga yang jujur."
        tone: "Informatif dan sedikit mengejutkan — harga properti selalu mengejutkan baik ke atas maupun ke bawah. Format reveal menciptakan engagement alami. Jujur soal kondisi pasar yang tidak selalu berpihak ke pembeli muda."
        format: "45–90 detik. Tur singkat properti atau visual eksterior/interior → reveal harga + konteks lokasi → analisis apakah ini worth it atau tidak berdasarkan data → CTA reflektif. Voiceover informatif. Vertikal 9:16."
        boleh:
          - "Gunakan harga dari listing publik yang bisa diverifikasi (Rumah123, Lamudi, OLX Properti)"
          - "Berikan konteks lokasi, aksesibilitas, dan fasilitas sekitar untuk analisis komprehensif"
          - "Bandingkan harga per meter persegi antar lokasi untuk benchmark yang useful"
          - "Tampilkan kalkulator cicilan KPR sederhana berdasarkan harga properti yang dibahas"
        hindari:
          - "Jangan beri rekomendasi 'beli properti ini' secara langsung — kondisi personal sangat menentukan"
          - "Jangan klaim bahwa properti selalu naik sebagai investasi — pasar properti bisa stagnan atau turun"
          - "Jangan promosikan developer atau agen properti tertentu tanpa disclosure"
          - "Jangan abaikan biaya tersembunyi properti (pajak, biaya notaris, biaya developer) dalam analisis"
        pola_hook: "Detik 0: visual properti dengan teks 'tebak harga ini' — tidak ada jawaban dulu. Penonton harus scroll atau tonton sampai reveal harga yang selalu mengejutkan."
        contoh_judul:
          - "Tebak harga apartemen studio di Jakarta Selatan ini, jawabannya mengejutkan"
