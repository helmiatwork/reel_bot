            audience: "Trader pemula crypto 20–35 yang sering trading berdasarkan feeling atau berita; ingin mulai belajar analisis teknikal tapi intimidated dengan kompleksitasnya; butuh pengantar yang langsung applicable."
            tone: "Teknis tapi tidak menakutkan — satu konsep per video, dijelaskan dengan sangat visual. Jujur bahwa analisis teknikal bukan crystal ball, hanya alat bantu probabilistik."
            format: "75–90 detik. Satu indikator teknikal per video → cara membacanya pada chart nyata (historis) → sinyal apa yang dihasilkan dan artinya → keterbatasan indikator ini → cara kombinasikan dengan risk management. Screen-record chart yang dianotasi langsung. Vertikal 9:16."
            boleh:
              - "Gunakan contoh chart historis yang sudah terjadi (bukan prediksi) untuk ilustrasi"
              - "Tampilkan indikator secara visual langsung di atas chart yang relevan"
              - "Jelaskan false signal dan kapan indikator ini tidak bisa diandalkan"
              - "Sambungkan ke money management: sinyal bagus + sizing buruk tetap rugi"
            hindari:
              - "Jangan klaim indikator tertentu 'selalu akurat' atau bisa prediksi pergerakan dengan pasti"
              - "Jangan berikan sinyal trading spesifik berdasarkan kondisi pasar saat ini"
              - "Jangan buat penonton merasa analisis teknikal bisa menghilangkan risiko trading"
              - "Jangan abaikan disclaimer bahwa trading crypto mengandung risiko kehilangan modal"
            pola_hook: "Detik 0: close-up chart historis dengan indikator menyala tepat sebelum pergerakan besar + teks 'ini yang muncul sebelum pump ini terjadi'. Langsung ke penjelasan indikator di detik 4."
            contoh_judul:
              - "RSI itu apa dan cara bacanya di chart crypto untuk pemula yang belum pernah coba"
              - "Support dan resistance: konsep paling dasar analisis teknikal yang wajib dipahami dulu"
              - "MACD sinyal golden cross dan death cross — ini yang terjadi setelahnya di chart historis"
              - "Indikator teknikal tidak pernah 100% akurat, ini kenapa dan cara pakai yang benar"
              - "Cara annotate chart crypto sendiri untuk bantu keputusan trading yang lebih terstruktur"
            content_runway: "Setiap indikator teknikal (RSI, MACD, Bollinger Bands, EMA, volume, Fibonacci, dll) menjadi video tersendiri; setiap kombinasi indikator dan strategi menghasilkan konten baru; pasar crypto yang terus bergerak selalu menghadirkan contoh chart baru."

        - slug: crypto-trading-manajemen-risiko
          name: Manajemen Risiko dalam Trading Crypto
          description: Framework konkret mengatur posisi dan stop-loss agar tidak habis modal karena satu trade buruk, untuk trader pemula yang sering over-leverage.
          example_hook: "Trader ini rugi 80% bukan karena analisis salah, tapi karena ini..."
          guide:
            audience: "Trader crypto 20–38 yang sudah pernah rugi besar dari satu atau beberapa trade buruk; tahu cara analisis teknikal dasar tapi belum punya framework manajemen risiko yang disiplin."
            tone: "Serius dan berbasis data — ini topik yang bisa benar-benar mengubah hasil trading penonton. Bukan motivasi, tapi framework konkret yang harus dipraktikkan setiap trade."
            format: "75–90 detik. Kasus konkret kerugian besar dari risiko tidak dimanage → konsep position sizing sederhana → cara hitung stop-loss yang logis → aturan risk/reward ratio → mental framework untuk tetap disiplin. Kalkulator visual dan contoh angka nyata. Vertikal 9:16."
            boleh:
              - "Tampilkan simulasi konkret: modal Rp10jt dengan berbagai skenario position sizing"
              - "Jelaskan rule 1-2% per trade secara visual dan kenapa ini melindungi akun dalam jangka panjang"
              - "Bahas psikologi kenapa trader over-leverage meskipun tahu risikonya"
              - "Tunjukkan perbedaan drawdown antara yang pakai manajemen risiko vs tidak"
            hindari:
              - "Jangan buat framework yang terkesan bisa menghilangkan kerugian sepenuhnya"
              - "Jangan rekomendasikan leverage spesifik sebagai 'aman' — semua leverage mengandung risiko"
              - "Jangan abaikan bahwa bahkan dengan risk management terbaik, trading crypto masih sangat berisiko"
              - "Jangan berikan sinyal atau rekomendasi trade spesifik di konten ini"
            pola_hook: "Detik 0: statistik berapa persen trader ritel crypto kehilangan uang dalam jangka panjang + teks 'bukan karena analisis salah, tapi karena ini yang tidak dilakukan'. Langsung ke konsep di detik 4."
            contoh_judul:
              - "Kenapa trader ini rugi 80% modal dalam satu minggu meski analisisnya benar"
              - "Rule 1% per trade: aturan sederhana yang melindungi akun trading dari kehancuran"
              - "Cara hitung stop-loss yang logis bukan berdasarkan berapa yang sanggup rugi"
              - "Risk/reward ratio dan kenapa trader yang winrate-nya 40% masih bisa profit"
              - "Framework manajemen risiko trading crypto yang bisa mulai diterapkan hari ini"
            content_runway: "Setiap aspek manajemen risiko (position sizing, stop-loss, take-profit, diversifikasi, korrelasi aset, drawdown management) menghasilkan video tersendiri; kasus kerugian nyata yang terdokumentasi terus menghasilkan konten edukatif baru."

        - slug: crypto-trading-psikologi
          name: Psikologi Trading yang Sering Bikin Rugi
          description: Analisis bias kognitif umum yang dialami trader crypto — FOMO, revenge trading, overconfidence — dengan cara konkret melawannya.
          example_hook: "Bukan strategi yang bikin kamu rugi, ini yang sebenarnya terjadi di otakmu saat trading..."
          guide:
            audience: "Trader crypto 21–38 yang merasa sudah punya strategi dan pengetahuan tapi masih sering rugi karena keputusan emosional; menyadari ada masalah mental tapi tidak tahu cara mengatasinya secara konkret."
            tone: "Psikologis dan insightful — membantu penonton melihat pola perilaku mereka sendiri dalam trading. Sedikit introspektif tapi tidak terkesan judgemental. Jujur bahwa bias ini dialami hampir semua trader."
            format: "75–90 detik. Satu atau dua bias psikologi per video → ilustrasi bagaimana bias ini muncul dalam keputusan trading nyata → dampak finansialnya → teknik konkret untuk melawan bias ini → reminder bahwa ini butuh latihan. Animasi atau screen-record dengan narasi. Vertikal 9:16."
            boleh:
              - "Gunakan contoh trade scenario yang sangat relatable untuk mengilustrasikan bias"
              - "Bahas teknik konkret: trading journal, pre-trade checklist, aturan 24 jam sebelum entry"
              - "Akui bahwa bias psikologi tidak bisa dihilangkan, hanya dimanage"
              - "Sambungkan ke penelitian behavioral finance yang mendukung poin yang dibahas"
            hindari:
              - "Jangan buat konten terkesan bisa 'menyembuhkan' masalah psikologi trading — ini proses jangka panjang"
              - "Jangan abaikan konteks bahwa bahkan trader terbaik dengan psikologi terbaik masih bisa rugi"
              - "Jangan berikan rekomendasi trade atau sinyal di konten bertema psikologi"
              - "Jangan simplifikasi psikologi trading menjadi 'jangan emosi' — ini tidak actionable"
            pola_hook: "Detik 0: cerita singkat skenario FOMO atau revenge trade yang sangat relatable + teks 'ini yang sebenarnya terjadi di otakmu saat trading, bukan masalah strategi'. Langsung ke penjelasan bias di detik 5."
            contoh_judul:
              - "Bukan strategi yang bikin kamu rugi, ini yang sebenarnya terjadi di otak saat trading"
              - "FOMO trading: kenapa kamu selalu beli di puncak dan jual di bawah"
              - "Revenge trading adalah pembunuh akun paling umum dan cara mengenalinya sebelum terlambat"
              - "Trading journal: satu kebiasaan yang memisahkan trader yang berkembang dari yang stagnan"
              - "Overconfidence bias di trading crypto dan kenapa setelah menang besar kamu lebih rentan rugi"
            content_runway: "Setiap bias kognitif dalam trading (FOMO, loss aversion, confirmation bias, sunk cost, overconfidence, herding) menjadi video tersendiri; trading journal tips, pre-trade routine, dan psikologi pasar bear/bull juga menghasilkan konten baru sepanjang tahun."
