        - slug: real-estate-kpr-pemula
          name: KPR untuk Pertama Kali Tanpa Bingung
          description: Panduan proses KPR dari awal hingga akad untuk pembeli rumah pertama, menjawab pertanyaan yang sering bikin orang ragu untuk mulai.
          example_hook: "Ini yang bank gak kasih tahu kamu soal KPR sebelum kamu tanda tangan..."
          guide:
            audience: "Anak muda 27–40 yang ingin beli rumah pertama tapi bingung dan takut dengan proses KPR; merasa proses KPR rumit dan penuh jebakan; butuh panduan jujur yang membantu mereka navigasi proses ini."
            tone: "Jujur dan membantu — seperti teman yang sudah pernah lewati proses KPR dan mau berbagi semua yang tidak diajarkan bank. Tidak panik, tapi tidak menutup-nutupi kompleksitasnya."
            format: "75–90 detik. Step-by-step proses KPR dari simulasi awal → pengajuan → BI checking → survei → akad → serah terima → biaya-biaya yang sering mengejutkan pembeli pertama → tips negosiasi sederhana. Flowchart visual atau checklist. Vertikal 9:16."
            boleh:
              - "Tampilkan biaya-biaya tersembunyi KPR yang sering mengejutkan: BPHTB, biaya notaris, biaya asuransi"
              - "Jelaskan BI checking dan cara memperbaiki rekam jejak kredit sebelum apply"
              - "Berikan tips negosiasi sederhana: minta tenor lebih panjang, tanya cicilan awal lebih ringan"
              - "Bahas perbedaan KPR konvensional dan syariah secara objektif"
            hindari:
              - "Jangan rekomendasikan bank KPR tertentu sebagai 'terbaik' tanpa konteks dan disclaimer"
              - "Jangan klaim bahwa properti tertentu adalah 'pilihan terbaik' untuk KPR"
              - "Jangan abaikan risiko: apa yang terjadi jika tidak bisa bayar cicilan"
              - "Jangan berikan angka bunga KPR spesifik tanpa disclaimer bahwa kondisi berubah dan harus dicek langsung"
            pola_hook: "Detik 0: teks 'ini yang bank tidak kasih tahu kamu sebelum tanda tangan KPR' + daftar singkat hal yang mengejutkan banyak pembeli pertama. Langsung ke langkah pertama di detik 4."
            contoh_judul:
              - "Ini yang bank tidak kasih tahu sebelum kamu tanda tangan KPR pertama"
              - "Proses KPR dari awal sampai akad dalam 90 detik — panduan step by step"
              - "Biaya KPR yang sering bikin pembeli pertama kaget setelah deal sudah jalan"
              - "Cara cek dan perbaiki BI checking sebelum apply KPR agar tidak langsung ditolak"
              - "Beda KPR konvensional dan syariah: mana yang lebih cocok untuk kondisimu?"
            content_runway: "Setiap tahapan proses KPR bisa menjadi video tersendiri; setiap bank memiliki kebijakan berbeda; kondisi suku bunga dan regulasi berubah menghasilkan konten update; pertanyaan pembeli pertama tidak pernah habis."

    - slug: crypto-trading
      name: Crypto Trading
      description: Strategi dan analisis trading aset kripto untuk pemula hingga menengah.
      faceless: true
      difficulty: menengah
      rpm: tinggi
      formats: grafik + screen-record + voiceover
      example_hook: "Chart ini kasih sinyal beli sebelum naik 3x..."
      guide:
        audience: "Penonton 20–38 yang sudah atau ingin mulai trading crypto; paham dasar crypto tapi belum mengerti cara analisis teknikal atau manajemen risiko; sering impulsif dan rugi karena tidak ada strategi."
        tone: "Teknis tapi accessible — tidak mengasumsikan penonton sudah ahli, tapi tidak terlalu basic. Jujur soal kesulitan trading dan tingginya risiko rugi. Tidak mempromosikan trading sebagai cara cepat kaya."
        format: "60–90 detik. Chart atau grafik trading nyata → penjelasan konsep teknikal satu per satu → implikasi praktis dalam keputusan trading → disclaimer risiko yang kuat. Screen-record platform trading atau grafik yang dianotasi. Vertikal 9:16."
        boleh:
          - "Tampilkan analisis chart dengan contoh nyata yang sudah lewat (bukan prediksi masa depan)"
          - "Jelaskan konsep teknikal dengan contoh visual yang langsung terlihat di chart"
          - "Bahas manajemen risiko sebagai topik yang sama pentingnya dengan strategi entry"
          - "Gunakan data historis untuk ilustrasi, dengan disclaimer bahwa masa lalu tidak menjamin masa depan"
        hindari:
          - "Jangan pernah memberikan sinyal beli/jual crypto spesifik — ini bisa dianggap saran investasi ilegal"
          - "Jangan klaim indikator teknikal 'selalu akurat' atau 'bisa prediksi pergerakan pasti'"
          - "Jangan buat konten yang mendorong over-leverage atau posisi berisiko sangat tinggi"
          - "Jangan abaikan disclaimer risiko tinggi dari trading crypto di setiap konten"
        pola_hook: "Detik 0: chart yang menunjukkan sinyal teknikal sebelum pergerakan signifikan (historis) + teks 'ini yang terjadi setelah sinyal ini muncul'. Langsung ke penjelasan sinyal di detik 4."
        contoh_judul:
          - "Indikator ini muncul sebelum setiap pump besar di chart, ini cara bacanya"
          - "Kenapa trader crypto rugi bukan karena analisis salah, tapi karena ini"
          - "Cara baca chart crypto dasar yang bisa langsung diterapkan pemula"

      micro:
        - slug: crypto-trading-teknikal-dasar
          name: Analisis Teknikal Crypto untuk Pemula
          description: Pengenalan indikator teknikal dasar seperti RSI, MACD, dan support-resistance yang dipakai trader crypto, disajikan dengan contoh chart nyata.
