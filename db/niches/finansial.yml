            tone: "Kalkulatif dan realistis — penonton harus keluar dengan pemahaman angka yang jelas. Bukan sekadar inspiratif, tapi seperti berdiskusi dengan teman yang sudah lebih pengalaman di properti."
            format: "75–90 detik. Konsep investasi kos-kosan → perhitungan modal awal (beli/bangun) → estimasi pendapatan sewa dan ROI → faktor lokasi strategis → risiko dan tantangan yang sering diabaikan. Kalkulator visual dan infografis ROI sangat membantu. Vertikal 9:16."
