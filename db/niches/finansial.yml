version: 1
vertical:
  slug: v-finansial
  name: Finansial
  description: Konten edukasi keuangan, investasi, dan cara menghasilkan uang untuk generasi muda Indonesia.
  guide:
    audience: "Anak muda Indonesia 18–35 yang mulai sadar soal keuangan pribadi; fresh graduate, pekerja awal karir, dan mahasiswa tingkat akhir; mencari panduan praktis yang bisa langsung diterapkan dengan kondisi keuangan riil Indonesia."
    tone: "Kasual, jelas, dan jujur — seperti teman yang lebih tahu soal uang menjelaskan tanpa menggurui. Tidak pakai jargon berlebihan. Mengakui bahwa kondisi keuangan banyak penonton terbatas, dan itu normal."
    format: "Video 30–90 detik dominan screen-record, grafik sederhana, atau teks animasi. Voiceover kasual atau teks overlay. Struktur: hook angka/pertanyaan mengejutkan → inti info yang bisa langsung diterapkan → CTA ringan. Vertikal 9:16."
    boleh:
      - "Pakai angka konkret dan contoh kasus nyata Indonesia (UMR, harga barang, biaya hidup Jakarta/daerah)"
      - "Sederhanakan konsep rumit menjadi analogi sehari-hari yang relatable"
      - "Tunjukkan rumus atau framework yang bisa langsung dipakai penonton hari ini"
      - "Gunakan data dan sumber terpercaya (OJK, BPS, laporan keuangan resmi)"
      - "Akui keterbatasan dan risiko — kejujuran membangun kepercayaan jangka panjang"
    hindari:
      - "Jangan klaim imbal hasil pasti atau jaminan keuntungan investasi apapun — melanggar regulasi OJK dan menyesatkan"
      - "Jangan berikan rekomendasi beli/jual aset spesifik secara langsung tanpa disclaimer yang jelas"
      - "Jangan pakai testimoni palsu atau angka fantastis yang tidak realistis untuk audiens pemula"
      - "Jangan abaikan risiko — setiap konten investasi wajib menyebutkan bahwa investasi mengandung risiko"
      - "Jangan gunakan musik ber-hak-cipta di video"
    pola_hook: "Detik 0–3: angka mengejutkan atau pertanyaan retoris yang langsung relevan ('Gaji UMR bisa investasi berapa?', 'Ternyata 80% gaji habis untuk ini'). Langsung masuk ke inti, tidak ada intro panjang."
    contoh_judul:
      - "Gaji UMR ternyata bisa investasi, ini caranya yang realistis"
      - "Kesalahan keuangan yang dilakukan hampir semua fresh graduate Indonesia"
      - "Formula 50-30-20 itu untuk siapa? Bukan untuk kamu yang gajinya segini"

  niches:
    - slug: finance-edu
      name: Edukasi Keuangan
      description: "Tips uang, nabung, budgeting."
      faceless: true
      difficulty: menengah
      rpm: tinggi
      formats: teks + grafik + voiceover
      example_hook: "Cara nabung Rp10jt setahun..."
      guide:
        audience: "Pekerja muda 20–32 yang merasa gaji selalu habis sebelum akhir bulan; belum punya tabungan yang signifikan; ingin mulai tapi tidak tahu dari mana dan merasa kondisinya terlalu sempit."
        tone: "Empatetis dan realistis — tidak menghakimi kondisi keuangan penonton. Memberikan harapan yang didukung langkah konkret, bukan motivasi kosong."
        format: "45–75 detik. Struktur: masalah umum yang relatable → penyebab tersembunyi → solusi konkret dengan angka nyata → CTA sederhana. Screen-record kalkulator atau spreadsheet sangat efektif. Teks overlay besar dan mudah dibaca."
        boleh:
          - "Mulai dengan kondisi yang sangat relatable ('gaji 5jt tapi pengeluaran 5,5jt') sebelum solusi"
          - "Tampilkan perhitungan sederhana secara visual — angka yang bergerak lebih meyakinkan dari kata-kata"
          - "Gunakan referensi harga lokal yang akurat (kos Jakarta, makan sehari, transport)"
          - "Sederhanakan framework keuangan global ke konteks Indonesia (mis. adaptasi 50/30/20 untuk UMR)"
        hindari:
          - "Jangan rekomendasikan produk keuangan spesifik tanpa disclaimer risiko yang jelas"
          - "Jangan bandingkan kondisi keuangan penonton dengan standar yang tidak realistis"
          - "Jangan pakai istilah teknis tanpa penjelasan — penonton tidak harus punya background ekonomi"
          - "Jangan buat konten yang terkesan menjual produk keuangan tertentu secara terselubung"
        pola_hook: "Detik 0: angka atau fakta mengejutkan seputar kebiasaan keuangan umum + identifikasi masalah dalam 1 kalimat. Langsung ke inti di detik 3."
        contoh_judul:
          - "Cara nabung Rp10jt setahun dari gaji yang selalu pas-pasan"
          - "Kenapa gaji selalu habis sebelum tanggal 25, ini yang sebenarnya terjadi"
          - "Budgeting paling sederhana yang bisa dilakukan siapapun mulai hari ini"

      micro:
        - slug: finance-edu-gaji-pertama
          name: Cara Kelola Gaji Pertama dengan Benar
          description: Panduan alokasi gaji untuk fresh graduate yang baru mulai bekerja, dengan formula sederhana yang bisa langsung diterapkan tanpa background finansial.
          example_hook: "Gaji pertama kamu akan habis sia-sia tanpa aturan ini..."
          guide:
            audience: "Fresh graduate 21–25 yang baru terima gaji pertama; kebanyakan belum punya kebiasaan menabung; rentan terjebak lifestyle inflation karena pertama kali punya penghasilan sendiri."
            tone: "Hangat dan memandu seperti kakak yang lebih berpengalaman — tidak menghakimi, tapi juga tidak menutup-nutupi konsekuensi kalau tidak diatur dari awal."
            format: "60–75 detik. Tampilkan breakdown alokasi gaji secara visual (grafik pai atau daftar persentase) → simulasi angka konkret untuk gaji 3, 5, 7 juta → CTA untuk langsung atur di hari gajian. Screen-record atau animasi teks sederhana. Vertikal 9:16."
            boleh:
              - "Tampilkan perbandingan dua skenario: alokasi spontan vs alokasi terencana dalam 6 bulan"
              - "Gunakan angka gaji UMR dan menengah bawah yang realistis untuk segmen ini"
              - "Rekomendasikan langkah hari pertama: pisahkan rekening tabungan sebelum dipakai"
              - "Sertakan pos 'hiburan' yang realistis — penonton perlu merasa ini bisa dijalani"
            hindari:
              - "Jangan rekomendasikan produk investasi spesifik tanpa menyebut risiko dan konsultasi penasihat keuangan"
              - "Jangan pakai contoh gaji yang terlalu tinggi — tidak relevan untuk mayoritas penonton segmen ini"
              - "Jangan buat formula yang terasa terlalu kaku sehingga tidak bisa diikuti"
              - "Jangan abaikan pos kebutuhan darurat — dana darurat harus masuk di bulan pertama"
            pola_hook: "Detik 0: teks besar 'Gaji pertama kamu akan habis sia-sia tanpa aturan ini' + ilustrasi uang menguap. Langsung tampilkan breakdown di detik 3."
            contoh_judul:
              - "Gaji pertama kamu akan habis sia-sia kalau tidak lakukan ini di hari gajian"
              - "Cara bagi gaji fresh graduate supaya masih ada sisa di akhir bulan"
              - "3 rekening yang wajib dimiliki sebelum gajian pertama masuk"
              - "Formula alokasi gaji yang realistis untuk fresh graduate Indonesia"
              - "Ini yang terjadi kalau gaji pertama tidak langsung diatur dari hari pertama"
            content_runway: "Setiap range gaji (UMR, menengah, high-income starter), kota (Jakarta vs daerah), status (single vs sudah menikah), dan pos pengeluaran berbeda menghasilkan simulasi yang unik; topik ini selalu relevan karena ada fresh graduate baru setiap tahun."

        - slug: finance-edu-hutang-produktif
          name: Hutang yang Produktif vs Hutang yang Bunuh
          description: Edukasi perbedaan hutang konsumtif dan produktif dengan contoh kasus nyata Indonesia, membantu penonton membuat keputusan pinjaman yang lebih cerdas.
          example_hook: "Bukan semua hutang buruk, tapi jenis hutang ini yang hancurkan keuanganmu..."
          guide:
            audience: "Anak muda 22–35 yang pernah atau sedang punya pinjaman — cicilan HP, paylater, KPR, atau pinjaman online — dan bingung apakah keputusan mereka tepat; juga yang sedang mempertimbangkan ambil hutang baru."
            tone: "Jelas dan sedikit menggugah — konten ini perlu membuat penonton berhenti sejenak dan merefleksikan keputusan mereka. Tidak menghakimi, tapi juga tidak membenarkan semua jenis hutang."
            format: "60–90 detik. Mulai dari contoh kasus nyata orang yang hutangnya 'bunuh' mereka → definisi visual hutang konsumtif vs produktif → cek list sederhana cara membedakan → penutup dengan pertanyaan reflektif. Teks overlay + grafik perbandingan. Vertikal 9:16."
            boleh:
              - "Pakai contoh kasus yang sangat relatable: paylater beli HP baru, cicilan motor, KPR"
              - "Tampilkan perbandingan visual total bunga yang dibayarkan vs nilai aset"
              - "Berikan framework 3 pertanyaan untuk cek apakah hutang ini produktif atau tidak"
              - "Sebut platform paylater dan pinjol yang populer di Indonesia sebagai konteks (bukan promosi)"
            hindari:
              - "Jangan berikan saran spesifik 'ambil hutang di sini' atau 'jangan ambil di sana' tanpa konteks menyeluruh"
              - "Jangan dramatisasi berlebihan yang terkesan menakut-nakuti penonton"
              - "Jangan klaim bahwa hutang produktif selalu aman — tetap ada risiko yang harus disebutkan"
              - "Jangan abaikan konteks bahwa kemampuan membayar cicilan sangat individual"
            pola_hook: "Detik 0: cerita singkat orang yang gaji besar tapi seluruhnya untuk bayar cicilan + teks 'ini hutang yang bunuh keuangan kamu'. Langsung definisi di detik 4."
            contoh_judul:
              - "Bukan semua hutang buruk, tapi hutang ini yang perlahan hancurkan keuanganmu"
              - "Cicilan HP baru kamu itu hutang produktif atau konsumtif? Cek dulu"
              - "Orang ini gaji 10jt tapi tidak punya tabungan karena ini jenis hutangnya"
              - "3 pertanyaan sebelum ambil pinjaman apapun — wajib dijawab jujur"
              - "Perbedaan KPR dan paylater baju baru: kenapa satu oke dan satu tidak"
            content_runway: "Setiap produk pinjaman populer di Indonesia (KPR, KTA, paylater, pinjol, cicilan motor/HP, kartu kredit) bisa menjadi satu video tersendiri; topik ini selalu relevan karena penetrasi pinjaman digital terus tumbuh."

        - slug: finance-edu-dana-darurat
          name: Bangun Dana Darurat dari Nol
          description: Panduan langkah-langkah konkret membangun dana darurat bagi yang belum punya tabungan sama sekali, dengan timeline realistis berdasarkan penghasilan UMR.
          example_hook: "Tanpa dana darurat, satu musibah cukup untuk hancurkan 5 tahun kerja kerasmu..."
          guide:
            audience: "Pekerja muda 20–30 yang belum punya dana darurat sama sekali atau dananya kurang dari 1 bulan pengeluaran; sadar bahwa ini penting tapi tidak tahu bagaimana mulai dengan kondisi finansial yang terbatas."
            tone: "Urgen tapi tidak panik — penonton perlu merasa ini mendesak, tapi juga yakin bahwa ini bisa dilakukan meskipun kondisi keuangan terbatas saat ini."
            format: "60–80 detik. Scenario disaster tanpa dana darurat → definisi dana darurat ideal (3-6 bulan pengeluaran) → breakdown rencana menabung bulanan menuju target → rekomendasi tempat menyimpan dana darurat. Grafik progres visual sangat efektif. Vertikal 9:16."
            boleh:
              - "Tampilkan simulasi konkret: mulai dari Rp200rb/bulan menuju dana darurat Rp15jt dalam 18 bulan"
              - "Rekomendasikan produk penyimpanan yang likuid (tabungan, reksa dana pasar uang) dengan disclaimer risiko"
              - "Tampilkan 'milestone kecil' yang bisa dirayakan untuk jaga motivasi"
              - "Berikan tips konkret untuk 'curi' uang dari budget yang sudah ketat"
            hindari:
              - "Jangan sebut produk tabungan atau investasi spesifik sebagai 'terbaik' tanpa disclaimer bahwa setiap produk memiliki risiko dan kondisi berbeda"
              - "Jangan buat target yang tidak realistis yang malah bikin penonton menyerah"
              - "Jangan abaikan bahwa beberapa penonton mungkin punya utang yang harus diselesaikan dulu"
              - "Jangan klaim dana darurat di reksa dana pasar uang tanpa menyebutkan risiko likuiditas pencairan"
            pola_hook: "Detik 0: skenario singkat — 'ban mobil bocor, HP rusak, masuk RS semuanya di bulan yang sama' + teks 'tanpa dana darurat ini artinya hutang'. Langsung ke solusi di detik 5."
            contoh_judul:
              - "Tanpa dana darurat, satu musibah bisa hancurkan 5 tahun kerja kerasmu"
              - "Cara bangun dana darurat dari nol meskipun gaji tidak ada sisanya"
              - "Berapa seharusnya dana darurat kamu? Cek simulasi ini berdasarkan pengeluaranmu"
              - "Mulai dari Rp200rb per bulan sampai dana darurat 6 bulan — ini timeline-nya"
              - "Ini yang terjadi kalau kamu kena PHK besok dan tidak punya tabungan sama sekali"
            content_runway: "Setiap fase kehidupan (lajang, menikah, punya anak, sudah punya rumah), rentang pengeluaran, dan situasi darurat yang berbeda menghasilkan variasi konten; topik ini evergreen karena selalu ada penonton yang baru memulai perjalanan keuangan mereka."

    - slug: investing
      name: Investasi
      description: "Saham, reksadana, investasi dasar."
      faceless: true
      difficulty: menengah
      rpm: tinggi
      formats: grafik + voiceover
      example_hook: "Rp1jt/bulan jadi Rp1M dengan..."
      guide:
        audience: "Anak muda 22–35 yang ingin mulai investasi tapi bingung mulai dari mana; memiliki sedikit modal (Rp100rb–Rp1jt/bulan) tapi serius ingin membangun aset jangka panjang; belum punya pengalaman investasi sebelumnya."
        tone: "Edukatif dan jelas — tidak sensasional, tidak over-promising. Penonton harus keluar dengan pemahaman yang lebih baik, bukan sekadar semangat sesaat. Transparansi soal risiko adalah kunci kepercayaan jangka panjang."
        format: "45–90 detik. Grafik pertumbuhan, simulasi kalkulator, atau perbandingan produk investasi. Voiceover tenang. Struktur: konteks kenapa ini penting → cara kerja dasar → langkah konkret mulai → disclaimer risiko singkat. Vertikal 9:16."
        boleh:
          - "Tampilkan simulasi compounding jangka panjang dengan angka nyata yang realistis"
          - "Bandingkan produk investasi secara objektif berdasarkan risiko, likuiditas, dan potensi return"
          - "Gunakan bahasa yang tidak mengintimidasi — 'dana investasi' bukan 'equity portfolio'"
          - "Selalu sertakan disclaimer risiko yang jelas dan mudah dipahami"
        hindari:
          - "Jangan klaim atau implisitkan imbal hasil pasti dari instrumen investasi apapun — ini melanggar regulasi OJK"
          - "Jangan rekomendasikan saham atau instrumen spesifik secara langsung tanpa konteks risiko dan profil investor"
          - "Jangan pakai angka return masa lalu sebagai jaminan return masa depan"
          - "Jangan buat konten yang terkesan 'get rich quick' — merusak kepercayaan dan bisa menyesatkan"
        pola_hook: "Detik 0: simulasi angka Rp1jt/bulan selama 20 tahun dengan compounding + teks 'ini yang terjadi kalau kamu mulai hari ini vs 5 tahun lagi'. Langsung masuk penjelasan di detik 4."
        contoh_judul:
          - "Rp1jt per bulan di reksadana ini jadi berapa dalam 15 tahun, ini hitungannya"
          - "Perbedaan tabungan biasa vs investasi yang bikin beda puluhan juta dalam 10 tahun"
          - "Mulai investasi dengan modal Rp100rb, ini yang realistis bisa dicapai"

      micro:
        - slug: investing-reksadana-pemula
          name: Reksadana untuk Pemula Absolut
          description: Panduan mulai investasi reksadana dari nol untuk yang belum pernah investasi, dengan rekomendasi platform dan jenis reksadana yang sesuai risiko pemula.
          example_hook: "Rp100rb/bulan di reksadana ini jadi berapa dalam 10 tahun, ini hitungannya..."
          guide:
            audience: "Penonton 20–30 yang baru dengar soal reksadana dan ingin tahu apakah ini cocok untuk mereka; modal kecil (Rp100rb–500rb/bulan); butuh panduan step-by-step yang tidak membingungkan."
            tone: "Sabar dan membimbing — anggap penonton benar-benar belum tahu apa-apa. Tidak ada asumsi pengetahuan sebelumnya. Semua istilah teknis harus dijelaskan dengan analogi sederhana."
            format: "75–90 detik. Definisi reksadana dengan analogi → jenis reksadana (pasar uang, pendapatan tetap, campuran, saham) dan cocok untuk siapa → cara beli di platform digital → simulasi pertumbuhan. Screen-record saat daftar di aplikasi sangat membantu. Vertikal 9:16."
            boleh:
              - "Gunakan analogi sederhana: reksadana = titip uang ke manajer investasi profesional"
              - "Tampilkan screen-record proses daftar dan beli reksadana pertama (tanpa menyebut platform sebagai 'terbaik')"
              - "Simulasi kalkulator dengan angka investasi kecil yang realistis untuk pemula"
              - "Jelaskan biaya dan fee yang mungkin ada secara transparan"
            hindari:
              - "Jangan klaim reksadana tertentu pasti menghasilkan return X persen — tidak ada jaminan dan melanggar regulasi"
              - "Jangan rekomendasikan satu platform sebagai satu-satunya pilihan tanpa konteks"
              - "Jangan skip penjelasan risiko — terutama bahwa nilai reksadana bisa turun"
              - "Jangan gunakan angka return historis sebagai proyeksi masa depan tanpa disclaimer jelas"
            pola_hook: "Detik 0: simulasi visual Rp100rb/bulan selama 10 tahun dengan asumsi return realistis + teks pertanyaan. Langsung ke penjelasan apa itu reksadana di detik 4."
            contoh_judul:
              - "Rp100rb per bulan di reksadana, ini berapa hasilnya dalam 10 tahun secara realistis"
              - "Cara beli reksadana pertama kali dari HP tanpa ribet dan tanpa modal besar"
              - "Beda reksadana pasar uang vs reksadana saham — mana yang cocok untuk pemula?"
              - "Reksadana itu aman atau tidak? Ini yang perlu kamu tahu sebelum mulai"
              - "Panduan lengkap mulai reksadana dari nol untuk yang belum pernah investasi sama sekali"
            content_runway: "Setiap jenis reksadana, platform berbeda, perbandingan strategi DCA vs lump sum, dan pertanyaan umum pemula (berapa lama? apa bedanya dengan deposito? bagaimana kalau rugi?) masing-masing menjadi video tersendiri."

        - slug: investing-saham-dividen
          name: Saham Dividen sebagai Passive Income
          description: Strategi investasi saham berorientasi dividen untuk pembangun passive income jangka panjang, dengan daftar saham dividen konsisten di BEI.
          example_hook: "Saham ini bayar dividen setiap tahun selama 10 tahun berturut-turut..."
          guide:
            audience: "Investor pemula hingga menengah 24–40 yang ingin membangun passive income dari pasar modal; sudah mulai investasi reksadana dan ingin naik level; berpikir jangka panjang, bukan trader harian."
            tone: "Sedikit lebih teknis dari konten pemula absolut, tapi tetap kasual. Fokus pada konsep yang bisa langsung diterapkan, bukan teori akademis. Jujur soal jangka waktu yang dibutuhkan."
            format: "60–90 detik. Konsep dividend yield dan cara menghitungnya → kriteria saham dividen yang konsisten → ilustrasi portofolio dividen jangka panjang dengan angka realistis → disclaimer risiko pasar saham. Grafik bar dan tabel sederhana. Vertikal 9:16."
            boleh:
              - "Tampilkan ilustrasi bagaimana dividen bisa reinvest untuk compounding lebih cepat"
              - "Bahas kriteria saham dividen konsisten secara umum (bukan rekomendasikan saham spesifik)"
              - "Tunjukkan simulasi berapa passive income dari portofolio Rp100jt–500jt dalam dividen"
              - "Bandingkan dividen saham dengan instrumen passive income lain secara objektif"
            hindari:
              - "Jangan rekomendasikan saham spesifik sebagai 'pasti' bayar dividen — saham bisa kapan saja stop dividen"
              - "Jangan klaim passive income dari dividen tanpa menyebut risiko penurunan harga saham dan pembatalan dividen"
              - "Jangan buat simulasi dengan asumsi return yang tidak realistis atau data yang tidak terverifikasi"
              - "Jangan abaikan bahwa investasi saham memerlukan toleransi risiko yang lebih tinggi dari reksadana"
            pola_hook: "Detik 0: ilustrasi uang masuk rekening setiap tahun tanpa kerja + teks 'ini yang dilakukan saham dividen selama 10 tahun berturut-turut'. Langsung ke penjelasan konsep dividen di detik 4."
            contoh_judul:
              - "Saham yang bayar dividen konsisten 10 tahun berturut-turut — ini cara kerjanya"
              - "Cara bangun passive income dari dividen saham mulai dari modal kecil"
              - "Berapa passive income dari portofolio saham Rp100jt di dividen saja?"
              - "Strategi beli saham untuk dividen, bukan trading — cocok untuk yang tidak mau ribet"
              - "Dividend yield itu apa dan kenapa ini penting sebelum beli saham apapun"
            content_runway: "Setiap sektor saham (perbankan, BUMN, konsumer, infrastruktur), strategi reinvestment, perbandingan dengan instrumen lain, dan pertanyaan umum tentang perpajakan dividen menghasilkan konten yang berbeda; topik ini relevan sepanjang tahun."

        - slug: investing-portofolio-milenial
          name: Portofolio Investasi untuk Milenial Indonesia
          description: Panduan alokasi portofolio yang realistis untuk milenial dengan penghasilan menengah, menggabungkan reksadana, saham, dan aset lain sesuai profil risiko.
          example_hook: "Portofolio Rp500rb/bulan yang bisa bikin kamu pensiun dini di 45..."
          guide:
            audience: "Milenial 27–38 yang sudah punya penghasilan stabil dan mulai serius soal masa depan finansial; sudah pernah coba satu dua instrumen investasi tapi belum punya strategi yang menyeluruh; ingin tahu bagaimana mengalokasikan dengan lebih cerdas."
            tone: "Strategis dan visioner — membantu penonton melihat gambaran besar sekaligus langkah konkret. Lebih serius dari konten pemula, tapi tetap accessible dan tidak berjarak."
            format: "75–90 detik. Konsep alokasi portofolio berdasarkan profil risiko → contoh alokasi konservatif, moderat, agresif → simulasi pertumbuhan 10–20 tahun → langkah review portofolio berkala. Grafik alokasi pie chart dan proyeksi pertumbuhan. Vertikal 9:16."
            boleh:
              - "Tampilkan tiga skenario alokasi (konservatif/moderat/agresif) dengan proporsi dan alasannya"
              - "Pakai simulasi jangka panjang yang realistis berdasarkan asumsi return historis rata-rata dengan disclaimer"
              - "Bahas kapan dan bagaimana merebalance portofolio secara sederhana"
              - "Sertakan aset alternatif yang populer di Indonesia (emas, properti) sebagai konteks"
            hindari:
              - "Jangan klaim portofolio tertentu 'pasti' bisa pensiun dini — bergantung banyak variabel personal"
              - "Jangan berikan alokasi spesifik sebagai 'rekomendasi investasi' tanpa disclaimer bahwa ini bukan saran keuangan profesional"
              - "Jangan abaikan bahwa setiap orang memiliki profil risiko, tujuan, dan kondisi berbeda"
              - "Jangan pakai return asumsi yang terlalu optimis tanpa mempertimbangkan inflasi dan pajak"
