version: 1
vertical:
  slug: v-teknologi
  name: Teknologi
  description: Konten teknologi — gadget, tips aplikasi, AI tools, dan coding untuk penonton tech-savvy Indonesia.
  guide:
    audience: "Penonton 18–35 tahun, dominan pria, yang aktif pakai smartphone dan tertarik perkembangan teknologi; campuran mahasiswa, profesional muda, dan freelancer yang ingin produktif dan up-to-date; penonton yang scroll sambil mencari tips praktis, bukan sekadar hiburan."
    tone: "Cerdas tapi kasual — seperti teman yang lebih ngerti teknologi menjelaskan sesuatu yang berguna. Tidak terlalu formal, tidak terlalu receh. Penonton harus merasa lebih pintar setelah menonton."
    format: "Video pendek 45–90 detik dengan dominasi screen recording atau demo langsung. Voiceover atau teks overlay wajib — konten ini butuh penjelasan singkat. Struktur: hook fakta mengejutkan → inti tips/informasi → CTA singkat. Vertikal 9:16."
    boleh:
      - "Mulai dengan fakta atau data yang mengejutkan untuk hook yang kuat"
      - "Gunakan screen recording asli — bukan animasi atau mockup yang terlihat palsu"
      - "Tampilkan sebelum-sesudah (workflow lama vs baru) untuk tips produktivitas"
      - "Sebut konteks Indonesia spesifik — harga rupiah, aplikasi populer lokal, kondisi pasar lokal"
      - "Kalimat pendek dan to-the-point — penonton tech tidak suka basa-basi"
    hindari:
      - "Jangan pakai jargon teknis berat tanpa penjelasan singkat — penonton bukan semua developer"
      - "Jangan buka dengan salam panjang atau intro channel — langsung ke hook"
      - "Jangan rekam layar dengan resolusi rendah atau UI yang ter-zoom aneh"
      - "Jangan buat klaim sensasional tanpa bukti nyata — credibility adalah aset utama channel tech"
      - "Jangan pakai musik ber-hak-cipta; pilih lo-fi instrumental yang tidak distraktif"
    pola_hook: "Detik 0–3: fakta atau klaim mengejutkan yang relevan penonton ('HP kamu nyimpan ini tanpa sepengetahuanmu' / 'Tool ini gantiin 3 aplikasi berbayar dengan gratis'). Langsung masuk demo atau bukti."
    contoh_judul:
      - "Setting HP ini wajib dimatikan sekarang, kamu belum tahu risikonya"
      - "Tool gratis ini bikin kerja yang biasanya 2 jam jadi 10 menit"
      - "Ini yang terjadi di industri tech Indonesia yang media besar tidak ceritakan"

  niches:
    - slug: tech-news
      name: "Tech / Gadget News"
      description: "Berita teknologi, bocoran gadget."
      faceless: true
      difficulty: menengah
      rpm: tinggi
      formats: screen-record + voiceover
      example_hook: "Fitur HP ini disembunyikan..."
      guide:
        audience: "Penonton 20–35 yang aktif mengikuti berita teknologi dan rilis gadget terbaru; pembaca The Verge atau TeknoJurnal versi video; tertarik pada implikasi praktis berita tech, bukan sekadar headline."
        tone: "Analitis tapi ringan. Bukan sekadar baca ulang press release — tambahkan sudut pandang dan relevansi untuk pengguna Indonesia. Seperti anchor berita tech yang punya opini."
        format: "60–90 detik. Struktur: fakta atau bocoran mengejutkan (hook) → konteks cepat → implikasi untuk penonton Indonesia → pendapat singkat presenter. Screen recording artikel atau UI produk sebagai visual. Voiceover wajib."
        boleh:
          - "Sertakan angka dan data konkret — penonton tech menghargai presisi"
          - "Tambahkan sudut pandang lokal: 'Di Indonesia, ini artinya…'"
          - "Gunakan footage atau screenshot resmi dari sumber primer sebagai visual"
          - "Format 'berita + opini singkat' lebih engaging dari sekadar reporting datar"
        hindari:
          - "Jangan hanya parafrase press release tanpa tambahan nilai atau sudut pandang"
          - "Jangan buat judul clickbait yang tidak sesuai isi — audiens tech sangat kritis"
          - "Jangan gunakan footage atau gambar yang tidak jelas sumber lisensinya"
          - "Jangan rekam berita yang sudah berumur lebih dari 3 hari tanpa angle baru"
        pola_hook: "Detik 0: tampilkan screenshot atau visual produk/berita + kalimat klaim yang mengejutkan ('Google sembunyikan fitur ini di update terakhir'). Langsung masuk penjelasan di detik 3."
        contoh_judul:
          - "Fitur HP ini sengaja disembunyikan oleh produsen, ini alasannya"
          - "Update Android terbaru hapus fitur yang dipakai jutaan orang tanpa pengumuman"
          - "Startup Indonesia ini baru dapat pendanaan, tapi model bisnisnya mengkhawatirkan"
      micro:
        - slug: tech-news-fitur-android-tersembunyi
          name: Fitur Android yang Disembunyikan di Menu Developer
          description: Showcase fitur-fitur Android yang tersembunyi di balik Developer Options atau pengaturan yang jarang dibuka, memberikan pengguna kontrol lebih atas perangkat tanpa harus root.
          example_hook: "Setting ini ada di semua HP Android tapi tersembunyi di sini, dan fungsinya sangat berguna..."
          guide:
            audience: "Pengguna Android 18–32 yang ingin memaksimalkan HP mereka; penonton yang bosan dengan pengaturan default; orang yang penasaran 'apa lagi yang bisa dilakukan HP-ku' tanpa harus beli HP baru."
            tone: "Informatif dan sedikit conspiratorial — seperti mengungkap sesuatu yang sengaja disembunyikan. Penonton harus merasa mendapat akses eksklusif ke informasi yang tidak semua orang tahu."
            format: "45–75 detik. Screen recording HP langsung (bukan emulator) — tampilkan navigasi ke Settings → Developer Options → fitur target → demo fitur aktif. Teks overlay nama fitur dan fungsinya. Vertikal 9:16."
            boleh:
              - "Tunjukkan cara mengaktifkan Developer Options di awal jika fitur ada di sana"
              - "Demo langsung perbedaan sebelum dan sesudah fitur diaktifkan"
              - "Gunakan close-up layar HP fisik jika memungkinkan — lebih autentik dari screen mirroring"
              - "Sebut merek dan versi Android yang digunakan untuk relevansi spesifik"
            hindari:
              - "Jangan tampilkan fitur yang butuh root — mayoritas penonton tidak mau root HP"
              - "Jangan skip langkah navigasi — penonton harus bisa mengikuti sendiri"
              - "Jangan gunakan device dengan UI sangat berbeda dari mayoritas HP Indonesia tanpa penjelasan"
              - "Jangan klaim semua fitur bekerja di semua HP tanpa catatan kompatibilitas"
            pola_hook: "Detik 0: tunjukkan HP dengan teks 'ada setting tersembunyi di HP kamu yang produsen tidak promosikan'. Langsung masuk navigasi di detik 3."
            contoh_judul:
              - "Setting Android ini diaktifkan developer HP tapi kamu tidak dikasih tahu"
              - "Menu tersembunyi di HP kamu bisa 2x-kan performa gaming tanpa aplikasi tambahan"
              - "Fitur Developer Options yang wajib diaktifkan pengguna Android berpengalaman"
              - "HP kamu rekam layar tanpa aplikasi pihak ketiga, begini cara aktifkannya"
              - "3 pengaturan Android ini bikin baterai tahan 30% lebih lama, tersembunyi di sini"
            content_runway: "Setiap versi Android baru membawa fitur tersembunyi baru; perbedaan antar merek (Samsung, Xiaomi, OPPO, Vivo) menghasilkan video spesifik per brand; kombinasi use-case (gaming, baterai, privasi, performa) hampir tidak terbatas."

        - slug: tech-news-startup-indonesia-gagal
          name: Startup Teknologi Indonesia yang Tutup Tahun Ini
          description: Liputan singkat startup teknologi Indonesia yang baru saja tutup atau pivot drastis, dengan analisis cepat apa yang salah — bukan gosip tapi pelajaran industri yang berguna.
          example_hook: "Startup ini baru raih pendanaan Seri A, 8 bulan kemudian tutup. Ini yang terjadi..."
          guide:
            audience: "Profesional muda 22–38 yang bekerja di atau tertarik dengan ekosistem startup Indonesia; founder pemula yang ingin belajar dari kegagalan orang lain; penonton yang skeptis terhadap hype startup."
            tone: "Analitis dan empatik — bukan menghakimi tapi belajar. Faktual, berbasis data publik, dan berikan konteks industri yang membuat kegagalan masuk akal secara struktural."
            format: "75–90 detik. Struktur: fakta penutupan (hook dengan angka) → kronologi singkat (founding → funding → pivot/tutup) → analisis 2–3 faktor kegagalan → takeaway untuk penonton. Voiceover dengan visual logo startup dan screenshot berita. Vertikal 9:16."
            boleh:
              - "Gunakan data publik yang bisa diverifikasi — funding round, tanggal, angka pengguna"
              - "Sebut industri sejenis yang berhasil sebagai kontras untuk analisis lebih dalam"
              - "Format 'timeline collapse' sangat efektif untuk konten ini — visual yang mudah dipahami"
              - "Akhiri dengan satu insight yang bisa diterapkan oleh founder atau profesional yang menonton"
            hindari:
              - "Jangan buat spekulasi tanpa bukti atau sumber yang bisa diverifikasi"
              - "Jangan bernada schadenfreude — kegagalan startup adalah pelajaran berharga, bukan hiburan"
              - "Jangan bahas startup yang kasusnya sedang dalam proses hukum aktif tanpa legal disclaimer"
              - "Jangan hanya daftar fakta tanpa analisis — penonton ingin tahu 'kenapa', bukan hanya 'apa'"
            pola_hook: "Detik 0: logo startup + angka funding yang diraih + teks 'tutup X bulan kemudian'. Kontras angka ini adalah hook utamanya."
            contoh_judul:
              - "Startup ini dapat Rp50M funding, tutup dalam 8 bulan — ini yang salah"
              - "Kenapa super-app Indonesia selalu gagal padahal idenya bagus?"
              - "Startup unicorn ini ternyata membakar uang dengan cara yang tidak masuk akal"
              - "Tiga startup Indonesia yang pivot drastis tahun ini dan alasan di baliknya"
              - "Founder startup ini jujur ceritakan kenapa perusahaannya tutup — langka dan penting"
            content_runway: "Ekosistem startup Indonesia sangat aktif dengan ratusan perusahaan yang berdiri dan tutup setiap tahun; setiap sektor (fintech, edtech, healthtech, agritech) menghasilkan pelajaran berbeda; siklus funding dan krisis ekonomi global menciptakan gelombang kegagalan yang berulang."

        - slug: tech-news-ai-gantikan-pekerjaan
          name: Pekerjaan yang Sudah Mulai Digantikan AI di Indonesia
          description: Laporan konkret tentang profesi di Indonesia yang sudah mulai terdampak otomasi dan AI — bukan prediksi spekulatif tapi kasus nyata yang sedang terjadi — untuk penonton yang ingin antisipasi.
          example_hook: "3 profesi ini sudah mulai kehilangan pekerjaan di Indonesia karena AI, ini datanya..."
          guide:
            audience: "Profesional 22–40 yang khawatir dampak AI pada karir mereka; fresh graduate yang memilih jurusan atau pekerjaan pertama; penonton yang ingin tahu harus pivot ke mana sebelum terlambat."
            tone: "Realistis dan berdaya — bukan alarmis. Sajikan fakta dengan dingin tapi akhiri dengan informasi yang memberdayakan penonton untuk mengambil tindakan, bukan panik."
            format: "75–90 detik. Struktur: data atau kasus konkret di Indonesia (hook) → 2–3 profesi yang terdampak dengan contoh nyata → apa yang belum bisa digantikan → satu langkah antisipasi konkret. Voiceover dengan infografis sederhana atau screen recording data. Vertikal 9:16."
            boleh:
              - "Gunakan data dari sumber Indonesia yang bisa dikutip — BPS, laporan konsultan lokal, berita bisnis"
              - "Tampilkan contoh spesifik — nama perusahaan yang sudah mengimplementasi AI pengganti pekerja"
              - "Bedakan 'pekerjaan yang hilang' vs 'pekerjaan yang bertransformasi' — nuansa ini penting"
              - "Akhiri dengan skill yang justru makin bernilai — penonton butuh arah positif"
            hindari:
              - "Jangan gunakan data global yang tidak relevan untuk konteks Indonesia"
              - "Jangan buat konten yang memperparah kecemasan tanpa memberikan jalan keluar"
              - "Jangan klaim AI akan gantikan 'semua pekerjaan' — oversimplifikasi yang tidak akurat"
              - "Jangan sebut nama individu yang kehilangan pekerjaan tanpa izin atau sumber publik"
            pola_hook: "Detik 0: angka konkret (berapa pekerja terdampak, di sektor apa) + teks 'ini bukan prediksi, ini sudah terjadi'. Data spesifik Indonesia lebih powerful dari klaim global."
            contoh_judul:
              - "3 profesi Indonesia ini sudah mulai digantikan AI — ini datanya, bukan prediksi"
              - "Perusahaan ini PHK 200 karyawan dan ganti dengan AI, ini yang terjadi"
              - "Customer service berbahasa Indonesia sudah bisa digantikan AI, ini buktinya"
              - "Skill ini yang bikin kamu tidak tergantikan AI dalam 5 tahun ke depan"
              - "Designer grafis Indonesia sudah merasakan dampak AI image generation, ini ceritanya"
            content_runway: "Setiap industri (perbankan, retail, logistik, media, hukum) menghasilkan angle berbeda; setiap tools AI baru yang dirilis membuka angle liputan baru; dampak AI berkembang setiap bulan sehingga konten selalu relevan diperbarui."

    - slug: app-tips
      name: "Tips Aplikasi"
      description: "Trik aplikasi, hidden feature."
      faceless: true
      difficulty: pemula
      rpm: tinggi
      formats: screen-record + caption
      example_hook: "Setting WhatsApp ini wajib kamu matiin..."
      guide:
        audience: "Pengguna smartphone 18–40 yang aktif pakai aplikasi sehari-hari tapi tidak mengeksplor pengaturan di balik permukaan; penonton yang ingin produktif tapi tidak mau baca manual; semua level tech literacy."
        tone: "Langsung dan praktis. Seperti teman yang iseng nemuin fitur keren dan langsung share. Tidak perlu explain background panjang — langsung ke manfaat dan cara lakukannya."
        format: "30–60 detik. Screen recording langsung dari HP (bukan emulator). Struktur: tunjukkan masalah atau fakta yang hilang (hook) → navigasi ke pengaturan atau fitur → demo manfaat langsung → CTA. Teks overlay di setiap langkah navigasi. Vertikal 9:16."
        boleh:
          - "Rekam navigasi real-time yang bisa diikuti penonton secara langsung"
          - "Tampilkan 'sebelum' (masalah yang umum dialami) sebelum reveal solusinya"
          - "Fokus pada satu tips per video — jangan campur banyak tips yang mengencerkan nilai"
          - "Gunakan versi aplikasi yang paling umum dipakai di Indonesia"
        hindari:
          - "Jangan rekam dengan resolusi layar rendah atau teks yang tidak terbaca"
          - "Jangan buat tutorial yang butuh langkah lebih dari 5 — terlalu kompleks untuk format pendek"
          - "Jangan gunakan aplikasi berbayar atau premium tanpa menyebutkan statusnya"
          - "Jangan asumsikan penonton punya OS atau versi aplikasi tertentu tanpa disclaimer"
        pola_hook: "Detik 0: tampilkan masalah umum yang penonton sering alami ('kamu sering gini di WhatsApp?') atau klaim mengejutkan ('setting ini diam-diam lacak kamu'). Langsung masuk ke navigasi."
        contoh_judul:
          - "Setting ini di WhatsApp kamu kasih tahu orang asing kapan kamu online"
          - "Fitur Google Maps ini bekerja tanpa internet, 99% orang tidak tahu"
          - "Shortcut keyboard ini hemat 1 jam kerja setiap hari, coba sekarang"
      micro:
        - slug: app-tips-whatsapp-privasi
          name: Setting WhatsApp yang Melindungi Privasi Kamu
          description: Panduan konfigurasi privasi WhatsApp yang sering diabaikan — siapa yang bisa lihat foto profil, status online, dan last seen — dengan penjelasan risiko jika dibiarkan default.
          example_hook: "Setting WhatsApp ini membiarkan orang asing tahu kapan kamu online, matikan sekarang..."
          guide:
            audience: "Pengguna WhatsApp 17–45 dari semua kalangan — hampir semua pengguna smartphone Indonesia; khususnya yang pernah merasa risih karena orang tidak dikenal bisa melihat statusnya atau menghubungi kapan saja."
            tone: "Sedikit alarm tapi solutif — bukan paranoia, tapi kesadaran. Penonton harus merasa perlu bertindak sekarang, bukan 'nanti'."
            format: "45–60 detik. Screen recording WhatsApp asli di HP. Navigasi: Settings → Privacy → setiap pengaturan penting ditampilkan satu per satu dengan penjelasan risiko + rekomendasi setting. Teks overlay di setiap step. Vertikal 9:16."
            boleh:
              - "Tampilkan setting default (yang berisiko) sebelum rekomendasi — kontras membangun urgensi"
              - "Jelaskan risiko konkret untuk tiap setting dalam satu kalimat singkat"
              - "Urutkan dari yang paling berisiko ke paling rendah untuk prioritas penonton"
              - "Sertakan tips bonus: 'Blocked contacts' dan 'Fingerprint lock' jika durasi masih ada"
            hindari:
              - "Jangan buat penonton panik berlebihan — framing harus memberdayakan, bukan menakut-nakuti"
              - "Jangan bahas pengaturan yang butuh akses root atau pihak ketiga"
              - "Jangan rekam dengan notifikasi chat nyata yang bisa terlihat — lindungi privasi sendiri"
              - "Jangan gunakan versi WhatsApp Business sebagai demo utama jika target adalah pengguna personal"
            pola_hook: "Detik 0: buka WhatsApp → Settings → Privacy dan tampilkan setting 'Everyone' yang default aktif + teks 'siapa saja bisa lihat ini'. Langsung jelaskan risikonya."
            contoh_judul:
              - "Setting WhatsApp ini membiarkan siapa saja tahu kapan kamu online — matikan sekarang"
              - "Foto profil WhatsApp kamu bisa dilihat semua orang termasuk nomor yang tidak tersimpan"
              - "5 pengaturan privasi WhatsApp yang wajib diubah dari default hari ini"
              - "Kenapa kamu dapat panggilan spam di WhatsApp dan cara menghentikannya"
              - "Last seen kamu bisa tersembunyi dari semua orang tapi tetap lihat punya orang lain — ini caranya"
            content_runway: "WhatsApp rutin update fitur privasi baru; setiap update besar menghasilkan video baru; platform alternatif (Telegram, Signal) menghasilkan angle perbandingan; isu privasi digital terus berkembang dan selalu relevan di Indonesia."

        - slug: app-tips-google-maps-offline
          name: Fitur Google Maps yang Berguna Saat Tidak Ada Sinyal
          description: Tutorial fitur offline dan tersembunyi Google Maps yang sangat berguna saat traveling ke daerah sinyal lemah Indonesia, termasuk download peta dan navigasi tanpa internet.
          example_hook: "Di daerah tanpa sinyal ini, Google Maps masih bisa navigasi karena setting ini..."
          guide:
            audience: "Pengguna 20–40 yang sering traveling ke daerah-daerah sinyal lemah di Indonesia; pengemudi ojol atau delivery yang butuh navigasi andal; penonton yang pernah tersesat karena Maps mati saat tidak ada sinyal."
            tone: "Praktis dan berpengalaman — seperti tips dari traveler veteran yang sudah sering ke daerah terpencil. Penonton harus merasa 'kenapa aku baru tahu ini sekarang'."
            format: "50–70 detik. Screen recording Google Maps di HP. Demo langsung: cara download area offline, cara gunakan saat airplane mode, fitur-fitur yang tetap berfungsi offline. Tampilkan airplane mode aktif sebagai bukti. Vertikal 9:16."
            boleh:
              - "Demo dengan airplane mode aktif saat menunjukkan navigasi offline — bukti visual yang kuat"
              - "Tampilkan estimasi ukuran file download peta agar penonton bisa persiapkan storage"
              - "Tunjukkan batas area yang bisa di-download dan cara pilih area yang optimal"
              - "Tambahkan tips bonus: 'pin lokasi sebelum berangkat' untuk antisipasi tanpa sinyal"
            hindari:
              - "Jangan rekam dengan koneksi internet aktif saat demo offline — penonton harus tahu ini benar-benar offline"
              - "Jangan gunakan versi Maps yang berbeda jauh dari versi yang umum di Indonesia"
              - "Jangan skip langkah cara update peta offline — peta kedaluwarsa bisa sesat"
              - "Jangan klaim semua fitur Maps tersedia offline — beberapa fitur (live traffic, Street View) tidak"
            pola_hook: "Detik 0: tampilan HP di daerah sinyal nol bar + Google Maps yang tetap bisa navigasi + teks 'sinyal tidak ada, Maps tetap jalan — ini caranya'. Langsung masuk tutorial."
            contoh_judul:
              - "Google Maps tetap navigasi tanpa sinyal internet sama sekali — ini cara setupnya"
              - "Download peta offline ini sebelum liburan ke daerah sinyal lemah Indonesia"
              - "Fitur Maps ini yang bikin aku tidak pernah tersesat di daerah terpencil"
              - "Cara simpan lokasi offline di Google Maps yang bekerja di airplane mode"
              - "Maps tanpa kuota — fitur ini sudah ada di HP kamu tapi belum pernah diaktifkan"
            content_runway: "Setiap daerah Indonesia dengan karakteristik sinyal berbeda menghasilkan konteks berbeda; update Google Maps rutin menambah fitur baru; tips serupa bisa dibuat untuk Waze, Here Maps, dan aplikasi navigasi lokal; musim liburan selalu menghadirkan relevansi konten perjalanan."

        - slug: app-tips-shortcuts-produktivitas
          name: Shortcut Aplikasi Produktivitas yang Hemat 1 Jam Sehari
          description: Kumpulan shortcut keyboard dan gesture di aplikasi produktivitas populer — Notion, Google Docs, Gmail — yang pengguna rutin pun jarang ketahui tapi signifikan menghemat waktu.
          example_hook: "Shortcut ini ada di aplikasi yang kamu buka setiap hari, dan aku hemat 45 menit per hari karenanya..."
          guide:
            audience: "Profesional dan mahasiswa 20–35 yang pakai aplikasi produktivitas setiap hari tapi bekerja lebih lambat dari seharusnya; penonton yang ingin jadi power user tanpa belajar dari nol; freelancer yang waktu adalah uang."
            tone: "Efisien dan terkejut menyenangkan — penonton harus merasakan 'aku buang-buang waktu selama ini'. Setiap shortcut yang ditampilkan harus terasa seperti cheat code yang langsung applicable."
            format: "45–75 detik. Screen recording desktop atau tablet (shortcut keyboard lebih relevan di layar besar). Tampilkan 3–5 shortcut paling impactful per video. Setiap shortcut: demo masalah lama → demo shortcut → tampilkan waktu yang dihemat. Vertikal 9:16 dengan pilihan landscape untuk readability."
            boleh:
              - "Tampilkan keystroke di layar (key overlay) sehingga penonton tahu persis tombol yang ditekan"
              - "Hitung atau estimasi waktu yang dihemat per shortcut — angka konkret sangat persuasif"
              - "Fokus pada aplikasi paling umum di Indonesia: Google Workspace, Notion, Microsoft Office"
              - "Format 'challenge' — 'coba lakukan ini tanpa shortcut, berapa detiknya?' — sangat engaging"
            hindari:
              - "Jangan campurkan shortcut Mac dan Windows tanpa label yang jelas — konfus"
              - "Jangan tampilkan shortcut yang hanya berlaku di versi Pro atau berbayar tanpa keterangan"
              - "Jangan buat video yang terlalu panjang dengan terlalu banyak shortcut — fokus 3–5 terbaik"
              - "Jangan rekam di layar yang penuh file sensitif atau notifikasi pribadi"
            pola_hook: "Detik 0: tampilkan cara lama yang lambat melakukan sesuatu (misal: klik menu → klik → klik) + teks 'kamu masih lakukan ini?'. Langsung demo shortcut di detik 3 dan tunjukkan perbedaan waktu."
            contoh_judul:
              - "Shortcut Notion ini bikin navigasi 5x lebih cepat, kenapa tidak diajarkan dari awal"
              - "Gmail punya 30 keyboard shortcut yang hemat 40 menit kerja sehari — ini 5 yang wajib"
              - "Google Docs bisa lakukan ini dengan satu tombol dan aku baru tahu bulan ini"
              - "Cara select teks di HP ini 10x lebih cepat dari yang biasa kamu lakukan"
              - "Shortcut Copy-Paste yang lebih dari sekadar Ctrl+C — ada versi yang jauh lebih powerful"
            content_runway: "Setiap aplikasi produktivitas populer punya puluhan shortcut; setiap update aplikasi menambah shortcut baru; kombinasi aplikasi dan use-case (pelajar, freelancer, HRD, akuntan) menciptakan angle berbeda yang hampir tidak ada habisnya."

    - slug: ai-tools
      name: "AI Tools"
      description: "Review/tutorial tools AI terbaru."
      faceless: true
      difficulty: menengah
      rpm: tinggi
      formats: screen-record + voiceover
      example_hook: "5 tools AI yang bikin kerjamu 10x..."
      guide:
