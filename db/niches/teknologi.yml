            audience: "Pengguna smartphone 16–35 yang belanja aksesoris di marketplace Indonesia; pelajar dan mahasiswa yang harus bijak dengan budget; penonton yang bingung pilih dari ratusan pilihan murah di Shopee."
            tone: "Consumer advocate — seperti teman yang rajin research sebelum beli dan mau share hasilnya. Jujur tentang mana yang 'surprisingly good' dan mana yang 'kelihatan bagus di foto doang'."
            format: "60–75 detik. Close-up fisik produk yang jelas. Struktur: produk mahal sebagai referensi → produk murah yang diuji → test konkret (charging speed, drop test ringan, audio test) → comparison → verdict + rekomendasi beli di mana. Vertikal 9:16."
            boleh:
              - "Gunakan alat pengukur yang terlihat di frame — ammeter, stopwatch, decibel meter — sebagai bukti"
              - "Tampilkan packaging dan build quality yang sering beda jauh dari foto marketplace"
              - "Sebut link atau keyword pencarian di marketplace untuk memudahkan penonton"
              - "Format 'best of' (charger, kabel, casing, earphone) per video menghasilkan seri konten"
            hindari:
              - "Jangan review produk yang tidak bisa diverifikasi safety-nya — bahaya charger palsu nyata"
              - "Jangan tampilkan merek atau toko tanpa disclosure jika ada kerjasama komersial"
              - "Jangan buat kesan semua produk murah bagus — beberapa memang buruk dan harus dikatakan"
              - "Jangan lupa sebut tanggal review karena produk marketplace berubah model tanpa pemberitahuan"
            pola_hook: "Detik 0: close-up charger murah di sebelah charger original + teks 'yang ini Rp50rb, yang ini Rp500rb — mana yang lebih aman di test ini'. Langsung masuk pengujian."
            contoh_judul:
              - "Charger Rp50rb di Shopee ini aku uji keamanannya — hasilnya bikin kaget"
              - "5 aksesoris HP terbaik di bawah Rp200rb yang aku pakai setiap hari"
              - "Kabel data Rp15rb vs Rp200rb — perbedaan charging speed-nya segini"
              - "Casing Rp20rb ini ternyata punya proteksi yang tidak kalah dari yang Rp150rb"
              - "Earphone true wireless Rp150rb ini aku blind test dan hasilnya mengubah pandanganku"
            content_runway: "Marketplace Indonesia dirilis ribuan produk aksesoris baru setiap bulan; setiap kategori aksesoris (charger, kabel, casing, earphone, powerbank, mount) butuh review berbeda; momen kampanye belanja (Harbolnas, Lebaran, Back to School) menciptakan urgensi konten yang berulang."

        - slug: gadget-review-laptop-second-worth
          name: Laptop Second Berapa yang Masih Layak Dibeli
          description: Panduan membeli laptop bekas dengan benchmark yang jelas — usia maksimal, spec minimum per harga, dan cara cek kondisi fisik — untuk mahasiswa yang harus memilih laptop dengan budget terbatas.
          example_hook: "Di bawah budget ini, laptop baru tidak ada yang worth it. Ini alternatif second yang lebih baik..."
          guide:
            audience: "Mahasiswa dan fresh graduate 18–25 yang harus beli laptop dengan budget ketat; orang tua yang carikan laptop untuk anak kuliah; penonton yang frustrasi dengan pilihan laptop baru di bawah Rp5 juta."
            tone: "Advisor yang berpihak pada pembeli — bukan dealer. Jujur tentang risiko beli second, tapi juga jujur bahwa untuk budget tertentu second adalah pilihan rasional yang lebih baik dari baru yang underpowered."
            format: "75–90 detik. Demo fisik laptop second yang sedang diinspeksi. Struktur: argumen kenapa second kadang lebih rasional (hook dengan perbandingan spec) → checklist inspeksi visual dan fungsional → benchmark singkat → rekomendasi budget range per use-case. Vertikal 9:16."
            boleh:
              - "Tampilkan checklist inspeksi yang bisa dilakukan siapapun tanpa keahlian teknis"
              - "Gunakan benchmark yang konkret dan mudah dipahami — bukan hanya angka teknis"
              - "Sebut toko atau platform second yang terpercaya di Indonesia dengan tips red flag"
              - "Sertakan skenario penggunaan per budget — pelajar, desainer pemula, programmer"
            hindari:
              - "Jangan rekomendasikan laptop dengan usia sangat tua yang baterainya tidak bisa bertahan"
              - "Jangan abaikan risiko tidak ada garansi — harus disebutkan sebagai tradeoff nyata"
              - "Jangan buat generalisasi merek tertentu tanpa data yang cukup"
              - "Jangan sebut toko tertentu tanpa disclosure jika ada kerjasama atau afiliasi"
            pola_hook: "Detik 0: tampilkan spec laptop baru Rp4jt yang rendah di sebelah spec laptop second harga sama yang jauh lebih tinggi + teks 'dengan budget ini, second jauh lebih masuk akal'. Langsung masuk penjelasan."
            contoh_judul:
              - "Budget Rp3–5 juta untuk laptop? Ini kenapa second lebih masuk akal dari baru"
              - "Cara cek kondisi laptop second sebelum beli agar tidak tertipu — checklist lengkap"
              - "ThinkPad second Rp2,5jt vs laptop baru Rp4jt untuk mahasiswa — mana yang menang?"
              - "Laptop second ini aku beli Rp2jt dan masih lebih kencang dari laptop teman yang beli baru Rp5jt"
              - "Red flag yang harus kamu hindari saat beli laptop second di Tokopedia atau offline"
            content_runway: "Setiap generasi prosesor baru menggeser value proposition laptop second; setiap segment (gaming, desain, programming, perkantoran) butuh rekomendasi berbeda; kondisi pasar second Indonesia sangat aktif dengan variasi merek dan model yang luas."

        - slug: gadget-review-earphone-lokal
          name: Earphone Brand Lokal yang Bersaing dengan JBL
          description: Review komparatif earphone buatan Indonesia atau brand Asia yang kurang dikenal melawan brand besar pada rentang harga yang sama, membongkar apakah harga brand premium selalu justified.
          example_hook: "Earphone Rp150rb ini aku test blind dengan earphone Rp600rb, hasilnya mengejutkan..."
          guide:
            audience: "Konsumen musik dan konten 17–35 yang butuh earphone tapi tidak mau bayar brand premium; penonton yang curiga brand lokal atau unknown bisa lebih bagus dari yang branded; pelajar yang anggaran untuk audio terbatas."
            tone: "Investigatif dan fair — seperti consumer report yang tidak memihak brand besar atau kecil. Penonton harus percaya test-nya objektif karena metodologinya transparan."
            format: "60–80 detik. Close-up fisik kedua earphone. Demo: masukkan audio yang sama, rekam output, bandingkan frekuensi. Blind test dengan teks overlay hasil voting. Verdict berdasarkan value-for-money, bukan sekedar kualitas absolut. Vertikal 9:16."
            boleh:
              - "Gunakan blind test methodology yang jelas dan bisa diverifikasi"
              - "Tampilkan berat, build quality, dan aksesori yang disertakan sebagai faktor value"
              - "Tes aspek yang relevan untuk pengguna Indonesia: durability di cuaca panas dan lembab"
              - "Sertakan earphone lokal buatan Indonesia jika ada yang relevan untuk mendorong industri lokal"
            hindari:
              - "Jangan buat test yang tidak bisa direplikasi atau terlihat sudah tahu hasilnya"
              - "Jangan hanya bandingkan suara tanpa mempertimbangkan durability dan value keseluruhan"
              - "Jangan gunakan sample produk yang tidak representatif dari produk yang dijual di pasaran"
              - "Jangan rekomendasikan produk yang tidak tersedia di marketplace Indonesia"
            pola_hook: "Detik 0: dua earphone berdampingan + harga masing-masing terlihat jelas + teks 'aku tidak bisa bedakan suaranya dalam blind test'. Langsung masuk metodologi test."
            contoh_judul:
              - "Earphone Rp150rb ini aku blind test lawan JBL Rp600rb dan hasilnya mengejutkan"
              - "Brand earphone Malaysia ini lebih bagus dari Sony di harga yang sama — ini testnya"
              - "Earphone Indonesia ini dapat rating lebih tinggi dari JBL dalam blind test 20 orang"
              - "Kenapa kamu bayar mahal untuk nama brand earphone kalau ini ada"
              - "True wireless Rp200rb vs Rp800rb — test ANC, baterai, dan suara selama 2 minggu"
            content_runway: "Pasar earphone sangat aktif dengan ratusan model baru setiap bulan; setiap kategori (wired, TWS, ANC, gaming, sport) butuh review berbeda; brand Asia (Moondrop, KZ, Soundcore, Edifier) terus meluncurkan produk baru yang menarik untuk diuji."

    - slug: product-review
      name: "Product Review"
      description: "Review produk konsumen dengan perbandingan harga dan performa untuk keputusan beli."
      faceless: true
      difficulty: menengah
      rpm: tinggi
      formats: unboxing + demo + voiceover
      example_hook: "Produk viral ini worth it atau cuma hype?"
      guide:
        audience: "Konsumen Indonesia 20–40 yang aktif belanja online dan terpengaruh review sebelum beli; penonton yang capek dengan review endorsement berbayar yang tidak objektif; pembeli yang ingin second opinion jujur sebelum checkout."
        tone: "Jujur dan tidak bisa dibeli. Penonton harus bisa membedakan konten ini dari iklan. Kalimat 'ini kekurangannya' dan 'ini yang lebih baik' adalah nilai utama — bukan hanya pujian."
        format: "60–90 detik. Unboxing cepat + demo langsung dalam kondisi penggunaan nyata. Struktur: hype vs realita (hook) → test konkret → kelebihan nyata + kelemahan yang jujur → verdict siapa yang cocok beli / tidak perlu beli. Voiceover wajib. Vertikal 9:16."
        boleh:
          - "Lakukan uji coba nyata yang relevan untuk penonton Indonesia — kondisi cuaca, kebiasaan lokal"
          - "Bandingkan dengan kompetitor atau alternatif yang lebih murah secara langsung"
          - "Verdict harus spesifik siapa yang cocok dan tidak cocok — bukan 'tergantung kebutuhan' yang samar"
          - "Sebut harga teraktual di marketplace Indonesia saat review dibuat"
        hindari:
          - "Jangan sembunyikan kelemahan produk atau framing kelemahan sebagai 'hanya masalah kecil'"
          - "Jangan review produk yang tidak bisa diuji dalam kondisi penggunaan nyata"
          - "Jangan buat konten yang tidak bisa dibedakan dari iklan berbayar tanpa disclosure"
          - "Jangan abaikan aspek safety untuk produk konsumsi (suplemen, peralatan listrik, dll.)"
        pola_hook: "Detik 0: tampilkan klaim iklan yang besar atau hype media sosial + teks 'aku beli dan uji ini selama X hari, ini yang sebenarnya terjadi'. Penonton yang sedang pertimbangkan beli produk ini langsung tertarik."
        contoh_judul:
          - "Produk viral ini aku beli dan test 2 minggu — jauh dari yang dijanjikan iklannya"
          - "Skincare lokal Rp80rb ini aku bandingkan dengan Korea Rp300rb — ini hasilnya"
          - "Alat masak viral Shopee ini aku test masak nyata — worth it atau cuma bagus di video?"
      micro:
        - slug: product-review-skincare-lokal-vs-impor
          name: Skincare Lokal vs Impor Harga Sama — Mana yang Menang?
          description: Perbandingan head-to-head produk skincare lokal Indonesia dengan produk impor pada rentang harga yang sama, menggunakan pengujian nyata bukan sekadar baca kandungan.
          example_hook: "Serum lokal Rp80rb ini aku bandingkan dengan serum Korea Rp90rb selama 4 minggu, ini hasilnya..."
          guide:
            audience: "Perempuan dan pria 18–35 yang aktif pakai skincare; penonton yang ingin tahu apakah produk lokal worth it dibanding impor; konsumen yang peduli kandungan tapi tidak punya waktu riset panjang."
            tone: "Empiris dan relatable — seperti teman yang sungguh-sungguh test selama beberapa minggu dan mau cerita hasilnya. Tidak terlalu saintifik tapi juga bukan sekadar kesan pertama."
            format: "60–80 detik. Side-by-side produk + usage log singkat. Struktur: profil kulit penguji (untuk relevansi) → kandungan utama yang dibandingkan → hasil setelah X minggu dengan foto progress jika ada → verdict berdasarkan value → rekomendasi untuk jenis kulit tertentu. Vertikal 9:16."
            boleh:
              - "Tampilkan foto atau close-up kulit sebagai bukti perubahan yang bisa dilihat"
              - "Bandingkan kandungan kunci secara singkat — bukan chemistry lecture, tapi konteks yang cukup"
              - "Sertakan informasi BPOM untuk produk lokal — relevan untuk penonton Indonesia"
              - "Sebut jenis kulit penguji untuk membantu penonton yang kulitnya serupa"
            hindari:
              - "Jangan buat klaim medis atau dermatologi tanpa disclaimer bahwa ini bukan saran dokter"
              - "Jangan tampilkan gambar kulit yang mungkin sensitif tanpa warning"
              - "Jangan review produk yang tidak bisa didapat secara luas di Indonesia"
              - "Jangan abaikan faktor eksternal yang mempengaruhi hasil (cuaca, diet, stress) tanpa menyebutnya"
            pola_hook: "Detik 0: dua produk berdampingan dengan harga terlihat jelas + teks 'aku pakai keduanya 4 minggu — ini yang benar-benar lebih baik'. Langsung masuk perbandingan."
            contoh_judul:
              - "Serum lokal Rp80rb vs Korea Rp90rb — aku pakai keduanya 4 minggu dan ini yang menang"
              - "Skincare Indonesia ini ternyata mengalahkan brand Korea di kategori ini"
              - "Kenapa aku berhenti beli serum Korea setelah coba produk lokal Rp75rb ini"
              - "Kandungan Niacinamide di produk lokal dan impor ini berbeda signifikan — ini pengaruhnya"
              - "Moisturizer Indonesia vs Jepang untuk kulit berminyak — 30 hari test, ini hasilnya"
            content_runway: "Setiap kategori skincare (cleanser, toner, serum, moisturizer, SPF) menghasilkan video terpisah; industri skincare lokal Indonesia berkembang sangat pesat dengan brand baru setiap bulan; tren ingredient baru (bakuchiol, centella, snail mucin) menciptakan angle baru secara berulang."

        - slug: product-review-peralatan-dapur-murah
          name: Peralatan Dapur Viral Shopee — Worth It atau Tidak?
          description: Review jujur peralatan dapur yang sedang viral di Shopee dan TikTok Indonesia — apakah sesuai klaim iklan atau hanya bagus di video — dengan uji coba nyata di dapur.
          example_hook: "Alat masak ini 50.000 terjual bulan ini di Shopee, aku beli dan ini yang sebenarnya terjadi..."
          guide:
            audience: "Ibu rumah tangga dan penghuni kos 20–45 yang sering tergoda beli alat dapur viral; penonton yang pernah beli produk viral dan kecewa; siapapun yang sebelum checkout Shopee butuh second opinion jujur."
            tone: "Consumer champion — campuran skeptis dan terbuka. Penonton harus merasa reviewer tidak ingin produknya bagus atau jelek, tapi sungguh ingin tahu faktanya. Kadang produk viral memang bagus, kadang tidak."
            format: "60–80 detik. Demo langsung di dapur nyata bukan studio. Struktur: klaim iklan atau video viral (hook) → unboxing singkat → test masak nyata → hasil vs klaim → verdict + siapa yang cocok dan tidak cocok beli. Vertikal 9:16."
            boleh:
              - "Tampilkan screenshot iklan atau video viral aslinya sebagai referensi klaim"
              - "Test dalam kondisi dapur nyata — bukan setup sempurna yang tidak realistis"
              - "Bandingkan dengan alat dapur yang sudah ada — apakah benar-benar lebih baik?"
              - "Tunjukkan proses pembersihan — sering diabaikan tapi sangat relevan untuk produk dapur"
            hindari:
              - "Jangan review produk yang potensi bahayanya tinggi tanpa prosedur safety yang terlihat"
              - "Jangan buat review yang terlihat dipesan untuk positif atau negatif — objektivitas adalah nilainya"
              - "Jangan gunakan bahan masakan yang tidak umum di Indonesia untuk demo — tidak relevan"
              - "Jangan abaikan durability — kesan pertama berbeda dengan ketahanan jangka panjang"
            pola_hook: "Detik 0: tampilkan screenshot jumlah terjual di Shopee ('50 ribu terjual bulan ini') + teks 'aku beli untuk cari tahu kenapa'. Langsung masuk ke unboxing."
            contoh_judul:
              - "Alat masak ini 50 ribu terjual di Shopee bulan ini — aku test dan ini yang terjadi"
              - "Wajan viral TikTok yang katanya anti lengket sehebat itu — aku uji 2 minggu"
              - "Rice cooker mini Rp100rb yang viral — layak beli atau cuma bagus di foto?"
              - "Chopper sayur Rp60rb ini yang bikin konten food prep mudah — tapi ada catatan penting"
              - "Alat masak viral ini iklannya sempurna, realitanya ini setelah sebulan pemakaian"
            content_runway: "Setiap minggu ada produk dapur baru yang viral di marketplace Indonesia; musim-musim tertentu (Ramadan, Lebaran, akhir tahun) memunculkan gelombang produk baru; setiap kategori dapur (memasak, menyimpan, membersihkan) menghasilkan video terpisah."

        - slug: product-review-suplemen-populer
          name: Suplemen Paling Laris Indonesia — Mana yang Benar-benar Kerja?
          description: Review berbasis sains terhadap suplemen populer Indonesia — vitamin C dosis tinggi, collagen, dan omega-3 — dengan penjelasan apakah klaim marketing-nya sesuai riset aktual.
          example_hook: "Suplemen ini iklannya ada di mana-mana, tapi riset bilang efeknya ini..."
          guide:
            audience: "Konsumen suplemen 22–45 yang menghabiskan puluhan hingga ratusan ribu per bulan untuk suplemen dan belum yakin apakah efektif; penonton yang ingin keputusan beli berdasarkan fakta, bukan iklan artis; mereka yang skeptis tapi terbuka pada bukti."
            tone: "Science-based tapi accessible — seperti teman yang sempat baca risetnya dan mau cerita singkat yang jujur. Tidak alarmis, tidak dismissive. Klaim yang didukung riset diterima; yang tidak punya bukti cukup dibilang apa adanya."
            format: "75–90 detik. Close-up produk + tampilkan packaging klaim. Struktur: klaim marketing yang besar (hook) → apa yang riset aktual katakan (3 poin sederhana) → konteks dosis dan kondisi yang membuat suplemen bekerja → verdict siapa yang benar-benar perlu vs siapa yang mungkin buang uang. Vertikal 9:16."
            boleh:
              - "Kutip sumber riset yang bisa diverifikasi — bukan harus full citation tapi sebut journal atau institusinya"
              - "Tunjukkan perbedaan antara klaim marketing dan klaim yang didukung riset secara visual"
              - "Sertakan konteks penting — kondisi kekurangan, dosis efektif, cara konsumsi yang benar"
              - "Rekomendasikan kapan suplemen benar-benar diperlukan vs kapan bisa dari makanan saja"
            hindari:
              - "Jangan buat klaim medis yang menggantikan saran dokter — disclaimer wajib"
              - "Jangan review suplemen yang klaim kesehatan berlebihan tanpa izin BPOM Indonesia"
              - "Jangan oversimplifikasi riset yang kompleks sampai pesannya salah"
              - "Jangan rekomendasikan dosis spesifik tanpa menyarankan konsultasi profesional"
            pola_hook: "Detik 0: tampilkan iklan atau klaim marketing suplemen yang besar + teks 'ini yang riset sebenarnya katakan tentang klaim ini'. Kontras antara klaim besar dan realita riset adalah hook-nya."
            contoh_judul:
              - "Vitamin C dosis tinggi yang diminum jutaan orang Indonesia — riset bilang ini efeknya"
              - "Collagen drink yang iklannya ada di mana-mana — ini yang sains katakan sebenarnya"
              - "Suplemen paling laris di Shopee ini aku cek klaim iklannya ke riset — hasilnya mengejutkan"
              - "Omega-3 worth it atau tidak? Ini kondisi di mana riset bilang ya dan kondisi di mana tidak"
              - "Multivitamin vs suplemen spesifik — mana yang lebih worth it untuk orang Indonesia rata-rata"
            content_runway: "Industri suplemen Indonesia sangat besar dan aktif dengan produk baru terus diluncurkan; tren kesehatan global (immunity, anti-aging, gut health) menciptakan gelombang produk baru yang perlu diverifikasi; setiap kategori suplemen butuh video terpisah; update riset sains memungkinkan revisit topik lama."
