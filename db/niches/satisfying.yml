version: 1
vertical:
  slug: v-satisfying
  name: Satisfying
  description: Konten visual dan audio yang memuaskan — restorasi, ASMR, cleaning, dan proses yang menenangkan.
  guide:
    audience: "Penonton 16-35 tahun yang mencari konten relaksasi dan kepuasan visual; campuran pria-wanita yang menikmati tonton sebelum tidur atau saat istirahat; tertarik pada transformasi, kerapian, dan proses."
    tone: "Tenang, tanpa komentar berlebihan, membiarkan visual dan audio bicara. Gaya 'slow TV' — penonton datang untuk menikmati proses, bukan informasi."
    format: "Video pendek 30–90 detik, dominan close-up tangan dan bahan, vertikal 9:16. Musik minimal atau tidak ada — suara proses diutamakan. Struktur: kondisi awal (hook) → proses → reveal/hasil."
    boleh:
      - "Mulai dari kondisi paling parah atau kotor untuk hook yang kuat"
      - "Gunakan suara proses asli (ASMR) — naikkan gain sedikit di editing"
      - "Tampilkan reveal akhir slow-mo 2–3 detik untuk kepuasan maksimal"
      - "Loop-friendly — akhir video bisa menyambung kembali ke awal"
      - "Pakai pencahayaan natural atau ring light untuk warna akurat"
    hindari:
      - "Jangan banyak narasi atau voiceover — bunuh vibe satisfying"
      - "Jangan pakai musik ber-hak-cipta; pilih royalty-free ambient/tenang"
      - "Jangan skip langkah proses yang membuat hasil terlihat 'instan' tanpa kerja keras"
      - "Jangan tampilkan wajah jika channel faceless"
      - "Jangan gunakan caption berlebihan yang mengalihkan dari visual"
    pola_hook: "Detik 0–2: close-up kondisi terburuk + teks singkat konteks ('dibuang', '10 tahun tidak disentuh'). Langsung mulai proses di detik 3."
    contoh_judul:
      - "Barang ini dibuang tetangga, 3 jam kemudian seperti baru"
      - "Proses ini bikin otak tenang, tonton sampai habis"
      - "Transformasi yang gak akan kamu percaya sebelum lihat sendiri"

  niches:
    - slug: restoration
      name: "Restorasi Barang"
      description: "Perbaiki barang rusak jadi baru."
      faceless: true
      difficulty: pemula
      rpm: sedang
      formats: POV + time-lapse + before-after
      example_hook: "Barang karatan ini dibuang orang..."
      guide:
        audience: "Pria 18–40 yang suka konten 'puas' dan before-after; penggemar DIY dan pertukangan; penonton yang suka melihat nilai tersembunyi pada barang yang dianggap sampah."
        tone: "Fokus dan metodis. Suara proses — gosok, kikir, cat — jadi aktor utama. Tidak perlu penjelasan panjang; visual proses cukup bercerita."
        format: "45–90 detik. Urutan: kondisi terparah (hook 0–3 detik) → proses bertahap (time-lapse atau real-time) → reveal final slow-mo. Close-up tangan dan material, vertikal 9:16."
        boleh:
          - "Pilih barang dengan kondisi paling ekstrem sebagai bahan baku untuk hook kuat"
          - "Tampilkan alat dan bahan sebentar di awal agar penonton tahu prosesnya nyata"
          - "Gunakan SFX suara gosok, amplas, dan semprot untuk kepuasan audio"
          - "Reveal akhir: bandingkan langsung kondisi awal vs akhir dalam satu frame"
        hindari:
          - "Jangan gunakan narasi panjang — cukup teks singkat di frame jika perlu"
          - "Jangan pakai musik keras yang kalahkan suara proses"
          - "Jangan tampilkan wajah — channel ini faceless"
          - "Jangan potong proses terlalu agresif sampai penonton tidak merasakan 'kerja keras'-nya"
        pola_hook: "Detik 0: close-up kondisi terburuk + teks 'dibuang orang' atau 'ditemukan di gudang'. Langsung mulai proses di detik 2–3."
        contoh_judul:
          - "Barang karatan ini dibuang orang, ini yang terjadi setelah 3 jam"
          - "Restorasi barang tua yang sudah dianggap tidak bisa diselamatkan"
          - "Dari sampah jadi koleksi — proses restorasi yang menenangkan"
      micro:
        - slug: restoration-sepatu-jadul
          name: Restorasi Sepatu Jadul Jadi Seperti Baru
          description: Proses restorasi sepatu lawas yang tampak tidak terselamatkan — sol rekat, kulit mengelupas, warna pudar — hingga kembali layak pakai, dengan produk yang mudah ditemukan di Indonesia.
          example_hook: "Sepatu ini dibuang tetangga, 3 jam kemudian terlihat seperti baru dari toko..."
          guide:
            audience: "Pria dan wanita 18–35 yang suka sneaker culture dan thrift; penonton DIY yang ingin tahu cara merawat sepatu lama; penggemar konten sebelum-sesudah yang memuaskan."
            tone: "Hati-hati dan detail — setiap gerakan sikat, lem, dan poles terlihat disengaja. Suara sikat dan cat jadi melodi utama."
            format: "60–90 detik. Mulai dari kondisi terparah (kulit mengelupas, sol lepas) → pembersihan → perbaikan sol → pewarnaan ulang → poles final → reveal. Vertikal 9:16, close-up tangan dan bahan."
            boleh:
              - "Tampilkan merk sepatu di awal jika terkenal — menambah nostalgia"
              - "Gunakan SFX suara sikat dan semprotan cleaner"
              - "Reveal akhir: sepatu dipegang di bawah cahaya agar kilap terlihat"
              - "Tambahkan teks overlay singkat nama produk yang dipakai (tanpa endorsement berlebihan)"
            hindari:
              - "Jangan skip langkah pembersihan awal — itu bagian yang paling satisfying"
              - "Jangan gunakan musik keras; ambient lo-fi cukup"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan klaim hasil bisa dicapai tanpa produk khusus jika memang butuh produk khusus"
            pola_hook: "Detik 0: close-up bagian sepatu paling parah (sol mengelupas atau kulit retakretak) + teks 'dibuang tetangga'. Langsung mulai sikat di detik 2."
            contoh_judul:
              - "Sepatu Nike ini dibuang tetangga, 3 jam kemudian seperti baru dari toko"
              - "Sol sepatu kulit ini sudah mau lepas, ini cara betulkan tanpa ke tukang"
              - "Sneaker jadul tahun 2005 aku restorasi sampai kilap lagi"
              - "Sepatu kulit retak parah ini masih bisa diselamatkan dengan cara ini"
              - "Buang sayang, restorasi dulu — sepatu lawas ini jadi kayak beli kemarin"
            content_runway: "Setiap model, merek, dan material sepatu (kulit, kanvas, suede, karet) menghasilkan video yang berbeda; pasokan sepatu lawas dari pasar loak atau donasi tidak ada habisnya."

        - slug: restoration-furnitur-kayu-lapuk
          name: Furnitur Kayu Lapuk Dijadikan Kembali Fungsional
          description: Proses restorasi furniture kayu tua yang lapuk dan rusak menjadi fungsional dan estetik kembali, memperlihatkan nilai yang tersembunyi dalam barang yang tampak tidak berguna.
          example_hook: "Kursi kayu ini sudah 40 tahun tidak dipakai, ini yang terjadi setelah 5 jam di bengkel..."
          guide:
            audience: "Pecinta desain interior dan DIY berusia 25–45; pemilik rumah yang ingin memperbaiki furnitur lama daripada beli baru; penonton yang menghargai nilai historis dan estetika kayu tua."
            tone: "Sabar dan penuh perhatian — setiap proses pengamplasan dan pelapisan dilakukan dengan penuh kontrol. Suara amplas, kuas, dan kayu jadi bagian narasi."
            format: "75–90 detik. Struktur: kondisi lapuk di awal → pembersihan dan pengupasan → perbaikan struktur → pengamplasan → finishing (cat atau natural oil) → reveal dengan furniture difungsikan. Vertikal 9:16."
            boleh:
              - "Tunjukkan tekstur kayu asli yang muncul setelah lapisan lama diangkat — selalu memuaskan"
              - "Gunakan time-lapse untuk proses pengamplasan panjang"
              - "Reveal akhir: furniture diletakkan di sudut ruangan, terlihat kontras dengan sekelilingnya"
              - "Tambahkan sedikit teks tentang usia barang untuk konteks emosional"
            hindari:
              - "Jangan skip proses pengamplasan — itu inti kepuasan channel ini"
              - "Jangan gunakan musik yang terlalu upbeat; pilih ambient tenang"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan klaim hasil sempurna jika ada cacat kecil yang tersisa — kejujuran membangun kepercayaan"
            pola_hook: "Detik 0: close-up furnitur lapuk dengan kaki patah atau jamur terlihat + teks usia barang. Langsung ambil alat pertama di detik 3."
            contoh_judul:
              - "Kursi kayu ini sudah 40 tahun di gudang, aku butuh 5 jam untuk hidupkan kembali"
              - "Lemari kayu jati lapuk ini aku poles sampai serat kayunya terlihat lagi"
              - "Meja makan nenek yang hampir dibuang aku jadikan centerpiece ruang tamu"
              - "Kayu lapuk ini di bawah cat tua menyimpan sesuatu yang luar biasa"
              - "Restorasi kursi vintage yang sudah dianggap sampah — hasilnya di luar dugaan"
            content_runway: "Jenis furnitur (kursi, meja, lemari, rak) dan jenis kayu (jati, mahoni, pinus) sudah menghasilkan ratusan kombinasi; ditambah gaya finishing (natural, cat, stain) yang berbeda-beda."

        - slug: restoration-elektronik-rusak
          name: Barang Elektronik Rusak Diperbaiki dari Nol
          description: Proses perbaikan barang elektronik yang dinyatakan mati — radio tua, kalkulator vintage, atau tape player — mulai dari diagnosis kerusakan hingga berhasil menyala kembali.
          example_hook: "Radio tahun 1975 ini ditemukan di gudang, terakhir menyala saat aku belum lahir..."
          guide:
            audience: "Pria 20–45 yang tertarik elektronik, hobi reparasi, atau nostalgia teknologi lawas; penonton yang menikmati momen 'menyala kembali' setelah perbaikan panjang."
            tone: "Penuh fokus dan presisi — gerakan tangan kecil dengan alat solder dan multimeter menjadi inti visual. Suara klik, bip, dan derak komponen lama sangat memuaskan."
            format: "60–90 detik. Struktur: kondisi mati total → buka casing (reveal komponen dalam) → diagnosis visual → perbaikan (solder, ganti komponen) → test nyala → reveal berfungsi penuh. Close-up extreme, vertikal 9:16."
            boleh:
              - "Perlihatkan kondisi dalam komponen yang kotor atau berkarat sebelum dibersihkan"
              - "Gunakan SFX suara solder, klik tombol, dan suara radio menyala pertama kali"
              - "Tampilkan momen pertama kali alat menyala kembali sebagai klimaks video"
              - "Tambahkan teks tahun produksi barang untuk konteks nostalgia"
            hindari:
              - "Jangan skip proses diagnosis — penonton ingin mengerti kenapa rusak"
              - "Jangan gunakan narasi teknis panjang; visual proses lebih kuat"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan klaim repair mudah jika perlu keahlian khusus — bisa menyesatkan"
            pola_hook: "Detik 0: close-up barang mati ditekan tombol dan tidak ada respons + teks tahun produksi. Langsung buka casing di detik 3."
            contoh_judul:
              - "Radio tahun 1975 ini tidak menyala sejak aku belum lahir — aku coba perbaiki"
              - "Kalkulator vintage ini mati total, ternyata masalahnya sesederhana ini"
              - "Tape player jadul ditemukan di gudang, 2 jam kemudian musik mengalun lagi"
              - "Walkman rusak dari tahun 1988 aku buka dan perbaiki dari nol"
              - "TV tabung tua ini aku nyalakan kembali setelah 15 tahun tidak disentuh"
            content_runway: "Setiap dekade menghasilkan ratusan jenis elektronik vintage yang berbeda (radio, TV, kamera, komputer, audio equipment); kombinasi merek dan model hampir tidak terbatas."

    - slug: satisfying
      name: "Oddly Satisfying"
      description: "Visual/proses memuaskan, loop."
      faceless: true
      difficulty: pemula
      rpm: rendah
      formats: close-up + SFX + loop
      example_hook: "Tonton sampai habis, dijamin lega..."
      guide:
        audience: "Penonton 14–30 yang mencari konten relaksasi instan; sering scroll malam hari atau saat bosan; tertarik pada kerapian, presisi, dan kesempurnaan visual."
        tone: "Meditif dan non-verbal — tidak ada narasi, tidak ada musik keras. Membiarkan proses berbicara. Ritme video mengikuti ritme proses itu sendiri."
        format: "15–45 detik, dioptimalkan untuk loop seamless. Satu aksi per video — tidak perlu cerita panjang. Close-up ekstrem, pencahayaan merata, vertikal 9:16."
        boleh:
          - "Buat akhir video bisa di-loop kembali ke awal tanpa cut terasa"
          - "Pilih subjek dengan kontras warna atau tekstur yang kuat"
          - "Gunakan SFX suara proses asli yang sedikit di-boost"
          - "Tambahkan slow-motion di momen kunci untuk efek maksimal"
        hindari:
          - "Jangan tambahkan narasi atau teks berlebihan — mengalihkan dari visual"
          - "Jangan gunakan musik yang terlalu dominan"
          - "Jangan tampilkan wajah — channel ini faceless"
          - "Jangan rekam dengan pencahayaan buruk atau kamera goyang — kualitas visual adalah produknya"
        pola_hook: "Detik 0: langsung masuk ke aksi paling memuaskan tanpa intro. Tidak perlu penjelasan — biarkan visual menarik perhatian sendiri."
        contoh_judul:
          - "Tonton ini sampai habis, dijamin lega"
          - "Proses ini sempurna dari awal sampai akhir"
          - "Gak ada yang lebih satisfying dari ini hari ini"

      micro:
        - slug: satisfying-cat-rata-sempurna
          name: Cat Dinding Rata Sempurna Tanpa Noda
          description: Footage close-up proses pengecatan dinding dengan teknik yang menghasilkan lapisan sempurna rata dan bebas brush mark, format yang memuaskan bagi penonton yang obsesif dengan kerapian.
          example_hook: "Kuas bergerak sekali ini dan hasilnya tidak ada yang menandingi..."
          guide:
            audience: "Penonton 20–40 yang obsesif dengan kerapian dan perfeksionisme visual; pemilik rumah yang baru renovasi; penggemar konten DIY dan interior."
            tone: "Slow dan metodis. Suara kuas di dinding — gerakan panjang satu arah — menjadi asmr tersendiri. Tidak perlu kata-kata."
            format: "20–40 detik. Satu gerakan kuas panjang yang mengisi frame dari atas ke bawah, close-up sangat dekat hingga terlihat tekstur cat, vertikal 9:16. Loop-friendly."
            boleh:
              - "Pilih cat dengan warna kontras terhadap latar — putih di dinding kusam sangat efektif"
              - "Gunakan roller untuk area luas dan kuas untuk tepi — tampilkan keduanya"
              - "Boost suara gesek roller di dinding untuk kepuasan audio"
              - "Tampilkan garis tepi yang sempurna menggunakan masking tape"
            hindari:
              - "Jangan rekam dengan cat yang tidak rata atau ada bubble — defeat the purpose"
              - "Jangan potong di tengah gerakan kuas — satu gerakan harus utuh dalam satu shot"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan musik cepat; ambient atau silence lebih cocok"
            pola_hook: "Detik 0: kuas dicelup cat lalu langsung ditempel ke dinding, gerakan pertama dimulai. Tidak ada intro."
            contoh_judul:
              - "Satu sapuan kuas ini bikin dinding seperti baru, tidak ada satupun noda"
              - "Cara cat dinding satu arah yang hasilnya sempurna rata tanpa brush mark"
              - "Rolling cat dinding ini terlalu memuaskan untuk tidak ditonton ulang"
              - "Batas cat yang sempurna menggunakan masking tape — tonton reveal-nya"
              - "Cat putih di atas dinding kuning — transformasi paling satisfying hari ini"
            content_runway: "Setiap warna, teknik (roller vs kuas vs spray), dan permukaan (tembok, kayu, besi) menghasilkan konten berbeda; proyek renovasi rumah di Indonesia sangat umum sebagai sumber konten."

        - slug: satisfying-packaging-rapi
          name: Proses Packing Produk dengan Ketelitian Ekstrem
          description: Footage proses pengemasan produk secara sangat teliti dan presisi — lipatan kertas sempurna, pita simetris, dan label rata — yang memenuhi kebutuhan penonton yang obsesif dengan kerapian.
          example_hook: "Kotak ini dilipat dan dikemas dengan cara yang bikin tangan gatal ingin coba sendiri..."
          guide:
            audience: "Penonton 16–35 yang obsesif dengan kerapian; penggemar unboxing dan packaging aesthetics; pelaku UMKM yang ingin belajar packaging rapi."
            tone: "Presisi dan penuh perhatian. Setiap lipatan, potongan pita, dan tempelan label dilakukan dengan kontrol penuh. Suara kertas dan selotip menjadi ASMR."
            format: "25–45 detik. Close-up tangan melipat, memotong, dan menempel secara sistematis. Satu paket dari awal sampai selesai dalam satu video. Loop-friendly, vertikal 9:16."
            boleh:
              - "Pilih produk dengan warna atau branding yang estetik secara visual"
              - "Gunakan gerakan simetris yang bisa diantisipasi penonton — kepuasan ada di ekspektasi terpenuhi"
              - "SFX suara gunting, selotip, dan kertas diboost untuk kepuasan audio"
              - "Tampilkan hasil akhir dari berbagai sudut sebelum video selesai"
            hindari:
              - "Jangan ada lipatan tidak rata atau gelembung pada stiker — otomatis tidak satisfying"
              - "Jangan rekam dengan tangan gemetar atau pencahayaan tidak merata"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan insert narasi produk atau promosi di tengah video"
            pola_hook: "Detik 0: bahan packing tersusun rapi di meja, tangan masuk frame dan langsung mulai melipat. Tidak ada intro."
            contoh_judul:
              - "Cara packing produk yang terlalu rapi untuk dilihat sekali saja"
              - "Lipatan kotak ini sempurna sampai sudutnya bisa jadi penggaris"
              - "Proses packing ini bikin tangan gatal ingin coba sendiri"
              - "Packaging UMKM yang terlihat semahal brand internasional — ini caranya"
              - "Stiker label ditempel dan tidak ada satu gelembung pun — tonton sampai habis"
            content_runway: "Setiap jenis produk (makanan, kosmetik, pakaian, elektronik), material packaging (karton, kain, bubble wrap), dan event (lebaran, natal, ulang tahun) menghasilkan video baru yang relevan sepanjang tahun."

        - slug: satisfying-grouting-keramik
          name: Grouting Nat Keramik Sampai Sempurna
          description: Footage proses mengisi nat keramik dari yang kotor dan tidak merata hingga putih bersih dan rata sempurna, format satisfying yang sangat populer di komunitas rumah tangga.
          example_hook: "Nat keramik ini hitam selama 10 tahun, 20 menit kemudian terlihat seperti baru dipasang..."
          guide:
            audience: "Pemilik rumah 25–45 yang peduli kebersihan dan renovasi; penonton yang obsesif dengan garis-garis keramik bersih; penggemar konten cleaning dan home improvement."
            tone: "Bersih dan metodis. Gerakan spatula yang mengisi nat dalam satu arah menghasilkan ritme visual yang sangat memuaskan. Suara scraping dan air jadi melodi."
            format: "30–60 detik. Mulai dari nat kotor gelap → proses pengisian/pembersihan → wipe bersih → reveal nat putih sempurna. Close-up eksetrem pada garis-garis keramik, vertikal 9:16."
            boleh:
              - "Pilih keramik dengan nat yang kontras warna — hitam vs putih paling efektif"
              - "Tampilkan proses wipe basah yang mengangkat sisa grout — sangat satisfying"
              - "SFX suara gesek spatula dan air diboost"
              - "Reveal akhir: zoom out dari close-up ke area keramik yang sudah selesai"
            hindari:
              - "Jangan ada garis nat yang tidak rata atau tidak penuh — mengalahkan tujuan video"
              - "Jangan gunakan musik cepat atau distraktif"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan rekam dengan pencahayaan redup — kontras hitam-putih nat harus terlihat jelas"
            pola_hook: "Detik 0: close-up extreme nat keramik hitam kotor + teks '10 tahun tidak dibersihkan'. Langsung mulai aplikasi grout di detik 2."
            contoh_judul:
              - "Nat keramik ini hitam 10 tahun, 20 menit kemudian putih seperti baru dipasang"
              - "Grouting ulang kamar mandi dan hasilnya bikin gak percaya"
              - "Cara bersihkan nat keramik hitam membandel yang belum pernah kamu coba"
              - "Sela keramik ini diisi ulang dan transformasinya terlalu memuaskan"
              - "Dapur lama terlihat baru hanya dengan perbaiki nat keramiknya"
            content_runway: "Setiap ruangan (kamar mandi, dapur, teras, garasi) dan setiap pola keramik menghasilkan video yang berbeda secara visual; setiap rumah di Indonesia punya keramik yang bisa direstorasi."

    - slug: asmr
      name: "ASMR"
      description: "Suara memuaskan, dominan audio."
      faceless: true
      difficulty: menengah
      rpm: rendah
      formats: audio + close-up + no-talk
      example_hook: "Pakai headset, dengerin ini..."
      guide:
        audience: "Penonton 16–35 yang menggunakan ASMR untuk relaksasi, tidur, atau fokus; campuran pria-wanita yang sensitif terhadap suara; sering tonton malam hari dengan headset."
        tone: "Sunyi, lambat, dan intim. Tidak ada suara manusia berbicara. Setiap suara — gesek, ketuk, alir — diperkuat dan dimurnikan. Konten yang mengundang penonton untuk menutup mata."
        format: "1–3 menit. Dominan audio: rekam dengan mic eksternal atau binaural jika memungkinkan. Visual mendukung audio — close-up tangan, bahan, dan gerakan. Tidak ada musik, tidak ada teks berlebihan. Vertikal 9:16."
        boleh:
          - "Rekam dengan mic kondenser atau directional untuk kualitas audio lebih baik"
          - "Eksperimen dengan teknik 3D binaural untuk pengalaman headset yang lebih imersif"
          - "Variasi suara dalam satu video: mulai pelan, naik ke suara yang lebih kaya, lalu turun lagi"
          - "Tambahkan teks 'pakai headset' di awal sebagai instruksi sederhana"
        hindari:
          - "Jangan tambahkan musik latar — mengalahkan suara ASMR asli"
          - "Jangan ada suara ambient tidak sengaja (AC, kendaraan) yang terlalu keras tanpa sengaja"
          - "Jangan tampilkan wajah — channel ini faceless"
          - "Jangan bicara atau berbisik jika bukan ASMR talking — jaga konsistensi format"
        pola_hook: "Detik 0: teks 'pakai headset' + suara pertama yang langsung intens dan menarik. Tidak ada intro visual panjang — suara harus menarik perhatian di detik pertama."
        contoh_judul:
          - "Pakai headset, dengerin ini sebelum tidur"
          - "Suara ini akan reset pikiran kamu yang penuh"
          - "ASMR Indonesia — suara yang kamu rindukan tapi gak tahu kenapa"

      micro:
        - slug: asmr-masak-tradisional
          name: ASMR Memasak Masakan Tradisional Indonesia
          description: Rekaman close-up dan binaural memasak masakan tradisional Indonesia — tumisan, goreng bawang, dan ulek sambal — tanpa narasi, hanya suara proses memasak yang autentik.
          example_hook: "Suara cobek ini akan membawa kamu ke dapur nenek, pakai headset..."
          guide:
            audience: "Penonton Indonesia 20–40 yang rindu suasana dapur tradisional; diaspora Indonesia yang kangen suasana masak di kampung; penonton ASMR yang mencari konten dengan konteks budaya lokal."
            tone: "Nostalgia dan hangat. Suara cobek, sodet di wajan besi, dan uap panas menjadi karakter utama. Tidak ada kata — suara masak cukup menceritakan segalanya."
