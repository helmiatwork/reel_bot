version: 1
vertical:
  slug: v-kreatif
  name: Kreatif
  description: Konten proses kreatif dan pembuatan — kerajinan, seni, woodworking, teknologi maker, dan fotografi.
  guide:
    audience: "Penonton 18–40 yang menikmati menonton proses pembuatan dari awal hingga selesai; campuran pria-wanita yang suka DIY, seni, dan teknologi; mereka yang terinspirasi untuk mencoba sendiri atau sekadar menikmati kepuasan visual proses kreatif."
    tone: "Fokus pada proses, bukan hasil semata. Setiap langkah diperlihatkan dengan rasa bangga dan ketelitian. Tidak perlu narasi panjang — tangan yang bekerja sudah bercerita sendiri."
    format: "Video 30–90 detik, dominan close-up tangan dan bahan, vertikal 9:16. Time-lapse untuk tahap panjang, real-time untuk momen kunci. Struktur: kondisi awal / bahan mentah → proses bertahap → reveal karya jadi."
    boleh:
      - "Perlihatkan kondisi bahan mentah atau alat sebelum mulai agar penonton tahu tantangannya"
      - "Gunakan SFX proses asli (gergaji, kuas, printer berjalan) dan boost sedikit untuk kepuasan audio"
      - "Reveal akhir: tampilkan karya di bawah pencahayaan yang memperlihatkan detail terbaik"
      - "Tambahkan teks singkat nama bahan atau teknik yang dipakai agar penonton bisa meniru"
      - "Variasi angle — bird-eye untuk layout, close-up untuk detail, medium untuk konteks"
    hindari:
      - "Jangan skip tahap yang membuat hasil terlihat tiba-tiba jadi tanpa usaha"
      - "Jangan gunakan musik keras yang kalahkan suara proses — ambient lo-fi lebih tepat"
      - "Jangan tampilkan wajah jika channel faceless"
      - "Jangan klaim proyek mudah jika sebenarnya butuh keahlian khusus — jujur soal kurva belajar"
      - "Jangan gunakan bahan atau alat yang tidak tersedia di Indonesia tanpa alternatif lokal"
    pola_hook: "Detik 0–2: tampilkan bahan mentah atau kondisi awal yang tampak biasa/tidak menarik + teks singkat hasil akhir yang mengesankan. Penonton harus bertanya-tanya 'bagaimana bisa jadi begitu?'."
    contoh_judul:
      - "Dari bahan murah ini jadi sesuatu yang bikin orang nanya beli di mana"
      - "Proses ini butuh 3 jam tapi kamu bisa tonton dalam 60 detik"
      - "Tangan yang bekerja lebih menarik dari apapun di feed ini"

  niches:
    - slug: diy-craft
      name: "DIY / Kerajinan"
      description: Bikin barang dari bahan murah.
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: POV + time-lapse + hard-sub
      example_hook: "Dari kardus bekas jadi ini..."
      guide:
        audience: "Penonton 18–35 yang suka konten kreatif praktis; ibu rumah tangga, mahasiswa, dan pekerja muda yang ingin menghasilkan sesuatu dengan tangan sendiri; penonton yang terdorong mencoba setelah menonton."
        tone: "Inventif dan memberdayakan. Setiap video harus meninggalkan pesan implisit bahwa siapapun bisa membuat sesuatu berharga dari bahan yang dianggap tidak berguna."
        format: "45–75 detik. Struktur: tampilkan bahan murah/bekas → proses kerajinan step-by-step (time-lapse + close-up detail) → reveal produk jadi yang terlihat lebih mahal dari bahan aslinya. Teks nama bahan dan estimasi harga di awal. Vertikal 9:16."
        boleh:
          - "Tampilkan harga total bahan di awal untuk impact 'murah tapi hasilnya begini'"
          - "Gunakan bahan yang mudah ditemukan di toko Rp2000an, Daiso, atau pasar lokal"
          - "Reveal akhir: taruh produk di konteks penggunaan nyata (di meja, di dinding, dibungkus sebagai hadiah)"
          - "Teks overlay singkat nama teknik atau bahan spesifik yang dipakai"
        hindari:
          - "Jangan gunakan alat yang tidak umum atau terlalu mahal tanpa alternatif"
          - "Jangan skip langkah kritis yang membuat penonton tidak bisa meniru di rumah"
          - "Jangan tampilkan wajah — channel ini faceless"
          - "Jangan klaim 'mudah' jika prosesnya membutuhkan ketelitian tinggi — set ekspektasi realistis"
        pola_hook: "Detik 0: close-up bahan mentah yang tampak biasa + teks 'modal Rp X' atau 'dari sampah jadi ini'. Langsung mulai proses di detik 2–3."
        contoh_judul:
          - "Dari kardus bekas jadi organizer meja yang keliatan beli di IKEA"
          - "Modal Rp30rb bikin hadiah ulang tahun yang terlihat Rp500rb"
          - "Botol plastik ini biasanya dibuang, tapi jadi ini dalam 20 menit"
      micro:
        - slug: diy-craft-daur-ulang-plastik
          name: Daur Ulang Sampah Plastik Jadi Barang Berguna
          description: Proyek kerajinan yang mengubah botol plastik, kantong kresek, dan kemasan bekas menjadi item rumah tangga berguna, menyasar penonton yang peduli lingkungan dan hemat.
          example_hook: "Botol plastik ini biasanya langsung dibuang, tapi jadi ini dalam 20 menit..."
          guide:
            audience: "Penonton 20–35 yang peduli lingkungan dan penghematan; ibu rumah tangga yang ingin kurangi sampah plastik rumah tangga; mahasiswa yang suka proyek DIY murah meriah."
            tone: "Solutif dan mengejutkan. Setiap video harus membuat penonton berpikir dua kali sebelum membuang plastik. Nada kasual seperti ngobrol dengan teman yang kreatif."
            format: "40–60 detik. Struktur: tampilkan sampah plastik yang akan digunakan → bersihkan → potong/bentuk → rakit → finishing → reveal produk jadi dalam penggunaan nyata. Time-lapse bagian proses panjang. Vertikal 9:16."
            boleh:
              - "Mulai dengan sampah yang paling sering ada di rumah (botol air mineral, kemasan sampo, kantong kresek)"
              - "Tampilkan hasil akhir dalam penggunaan nyata — pot tanaman diisi tanaman, tempat pensil berisi pensil"
              - "Gunakan teks 'biasanya dibuang' atau 'harga beli Rp X' untuk efek kontras"
              - "Boost SFX gunting, pemotong, dan hot glue gun untuk kepuasan audio"
            hindari:
              - "Jangan gunakan bahan kimia berbahaya tanpa disclosure safety"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan skip langkah pembersihan sampah — hygiene penting untuk relevansi"
              - "Jangan pilih proyek yang hasilnya terlihat murahan meski dari sampah — estetika tetap penting"
            pola_hook: "Detik 0: close-up sampah plastik bekas (botol air mineral, kemasan sampo) + teks 'biasanya langsung dibuang'. Langsung ambil gunting di detik 2."
            contoh_judul:
              - "Botol plastik ini aku kumpul 5 hari, sekarang jadi rak dinding yang cakep"
              - "Kantong kresek bekas jadi keset anyaman yang tahan bertahun-tahun"
              - "Kemasan sampo ini jadi tempat sikat gigi yang lebih rapi dari yang dijual"
              - "5 botol air mineral = 1 pot gantung yang bikin teras kos kelihatan hidup"
              - "Tutup botol plastik ini dikumpul 2 minggu, hasilnya bikin tetangga nanya beli di mana"
            content_runway: "Setiap jenis plastik rumah tangga (botol, kemasan, kantong, sedotan) dan setiap kebutuhan rumah (organizer, dekorasi, alat dapur, pot) menghasilkan kombinasi yang hampir tak terbatas; produksi sampah plastik Indonesia jaminan pasokan bahan baku."

        - slug: diy-craft-hadiah-personal
          name: Hadiah Buatan Tangan yang Terlihat Mahal
          description: Proyek kerajinan yang menghasilkan hadiah personal bernilai tinggi dari bahan murah — bingkai foto unik, lilin aroma, dan hiasan — untuk penonton yang ingin berkesan tanpa budget besar.
          example_hook: "Hadiah ini terlihat Rp500rb tapi aku buat sendiri dengan modal Rp30rb..."
          guide:
            audience: "Penonton 18–30 yang ingin memberi hadiah berkesan tapi budget terbatas; pasangan muda di momen ulang tahun dan anniversary; pemberi hadiah yang ingin sentuhan personal di atas segalanya."
            tone: "Hangat dan personal. Setiap video memberi kesan bahwa hadiah terbaik adalah yang dibuat dengan tangan sendiri. Bukan tentang sempurna, tapi tentang niat yang terlihat nyata."
            format: "45–70 detik. Struktur: tampilkan bahan mentah dengan harga → proses pembuatan (close-up detail tangan) → pengemasan yang rapi → reveal hadiah jadi yang siap diberikan. Vertikal 9:16."
            boleh:
              - "Tampilkan harga total bahan di awal untuk efek 'murah tapi berkesan'"
              - "Pengemasan adalah bagian penting — tunjukkan cara bungkus yang rapi meski sederhana"
              - "Tambahkan momen 'membayangkan reaksi penerima' di reveal akhir"
              - "SFX suara kertas wrapping, selotip, dan pita ditarik untuk kepuasan audio"
            hindari:
              - "Jangan gunakan bahan yang sulit ditemukan di Indonesia tanpa alternatif lokal"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan skip langkah yang membuat hasil terlihat mahal — detail finishing adalah kuncinya"
              - "Jangan proyek yang membutuhkan mesin khusus tanpa alternatif manual"
            pola_hook: "Detik 0: close-up bahan-bahan murah tersusun di meja + teks 'modal Rp30rb, terlihat Rp500rb'. Langsung mulai proses di detik 2."
            contoh_judul:
              - "Hadiah ultah ini bikin pacar nangis, modal Rp35rb dan 1 jam bikin sendiri"
              - "Lilin aroma custom ini terlihat dari toko premium tapi aku buat di dapur"
              - "Bingkai foto vintage ini dari kardus bekas, cara buatnya lebih mudah dari yang kelihatan"
              - "Anniversary gift Rp50rb yang lebih berkesan dari beli di mal — ini prosesnya"
              - "Hadiah wisuda buatan tangan yang bikin orang tanya 'beli di mana?' padahal gak jual di mana-mana"
            content_runway: "Setiap momen hadiah (ulang tahun, anniversary, wisuda, lebaran, natal) dan setiap jenis hadiah (foto, lilin, perhiasan, dekorasi) menghasilkan video berbeda; momen perayaan di Indonesia sangat sering dan beragam sepanjang tahun."

        - slug: diy-craft-dekorasi-kos-murah
          name: Dekorasi Kamar Kos dengan Budget Minimum
          description: Proyek transformasi kamar kos dengan kerajinan tangan murah yang tidak merusak tembok dan tidak memerlukan izin pemilik kos, menyasar mahasiswa dan perantau.
          example_hook: "Kamar kos ini totalnya Rp150rb untuk dekorasi dan sekarang terlihat kayak apartemen..."
          guide:
            audience: "Mahasiswa dan perantau 18–27 yang tinggal di kos; penonton yang ingin ruangan terasa lebih hidup tanpa renovasi; penghuni kos yang terbatas oleh aturan 'tidak boleh paku dinding'."
            tone: "Relatable dan mendorong. Setiap video seperti ngobrol dengan teman sesama penghuni kos yang punya ide kreatif. Biaya selalu transparan karena itu kekhawatiran utama audiens."
            format: "45–75 detik. Struktur: tampilkan kamar kos sebelum (polos/biasa) → proses beli bahan + buat dekorasi → proses pasang → reveal kamar setelah. Before-after dari sudut yang sama. Vertikal 9:16."
            boleh:
              - "Gunakan metode tanpa paku (command strip, selotip, tali) yang tidak merusak dinding"
              - "Tampilkan total budget dengan rinci di layar — ini poin jual utama konten ini"
              - "Reveal dari sudut pintu masuk agar penonton lihat transformasi keseluruhan"
              - "Bahan dari Daiso, toko Rp2000an, atau marketplace dengan pengiriman cepat"
            hindari:
              - "Jangan proyek yang memerlukan palu, paku, atau modifikasi permanen"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan bahan yang total harganya di atas Rp300rb tanpa justifikasi nilai"
              - "Jangan skip before shot — kontras sebelum-sesudah adalah inti konten ini"
            pola_hook: "Detik 0: wide shot kamar kos polos + teks 'total budget Rp150rb'. Potong ke shots bahan-bahan di detik 3."
            contoh_judul:
              - "Kamar kos polos ini aku ubah total dengan Rp150rb dan 4 jam — tanpa paku"
              - "Dekorasi dinding kos tanpa merusak cat, cara yang gak pernah dibilang pemilik kos"
              - "String light + polaroid + Rp80rb = kamar kos yang bikin teman betah main ke sini"
              - "Sudut baca kos ini dari kardus bekas dan kain sisa, totalnya di bawah Rp100rb"
              - "Kamar kos 3x3 ini terasa lebih besar setelah trick dekorasi sederhana ini"
            content_runway: "Setiap area kamar kos (meja belajar, dinding, sudut baca, area tidur, lemari) dan setiap gaya (minimalis, bohemian, estetik Korea, vintage) menghasilkan video berbeda; populasi anak kos Indonesia sangat besar dan terus berganti setiap tahun ajaran."

    - slug: art-drawing
      name: "Seni / Menggambar"
      description: Proses menggambar/melukis time-lapse.
      faceless: true
      difficulty: menengah
      rpm: rendah
      formats: time-lapse + ASMR
      example_hook: "Gambar ini cuma pakai 1 pensil..."
      guide:
        audience: "Penonton 16–35 yang mengagumi seni tapi tidak semua bisa menggambar sendiri; penggemar time-lapse proses artistik; seniman pemula yang mencari inspirasi dan teknik."
        tone: "Meditatif dan penuh kekaguman. Setiap goresan diperlihatkan sebagai keputusan yang disengaja. Penonton harus merasa seperti menyaksikan sesuatu yang ajaib muncul di depan mata."
        format: "60–90 detik. Time-lapse 8–15x untuk sebagian besar proses, real-time untuk detail akhir atau momen kunci. Struktur: kertas/kanvas kosong → sketsa awal → detail bertahap → finishing → reveal hasil jadi. ASMR suara pensil atau kuas di atas kertas diboost. Vertikal 9:16."
        boleh:
          - "Reveal di akhir: mundur dari close-up detail ke keseluruhan karya"
          - "ASMR suara pensil, kuas, atau stylus sangat memuaskan — rekam dengan mic dekat"
          - "Tampilkan alat yang digunakan sebentar di awal (jenis pensil, cat, software)"
          - "Split-screen progress di titik tertentu untuk menunjukkan perkembangan"
        hindari:
          - "Jangan cut terlalu agresif sampai penonton kehilangan sense of progress"
          - "Jangan tambahkan musik yang terlalu dominan mengalahkan suara menggambar"
          - "Jangan tampilkan wajah — channel ini faceless"
          - "Jangan skip dari sketsa kasar langsung ke hasil akhir — proses adalah kontennya"
        pola_hook: "Detik 0: kertas/kanvas kosong atau sketsa awal yang belum jelas + teks hasil akhir ('potret realistis', 'hanya pakai pensil 2B'). Penonton harus penasaran bagaimana bisa."
        contoh_judul:
          - "Kertas kosong jadi potret ini hanya pakai satu pensil 2B"
          - "60 menit proses ini dikompres jadi 60 detik — tonton dari awal"
          - "Setiap goresan kuas ini ada alasannya, tonton prosesnya"
      micro:
        - slug: art-drawing-potret-1-jam
          name: Potret Wajah Realistis dalam 1 Jam
          description: Time-lapse menggambar potret wajah realistis dari blank canvas hingga selesai dalam format yang memperlihatkan keputusan artistis penting di setiap tahap.
          example_hook: "Dari kertas kosong jadi potret ini dalam 60 menit, ini prosesnya step by step..."
          guide:
            audience: "Penonton 16–30 yang mengagumi seni potret realistis; seniman pemula yang ingin belajar struktur dan shading; penonton yang menikmati kepuasan melihat wajah muncul secara bertahap."
            tone: "Presisi dan metodis. Setiap keputusan proporsi dan shading terlihat disengaja. Penonton bisa ikuti logika proses — proporsi → bentuk besar → nilai gelap-terang → detail."
            format: "60–90 detik. Time-lapse 10–15x untuk sketsa dan shading dasar, real-time 1x untuk detail mata dan bibir. Struktur: kertas kosong → proporsi → bentuk wajah → shading bertahap → detail → reveal. Close-up tangan dan area yang sedang dikerjakan. Vertikal 9:16."
            boleh:
              - "Tampilkan alat: jenis pensil (2H, HB, 2B, 4B) dan blending tool yang dipakai"
              - "ASMR suara pensil di atas kertas diboost — suara HB vs 4B beda dan menarik"
              - "Momen mata mulai terlihat 'hidup' adalah klimaks yang harus real-time atau slow-down"
              - "Tampilkan referensi foto vs hasil gambar di split-screen di akhir"
            hindari:
              - "Jangan skip proses shading bertahap — nilai gelap-terang yang bertahap adalah kepuasan utama"
              - "Jangan tampilkan wajah orang nyata yang dikenali tanpa izin"
              - "Jangan tampilkan tangan yang menggambar dengan getaran — stabilisasi penting"
              - "Jangan gunakan musik terlalu keras — ASMR pensil lebih berharga"
            pola_hook: "Detik 0: close-up kertas kosong + pensil diletakkan + teks '60 menit, satu pensil'. Goresan pertama sketsa proporsi dimulai di detik 2."
            contoh_judul:
              - "Dari kertas kosong jadi potret realistis ini, hanya pakai tiga jenis pensil"
              - "60 menit gambar wajah ini dikompres jadi 60 detik — tonton prosesnya"
              - "Momen mata mulai kelihatan 'hidup' di gambar ini selalu bikin merinding"
              - "Potret pensil ini dikira foto sampai lihat dari dekat — ini proses lengkapnya"
              - "Shading wajah dari terang ke gelap bertahap — proses ini terlalu memuaskan untuk diskip"
            content_runway: "Setiap subjek potret (orang, hewan, tokoh ikonik), setiap media (pensil, arang, conté, ballpoint), dan setiap gaya (realistis, semi-realistis, sketchy) menghasilkan video yang berbeda; tidak ada dua potret yang sama."

        - slug: art-drawing-digital-tablet
          name: Proses Digital Art dari Sketch ke Final
          description: Layar-rekam proses lengkap membuat digital illustration dari sketsa kasar hingga artwork final, termasuk tips layer management dan pilihan brush.
          example_hook: "Ini yang berbeda antara sketsa awal dan hasil akhir, dan kenapa layer itu penting..."
          guide:
            audience: "Seniman digital 18–30 yang ingin belajar workflow; penonton yang penasaran dengan proses di balik ilustrasi digital yang sering dilihat di media sosial; gamer dan anime fan yang tertarik dunia seni digital."
            tone: "Teknis tapi accessible. Screen recording yang rapid tapi bisa dipahami. Setiap keputusan layer dan warna terasa logis — bukan sihir, tapi skill yang bisa dipelajari."
            format: "60–90 detik. Screen recording tablet/layar + tangan dan stylus di frame. Struktur: kanvas kosong → rough sketch → clean lineart → base color → shading → detail → final. Time-lapse 8x untuk blocking, real-time untuk detail kunci. Vertikal 9:16."
            boleh:
              - "Tampilkan panel layer di sisi layar agar penonton memahami struktur"
              - "Zoom in ke area yang sedang dikerjakan untuk kejelasan visual"
              - "Teks overlay nama brush atau teknik yang dipakai di momen kunci"
              - "Split: WIP di tengah proses vs hasil final untuk menunjukkan jarak yang ditempuh"
            hindari:
              - "Jangan rekam dengan resolusi rendah — detail layar harus terlihat jelas"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan software yang tidak tersedia di Indonesia atau terlalu mahal tanpa alternatif"
              - "Jangan loncat dari lineart langsung ke final tanpa proses warna yang jelas"
            pola_hook: "Detik 0: tampilkan hasil akhir ilustrasi yang sudah jadi 0.5 detik → cut ke kanvas kosong + teks 'proses dari awal'. Penonton tahu tujuan akhirnya, sekarang penasaran bagaimana sampai di sana."
            contoh_judul:
              - "Dari sketsa berantakan ini aku buat ilustrasi yang masuk portofolio klien"
              - "Kenapa 20 layer lebih baik dari 3 layer — workflow digital art ini jelaskan semuanya"
              - "Proses digital art 4 jam ini dikompres jadi 90 detik — perhatikan keputusan warnanya"
              - "Rough sketch jelek ini jadi ilustrasi final yang bikin klien bayar Rp2jt"
              - "Setiap layer di file ini ada alasannya — ini workflow yang aku pakai tiap hari"
            content_runway: "Setiap tema ilustrasi (karakter, landscape, fanart, komersial, pattern), setiap software (Procreate, Clip Studio, Krita, Photoshop), dan setiap gaya artistik menghasilkan video berbeda; dunia digital art terus berkembang dengan tren baru setiap bulan."

        - slug: art-drawing-urban-sketching
          name: Urban Sketching Lokasi Ikonik Indonesia
          description: Time-lapse menggambar lokasi ikonik Indonesia secara langsung di lapangan — pasar, masjid, gedung tua — memadukan seni dengan dokumentasi budaya lokal.
          example_hook: "Aku duduk di sini selama 40 menit dan gambar ini sebelum lokasi ini direnovasi..."
          guide:
            audience: "Seniman dan pecinta seni perjalanan 22–40; penonton yang tertarik dokumentasi visual kota dan budaya; wisatawan dan orang lokal yang bangga dengan keindahan arsitektur Indonesia."
            tone: "Dokumentatif dan nostalgis. Ada rasa urgensi karena banyak lokasi ikonik di Indonesia sedang berubah atau hilang. Setiap sketsa adalah arsip visual yang berharga."
            format: "60–90 detik. Setup kamera tertuju pada tangan dan buku sketsa dengan latar lokasi nyata. Time-lapse 10–20x. Struktur: tampilkan lokasi asli sebentar → tangan mulai sketsa → proses bertahap → reveal halaman penuh → bandingkan dengan foto lokasi. Vertikal 9:16."
            boleh:
              - "Tampilkan lokasi nyata (wide shot atau foto) di awal sebelum sketsa dimulai"
              - "Suara ambient lokasi (pasar, adzan, lalu lintas jauh) sebagai latar — autentik"
              - "Reveal akhir: halaman sketchbook dibandingkan langsung dengan lokasi asli"
              - "Tambahkan teks nama lokasi dan kota untuk konteks dan discoverability"
            hindari:
              - "Jangan rekam di lokasi berbahaya atau yang larang pengambilan gambar"
              - "Jangan tampilkan wajah — channel ini faceless (tangan dan buku sketsa saja)"
              - "Jangan gunakan musik modern yang tidak cocok dengan suasana lokasi historis"
              - "Jangan skip bagian sketsa yang menunjukkan kesalahan dan koreksi — keautentikan adalah nilainya"
            pola_hook: "Detik 0: foto atau video lokasi ikonik yang indah + teks 'aku gambar ini langsung di sana'. Cut ke tangan membuka buku sketsa di detik 3."
            contoh_judul:
              - "Aku duduk di depan masjid ini 45 menit dan ini yang aku hasilkan sebelum hujan"
              - "Gedung kolonial ini mau dirobohkan — aku sempat gambar sebelum hilang"
              - "Urban sketching Pasar Baru Jakarta — suara pasar jadi musik latar terbaik"
              - "Sketsa langsung Pura Bali ini dalam 30 menit sebelum rombongan turis datang"
              - "Kampung warna-warni ini aku gambar dari atas bukit, hasilnya bikin mau balik lagi"
            content_runway: "Indonesia punya ribuan lokasi ikonik (pasar, masjid, gereja, kuil, gedung kolonial, kampung adat, alam) di ratusan kota; setiap lokasi bisa dikunjungi ulang di musim atau waktu berbeda untuk hasil visual yang berbeda."

    - slug: manufacturing
      name: How It's Made
      description: Proses produksi pabrik.
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: footage proses + voiceover
      example_hook: "Begini cara pensil dibuat massal..."
      guide:
