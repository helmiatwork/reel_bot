          example_hook: "Komponen ini sudah discontinue dan harga Rp500rb, aku print sendiri Rp15rb dalam 2 jam..."
          guide:
            audience: "Pemilik rumah 25–40 yang frustrasi dengan masalah kecil yang tidak ada solusi standar di toko; penonton yang tertarik ROI praktis dari printer 3D; maker yang mencari inspirasi proyek nyata."
            tone: "Problem-solving yang memuaskan. Ada rasa 'aha' di setiap video — masalah yang terlihat tidak ada solusinya ternyata bisa dipecahkan dengan cetak sendiri. Penonton harus merasa diberdayakan."
            format: "45–70 detik. Struktur: tampilkan masalah konkret di rumah → cari di toko tidak ada / terlalu mahal → design singkat (screen recording) → print → post-process → pasang / gunakan → masalah terpecahkan. Vertikal 9:16."
            boleh:
              - "Tampilkan harga beli solusi di toko vs biaya filamen untuk print sendiri"
              - "Video langsung masuk ke masalah — tidak perlu intro 3D printing panjang"
              - "Tampilkan ukuran dan presisi fitting ketika solusi dipasang"
              - "Tunjukkan masalah yang sangat spesifik — semakin unik semakin menarik"
            hindari:
              - "Jangan tampilkan proyek yang memerlukan post-processing kompleks tanpa penjelasan"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan buat klaim kekuatan atau daya tahan yang berlebihan untuk objek cetak 3D"
              - "Jangan pilih masalah yang solusinya sudah tersedia murah di toko"
            pola_hook: "Detik 0: tampilkan komponen rusak atau kebutuhan khusus yang tidak ada di toko + teks 'tidak ada solusinya, jadi aku buat sendiri'. Langsung cut ke printer berjalan di detik 3."
            contoh_judul:
              - "Engsel lemari ini sudah discontinue 10 tahun, aku print penggantinya dalam 2 jam"
              - "Bracket TV ini ukurannya tidak standar, solusinya aku cetak sendiri seharga Rp8rb"
              - "3 masalah kecil di rumah ini akhirnya terpecahkan dengan printer 3D dan filamen seharga Rp50rb"
              - "Remote AC ini tombolnya lepas, pengganti asli Rp200rb — aku print Rp5rb"
              - "Organizer laci dapur custom yang pas persis ukurannya karena aku desain dan print sendiri"
            content_runway: "Setiap rumah punya puluhan masalah kecil yang tidak ada solusi standarnya di toko; kombinasi ruangan (dapur, kamar mandi, garasi, kantor) dan jenis masalah (komponen rusak, organizer custom, bracket, adapter) menghasilkan konten hampir tak terbatas."

        - slug: 3d-print-gagal-belajar
          name: 3D Print Gagal dan Cara Mendiagnosis Masalahnya
          description: Konten jujur memperlihatkan hasil cetak 3D yang gagal beserta analisis penyebab dan solusinya, membantu komunitas maker pemula belajar dari kesalahan nyata.
          example_hook: "Print ke-7 ini akhirnya berhasil, dan ini perbedaan yang aku lakukan di setiap iterasi..."
          guide:
            audience: "Pemilik printer 3D pemula 20–35 yang frustasi dengan hasil gagal berulang; penonton yang mempertimbangkan beli printer dan ingin tahu learning curve nyatanya; maker yang suka konten troubleshooting jujur."
            tone: "Jujur dan edukatif. Kegagalan bukan memalukan — itu proses normal yang semua maker lalui. Nada seperti teman senior yang membimbing tanpa menghakimi, bahkan mentertawakan kegagalannya sendiri."
            format: "60–90 detik. Struktur: tampilkan hasil cetak gagal → analisis visual masalah (warping, stringing, layer separation) → sebutkan penyebab → perbaikan setting / model → cetak ulang → hasil yang lebih baik. Vertikal 9:16."
            boleh:
              - "Tunjukkan kegagalan sedekat mungkin — close-up warping, stringing, dan layer shift"
              - "Buat perbandingan visual: gagal vs berhasil dalam satu frame"
              - "Gunakan terminologi teknis tapi selalu sertakan penjelasan singkat dalam bahasa biasa"
              - "Format seri: '7 iterasi sampai sempurna' mendorong penonton untuk kembali"
            hindari:
              - "Jangan sembunyikan atau edit kegagalan — kejujuran adalah nilai utama channel ini"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan setting printer yang terlalu spesifik satu merk tanpa generalisasi"
              - "Jangan hanya tampilkan kegagalan tanpa solusi — penonton butuh takeaway yang actionable"
            pola_hook: "Detik 0: close-up hasil cetak gagal yang jelas gagal (melengkung parah, berserabut) + teks 'ini gagal ke-6, ini pelajarannya'. Langsung diagnosis di detik 2."
            contoh_judul:
              - "Print ke-7 akhirnya berhasil — ini kesalahan yang aku buat di 6 iterasi sebelumnya"
              - "Kenapa print ini melengkung parah dan cara aku akhirnya mengatasinya"
              - "Satu bulan belajar 3D printing, semua kegagalannya ada di video ini"
              - "Stringing parah di semua print aku — ini penyebab sebenarnya dan solusinya"
              - "Layer separation di jam ke-8 print — kenapa terjadi dan cara cegah di next build"
            content_runway: "Setiap jenis kegagalan cetak 3D (warping, stringing, layer adhesion, supports, calibration, filamen) menghasilkan video diagnostik berbeda; komunitas maker terus bertumbuh dan selalu ada pemula baru yang menghadapi masalah yang sama."

        - slug: 3d-print-miniatur-arsitektur
          name: Cetak Miniatur Bangunan Ikonik Indonesia
          description: Proses modeling dan printing miniatur bangunan ikonik Indonesia — Monas, Borobudur, rumah adat — sebagai showcase sekaligus panduan untuk penggemar arsitektur dan maker.
          example_hook: "Aku print Borobudur dalam skala 1:500 dan butuh 47 jam cetak, ini hasilnya..."
          guide:
            audience: "Penonton 22–45 yang mencintai arsitektur dan heritage Indonesia; kolektor miniatur dan model kit; maker yang ingin proyek ambisius dengan hasil yang bisa dipajang."
            tone: "Ambisius dan bangga. Mencetak bangunan ikonik Indonesia adalah perpaduan antara teknologi modern dan kebanggaan budaya. Setiap detail yang tercetak adalah penghormatan terhadap arsitektur aslinya."
            format: "75–90 detik. Struktur: tampilkan foto bangunan asli → proses modeling singkat (screen recording) → printer berjalan time-lapse (highlight lapisan per lapisan) → post-processing (support removal, sanding, painting) → reveal miniatur final. Vertikal 9:16."
            boleh:
              - "Bandingkan foto bangunan asli dengan miniatur yang dicetak dalam satu frame"
              - "Angka yang mengesankan: durasi print, jumlah lapisan, ukuran file"
              - "Tampilkan detail arsitektur yang berhasil ditangkap printer dengan baik"
              - "Reveal: miniatur diletakkan di rak atau dijadikan desk display yang estetik"
            hindari:
              - "Jangan tampilkan miniatur dengan kualitas cetak buruk sebagai produk final"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan klaim model yang kamu desain sendiri jika menggunakan file dari Thingiverse tanpa credit"
              - "Jangan skip proses post-processing — finishing adalah yang membuat miniatur terlihat premium"
            pola_hook: "Detik 0: foto bangunan ikonik yang dikenal luas + teks 'aku print ini dalam skala 1:500'. Langsung cut ke printer berjalan di detik 3."
            contoh_judul:
              - "Aku print Borobudur dalam skala 1:500 — printer berjalan 47 jam non-stop"
              - "Miniatur Monas ini lebih detail dari yang dijual di toko souvenir, dan aku buat sendiri"
              - "Rumah adat Toraja ini aku modeling dari foto asli dan cetak dalam seminggu"
              - "Print Masjid Istiqlal dalam skala kecil — detail kubah yang berhasil tertangkap mengejutkan"
              - "Koleksi rumah adat Indonesia dari 34 provinsi — satu printer, setahun proyek"
            content_runway: "Indonesia punya ratusan bangunan ikonik (Borobudur, Prambanan, Monas, masjid bersejarah, rumah adat 34 provinsi, benteng kolonial) yang masing-masing bisa jadi satu proyek; setiap bangunan bisa dicetak dalam skala, material, dan tingkat detail berbeda."

    - slug: photography
      name: "Fotografi / Editing"
      description: "Tips foto, edit, before-after."
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: before-after + tutorial
      example_hook: "Foto HP biasa jadi pro dengan..."
      guide:
        audience: "Penonton 18–35 yang ingin foto mereka terlihat lebih baik; kreator konten pemula yang frustrasi dengan kualitas foto; fotografer amatir yang ingin naik level tanpa beli kamera mahal."
        tone: "Memberdayakan dan praktis. Setiap video memberikan satu insight atau teknik yang bisa langsung diterapkan. Penonton harus merasa 'saya bisa lakukan ini sekarang' setelah menonton."
        format: "45–75 detik. Before-after adalah inti — tampilkan foto sebelum dan sesudah dengan perbedaan yang jelas. Struktur: foto biasa/buruk → penjelasan masalah → teknik atau edit → foto yang lebih baik. Screen recording untuk editing, real demo untuk teknik lapangan. Vertikal 9:16."
        boleh:
          - "Before-after yang kontrasnya sangat jelas — keduanya harus tampil di video"
          - "Gunakan foto yang bisa diambil oleh siapapun dengan HP biasa untuk relevansi"
          - "Tampilkan satu teknik per video — fokus lebih kuat dari banyak tips sekaligus"
          - "Teks overlay menjelaskan parameter yang diubah (suhu warna +40, exposure -0.5)"
        hindari:
          - "Jangan gunakan software berbayar tanpa menyebut alternatif gratis"
          - "Jangan tampilkan wajah — channel ini faceless (tangan dan layar saja)"
          - "Jangan pilih foto yang perbedaan before-after-nya kecil — dampak visual harus dramatis"
          - "Jangan klaim hasil bisa dicapai dengan HP entry-level jika sebenarnya butuh hardware yang lebih baik"
        pola_hook: "Detik 0: tampilkan foto biasa-biasa yang bisa diambil siapapun + teks 'sama HP, beda teknik'. Cut ke hasil foto yang jauh lebih baik di detik 2, lalu proses bagaimana."
        contoh_judul:
          - "Foto ini dari HP yang sama, tapi yang kanan pakai satu teknik yang kiri tidak"
          - "5 slider di Lightroom gratis ini mengubah foto HP jadi terlihat kamera mirrorless"
          - "Aturan komposisi ini bikin foto kamu langsung lebih baik tanpa edit apapun"
      micro:
        - slug: photography-lightroom-preset-lokal
          name: Editing Foto dengan Tone Warna Estetik Indonesia
          description: Tutorial Lightroom mobile untuk menciptakan tone warna yang cocok dengan lanskap dan cahaya Indonesia — golden hour tropis, tone hijau hutan — dengan preset yang bisa diunduh.
          example_hook: "Foto biasa ini diubah dengan 5 slider di Lightroom gratis, sebelum dan sesudahnya..."
          guide:
            audience: "Kreator konten dan fotografer pemula 18–30 yang ingin tone foto yang konsisten dan estetik; pengguna Instagram dan TikTok yang sadar pentingnya estetika feed; fotografer mobile yang ingin looks profesional."
            tone: "Praktis dan visual-driven. Penonton hadir karena mereka melihat hasil foto yang bagus dan ingin mencapai hal yang sama. Setiap video adalah jalan pintas menuju estetika yang selama ini dilihat di akun-akun besar."
            format: "50–70 detik. Screen recording Lightroom mobile dengan tangan di frame. Struktur: foto asli → import ke Lightroom → adjustment bertahap (setiap slider diperlihatkan) → before-after wipe → tampilkan preset nilai akhir. Vertikal 9:16."
            boleh:
              - "Sebutkan nilai slider yang tepat sebagai teks overlay — konkret dan actionable"
              - "Gunakan foto yang bisa diambil siapapun (makanan, pantai, pegunungan Indonesia)"
              - "Before-after wipe reveal selalu memuaskan — gunakan di tengah dan di akhir"
              - "Tawaran download preset di caption untuk engagement dan follow"
            hindari:
              - "Jangan gunakan Lightroom versi desktop tanpa menyebut bahwa mobile version sudah cukup"
              - "Jangan tampilkan wajah — channel ini faceless (layar dan tangan saja)"
              - "Jangan edit foto sampai terlihat tidak realistis — tone harus masih natural"
              - "Jangan pilih foto dengan masalah exposure terlalu ekstrem yang tidak bisa diperbaiki di edit"
            pola_hook: "Detik 0: foto asli yang flat dan biasa + teks 'sebelum'. Wipe reveal ke foto setelah editing yang dramatis di detik 2. Lalu mulai tutorial dari awal."
            contoh_judul:
              - "5 slider ini ubah foto pantai Indonesia jadi terlihat dari majalah travel"
              - "Tone warna golden hour tropis — cara repro look ini di Lightroom mobile gratis"
              - "Foto hutan Indonesia jadi cinematik dengan 3 adjustment ini, tanpa preset berbayar"
              - "Feed Instagram yang konsisten dari satu preset — ini nilai-nilainya untuk cahaya Indonesia"
              - "Foto sore hari di Indonesia selalu bisa bagus dengan tweak ini, ini buktinya"
            content_runway: "Setiap kondisi cahaya (golden hour, siang terik, mendung, indoor), setiap subjek foto (lanskap, kuliner, portrait tanpa wajah, arsitektur, street), dan setiap mood estetik (warm, moody, bright, matte) menghasilkan tutorial yang berbeda."

        - slug: photography-golden-hour-hp
          name: Teknik Foto Golden Hour Hanya dengan HP
          description: Panduan teknis memaksimalkan cahaya golden hour untuk foto dramatis menggunakan smartphone, termasuk posisi, sudut, dan pengaturan kamera bawaan yang sering diabaikan.
          example_hook: "Foto HP ini dikira pakai kamera mirrorless Rp20jt, ini tekniknya yang bisa kamu coba hari ini..."
          guide:
            audience: "Pengguna HP 18–35 yang frustrasi foto mereka tidak seindah yang dilihat di Instagram; penonton yang tidak ingin beli kamera mahal tapi ingin hasil dramatis; creator konten yang sadar pentingnya cahaya."
            tone: "Mengungkap dan memberdayakan. 'Kamu sudah punya semua yang dibutuhkan' adalah inti pesan. Cahaya gratis, HP ada di saku — tinggal tahu caranya."
            format: "50–70 detik. Demonstrasi langsung di luar ruangan saat golden hour atau simulasinya. Struktur: tampilkan foto yang dianggap mustahil dari HP → tunjukkan setting HP yang diubah → posisi dan sudut yang digunakan → hasil foto. Real demo, bukan hanya penjelasan. Vertikal 9:16."
            boleh:
              - "Demo langsung di lapangan lebih kuat dari slideshow teknik"
              - "Tampilkan perbedaan foto dari sudut yang berbeda dalam kondisi cahaya yang sama"
              - "Tunjukkan setting kamera manual HP (ISO, shutter) yang biasanya diabaikan"
              - "Tampilkan bayangan dan siluet sebagai teknik yang mudah dan selalu keren di golden hour"
            hindari:
              - "Jangan tampilkan teknik yang hanya bisa dilakukan di HP flagship mahal"
              - "Jangan tampilkan wajah — channel ini faceless (tangan memegang HP, foto di layar)"
              - "Jangan hanya teori — setiap teknik harus ada demo dan contoh foto hasilnya"
              - "Jangan rekam di kondisi cahaya yang tidak bisa direplikasi penonton"
            pola_hook: "Detik 0: tampilkan foto dramatis golden hour + teks 'ini dari HP biasa'. Penonton langsung skeptis dan penasaran — langsung masuk ke cara di detik 2."
            contoh_judul:
              - "Foto siluet golden hour ini dari HP seharga Rp2jt, ini posisi dan setting-nya"
              - "Kenapa foto kamu di sore hari tidak pernah sebagus yang kamu bayangkan — dan cara fixnya"
              - "Satu setting di kamera HP ini mengubah foto sore jadi sinematik — 90% orang tidak tahu"
              - "Posisi ini di golden hour selalu hasilkan foto yang dikira pakai kamera mahal"
              - "HP apapun bisa hasilkan foto golden hour dramatis dengan teknik sederhana ini"
            content_runway: "Setiap kondisi cahaya unik di Indonesia (golden hour tropis, cahaya pantai, cahaya pegunungan, cahaya urban), setiap jenis subjek, dan setiap teknik (siluet, bayangan, refleksi, lens flare) menghasilkan tutorial berbeda yang bisa diproduksi setiap hari cerah."

        - slug: photography-komposisi-otomatis
          name: Aturan Komposisi yang Bikin Foto Langsung Lebih Baik
          description: Penjelasan visual 5 aturan komposisi fotografi yang bisa langsung diterapkan siapapun tanpa pengetahuan teknis kamera — rule of thirds, leading lines, dan framing.
          example_hook: "Foto ini biasa, foto ini luar biasa. Satu-satunya beda adalah aturan komposisi ini..."
          guide:
            audience: "Pemula fotografi 16–30 yang ingin foto mereka 'lebih bagus' tapi tidak tahu kenapa foto orang lain lebih menarik; penonton yang belum pernah formal belajar fotografi; kreator konten yang sadar feed mereka perlu diperbaiki."
            tone: "Sederhana dan langsung ke intinya. Setiap aturan dijelaskan dalam satu kalimat dan langsung didemonstrasikan sebelum-sesudah. Tidak ada teori panjang — visual proof yang bicara."
            format: "45–65 detik. Satu aturan komposisi per video, didemonstrasikan dengan dua foto perbandingan: yang melanggar aturan vs yang menerapkan aturan. Struktur: tampilkan dua foto → highlight perbedaan → penjelasan singkat aturan → contoh aplikasi lain. Vertikal 9:16."
            boleh:
              - "Before-after yang jelas dan kontras — satu foto terasa biasa, satu lagi menarik"
              - "Grid overlay atau garis panduan di foto untuk visualisasi aturan"
              - "Gunakan foto dari lokasi yang dikenal di Indonesia untuk relevansi"
              - "Satu aturan per video — lebih mudah diingat dan diterapkan"
            hindari:
              - "Jangan jejalkan 5 aturan dalam satu video — terlalu banyak tidak mudah diterapkan"
              - "Jangan tampilkan wajah — channel ini faceless (gambar dan layar saja)"
              - "Jangan gunakan foto dari luar Indonesia yang tidak dikenal audiens"
              - "Jangan terlalu teknis — aturan komposisi harus bisa dijelaskan dalam satu kalimat"
            pola_hook: "Detik 0: dua foto berdampingan — satu biasa satu menarik — dari subjek yang sama + teks 'satu aturan yang membedakan keduanya'. Penonton langsung penasaran aturan apa itu."
            contoh_judul:
              - "Dua foto ini diambil dari posisi yang sama, tapi yang kanan punya aturan komposisi ini"
              - "Rule of thirds ini bikin foto kamu langsung lebih menarik tanpa edit apapun"
              - "Leading lines — aturan komposisi yang bikin mata penonton ikut ke mana kamu arahkan"
              - "Kenapa foto kamu selalu terasa 'ada yang kurang' — ini jawaban yang sebenarnya"
              - "Framing dengan elemen alami: teknik komposisi yang bisa kamu terapkan di mana saja"
            content_runway: "Ada minimal 20 aturan komposisi klasik (rule of thirds, golden ratio, leading lines, framing, symmetry, negative space, depth, dll) yang masing-masing bisa jadi satu video; setiap aturan bisa didemonstrasikan dengan berbagai subjek foto berbeda."
