            pola_hook: "Detik 0: mulai dari detail yang paling tidak masuk akal dalam hilangnya seseorang — 'Dia hilang di tengah keluarganya dan kamera tidak menangkap apapun...' — sebelum kronologi lengkap."
            contoh_judul:
              - "Dia hilang di depan matanya sendiri dan tidak ada yang bisa jelaskan apa yang terjadi"
              - "Kasus orang hilang ini sudah 15 tahun tapi keluarganya masih temukan clue baru setiap tahun"
              - "Hilang di kerumunan ramai dan tidak ada satu pun saksi yang ingat melihatnya"
              - "Cold case Indonesia ini punya satu detail yang tidak pernah masuk ke berita manapun"
              - "Semua jejak digitalnya berhenti di titik ini dan tidak ada yang tahu kenapa"
            content_runway: "Kasus orang hilang yang belum terpecahkan ada di setiap negara dan dekade; Indonesia sendiri punya ratusan kasus cold case yang belum pernah dibahas di format pendek yang aksesibel."

        - slug: mystery-fenomena-tak-terpecahkan
          name: Fenomena Alam Tak Terpecahkan
          description: Fenomena fisik dan alam yang belum ada penjelasan sains pasti, disajikan dengan nada penasaran bukan sensasional.
          example_hook: "Kejadian ini terekam ratusan kali tapi sains belum bisa jelaskan..."
          guide:
            audience: "Penonton 17–30 yang suka konten sains kasual dengan elemen misterius; mereka yang ingin terasa pintar setelah menonton; penonton yang menikmati 'sains belum tahu ini' sebagai pemantik rasa ingin tahu."
            tone: "Penasaran dan berbasis fakta. Bukan horor, bukan konspirasi — murni rasa takjub bahwa sains masih punya batas. Nada seperti presenter sains yang jujur soal ketidaktahuannya."
            format: "45–75 detik. Voiceover dengan teks fakta kunci onscreen. Footage fenomena yang relevan (jika ada rekaman asli atau simulasi) atau B-roll alam. Musik ambient penasaran. Hard-sub."
            boleh:
              - "Bedakan dengan jelas antara 'belum terpecahkan' dan 'tidak ada penjelasannya sama sekali'"
              - "Sertakan teori ilmiah yang paling diterima saat ini, sekalipun belum konklusif"
              - "Gunakan analogi sederhana untuk membuat fenomena kompleks mudah dipahami"
              - "Akhiri dengan pertanyaan terbuka yang mendorong penonton mencari tahu lebih lanjut"
            hindari:
              - "Jangan klaim fenomena sebagai bukti UFO, supernatural, atau konspirasi tanpa dasar"
              - "Jangan gunakan footage yang sudah terbukti hoaks"
              - "Jangan oversimplify fenomena yang butuh konteks ilmiah untuk dipahami"
              - "Jangan diskreditkan upaya ilmuwan untuk menjelaskan fenomena ini"
            pola_hook: "Detik 0: nyatakan bahwa sains belum punya jawaban untuk ini, lalu segera deskripsikan fenomenanya — 'Kejadian ini terekam ratusan kali di seluruh dunia dan sains belum punya jawaban resminya...'"
            contoh_judul:
              - "Fenomena ini terekam ratusan kali di seluruh dunia dan sains masih belum punya penjelasan"
              - "Suara bawah laut ini terdengar di seluruh samudra dan tidak ada yang tahu sumbernya"
              - "Pola ini muncul di tempat berbeda tanpa koneksi dan ilmuwan masih belum setuju kenapa"
              - "Fenomena alam Indonesia ini dicatat sejak abad ke-18 tapi masih misteri sampai sekarang"
              - "Rekaman ini valid secara ilmiah tapi tidak bisa dijelaskan dengan fisika yang ada"
            content_runway: "Sains selalu menghasilkan fenomena baru yang belum terpecahkan; kombinasi fenomena lama yang belum resolved, studi baru yang mempertanyakan teori lama, dan fenomena lokal Indonesia yang belum pernah dibahas menciptakan pipeline yang panjang."

        - slug: mystery-konspirasi-terverifikasi
          name: Konspirasi yang Ternyata Nyata
          description: Teori konspirasi masa lalu yang akhirnya terbukti benar dengan dokumen resmi, memberi penonton rasa validasi dan kejutan.
          example_hook: "Dulu dianggap gila karena percaya ini, sekarang dokumen resmi membuktikannya..."
          guide:
            audience: "Penonton 20–35 yang skeptis tapi terbuka; mereka yang pernah dianggap 'lebay' karena meragukan narasi resmi; penonton yang suka konten yang memberi mereka rasa 'aku sudah bilang kan'."
            tone: "Faktual dan memuaskan. Bukan gloating — tapi ada kepuasan yang jelas saat fakta tersembunyi akhirnya terungkap. Serius dan berbasis dokumen, bukan sensasional."
            format: "60–90 detik. Voiceover naratif di atas footage arsip atau dokumen yang ter-declassify. Teks timeline onscreen dari 'teori' ke 'terbukti'. Musik ambient yang sedikit ironis. Hard-sub penuh."
            boleh:
              - "Sertakan sumber dokumen resmi yang membuktikan — nomor dokumen, tahun declassified"
              - "Bandingkan reaksi publik saat ini vs saat konspirasi pertama kali muncul"
              - "Fokus pada konspirasi yang sudah 100% terbukti, bukan yang masih dalam teori"
              - "Jelaskan mengapa ini relevan untuk masa kini — bukan hanya trivia sejarah"
            hindari:
              - "Jangan campur konspirasi yang sudah terbukti dengan yang masih teori dalam satu video"
              - "Jangan gunakan konspirasi sebagai gateway untuk mendorong teori berbahaya lainnya"
              - "Jangan exaggerate seberapa banyak yang tahu di masa lalu — tetap akurat"
              - "Jangan sajikan sebagai bukti bahwa semua pemerintah berbohong tentang segalanya"
            pola_hook: "Detik 0: mulai dari persepsi umum saat itu — 'Dulu dianggap gila karena percaya ini...' — lalu segera reveal bahwa dokumen resmi telah membuktikan kebenaran teori tersebut."
            contoh_judul:
              - "Dulu dianggap gila karena percaya ini, sekarang ada dokumen resmi yang membuktikannya"
              - "Teori konspirasi ini ditertawakan selama 20 tahun sampai arsip ini dibuka ke publik"
              - "Pemerintah ini memang tahu tentang itu dan dokumen yang baru declassified membuktikannya"
              - "Semua yang dibilang conspiracy theorist tentang program ini ternyata lebih dekat dari yang diakui"
              - "Konspirasi Indonesia ini akhirnya punya bukti resminya dan tidak ada yang bahas"
            content_runway: "Sejarah penuh dengan operasi pemerintah, eksperimen rahasia, dan perjanjian tersembunyi yang akhirnya terungkap; arsip yang baru-baru ini dibuka di berbagai negara terus menghasilkan konten baru."

    - slug: plot-recap
      name: "Recap Film / Alur"
      description: Ringkas alur film/series.
      faceless: true
      difficulty: menengah
      rpm: rendah
      formats: "klip film + voiceover (hati2 hak cipta)"
      example_hook: "Pria ini dipenjara 15 tahun tanpa alasan..."
      guide:
        audience: "Penonton 17–32 yang ingin tahu isi film tanpa nonton penuh; mereka yang sudah nonton dan ingin recap untuk diskusi; penonton yang cari rekomendasi film pendek sebelum memutuskan menonton."
        tone: "Energik dan efisien. Setiap kata dalam voiceover punya fungsi — tidak ada padding. Seperti teman yang menceritakan film dengan antusias tapi tidak spoil ending sebelum waktunya."
        format: "60–90 detik. Voiceover cepat di atas klip film atau ilustrasi. Hard-sub setiap kalimat. Musik yang membangun mood sesuai genre film (tegang untuk thriller, emosional untuk drama). Hati-hati hak cipta — blur wajah aktor jika perlu atau gunakan footage minimal."
        boleh:
          - "Strukturkan sebagai: setup tokoh → konflik → turning point → outcome (tanpa spoil akhir jika tujuan rekomendasi)"
          - "Fokus pada satu atau dua elemen paling menarik dari film untuk memancing rasa ingin nonton"
          - "Untuk recap penuh, akhiri dengan analisis singkat kenapa film ini layak tonton atau tidak"
          - "Gunakan judul original film dalam Bahasa Indonesia untuk SEO lokal"
        hindari:
          - "Jangan gunakan klip film berlebihan yang bisa kena copyright claim — voiceover + sedikit B-roll lebih aman"
          - "Jangan recap film yang sedang tayang di bioskop tanpa disclaimer spoiler jelas"
          - "Jangan tambahkan opini pribadi yang terlalu panjang — ini recap, bukan review"
          - "Jangan salah eja nama tokoh atau judul film — penonton hardcore akan langsung pergi"
        pola_hook: "Detik 0: mulai dari momen paling dramatis atau pertanyaan terbesar dalam film — bukan dari 'Film ini dirilis tahun...' atau 'Hari ini kita bahas...' Langsung ke konflik."
        contoh_judul:
          - "Pria ini dipenjara 15 tahun untuk kejahatan yang tidak dia lakukan dan ini yang terjadi"
          - "Film ini memiliki twist ending yang tidak akan kamu terima jika tidak tahu konteksnya"
          - "Arc ini bikin jutaan penonton menangis dan ini kenapa kalau kamu belum tonton"
      micro:
        - slug: plot-recap-film-indonesia
          name: Recap Film Indonesia Klasik & Baru
          description: Ringkasan alur film Indonesia dari era klasik hingga terkini dengan konteks budaya, menyasar penonton yang ingin nostalgia atau tahu sinopsis sebelum nonton.
          example_hook: "Film ini meraih 5 juta penonton, dan ini alasan sebenarnya kenapa..."
          guide:
            audience: "Penonton Indonesia 18–35 yang cinta film lokal; mereka yang ingin nostalgia dengan film lama atau cari info film baru sebelum beli tiket; komunitas film Indonesia yang aktif berdiskusi di media sosial."
            tone: "Cinta film dan penuh rasa hormat pada sineas Indonesia. Ada kebanggaan lokal tapi jujur soal kualitas — tidak over-praise dan tidak unduly harsh."
            format: "60–90 detik. Voiceover dengan klip resmi (gunakan minimal, prioritaskan footage promo resmi). Hard-sub. Musik sesuai genre film yang direcap. Teks judul film, tahun, dan sutradara di awal."
            boleh:
              - "Sertakan konteks budaya yang membuat film Indonesia unik — apa yang tidak bisa dibuat di negara lain"
              - "Untuk film klasik, tambahkan konteks era produksi untuk penonton muda"
              - "Rekomendasikan siapa yang akan menikmati film ini — target audiens yang spesifik"
              - "Akhiri dengan rating singkat atau apakah layak ditonton ulang"
            hindari:
              - "Jangan gunakan klip film berlebihan yang bisa kena DMCA"
              - "Jangan spoil twist ending tanpa warning jelas di awal video"
              - "Jangan membandingkan film Indonesia dengan film asing secara dismissif"
              - "Jangan recap film yang belum izin tayang resmi"
            pola_hook: "Detik 0: mulai dari fakta atau momen paling memukau dari film — pencapaian penonton, award, atau adegan ikonik — bukan dari informasi produksi."
            contoh_judul:
              - "Film Indonesia ini tembus 5 juta penonton dan ini yang bikin orang rela nonton dua kali"
              - "Film klasik Indonesia tahun 90-an ini ternyata punya lapisan yang tidak disadari saat itu"
              - "Sutradara ini buat twist ending yang tidak akan kamu terima tanpa tonton dari awal"
              - "Film horror Indonesia ini lebih menakutkan dari versi Hollywood yang menginspirasinya"
              - "Ini alasan kenapa film Indonesia ini masih relevan 20 tahun setelah rilisnya"
            content_runway: "Indonesia menghasilkan ratusan film per tahun ditambah puluhan tahun arsip film klasik yang belum pernah di-recap dalam format short-form modern; komunitas film Indonesia sangat aktif dan selalu mencari konten."

        - slug: plot-recap-anime-populer
          name: Recap Anime Populer dalam Bahasa Indonesia
          description: Ringkasan arc atau season anime populer dalam narasi Bahasa Indonesia yang ringkas, untuk penonton anime yang ketinggalan atau ingin refresh ingatan.
          example_hook: "Arc ini bikin jutaan penonton nangis, ini kenapa..."
          guide:
            audience: "Penonton anime Indonesia 16–28 yang mengikuti anime populer; mereka yang ketinggalan episode atau ingin refresh sebelum season baru; penonton yang ingin berdiskusi tapi butuh konteks dulu."
            tone: "Antusias dan penuh energi. Seperti teman sesama weeb yang excited cerita. Ada rasa cinta terhadap materi sumbernya — bukan sekadar merangkum."
            format: "60–90 detik. Voiceover energik di atas footage anime resmi atau ilustrasi fanart (dengan credit). Hard-sub. Musik dari anime itu sendiri jika royalty-free, atau OST ambient alternatif. Nama karakter di teks onscreen saat pertama disebut."
            boleh:
              - "Gunakan nama karakter dengan benar — konsistensi antara nama Jepang dan terjemahan Indonesia"
              - "Sertakan konteks arc sebelumnya jika diperlukan untuk memahami arc yang di-recap"
              - "Tambahkan reaksi atau analisis singkat mengapa momen ini impactful"
              - "Tag dan recap konten yang lagi trending untuk riding momentum"
            hindari:
              - "Jangan spoil arc berikutnya jika recap ini untuk penonton yang belum sampai"
              - "Jangan salah eja nama karakter atau judul — komunitas anime sangat perhatian terhadap detail"
              - "Jangan gunakan footage anime berlebihan yang pasti kena copyright"
              - "Jangan buat recap yang terlalu panjang — 60–90 detik sudah harus cukup untuk satu arc"
            pola_hook: "Detik 0: mulai dari momen paling ikonik atau emosional dari arc — 'Arc ini bikin jutaan penonton nangis...' — sebelum mundur ke setup."
            contoh_judul:
              - "Arc ini bikin jutaan penonton nangis dan ini kenapa kalau kamu belum tonton"
              - "Season terbaru anime ini punya plot twist yang tidak ada yang prediksi sebelumnya"
              - "Karakter ini bilang satu kalimat di episode 1 yang maknanya baru jelas di episode 24"
              - "Anime ini terasa biasa di 3 episode pertama tapi alasan orang gak berhenti nonton ada di sini"
              - "Momen terbaik dari finale arc ini dan kenapa kreatornya berani ambil keputusan itu"
            content_runway: "Anime baru terus rilis setiap season dengan puluhan judul aktif; ditambah backlog ratusan anime lama yang belum pernah di-recap dalam Bahasa Indonesia, pipeline konten ini hampir tidak ada batasnya."

        - slug: plot-recap-twist-ending
          name: Film dengan Twist Ending Gila
          description: Khusus membahas film dan series dengan plot twist mengejutkan, dianalisis dengan penjelasan detail apa yang sebenarnya terjadi.
          example_hook: "Kamu pasti miss detail ini di menit ke-12 yang ubah segalanya..."
          guide:
            audience: "Penonton film 18–32 yang suka tebak-tebakan plot twist; mereka yang sudah nonton film tapi masih bingung dengan ending; penonton yang suka re-watch film setelah tahu twistnya."
            tone: "Detektif yang excited menemukan clue. Ada rasa kepuasan saat menjelaskan sesuatu yang membingungkan menjadi jelas. Tidak menghakimi penonton yang miss detail — tapi menunjukkan dengan excited."
            format: "60–90 detik. Voiceover dengan teks penjelasan onscreen di momen kunci. Minimal footage — cukup untuk konteks, tidak sampai kena copyright. Hard-sub. Musik yang membangun ketegangan menjelang reveal penjelasan."
            boleh:
              - "Tunjukkan clue yang ada di film jauh sebelum twist — retrospective adalah kekuatan konten ini"
              - "Gunakan timestamp atau deskripsi lokasi adegan untuk membantu penonton yang ingin rewatch"
              - "Beri warning spoiler yang jelas di awal — tidak semua orang sudah nonton"
              - "Tawarkan interpretasi alternatif jika twist punya multiple reading yang valid"
            hindari:
              - "Jangan skip warning spoiler — ini konten spoiler by nature"
              - "Jangan gunakan klip film yang terlalu panjang — deskripsi naratif lebih aman dari copyright"
              - "Jangan over-explain sampai kehilangan elemen kejutan untuk penonton yang baru tahu"
              - "Jangan cover film yang terlalu obscure sampai tidak ada penonton yang akan relate"
            pola_hook: "Detik 0: mulai dari clue tersembunyi yang paling tidak disadari — 'Kamu pasti miss detail ini di menit ke-12...' — sebelum reveal apa twistnya."
            contoh_judul:
              - "Kamu pasti miss detail di menit ke-12 ini yang mengubah arti semua adegan sebelumnya"
              - "Twist ending film ini sudah dihint dari menit pertama tapi tidak ada yang sadari"
              - "Penjelasan ending film ini yang membingungkan dan kenapa interpretasi ini paling masuk akal"
              - "Tonton film ini dua kali dan kamu akan lihat ini adalah film yang berbeda sama sekali"
              - "Detail kecil di background adegan ini yang membuktikan karakter ini tidak bohong dari awal"
            content_runway: "Film baru dengan twist ending rilis setiap bulan; ditambah backlog film klasik seperti Fight Club, The Sixth Sense, dan ratusan film Indonesia yang twist-nya belum pernah dianalisis mendalam dalam format pendek Bahasa Indonesia."
