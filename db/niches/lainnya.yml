version: 1
vertical:
  slug: v-lainnya
  name: Lainnya
  description: Konten yang tidak masuk kategori utama — berkebun, buku, kuis interaktif, dan kompilasi tematik.
  guide:
    audience: "Penonton 18–40 Indonesia yang serba ingin tahu dan punya minat beragam; tidak terikat satu niche kuat, tapi loyal pada creator yang konsisten menyajikan konten berkualitas tentang hal-hal sehari-hari yang sering diabaikan."
    tone: "Kasual dan ingin tahu. Tidak perlu dramatis atau viral-bait — cukup autentik, informatif, dan mudah dicerna. Gaya bicara teman yang tahu banyak tanpa menggurui."
    format: "Variatif tergantung niche: voiceover + b-roll untuk edukasi, teks + reveal untuk kuis, time-lapse + before-after untuk gardening, dan klip + caption untuk kompilasi. Durasi 30–90 detik, vertikal 9:16 kecuali ada catatan khusus."
    boleh:
      - "Gabungkan edukasi ringan dengan hiburan — penonton datang untuk belajar tapi tetap mau terhibur"
      - "Gunakan contoh lokal Indonesia yang relevan untuk memperkuat koneksi emosional"
      - "Format kuis dan interaksi dorong komentar yang meningkatkan engagement organik"
      - "Kompilasi dan ringkasan buku bisa dijadikan seri untuk membangun habit tonton yang berkelanjutan"
    hindari:
      - "Jangan buat konten yang terlalu niche sampai kehilangan audiens umum"
      - "Jangan klaim fakta atau saran tanpa dasar — kredibilitas di vertikal ini mudah rusak"
      - "Jangan pakai musik ber-hak-cipta pada format yang tidak memerlukannya"
      - "Jangan buat hook yang overpromise tapi kontennya underdeliver"
    pola_hook: "Detik 0–3: tunjukkan hasil yang menarik atau ajukan pertanyaan yang membuat penonton tidak bisa skip (bukan clickbait, tapi rasa ingin tahu yang jujur)."
    contoh_judul:
      - "Hal ini ada di sekitar kamu setiap hari tapi kamu tidak pernah perhatikan"
      - "Coba tebak ini, 90% orang Indonesia ternyata salah"
      - "Satu hal sederhana yang bisa dimulai hari ini dan hasilnya terlihat dalam seminggu"

  niches:
    - slug: gardening
      name: "Berkebun / Tanaman"
      description: "Tips tanaman, urban farming."
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: time-lapse + POV + voiceover
      example_hook: "Tanam ini sekali, panen selamanya..."
      guide:
        audience: "Penghuni kota 22–40 yang ingin berkebun tapi merasa tidak punya cukup lahan atau waktu; generasi muda yang tertarik gaya hidup berkelanjutan; pemilik kos atau apartemen yang ingin membuat ruangnya lebih hijau."
        tone: "Sabar dan encouraging. Gardening terasa menakutkan bagi pemula — nada harus selalu meyakinkan penonton bahwa mereka bisa melakukannya, dengan langkah yang mudah diikuti dan hasil yang terlihat nyata."
        format: "45–90 detik. Time-lapse pertumbuhan sangat efektif untuk kepuasan visual. POV tangan menanam, menyiram, dan memanen membangun koneksi personal. Voiceover singkat untuk konteks. Vertikal 9:16."
        boleh:
          - "Tampilkan hasil nyata — tanaman yang sudah tumbuh atau panen yang bisa dimakan"
          - "Gunakan tanaman yang mudah ditemukan di pasar atau toko online Indonesia"
          - "Time-lapse pertumbuhan 1–4 minggu adalah konten paling memuaskan di niche ini"
          - "Beri estimasi biaya awal yang jujur dan rendah untuk menurunkan barrier entry"
        hindari:
          - "Jangan rekomendasikan tanaman atau produk yang sulit ditemukan di Indonesia"
          - "Jangan tampilkan wajah jika channel ini dirancang faceless"
          - "Jangan skip kegagalan — penonton lebih percaya creator yang jujur tentang trial and error"
          - "Jangan gunakan jargon botani yang tidak perlu — tujuannya mengajak, bukan mengajar akademis"
        pola_hook: "Detik 0: tampilkan hasil akhir (tanaman subur atau panen) + teks 'dari benih kecil dalam X minggu'. Langsung masuk ke langkah pertama di detik 3."
        contoh_judul:
          - "Tanam ini sekali di polybag dan panen setiap minggu selama setahun"
          - "Urban farming di balkon 1 meter — setup yang sudah aku pakai 6 bulan"
          - "Tanaman ini gratis diperbanyak dari satu pot yang sudah ada"
      micro:
        - slug: gardening-polybag-balkon-sempit
          name: Urban Farming di Balkon Sempit dengan Polybag
          description: Panduan menanam sayuran produktif di balkon kos atau apartemen menggunakan polybag murah, membuktikan urban farming bisa dimulai dengan lahan kurang dari 2 meter persegi.
          example_hook: "Balkon 1x2 meter ini hasilkan sayuran cukup untuk seminggu, ini setup-nya..."
          guide:
            audience: "Penghuni kos dan apartemen 20–35 yang ingin menanam tapi tidak punya halaman; mahasiswa dan pekerja muda yang tertarik ketahanan pangan skala kecil; penonton yang terinspirasi konten sustainable living."
            tone: "Praktis dan memotivasi. Setiap tantangan (lahan sempit, anggaran terbatas) dijawab dengan solusi konkret. Penonton harus merasa bahwa ini bisa dilakukan mulai hari ini tanpa persiapan besar."
            format: "60–90 detik. Tunjukkan setup balkon nyata (bukan studio) → susun polybag dan media tanam → tanam → time-lapse pertumbuhan → panen kecil pertama. Vertikal 9:16, close-up tangan dan tanaman."
            boleh:
              - "Tampilkan total biaya setup di awal — transparansi biaya adalah daya tarik utama"
              - "Gunakan sayuran cepat panen (kangkung, bayam, selada) agar time-lapse tidak terlalu panjang"
              - "Before-after balkon kosong vs balkon penuh polybag hijau sangat efektif"
              - "Sebutkan merk polybag, tanah, dan pupuk yang mudah ditemukan di Tokopedia atau Shopee"
            hindari:
              - "Jangan rekomendasikan setup yang butuh balkon besar atau peralatan mahal"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan skip kegagalan awal — kreator yang jujur lebih dipercaya"
              - "Jangan gunakan tanaman hias yang tidak bisa dipanen — kurangi relevansi praktis"
            pola_hook: "Detik 0: tampilkan balkon kecil penuh tanaman hijau dari atas + teks 'lahan 1x2 meter, panen setiap minggu'. Langsung tunjukkan polybag dan media tanam di detik 3."
            contoh_judul:
              - "Balkon kos 1x2 meter ini hasilkan sayuran cukup untuk seminggu, ini setup-nya"
              - "Urban farming polybag dari Rp150rb — sudah 4 bulan panen bayam sendiri"
              - "Kangkung di balkon apartemen lantai 12 — ini yang aku pelajari setelah 3 bulan"
              - "Setup urban farming terkecil yang masih produktif, tes di balkon sempit"
              - "Dari polybag pertama sampai panen pertama — timeline jujur urban farming pemula"
            content_runway: "Setiap jenis sayuran, metode tanam (polybag, hidroponik sederhana, pot bekas), musim, dan level pengalaman pemula menghasilkan video yang berbeda; komunitas urban farming Indonesia terus berkembang dan selalu butuh konten pemula."

        - slug: gardening-tanaman-pengusir-nyamuk
          name: Tanaman Hias yang Sekaligus Pengusir Nyamuk
          description: Panduan menanam tanaman yang terbukti mengusir nyamuk secara alami sambil tetap estetik sebagai tanaman hias dalam ruangan, relevan untuk iklim tropis Indonesia.
          example_hook: "Tanaman ini sudah aku tanam 3 bulan di kamar dan nyamuk benar-benar berkurang..."
          guide:
            audience: "Penghuni rumah dan kos 20–45 yang terganggu nyamuk dan tidak ingin bergantung pada obat nyamuk kimia; orangtua muda yang ingin solusi aman untuk anak; penonton yang tertarik gaya hidup alami."
            tone: "Informatif dan meyakinkan. Klaim tentang efektivitas harus disampaikan dengan jujur dan berbasis bukti — hindari hiperbola. Nada teman yang sudah mencoba dan berbagi pengalaman nyata."
            format: "45–75 detik. Tunjukkan tanaman yang sudah tumbuh → close-up daun atau bunga khas → penjelasan singkat kenapa mengusir nyamuk → cara tanam dan perawatan minimal. Voiceover atau teks overlay. Vertikal 9:16."
            boleh:
              - "Tampilkan perbandingan sebelum dan sesudah menggunakan tanaman (anekdotal, bukan klaim medis)"
              - "Sebut tanaman dengan nama Indonesia yang umum dikenal, bukan hanya nama Latin"
              - "Tunjukkan cara meletakkan tanaman di sudut kamar yang estetik sekaligus efektif"
              - "Rekomendasikan kombinasi 2–3 tanaman untuk efek maksimal di ruangan kecil"
            hindari:
              - "Jangan klaim tanaman bisa menggantikan 100% obat nyamuk — tidak realistis dan menyesatkan"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan rekomendasikan tanaman yang sulit ditemukan di Indonesia"
              - "Jangan buat konten terlalu ilmiah hingga kehilangan daya tarik praktis"
            pola_hook: "Detik 0: close-up tanaman hias yang subur + teks 'nyamuk berkurang sejak tanam ini 3 bulan lalu'. Langsung masuk ke nama tanaman pertama di detik 3."
            contoh_judul:
              - "Tanaman ini aku taruh di kamar dan nyamuk benar-benar berkurang dalam 3 bulan"
              - "5 tanaman hias yang juga pengusir nyamuk alami, semua ada di pasar lokal"
              - "Ganti obat nyamuk dengan tanaman ini — lebih aman dan lebih estetik"
              - "Sereh, lavender, dan ini — kombinasi tanaman yang bikin nyamuk kabur dari kamar"
              - "Tanaman pengusir nyamuk yang juga enak dipandang, semua di bawah Rp50rb"
            content_runway: "Setiap jenis tanaman (sereh, lavender, mint, citronella, kemangi), cara perawatan per tanaman, kombinasi yang berbeda, dan ruangan yang berbeda (kamar, ruang tamu, dapur) menghasilkan konten yang tidak ada habisnya."

        - slug: gardening-propagasi-gratis
          name: Perbanyak Tanaman Sendiri Tanpa Beli Benih
          description: Teknik propagasi berbagai jenis tanaman hias dan sayuran dari stek, biji, dan daun yang sudah ada, sehingga koleksi tanaman bisa berkembang tanpa biaya tambahan.
          example_hook: "Satu tanaman monstera ini sudah jadi 12 tanaman dalam 6 bulan tanpa beli sesuatu..."
          guide:
            audience: "Pecinta tanaman 20–40 yang sudah punya beberapa tanaman dan ingin memperbanyak tanpa biaya; penonton yang terinspirasi konten zero-waste dan berkelanjutan; penggemar tanaman hias yang aktif di komunitas tanaman Indonesia."
            tone: "Gembira dan berbagi. Nada seperti membongkar rahasia yang terlalu lama disimpan — propagasi adalah 'life hack' dunia tanaman yang bikin penonton langsung ingin mencoba."
            format: "60–90 detik. Tunjukkan tanaman induk → potong bagian yang akan dipropagasi (stek, daun, biji) → proses penanaman di media baru → time-lapse pertumbuhan akar/tunas → tanaman baru yang sudah tumbuh. Close-up tangan dan tanaman, vertikal 9:16."
            boleh:
              - "Tunjukkan kondisi akar yang mulai tumbuh di air — sangat memuaskan secara visual"
              - "Gunakan toples kaca atau pot transparan agar akar terlihat saat propagasi di air"
              - "Tampilkan berapa banyak tanaman baru yang bisa dihasilkan dari satu tanaman induk"
              - "Sebutkan berapa lama proses propagasi — jujur tentang ekspektasi waktu"
            hindari:
              - "Jangan klaim semua teknik propagasi berhasil 100% — gagal adalah bagian prosesnya"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan media tanam atau alat yang sulit ditemukan di Indonesia"
              - "Jangan skip fase tunggu — time-lapse pertumbuhan akar adalah bagian paling memuaskan"
            pola_hook: "Detik 0: tampilkan deretan tanaman yang sama tumbuh dari satu tanaman induk + teks 'semua ini gratis dari satu tanaman'. Langsung tunjukkan cara memotong stek di detik 3."
            contoh_judul:
              - "Satu monstera ini aku propagasi jadi 12 tanaman dalam 6 bulan tanpa beli apapun"
              - "Cara perbanyak pothos dari stek air, berhasil 9 dari 10 kali"
              - "Propagasi daun sukulen sampai tumbuh tunas kecil — proses 4 minggu dalam 60 detik"
              - "Tanaman hias mahal ini bisa diperbanyak gratis dengan cara yang hampir semua orang tidak tahu"
              - "Dari 1 tanaman sirih gading jadi 20 tanaman — ini teknik propagasi airnya"
            content_runway: "Setiap jenis tanaman (monstera, pothos, sukulen, sirih gading, lidah mertua, begonia) memiliki teknik propagasi yang berbeda; kombinasi media (air, tanah, perlite) dan metode (stek batang, daun, akar) menghasilkan variasi konten yang sangat banyak."

    - slug: books
      name: "Buku / Ringkasan"
      description: "Ringkas buku, rekomendasi."
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: teks + b-roll + voiceover
      example_hook: "1 buku yang ubah cara pikirku..."
      guide:
        audience: "Pembaca muda 20–35 yang ingin terus belajar tapi tidak punya banyak waktu membaca; penonton yang tertarik self-help dan bisnis tapi kewalahan dengan banyaknya pilihan buku; mahasiswa dan pekerja muda yang ingin efisien dalam konsumsi pengetahuan."
        tone: "Cerdas tapi bersahabat. Bukan kuliah — lebih seperti teman yang baru selesai baca buku bagus dan tidak sabar untuk cerita. Jujur tentang mana yang benar-benar berguna dan mana yang overhyped."
        format: "45–90 detik. Kombinasi b-roll buku fisik atau halaman buku, teks overlay kutipan kunci, dan voiceover yang menjelaskan ide utama. Tidak perlu tampilkan wajah. Satu ide per video lebih kuat dari rangkuman penuh. Vertikal 9:16."
        boleh:
          - "Ambil satu ide kunci yang paling berdampak, bukan rangkuman seluruh bab"
          - "Gunakan contoh nyata dari kehidupan Indonesia untuk membumikan konsep buku luar negeri"
          - "Format 'satu kalimat yang mengubah segalanya' sangat efektif untuk engagement"
          - "Jujur tentang buku yang mengecewakan — review negatif yang jujur membangun kredibilitas"
        hindari:
          - "Jangan plagiat konten buku secara harfiah — ringkas dan interpretasikan dengan kata sendiri"
          - "Jangan tampilkan wajah jika channel ini dirancang faceless"
          - "Jangan rekomendasikan buku hanya karena populer tanpa benar-benar membacanya"
          - "Jangan buat konten terlalu panjang — penonton datang untuk efisiensi waktu"
        pola_hook: "Detik 0: tampilkan sampul buku + teks pernyataan mengejutkan dari isi buku. Langsung masuk ke ide utama di detik 3 tanpa setup panjang."
        contoh_judul:
          - "1 buku yang ubah cara aku melihat uang, dan aku baca 3 tahun terlambat"
          - "Buku ini 400 halaman, tapi satu ide ini yang benar-benar perlu kamu tahu"
          - "Buku paling overrated yang tetap aku rekomendasikan dengan catatan penting"
      micro:
        - slug: books-satu-ide-buku-bisnis
          name: Satu Ide Inti dari Buku Bisnis Terbaik
          description: Setiap video mengambil satu konsep kunci dari buku bisnis atau self-help terbaik dan menjelaskannya dalam 60 detik dengan contoh nyata yang relevan untuk Indonesia.
          example_hook: "Buku ini 400 halaman, tapi satu idenya ini yang benar-benar mengubah cara aku bekerja..."
          guide:
            audience: "Pekerja muda dan pemilik usaha kecil 22–38 yang ingin belajar bisnis dan pengembangan diri tapi tidak punya waktu membaca buku penuh; penonton yang akrab dengan nama-nama buku populer tapi belum sempat membacanya."
            tone: "Langsung ke inti. Tidak ada basa-basi panjang — penonton tahu buku apa yang dibicarakan, langsung masuk ke ide yang paling berharga. Gaya bicara teman senior yang berbagi insight dari pengalamannya."
            format: "60–75 detik. Tampilkan sampul buku → satu kalimat hook dari isi buku → penjelasan ide utama dengan contoh konteks Indonesia → satu kalimat takeaway yang bisa langsung diterapkan. Teks overlay kutipan kunci. Voiceover. Vertikal 9:16."
            boleh:
              - "Pilih buku yang sudah dikenal namanya — recognition meningkatkan klik"
              - "Hubungkan ide buku dengan situasi konkret Indonesia (startup lokal, UMKM, kultur kerja)"
              - "Kutipan langsung dari buku yang ditampilkan sebagai teks overlay sangat efektif"
              - "Akhiri dengan satu pertanyaan reflektif untuk memancing komentar"
            hindari:
              - "Jangan rangkum seluruh buku — satu ide kuat lebih berdampak dari sepuluh ide dangkal"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan ide yang terlalu abstrak tanpa contoh konkret"
              - "Jangan salin teks buku secara langsung panjang-panjang — simpulkan dengan kata sendiri"
            pola_hook: "Detik 0: tampilkan sampul buku yang dikenal + teks pernyataan dari ide kunci yang mengejutkan atau counterintuitive. Langsung mulai penjelasan di detik 3."
            contoh_judul:
              - "Buku ini 400 halaman, tapi satu ide ini yang mengubah cara aku bekerja selamanya"
              - "Atomic Habits punya ratusan tips, tapi yang ini yang benar-benar bekerja untukku"
              - "The Psychology of Money punya satu prinsip yang tidak pernah aku dengar dibahas orang"
              - "Rich Dad Poor Dad sudah tua tapi satu kalimat ini masih relevan untuk generasi sekarang"
              - "Buku Zero to One — satu ide di halaman 50 yang bikin aku lihat kompetisi secara berbeda"
            content_runway: "Ratusan buku bisnis dan self-help yang populer masing-masing punya puluhan ide kunci; format ini bisa terus berjalan selama ada buku baru yang terbit dan buku lama yang layak dibahas ulang."

        - slug: books-buku-yang-tidak-perlu-dibaca
          name: Buku yang Tidak Perlu Kamu Baca Penuh
          description: Review jujur buku populer yang ringkasannya lebih bermanfaat dari membaca penuh, membantu penonton memutuskan mana buku yang layak investasi waktu penuh.
          example_hook: "Buku ini ada di mana-mana tapi setelah baca sampai akhir, ini yang benar-benar berguna..."
          guide:
            audience: "Pembaca selektif 22–38 yang sudah kehabisan waktu dan ingin tahu apakah sebuah buku layak investasi 8–10 jam membaca; penonton yang pernah kecewa membeli buku hype tapi isinya mengecewakan."
            tone: "Jujur dan sedikit berani. Berani mengatakan bahwa buku terkenal tertentu tidak sepadan dengan hypenya adalah konten yang berbeda dan menarik. Bukan meremehkan penulis — tapi jujur tentang nilai per halaman."
            format: "60–90 detik. Tampilkan sampul buku → rating singkat (layak baca penuh / cukup ringkasan / skip) → alasan dengan bukti dari isi buku → rekomendasi alternatif jika ada. Teks overlay. Voiceover. Vertikal 9:16."
            boleh:
              - "Berikan verdict yang jelas — penonton butuh keputusan, bukan 'tergantung'"
              - "Kutip bagian buku yang mengecewakan untuk mendukung review — spesifik lebih meyakinkan"
              - "Format 'yang berguna vs yang padding' sangat efektif untuk buku tebal"
              - "Rekomendasikan buku yang lebih baik di topik yang sama jika ada"
            hindari:
              - "Jangan review buku tanpa benar-benar membacanya — pembaca yang sudah baca bisa langsung deteksi"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan terlalu negatif tanpa memberikan sesuatu yang berguna dari buku tersebut"
              - "Jangan review buku yang terlalu obscure — penonton butuh konteks kenal dulu"
            pola_hook: "Detik 0: tampilkan sampul buku yang sangat terkenal + teks 'buku ini ada di mana-mana tapi tidak semua isinya perlu dibaca'. Langsung masuk ke verdict di detik 3."
            contoh_judul:
              - "Buku bestseller ini punya 300 halaman, tapi yang berguna cuma 40 halaman ini"
              - "Jangan beli buku ini sebelum tahu bagian mana yang bisa di-skip"
              - "Review jujur Think and Grow Rich — apa yang tidak ada yang berani bilang"
              - "Buku ini ada di rak semua orang tapi setelah baca sampai akhir, ini yang aku temukan"
              - "5 buku paling overhyped yang ringkasannya 10 menit lebih berguna dari buku penuhnya"
            content_runway: "Setiap buku bestseller baru yang terbit adalah konten potensial; backlog buku lama yang sudah populer juga bisa dibahas ulang dengan perspektif baru; format ini tidak ada habisnya selama industri penerbitan terus berjalan."

        - slug: books-fiksi-yang-ajarkan-kehidupan
          name: Novel Fiksi yang Ajarkan Hal Nyata
          description: Analisis mendalam novel fiksi populer yang memuat pelajaran kehidupan tersembunyi di balik ceritanya — dari Bumi Manusia hingga The Alchemist — untuk penonton yang suka insight di balik hiburan.
          example_hook: "Ini bukan buku self-help, ini novel, tapi halaman ini ubah cara aku lihat kegagalan..."
          guide:
            audience: "Pembaca dan calon pembaca 18–35 yang menikmati fiksi tapi juga ingin konten bermakna; penonton yang tidak tertarik buku self-help tapi terbuka pada pelajaran yang dikemas dalam cerita; penggemar sastra Indonesia dan dunia."
            tone: "Apresiatif dan penuh insight. Bukan spoiler review — lebih pada mengungkap 'mengapa cerita ini lebih dari sekedar cerita'. Nada penggemar sastra yang excited berbagi penemuan tersembunyi."
            format: "60–90 detik. Tampilkan sampul novel → kutipan singkat dari buku → pelajaran tersembunyi yang diungkap → relevansi dengan kehidupan nyata. Teks overlay kutipan. Voiceover. Tidak perlu spoiler plot lengkap. Vertikal 9:16."
            boleh:
              - "Pilih kutipan singkat yang kuat dan tampilkan sebagai teks dengan font yang menarik"
              - "Gunakan novel yang sudah dikenal namanya di Indonesia untuk memaksimalkan reach"
              - "Hubungkan pelajaran dari novel dengan situasi kehidupan Indonesia yang konkret"
              - "Format 'bukan buku self-help tapi mengajarkan X' adalah hook yang selalu berhasil"
            hindari:
              - "Jangan spoil twist utama tanpa warning — hancurkan pengalaman baca orang"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan buat analisis terlalu akademis — ini short-form, bukan esai sastra"
              - "Jangan pilih novel yang terlalu obscure — penonton butuh konteks kenal dulu"
            pola_hook: "Detik 0: tampilkan sampul novel terkenal + teks 'ini novel fiksi, tapi pelajaran di halaman ini lebih dalam dari buku self-help manapun'. Langsung kutip satu kalimat kuat dari buku di detik 3."
            contoh_judul:
              - "Bumi Manusia bukan buku sejarah — ini pelajaran tentang martabat yang tersembunyi di balik ceritanya"
              - "The Alchemist sudah baca? Tapi apakah kamu tangkap pelajaran tersembunyi di bagian ini?"
              - "Novel 1984 Orwell punya satu konsep yang semakin relevan di era media sosial"
              - "Laskar Pelangi mengajarkan ini tentang kemiskinan dan pilihan yang tidak pernah dibahas"
              - "Sapiens bukan fiksi, tapi cara dia cerita tentang manusia lebih mengubah pandangan dari novel manapun"
            content_runway: "Ratusan novel Indonesia dan dunia masing-masing punya puluhan momen dan pelajaran yang bisa dianalisis; format ini mencakup fiksi lama dan baru, lokal dan internasional, sehingga konten bisa berjalan bertahun-tahun."

    - slug: quiz
      name: "Kuis / Tebak-tebakan"
      description: Tebak gambar/jawaban interaktif.
      faceless: true
      difficulty: pemula
      rpm: rendah
      formats: teks + timer + reveal
