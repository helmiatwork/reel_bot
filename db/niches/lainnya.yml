    - slug: compilation
      name: Kompilasi Tematik
      description: Kumpulan klip satu tema.
      faceless: true
      difficulty: pemula
      rpm: rendah
      formats: klip + musik + caption
      example_hook: "10 momen paling memuaskan minggu ini..."
      guide:
        audience: "Penonton 16–40 yang menikmati konten kurasi dan tidak ingin mencari sendiri; penggemar highlight dan best-of yang ingin efisiensi; penonton yang menikmati keberagaman dalam satu video pendek."
        tone: "Kuratorial dan antusias. Creator berperan sebagai kurator terpercaya yang sudah menyaring yang terbaik untuk penonton. Nada editorial — 'aku pilihkan ini karena alasan tertentu, bukan asal kumpul'."
        format: "45–90 detik. 5–10 klip pendek masing-masing 5–10 detik. Transisi cepat dan rapi. Musik yang mendukung mood tema. Caption singkat untuk konteks setiap klip. Vertikal 9:16."
        boleh:
          - "Tema yang spesifik lebih kuat dari kompilasi umum — 'profesi langka Indonesia' lebih baik dari 'konten keren'"
          - "Transisi yang rapi dan konsisten memberi kesan profesional"
          - "Caption singkat untuk setiap klip menambah informasi tanpa memotong tempo"
          - "Musik yang membangun emosi sesuai tema — epik untuk prestasi, tenang untuk alam"
        hindari:
          - "Jangan gunakan klip ber-hak-cipta tanpa izin atau fair use yang jelas"
          - "Jangan tampilkan wajah kreator sendiri — channel ini faceless"
          - "Jangan buat kompilasi dengan tema yang terlalu luas dan tidak fokus"
          - "Jangan gunakan klip dengan kualitas video sangat rendah yang merusak estetika keseluruhan"
        pola_hook: "Detik 0: tampilkan klip paling impresif dari kompilasi + teks tema ('10 profesi yang hampir punah di Indonesia'). Langsung masuk ke klip pertama di detik 3 tanpa intro panjang."
        contoh_judul:
          - "10 profesi Indonesia yang hampir punah tapi masih ada sampai sekarang"
          - "Tangan manusia bisa lakukan semua ini, dan ini buktinya dalam 60 detik"
          - "Fenomena alam Indonesia yang sulit dipercaya tapi semua terekam kamera"
