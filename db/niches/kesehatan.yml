    - slug: yoga
      name: "Yoga / Stretching"
      description: "Pose yoga, peregangan, relaksasi."
      faceless: true
      difficulty: pemula
      rpm: sedang
      formats: demo + ambience
      example_hook: "Stretching 3 menit buat sakit punggung..."
      guide:
        audience: "Pria dan wanita 25–45 yang punya keluhan fisik ringan akibat gaya hidup sedentary — nyeri punggung, leher kaku, tidur tidak nyenyak; penonton yang ingin mulai yoga atau stretching tapi merasa tidak fleksibel atau tidak tahu mulai dari mana."
        tone: "Tenang dan mengundang. Tidak ada tekanan untuk melakukan pose sempurna. Gaya 'tubuhmu sekarang cukup untuk memulai ini'. Pace pelan, instruksi jelas."
        format: "45–90 detik. Demo gerakan real-time dengan pace pelan. Background tenang dan bersih. Musik ambient atau suara alam. Instruksi napas dicantumkan dalam caption atau diucapkan singkat."
        boleh:
          - "Tampilkan modifikasi pose untuk pemula yang tidak fleksibel"
          - "Hubungkan setiap pose ke manfaat spesifik yang bisa dirasakan (punggung, tidur, kecemasan)"
          - "Instruksikan napas — ini membedakan yoga dari stretching biasa"
          - "Gunakan setting rumah yang bersih dan natural — tidak harus di studio yoga"
        hindari:
          - "Jangan tampilkan pose lanjutan tanpa memberikan alternatif yang lebih mudah"
          - "Jangan tampilkan wajah — channel ini faceless"
          - "Jangan buat klaim terapeutik tanpa menyebut sumber (yoga 'menyembuhkan' kondisi medis)"
          - "Selalu sarankan konsultasi dokter atau fisioterapis untuk nyeri yang sudah berlangsung lama atau intens"
        pola_hook: "Detik 0: sebut keluhan spesifik yang relatable + teks 'tiga gerakan ini yang fisioterapis rekomendasikan'. Langsung mulai pose pertama di detik 3."
        contoh_judul:
          - "Stretching 3 menit untuk punggung bawah yang sakit setelah duduk seharian"
          - "Pose yoga sebelum tidur yang benar-benar membantu untuk tidur lebih nyenyak"
          - "Gerakan ini untuk leher kaku setelah main HP terlalu lama"
      micro:
        - slug: yoga-punggung-pekerja-duduk
          name: Peregangan 3 Menit untuk Pekerja yang Duduk Seharian
          description: Urutan stretching singkat yang menargetkan nyeri punggung, leher, dan bahu akibat duduk di depan komputer, bisa dilakukan di meja kerja tanpa alas yoga.
          guide:
            audience: "Pekerja kantoran dan WFH 22–42 yang merasakan nyeri punggung atau leher akibat duduk lama; penonton yang tahu harus bergerak tapi tidak punya waktu atau tempat untuk olahraga di kantor."
            tone: "Simpel dan actionable. Gaya 'lakukan sekarang di meja kamu, tidak butuh alas atau pakaian olahraga'. Tidak ada fleksibilitas tinggi yang dibutuhkan — ini untuk tubuh yang kaku sekalipun."
            format: "30–45 detik. Demo dari kursi atau berdiri di dekat meja — setting kantor atau rumah. Real-time dengan instruksi singkat per gerakan. Timer per gerakan jika ada."
            boleh:
              - "Tampilkan gerakan yang bisa dilakukan dari kursi — sangat inklusif"
              - "Sertakan instruksi napas singkat per gerakan"
              - "Setting kantor yang relatable — meja, komputer, kursi biasa"
              - "Sebutkan berapa kali dan berapa lama tiap gerakan"
            hindari:
              - "Jangan tampilkan gerakan yang membutuhkan ruang besar atau alas yoga"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan buat klaim bisa menghilangkan nyeri kronik secara permanen tanpa disclaimer"
              - "Selalu sertakan catatan untuk konsultasi dokter atau fisioterapi jika nyeri sudah berlangsung lama atau intens"
            pola_hook: "Detik 0: tampilkan setting meja kerja atau komputer + teks 'tiga gerakan ini yang bisa kamu lakukan sekarang untuk punggung yang kaku'. Langsung mulai gerakan pertama di detik 3."
            contoh_judul:
              - "Tiga gerakan ini aku lakukan setiap jam di meja kerja untuk punggung yang tidak kaku"
              - "Peregangan 3 menit untuk yang duduk 8 jam sehari — tidak perlu alas, tidak perlu berdiri"
              - "Fisioterapis rekomendasikan ini untuk nyeri leher akibat komputer"
              - "Cara reset punggung bawah yang kaku setelah duduk lama tanpa harus keluar dari kursi"
              - "5 gerakan dari kursi yang bikin bahu dan leher tidak sakit setelah kerja seharian"
            content_runway: "Setiap area tubuh yang terpengaruh duduk lama (punggung atas, bawah, leher, bahu, pinggul, pergelangan tangan) bisa jadi video tersendiri; variasi gerakan dan durasi memperluas stok konten secara signifikan."

        - slug: yoga-tidur-nyenyak
          name: Yoga 10 Menit Sebelum Tidur untuk Tidur Lebih Nyenyak
          description: Rutinitas yoga malam hari yang menenangkan sistem saraf dan menurunkan kortisol sebelum tidur, untuk penonton yang sering insomnia atau tidur tidak berkualitas.
          guide:
            audience: "Pria dan wanita 22–40 yang sering kesulitan tidur atau sering terbangun malam; penonton yang pikiran terus aktif saat sudah berbaring; orang yang menggunakan HP sampai mau tidur dan butuh ritual wind-down."
            tone: "Sangat tenang dan mengantuk — intentionally. Pace paling lambat di antara semua konten yoga channel. Gaya 'biarkan tubuh dan pikiran turun perlahan bersama gerakan ini'."
            format: "60–90 detik untuk preview; bisa ada versi 10 menit penuh. Gerakan dilakukan di kasur atau matras. Pencahayaan redup atau warm tone. Musik ambient sangat pelan atau silence. Instruksi napas panjang."
            boleh:
              - "Gunakan pencahayaan yang sangat warm dan redup — menciptakan mood tidur"
              - "Semua gerakan bisa dilakukan di kasur — jangan ada yang butuh berdiri"
              - "Instruksi napas panjang (4 hitungan masuk, 6 hitungan keluar) adalah inti konten"
              - "Preview singkat diikuti tautan ke video penuh jika ada"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan gunakan musik yang upbeat atau energik — kontraproduktif"
              - "Jangan buat klaim bisa 'menyembuhkan insomnia' tanpa disclaimer"
              - "Selalu sarankan konsultasi dokter untuk insomnia kronis yang sudah berlangsung lebih dari beberapa minggu"
            pola_hook: "Detik 0: tampilkan visual kasur atau ruang tidur dengan cahaya redup + teks 'rutinitas ini kurangi waktu tidur dari 45 menit jadi 10 menit'. Langsung mulai gerakan pertama yang sangat pelan."
            contoh_judul:
              - "Rutinitas ini kurangi waktu tidurku dari 45 menit jadi 10 menit setiap malam"
              - "Yoga 10 menit sebelum tidur untuk yang pikiran tidak bisa berhenti"
              - "Gerakan di kasur ini yang aku lakukan setelah taruh HP dan sebelum tutup mata"
              - "Cara menenangkan sistem saraf sebelum tidur dengan 5 pose sederhana"
              - "Tidur lebih nyenyak bukan soal kasur mahal — ini rutinitas malam yang berhasil untukku"
            content_runway: "Variasi durasi (5, 10, 20, 30 menit), target (insomnia, stres, nyeri fisik sebelum tidur), dan musim atau situasi (setelah kerja keras, setelah berita buruk) menghasilkan puluhan variasi video yang berbeda."

        - slug: yoga-anxiety-grounding
          name: Gerakan Yoga untuk Atasi Kecemasan Akut
          description: Pose dan teknik napas yoga yang terbukti menenangkan sistem saraf saat serangan kecemasan tiba-tiba, disajikan sebagai first-aid mental untuk momen panik.
          guide:
            audience: "Orang 18–35 yang mengalami kecemasan tiba-tiba dalam situasi sehari-hari; penonton yang pernah panik attack atau kecemasan intens dan tidak tahu harus melakukan apa; orang yang mencari teknik grounding praktis yang bisa dilakukan dimana saja."
            tone: "Tenang dan sangat langsung. Tidak ada basa-basi. Gaya 'saat kamu butuh ini, lakukan langkah ini'. Menenangkan tapi konkret — bukan teoritis."
            format: "45–60 detik. Instruksi teknis yang sangat jelas — angka pernapasan, posisi tangan, posisi tubuh. Setting netral yang tidak memperburuk kecemasan (ruang terbuka atau interior tenang). Caption besar untuk instruksi kunci."
            boleh:
              - "Berikan teknik 4-7-8 atau box breathing yang berbasis bukti"
              - "Tampilkan grounding technique 5-4-3-2-1 sebagai pelengkap gerakan"
              - "Instruksi yang bisa diikuti bahkan saat seseorang tidak bisa berpikir jernih"
              - "Sertakan informasi hotline kesehatan jiwa Indonesia di caption"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan buat konten yang menstigmatisasi kecemasan sebagai 'lemah' atau 'berlebihan'"
              - "Jangan klaim teknik ini bisa menggantikan penanganan medis untuk anxiety disorder"
              - "Selalu sertakan catatan bahwa jika kecemasan sering dan berat, konsultasi psikolog atau psikiater adalah langkah yang tepat; cantumkan kontak Into The Light Indonesia atau Kemenkes"
            pola_hook: "Detik 0: tampilkan situasi umum yang memicu kecemasan + teks 'saat panik tiba-tiba, lakukan ini sebelum hal lainnya'. Langsung mulai teknik pertama di detik 3."
            contoh_judul:
              - "Saat panik tiba-tiba, lakukan ini sebelum hal lainnya — ini yang aku gunakan"
              - "Teknik pernapasan 4-7-8 untuk menenangkan sistem saraf dalam 2 menit"
              - "Grounding technique ini yang berhasil saat kecemasan tiba-tiba di tempat publik"
              - "Tiga gerakan untuk turunkan denyut jantung saat kecemasan menyerang"
              - "First-aid mental untuk panik attack — ini yang bisa kamu lakukan dimana saja"
            content_runway: "Setiap teknik grounding (pernapasan, indera 5-4-3-2-1, gerakan tubuh, visualisasi) bisa jadi video tersendiri; dikombinasikan dengan situasi pemicu berbeda, stok konten sangat luas dan relevan sepanjang waktu."
