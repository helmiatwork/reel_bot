        - slug: skincare-hiperpigmentasi-bekas-jerawat
          name: Atasi Bekas Jerawat dan Hiperpigmentasi
          description: Panduan berbasis dermatologi tentang cara mengatasi bekas jerawat dan flek hitam di kulit coklat Asia, dengan timeline realistis dan bahan aktif yang tepat.
          guide:
            audience: "Pria dan wanita 18–35 yang bergumul dengan bekas jerawat yang tidak kunjung hilang; penonton yang sudah coba berbagai produk tapi tidak tahu bahan aktif apa yang benar-benar bekerja; orang yang membutuhkan timeline realistis agar tidak frustrasi."
            tone: "Informatif berbasis sains dengan timeline realistis. Tidak menjual harapan palsu — gaya 'ini berhasil tapi butuh waktu, dan ini alasan ilmiahnya'."
            format: "60–90 detik. Infografik atau caption penjelasan bahan aktif. Before-after realistis dengan timeline yang disebutkan jelas. Referensi dermatologi atau ahli kulit jika tersedia."
            boleh:
              - "Jelaskan perbedaan PIH (post-inflammatory hyperpigmentation) dan PIE yang sering dikira sama"
              - "Rekomendasikan bahan aktif dengan sumber ilmiah (niacinamide, vitamin C, AHA)"
              - "Berikan timeline realistis per bahan aktif"
              - "Tampilkan produk dengan bahan aktif tersebut yang tersedia di Indonesia"
            hindari:
              - "Jangan klaim produk bisa menghilangkan bekas dalam 3 hari atau waktu sangat singkat"
              - "Jangan rekomendasikan bahan aktif kuat tanpa menyebut risiko dan cara pemakaian yang benar"
              - "Jangan promosikan produk pemutih kulit dengan cara yang mempermasalahkan warna kulit asli"
              - "Selalu sarankan konsultasi dermatologis untuk kasus hiperpigmentasi yang parah atau tidak merespons perawatan OTC"
            pola_hook: "Detik 0: tampilkan contoh bekas jerawat yang membandel + teks 'bekas ini butuh berapa lama hilang?'. Langsung masuk ke jawaban jujur di detik 3."
            contoh_judul:
              - "Bekas jerawat ini butuh berapa lama hilang? Jawaban jujur dari dermatologis"
              - "Niacinamide vs vitamin C untuk bekas jerawat — ini pemenangnya setelah 3 bulan"
              - "Bahan aktif ini yang benar-benar bekerja untuk hiperpigmentasi di kulit coklat Asia"
              - "Kenapa bekas jerawat kamu tidak hilang meski sudah pakai banyak produk"
              - "Timeline realistis untuk hilangkan PIH — karena 2 minggu itu tidak cukup"
            content_runway: "Setiap jenis bekas jerawat (PIH, PIE, scar), bahan aktif yang berbeda, dan jenis kulit menghasilkan konten yang berbeda; masalah ini sangat umum di Indonesia dan relevan untuk semua usia."

        - slug: skincare-pria-anti-ribet
