              - "Pria ini tidak pernah pakai skincare selama 30 tahun, ini perubahannya setelah 90 hari"
              - "Rutinitas skincare pria 3 menit dengan produk dari Alfamart"
              - "Tiga produk ini cukup untuk pria yang tidak mau ribet tapi mau kulit bersih"
              - "Kenapa pria juga butuh skincare dan ini cara mulainya tanpa drama"
