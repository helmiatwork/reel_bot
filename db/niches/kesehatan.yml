version: 1
vertical:
  slug: v-kesehatan
  name: Kesehatan
  description: Konten seputar kebugaran, nutrisi, kesehatan mental, dan perawatan diri untuk hidup lebih sehat.
  guide:
    audience: "Penonton 18–40 tahun yang sadar kesehatan atau sedang dalam perjalanan hidup lebih sehat; campuran pria-wanita yang mencari inspirasi gaya hidup, solusi masalah fisik ringan, dan dukungan mental; banyak yang melihat konten ini saat pagi atau malam hari sebagai pengingat dan motivasi."
    tone: "Suportif dan memberdayakan — bukan menghakimi, tidak menggurui. Nada seperti teman yang lebih paham, bukan dokter yang ceramah. Hindari bahasa klinis kaku; pilih Bahasa Indonesia kasual yang hangat dan langsung ke solusi."
    format: "Video 30–90 detik. Dominan demo gerakan atau infografik visual sederhana. Struktur: hook masalah relatable → inti solusi/informasi → takeaway konkret. Vertikal 9:16. Caption wajib — banyak ditonton tanpa suara."
    boleh:
      - "Mulai dengan masalah yang relatable dan spesifik (bukan 'hidup sehat itu penting')"
      - "Gunakan data atau fakta singkat untuk memperkuat poin — satu fakta kuat lebih baik dari lima fakta lemah"
      - "Tampilkan demo visual yang bisa langsung ditiru penonton hari ini"
      - "Gunakan referensi lokal Indonesia — makanan, kebiasaan, kondisi iklim tropis"
      - "Validasi perasaan penonton sebelum memberikan solusi, terutama untuk konten mental health"
    hindari:
      - "Jangan buat klaim medis atau diagnosis tanpa menyebut sumber yang kredibel (dokter, studi, ahli gizi)"
      - "Jangan tampilkan angka berat badan, kalori ekstrem, atau standar tubuh ideal yang bisa memicu body image issue"
      - "Jangan gunakan istilah medis klinisi tanpa penjelasan sederhana"
      - "Selalu sertakan catatan 'konsultasikan ke profesional' untuk topik yang berdampak kesehatan signifikan (cedera, kondisi medis, suplemen dosis tinggi)"
      - "Jangan tampilkan produk berbayar tanpa disclosure yang jelas"
    pola_hook: "Detik 0–2: sebut masalah spesifik yang dirasakan penonton ('nyeri punggung setelah 8 jam duduk?', 'kamu makan ini setiap hari tanpa sadar efeknya'). Langsung ke inti di detik 3."
    contoh_judul:
      - "Kebiasaan pagi ini yang sabotase energi kamu sepanjang hari tanpa sadar"
      - "Dokter bilang ini bukan soal diet, tapi soal ini yang kamu lakukan tiap malam"
      - "Cara tubuh minta bantuan yang sering diabaikan sampai terlambat"

  niches:
    - slug: fitness
      name: "Fitness / Workout"
      description: "Latihan, form, tips gym."
      faceless: false
      difficulty: menengah
      rpm: sedang
      formats: demo gerakan + caption
      example_hook: "Gerakan ini bakar lemak perut..."
      guide:
        audience: "Pria dan wanita 18–35 yang aktif atau ingin memulai hidup aktif; penonton yang sudah tahu harus olahraga tapi butuh arahan form yang benar dan motivasi konkret; komunitas gym dan workout yang besar di Indonesia."
        tone: "Energik dan percaya diri tanpa sombong. Gaya 'kakak senior yang mau kasih tahu' — langsung ke intinya, tidak bertele-tele. Dorong penonton untuk mencoba hari ini, bukan besok."
        format: "45–75 detik. Struktur: tunjukkan masalah umum (form salah atau mitos) → demo versi benar → penjelasan singkat kenapa ini penting. POV atau wide shot tergantung gerakan. Caption wajib ada."
        boleh:
          - "Tampilkan perbandingan form salah vs benar dalam satu frame atau potongan langsung"
          - "Gunakan caption angka (reps, detik, set) yang jelas sebagai panduan"
          - "Sertakan penanda visual — garis merah untuk form salah, hijau untuk benar"
          - "Hubungkan gerakan ke manfaat spesifik yang bisa dirasakan dalam minggu pertama"
        hindari:
          - "Jangan klaim hasil ekstrem ('perut rata dalam 7 hari') tanpa konteks diet dan konsistensi"
          - "Jangan demo gerakan dengan form yang tidak sempurna — penonton meniru apa yang mereka lihat"
          - "Jangan gunakan istilah teknis fitness tanpa penjelasan ('supination', 'posterior chain') tanpa konteks"
          - "Selalu sertakan catatan konsultasi dokter/fisioterapi untuk konten yang menyebut cedera atau kondisi medis"
        pola_hook: "Detik 0: tampilkan gerakan umum yang banyak dilakukan salah + teks '80% orang ini salah'. Langsung mulai demo koreksi di detik 3."
        contoh_judul:
          - "80% orang squat salah dan ini yang akan terjadi pada lutut mereka"
          - "Latihan perut ini populer tapi merusak punggung bawah — ini penggantinya"
          - "Cara benar push-up yang jarang diajarkan tapi bikin hasilnya 2x lipat"
      micro:
        - slug: fitness-form-koreksi
          name: Koreksi Form Latihan yang Sering Salah
          description: Konten side-by-side sebelum-sesudah form latihan umum yang sering dilakukan salah di gym, membantu penonton hindari cedera tanpa perlu personal trainer.
          guide:
            audience: "Pria dan wanita 20–35 yang aktif gym tapi otodidak; penonton yang pernah cedera atau takut cedera karena form salah; pemula yang tidak punya akses atau budget personal trainer."
            tone: "Langsung dan tidak menghakimi. Framing 'ini kesalahan umum bukan kesalahan kamu' — penonton harus merasa terbantu bukan dipermalukan."
            format: "45–60 detik. Split-screen atau cut langsung form salah vs benar untuk satu gerakan per video. Caption singkat di setiap frame menandai perbedaan kunci. POV atau medium shot yang terlihat seluruh tubuh."
            boleh:
              - "Fokus satu gerakan per video — squat, deadlift, atau push-up saja, bukan mix"
              - "Gunakan overlay garis atau tanda panah untuk highlight poin form yang salah"
              - "Tampilkan perbedaan yang bisa langsung dirasakan penonton saat dicoba"
              - "Tambahkan teks singkat apa risiko cedera jika form salah dipertahankan"
            hindari:
              - "Jangan demo gerakan yang memerlukan spotter tanpa menyebut kebutuhan itu"
              - "Jangan gunakan istilah anatomi tanpa penjelasan visual langsung ('jaga netral lumbar')"
              - "Jangan buat klaim form ini 'satu-satunya cara benar' — variasi tubuh berbeda-beda"
              - "Selalu sarankan konsultasi fisioterapis atau dokter jika penonton sudah punya riwayat cedera"
            pola_hook: "Detik 0: close-up gerakan yang tampak 'biasa' tapi ada kesalahan tersembunyi + teks 'kamu pernah melakukan ini?'. Langsung tampilkan koreksinya di detik 3."
            contoh_judul:
              - "Squat ini terlihat normal tapi setelah 1 tahun lutut kamu akan mulai berbicara"
              - "Cara deadlift yang diajarkan di YouTube tapi sebenarnya salah — perbaikannya ada di sini"
              - "Push-up kamu mungkin melatih bahu bukan dada, cek posisi ini"
              - "Gerakan plank 90% orang ini tidak salah tapi juga tidak efektif — ini bedanya"
              - "Pull-up dengan grip ini terlihat keren tapi bicep kamu yang menanggung semuanya"
            content_runway: "Setiap gerakan gym memiliki minimal 3–5 variasi kesalahan umum; ditambah perbedaan per tipe tubuh, gender, dan level pemula vs intermediate — konten form correction hampir tidak ada habisnya."

        - slug: fitness-gym-pemula-tidak-malu
          name: Panduan Gym Pertama Kali Tanpa Malu
          description: Konten panduan praktis untuk pemula yang ingin ke gym tapi takut terlihat bodoh — alat apa yang dipakai dulu, etika gym, dan latihan yang aman tanpa spotter.
          guide:
            audience: "Remaja dan dewasa muda 17–28 yang belum pernah ke gym tapi ingin mulai; penonton yang punya rasa takut dihakimi di lingkungan gym; mereka yang beli membership tapi belum pernah datang karena malu."
            tone: "Hangat dan mengundang. Normalkan ketidaktahuan sebagai titik awal yang wajar. Gaya 'teman yang sudah lebih dulu ke gym dan mau temani kamu'."
            format: "60–90 detik. Format 'ini yang perlu kamu tahu sebelum masuk gym' — bisa berupa walkthrough alat, etika, atau urutan latihan pertama. POV atau footage gym dengan narasi sederhana."
            boleh:
              - "Tampilkan suasana gym yang normal dan tidak intimidating"
              - "Berikan urutan prioritas alat yang harus dicoba pertama — sederhana dan aman"
              - "Jelaskan etika gym yang tidak tertulis (tapi bikin canggung kalau tidak tahu)"
              - "Akhiri dengan reassurance bahwa semua orang pernah di posisi pemula"
            hindari:
              - "Jangan gunakan jargon gym tanpa penjelasan ('compound movement', 'superset')"
              - "Jangan tampilkan gym yang terlalu elite atau mahal — tidak relevan untuk mayoritas penonton"
              - "Jangan klaim program tertentu 'terbaik untuk pemula' tanpa konteks individual"
              - "Jangan abaikan aspek keselamatan — selalu sebut pentingnya pemanasan dan pendinginan"
            pola_hook: "Detik 0: tampilkan suasana gym dari luar atau pintu masuk + teks 'pertama kali ke gym dan gak tau harus ngapain?'. Langsung masuk ke panduan di detik 3."
            contoh_judul:
              - "Ini yang harus kamu lakukan 30 menit pertama di gym agar tidak bingung sendiri"
              - "Alat gym mana yang harus dicoba dulu kalau baru pertama kali? Jawaban jujurnya ini"
              - "Etika gym yang tidak ada yang mau ajarkan tapi semua orang harap kamu tahu"
              - "Gym pertama kali terasa ini — dan begini cara melewatinya tanpa malu"
              - "Panduan 15 menit untuk orang yang beli gym membership tapi belum pernah datang"
            content_runway: "Setiap aspek pengalaman gym (alat spesifik, etika, nutrisi pre-workout, program pemula, interaksi dengan trainer) bisa jadi video tersendiri; audiens pemula gym terus bertambah setiap bulan."

        - slug: fitness-latihan-usia-30an
          name: Latihan Fisik yang Tepat Setelah Usia 30
          description: Panduan menyesuaikan program latihan untuk orang dewasa 30-40 tahun yang metabolismenya mulai berubah, dengan fokus pada keberlanjutan bukan ekstremitas.
          guide:
            audience: "Pria dan wanita 30–42 yang merasa tubuh merespons olahraga berbeda dari sebelumnya; profesional sibuk yang kehilangan stamina dari masa muda; penonton yang ingin aktif jangka panjang bukan hasil instan."
            tone: "Realistis dan empatis. Akui bahwa tubuh di 30-an memang berbeda — itu normal. Tidak ada nada 'kamu harus kerja lebih keras', melainkan 'kerja lebih cerdas'."
            format: "60–90 detik. Mix antara penjelasan singkat perubahan fisiologis dan demo latihan atau rutinitas yang direkomendasikan. Tone lebih tenang dari fitness pemuda, tapi tetap energik."
            boleh:
              - "Jelaskan kenapa recovery butuh lebih lama setelah 30 — konteks ilmiah singkat"
              - "Rekomendasikan latihan yang rendah risiko cedera tapi tinggi manfaat jangka panjang"
              - "Tampilkan latihan yang bisa dilakukan di tengah kesibukan — 20–30 menit cukup"
              - "Hubungkan latihan dengan manfaat jangka panjang (mobilitas, energi, pencegahan penyakit)"
            hindari:
              - "Jangan bandingkan kapasitas usia 30-an dengan 20-an secara merendahkan"
              - "Jangan rekomendasikan program HIIT ekstrem tanpa catatan risiko untuk yang tidak aktif"
              - "Jangan buat klaim medis tentang penuaan tanpa menyebut sumber"
              - "Selalu sarankan konsultasi dokter sebelum memulai program baru bagi yang memiliki kondisi kesehatan tertentu"
            pola_hook: "Detik 0: tampilkan kontras 'apa yang kamu lakukan di 20-an' vs 'apa yang terjadi di 30-an' + teks 'bukan kamu yang lemah, tubuhmu butuh program berbeda'. Langsung masuk solusi di detik 3."
            contoh_judul:
              - "Latihan yang kamu lakukan di 20-an ini justru merusak tubuh di 30-an"
              - "Kenapa tubuh di usia 30 butuh recovery 2x lebih lama dan itu bukan kelemahan"
              - "Program latihan 25 menit yang lebih efektif dari gym 1 jam yang kamu lakukan dulu"
              - "Metabolisme turun di 30-an itu mitos sebagian — ini fakta sebenarnya dan solusinya"
              - "Tiga perubahan latihan yang harus dibuat setelah ulang tahun ke-30"
            content_runway: "Setiap aspek fisiologis yang berubah di usia 30-an (metabolisme, mobilitas, recovery, hormon, tulang) bisa jadi video tersendiri; dikombinasikan dengan gender dan kondisi spesifik, konten ini memiliki stok ide yang luas."

    - slug: home-workout
      name: Home Workout
      description: Latihan rumah tanpa alat.
      faceless: true
      difficulty: pemula
      rpm: sedang
      formats: demo + timer + musik
      example_hook: "Latihan 5 menit, perut rata..."
      guide:
        audience: "Pria dan wanita 18–35 yang tidak punya waktu atau budget untuk gym; anak kos, ibu rumah tangga, dan pekerja WFH yang ingin tetap aktif; penonton yang butuh konten olahraga yang bisa langsung diikuti sekarang."
        tone: "Praktis dan tidak ribet. Nada 'ikuti aku sekarang' — bukan tutorial panjang, tapi sesi latihan yang bisa diikuti langsung. Energi positif tanpa terlalu hype."
        format: "30–75 detik. Demo gerakan real-time atau time-lapse dengan timer on-screen. Musik upbeat sebagai pengiring. Tidak perlu alat apapun yang terlihat di video. Vertikal 9:16."
        boleh:
          - "Tampilkan timer on-screen untuk setiap gerakan — penonton butuh referensi waktu"
          - "Gunakan setting rumah yang relatable (ruang tamu, kamar kos) bukan studio fitness mahal"
          - "Tunjukkan modifikasi untuk pemula di setiap gerakan"
          - "Musik upbeat yang royalty-free untuk menambah energi"
        hindari:
          - "Jangan klaim hasil spesifik tanpa disclaimer ('perut rata 7 hari' tanpa konteks diet)"
          - "Jangan tampilkan wajah jika channel ini faceless"
          - "Jangan gunakan gerakan yang memerlukan alat meski kecil tanpa alternatif tanpa-alat"
          - "Jangan abaikan pemanasan singkat — cedera dari gerakan tanpa pemanasan adalah nyata"
        pola_hook: "Detik 0: teks durasi latihan + nama target area ('5 menit, tidak ada alat, lemak perut'). Langsung mulai gerakan pertama di detik 3 tanpa intro panjang."
        contoh_judul:
          - "Latihan 5 menit ini yang aku lakukan setiap pagi sebelum mandi"
          - "Home workout tanpa alat yang bisa dilakukan di kamar kos 3x2 meter"
          - "Gerakan ini cocok untuk yang tidak punya waktu tapi mau tetap aktif"
      micro:
        - slug: home-workout-kasur-pagi
          name: Latihan 5 Menit di Atas Kasur Sebelum Bangun
          description: Rutinitas gerakan ringan yang bisa dilakukan sebelum benar-benar bangun dari kasur, cocok untuk orang yang kesulitan memulai hari dengan aktif.
          guide:
            audience: "Pria dan wanita 20–38 yang kesulitan bangun pagi dan langsung aktif; penonton yang ingin rutinitas pagi tapi merasa gym terlalu berat sebagai titik mulai; ibu rumah tangga dan pekerja yang ingin mulai hari dengan lebih bersemangat."
            tone: "Pelan dan mengundang. Tidak ada energi meledak-ledak di awal — sesuai kondisi baru bangun. Gaya 'ini hal kecil yang bisa kamu lakukan sekarang, sebelum kaki menyentuh lantai'."
            format: "30–45 detik. Demonstrasi gerakan di atas kasur secara real-time dengan pace lambat. Timer sederhana di layar. Tidak ada musik keras — ambient ringan atau musik akustik cukup."
            boleh:
              - "Gunakan kasur nyata di kamar yang terlihat natural — bukan set yang terlalu rapi"
              - "Tunjukkan gerakan dari sudut atas (bird-eye) agar posisi di kasur terlihat jelas"
              - "Gerakan yang aktivasi otot inti dan punggung — manfaat langsung yang dirasakan"
              - "Akhiri dengan framing 'ini cukup untuk memulai hari lebih baik'"
            hindari:
              - "Jangan tampilkan gerakan yang membutuhkan ruang lebih dari ukuran kasur single"
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan klaim manfaat medis spesifik tanpa sumber ('menurunkan kortisol 30%')"
              - "Jangan gunakan musik kencang — tidak cocok dengan konteks baru bangun tidur"
            pola_hook: "Detik 0: tampilkan kasur dari sudut atas + teks 'sebelum kaki menyentuh lantai, lakukan ini 5 menit'. Langsung mulai gerakan pertama dari posisi tidur."
            contoh_judul:
              - "Sebelum kaki menyentuh lantai, lakukan ini selama 5 menit untuk tubuh lebih siap"
              - "Rutinitas kasur pagi yang aku lakukan setiap hari sebelum benar-benar bangun"
              - "5 gerakan ini di atas kasur sebelum bangun dan punggungmu tidak akan kaku lagi"
              - "Latihan pagi tanpa harus berdiri — cocok untuk yang tidak suka morning workout keras"
              - "Kalau kamu susah bangun pagi, mulai dengan ini dulu sebelum hal lainnya"
            content_runway: "Setiap kelompok otot (core, punggung, pinggul, bahu) bisa jadi sesi kasur pagi tersendiri; variasi tujuan (energi, peregangan, punggung) dan durasi (3, 5, 10 menit) membuat stok konten terus tersedia."

        - slug: home-workout-tanpa-berisik
          name: Workout Tanpa Bising untuk Penghuni Kos
          description: Rangkaian latihan intensitas sedang yang tidak menghasilkan suara berisik atau getaran — cocok untuk anak kos, apartemen, atau yang punya tetangga sensitif.
          guide:
            audience: "Anak kos dan penghuni apartemen 18–30 yang ingin workout tapi takut bikin berisik; orang yang tinggal di lantai atas dengan tetangga di bawah; penonton yang shift kerjanya membuatnya harus olahraga di jam tidak biasa."
            tone: "Praktis dan solutif. Framing sebagai 'hack' bagi yang selama ini merasa tidak bisa workout di rumah karena situasi. Energi tenang tapi efektif."
            format: "45–60 detik. Demo slow-motion atau normal gerakan yang terbukti senyap — tidak ada jumping, tidak ada beban jatuh. Tampilkan setting kos atau apartemen yang relatable. Caption teknis singkat."
            boleh:
              - "Tampilkan gerakan isometrik dan berbasis lantai yang tidak ada suara impact sama sekali"
              - "Gunakan matras tipis atau handuk sebagai alternatif — bukan peralatan gym"
              - "Tunjukkan timer — penonton butuh tahu berapa lama per gerakan"
              - "Tambahkan teks 'zero impact' atau 'tetangga aman' sebagai selling point"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan rekam dengan suara footstep atau impact yang membuktikan tidak zero-noise"
              - "Jangan rekomendasikan gerakan yang membutuhkan ruang besar — kamar kos sempit"
              - "Jangan klaim kalori burn spesifik tanpa menyebut variasi per individu"
            pola_hook: "Detik 0: close-up dinding kos tipis atau plafon rendah + teks 'workout jam 11 malam di kos tanpa bikin tetangga marah'. Langsung mulai gerakan pertama di detik 3."
            contoh_judul:
              - "Workout jam 11 malam di kos tanpa satu pun suara yang terdengar ke luar"
              - "Latihan ini zero impact — cocok untuk lantai atas apartemen"
              - "Kalau kamu takut berisik saat olahraga di kamar, ini solusinya"
              - "Home workout untuk kamar kos 3x3 meter tanpa alat dan tanpa kebisingan"
              - "Tetangga kos tidak akan tahu kamu baru selesai workout — latihan silent ini caranya"
            content_runway: "Setiap kelompok otot bisa mendapat versi 'silent workout'-nya sendiri; variasi durasi, level kesulitan, dan tujuan (kekuatan, fleksibilitas, kardio low-impact) menghasilkan variasi konten yang luas."

        - slug: home-workout-sambil-nonton
          name: Gerakan yang Bisa Dilakukan Sambil Nonton TV
          description: Latihan ringan yang bisa dilakukan di depan TV tanpa harus pause tontonan — squat di iklan, plank di intro, dsb — untuk yang sulit meluangkan waktu khusus olahraga.
          guide:
            audience: "Pekerja 25–40 yang pulang lelah dan hanya ingin nonton TV; orang yang merasa tidak punya waktu olahraga tapi menonton 2–3 jam sehari; pasangan atau keluarga yang nonton bersama dan bisa coba bersamaan."
            tone: "Ringan dan sedikit jenaka. Framing 'olahraga yang tidak terasa seperti olahraga' — tidak ada beban psikologis. Nada seperti tips sambil lewat dari teman."
            format: "30–45 detik. Format listicle visual — tampilkan 3–5 gerakan yang bisa dilakukan di depan TV dengan konteks kapan melakukannya (saat iklan, saat loading, saat intro). Caption singkat tiap gerakan."
            boleh:
              - "Hubungkan gerakan ke momen TV yang spesifik — 'saat iklan: 20 squat', 'saat intro series: plank'"
              - "Tampilkan suasana ruang nonton yang relatable — sofa, TV, remote"
              - "Gerakan yang bisa dilakukan sambil berdiri atau duduk di sofa — tidak harus di lantai"
              - "Gamification ringan — '2 jam nonton = ini total kalori yang terbakar'"
            hindari:
              - "Jangan tampilkan wajah — channel ini faceless"
              - "Jangan rekomendasikan gerakan yang membutuhkan konsentrasi penuh dan tidak bisa dilakukan sambil nonton"
              - "Jangan klaim kalori terbakar dengan angka spesifik tanpa menyebut variasi per berat badan"
              - "Jangan gunakan musik yang terlalu keras yang tidak cocok dengan nuansa nonton santai"
            pola_hook: "Detik 0: tampilkan remote TV dan sofa + teks 'kalau kamu nonton 2 jam sehari, ini cara bakar kalori tanpa sadar'. Langsung tampilkan gerakan pertama di detik 3."
            contoh_judul:
              - "Kalau kamu nonton 2 jam sehari ini cara bakar 200 kalori tanpa sadar"
              - "Gerakan yang bisa dilakukan sambil nonton Netflix dan tidak akan kamu rasa berat"
              - "Saat iklan muncul lakukan ini — kebiasaan kecil yang mengubah segalanya"
              - "Cara menjadikan waktu nonton TV sebagai waktu olahraga tanpa mengganggunya"
              - "5 gerakan yang aku lakukan di sofa setiap malam dan tetap terhitung aktif"
            content_runway: "Setiap genre tontonan (series panjang, film, olahraga, berita) bisa dapat 'workout pair'-nya masing-masing; ditambah variasi level kesulitan dan kelompok otot target, stok ide sangat luas."

    - slug: nutrition
      name: "Nutrisi / Diet"
      description: "Tips makan sehat, mitos diet."
      faceless: true
      difficulty: menengah
      rpm: tinggi
      formats: teks + b-roll food + voiceover
      example_hook: "Makanan yang kamu kira sehat ternyata..."
      guide:
        audience: "Pria dan wanita 20–40 yang ingin makan lebih sehat tapi bingung dengan informasi yang bertentangan; orang yang pernah diet dan gagal; penonton yang peduli kandungan makanan tapi tidak mau ribet."
        tone: "Informatif dan mengejutkan — bukan menghakimi makanan yang disukai penonton. Gaya 'ternyata tidak sesederhana yang dikira' yang membuat penonton ingin tahu lebih."
        format: "45–75 detik. Struktur: fakta/mitos mengejutkan di awal → penjelasan singkat berbasis sains atau ahli → implikasi praktis. B-roll makanan lokal Indonesia yang relatable. Caption wajib."
        boleh:
          - "Gunakan makanan Indonesia sebagai contoh — tidak ada 'kale' atau 'quinoa' kecuali relevan"
          - "Selalu sertakan sumber referensi di caption atau end card (penelitian, rekomendasi BPOM, dokter gizi)"
