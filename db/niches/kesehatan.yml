        - slug: mental-health-healing-tanpa-toxic-positivity
          name: Pemulihan Emosi Tanpa Toxic Positivity
          description: Konten yang memvalidasi perasaan negatif dan membedakannya dari toxic positivity, membantu penonton memproses emosi dengan cara yang lebih sehat.
          guide:
            audience: "Pria dan wanita 20–35 yang lelah diberitahu untuk 'bersyukur' saat sedang tidak baik; penonton yang sedang dalam proses healing tapi merasa sendirian; mereka yang pernah merasa perasaannya dikecilkan oleh orang sekitar."
            tone: "Jujur dan memvalidasi. Tidak ada optimisme paksa. Gaya 'perasaan ini valid dan kamu tidak harus merasa baik-baik saja sekarang'. Hangat tapi tidak sentimentil berlebihan."
            format: "60–90 detik. Lebih banyak voiceover reflektif dibanding demo teknik. B-roll tenang — jendela hujan, tangan di meja, cahaya sore. Pace lambat dan terasa aman."
            boleh:
              - "Jelaskan perbedaan antara validasi emosi vs larut dalam emosi negatif"
              - "Berikan framing alternatif yang realistis tapi tidak memaksakan positif"
              - "Normalisasikan bahwa proses healing tidak linear"
              - "Sertakan sumber daya kesehatan mental profesional di akhir"
            hindari:
              - "Jangan buat konten yang menstigmatisasi positive thinking secara keseluruhan — bedakan dengan toxic positivity"
              - "Jangan berikan saran yang terdengar seperti diagnosis atau rekomendasi medis"
              - "Jangan buat konten yang mendorong penonton untuk larut atau meratapi keadaan tanpa arah"
              - "Selalu ingatkan bahwa jika emosi yang berat berlangsung lama, bantuan profesional adalah langkah terbaik"
            pola_hook: "Detik 0: kutipan atau kalimat toxic positivity yang familiar ('yang penting bersyukur', 'masa gitu aja sedih') + teks 'dan kenapa kalimat ini justru tidak membantu'. Langsung masuk ke penjelasan di detik 3."
            contoh_judul:
              - "Berhenti dipaksa bersyukur saat kamu sedang tidak baik-baik saja — ini yang sebenarnya membantu"
              - "Toxic positivity itu bukan positif — ini bedanya dan kenapa itu penting"
              - "Perasaan sedih ini valid dan kamu tidak harus segera sembuh darinya"
              - "Kenapa kata 'yang penting happy' justru memperburuk keadaan orang yang sedang susah"
              - "Cara memvalidasi emosi diri sendiri tanpa harus pura-pura baik-baik saja"
            content_runway: "Setiap bentuk toxic positivity yang umum di konteks Indonesia (budaya bersyukur yang disalahgunakan, tekanan keluarga untuk terlihat baik, dll) bisa jadi video tersendiri dengan nuansa berbeda."

