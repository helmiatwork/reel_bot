            boleh:
              - "Batasi rekomendasi maksimal 3 produk — lebih dari itu penonton langsung kabur"
              - "Gunakan produk yang ada di Alfamart atau toko biasa, bukan toko skincare khusus"
              - "Tampilkan harga — pria cenderung lebih price-sensitive untuk kategori ini"
              - "Demo cara pakai yang simpel — tidak perlu tapping atau teknik rumit"
            hindari:
