              - "Jangan rekomendasikan lebih dari 3 produk untuk konten pemula"
              - "Jangan buat klaim perubahan dramatis tanpa timeline yang realistis"
              - "Selalu sertakan catatan untuk konsultasi dermatologis jika ada masalah kulit spesifik yang tidak membaik"
            pola_hook: "Detik 0: tampilkan produk sabun mandi biasa yang dipakai pria + teks 'pria ini gak pernah pakai skincare selama 30 tahun, ini perubahannya setelah 90 hari'. Langsung ke rutinitas di detik 3."
