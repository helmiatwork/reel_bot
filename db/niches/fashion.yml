            tone: "Jujur, analitis, tapi tetap positive. Bukan sekedar promosi — ini review nyata yang berikan perbandingan adil. Penonton harus merasa mendapat informasi untuk ambil keputusan pembelian yang lebih baik. Bangga lokal tapi tidak buta."
