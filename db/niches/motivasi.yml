        - slug: spiritual-ibadah-dan-produktivitas
          name: Hubungan Antara Ibadah dan Produktivitas Harian
          description: Konten yang menghubungkan praktik ibadah rutin dengan manfaat psikologis dan produktivitas yang nyata — bukan klaim supranatural — untuk penonton yang ingin keduanya seimbang.
          example_hook: "Ini yang terjadi di otak dan tubuh 30 menit setelah sholat subuh yang tidak banyak dibahas..."
          guide:
            audience: "Muslim Indonesia 20–35 yang ingin konsisten ibadah tapi juga bergumul dengan tuntutan produktivitas modern; mereka yang mencari jembatan antara nilai spiritual dan kehidupan profesional, bukan memilih salah satu."
            tone: "Berbasis fakta dan penuh rasa syukur. Bukan membuktikan agama dengan sains — tapi menunjukkan bahwa praktik ibadah memiliki efek psikologis dan fisik yang sudah diteliti. Nada kagum, bukan apologetik."
            format: "60–80 detik. Hook fakta psikologis atau neurologi yang mengejutkan tentang praktik ibadah → penjelasan mekanisme konkret (mindfulness, ritme sirkadian, community effect) → cara mengintegrasikan ibadah sebagai anchor produktivitas hari → penutup yang menyeimbangkan aspek spiritual dan praktis. Vertikal 9:16."
            boleh:
              - "Referensi riset psikologi atau neurosains secara ringan tanpa mengklaim 'sains membuktikan agama'"
              - "Frame ibadah sebagai sistem yang sudah ada jauh sebelum modern wellness menemukan hal yang sama"
              - "Berikan contoh praktis cara menjadikan sholat sebagai anchor time-blocking"
              - "Akui bahwa manfaat ibadah jauh lebih dalam dari sekadar produktivitas — tapi ini satu dimensinya"
            hindari:
              - "Jangan klaim supranatural atau mukjizat sebagai konten yang bisa diverifikasi"
              - "Jangan buat perbandingan yang merendahkan praktik ibadah dari keyakinan lain"
              - "Jangan frame ibadah semata-mata sebagai 'hack produktivitas' — itu mereduksi maknanya"
              - "Jangan buat klaim teologis spesifik yang bisa menimbulkan perdebatan mazhab"
            pola_hook: "Detik 0: fakta mengejutkan tentang efek biologis atau psikologis dari ibadah pagi + 'dan ini yang tidak banyak dibahas'. Penjelasan dimulai di detik 5."
            contoh_judul:
              - "Ini yang terjadi di otak 30 menit setelah sholat subuh yang hampir tidak pernah dibahas"
              - "Kenapa orang yang rajin ibadah rata-rata lebih tenang menghadapi tekanan"
              - "Sholat lima waktu sebagai sistem manajemen waktu yang lebih baik dari GTD"
              - "Hubungan antara istikamah ibadah dan ketahanan mental yang ditemukan peneliti"
              - "Cara menjadikan ibadah anchor hari yang mengubah seluruh struktur produktivitasmu"
            content_runway: "Setiap praktik ibadah (sholat, puasa, dzikir, sedekah, membaca Quran) memiliki dimensi psikologis dan fisiologis yang berbeda untuk dieksplorasi; ditambah konteks kehidupan modern yang terus berubah, topik ini tidak akan kehabisan sudut baru."

    - slug: stoicism
      name: "Filosofi / Stoik"
      description: "Filosofi hidup, stoikisme."
      faceless: true
      difficulty: menengah
      rpm: sedang
      formats: teks + sinematik + voiceover
      example_hook: "Marcus Aurelius bilang hal ini..."
      guide:
        audience: "Penonton 20–35 yang sudah melampaui motivasi klise dan mencari kerangka berpikir yang lebih kokoh; tertarik pada filsafat praktis yang bisa langsung diterapkan di keseharian tanpa harus kuliah filsafat."
        tone: "Tenang, reflektif, dan sedikit berat dalam artian yang baik. Seperti menemukan buku tua yang relevansinya mengejutkan. Tidak sedih, tidak dramatis — tapi terasa serius dan berbobot dibanding konten motivasi biasa."
        format: "50–90 detik. Kutipan tokoh Stoik sebagai hook → penjelasan konsep dalam bahasa hari ini → satu atau dua contoh penerapan konkret di kehidupan Indonesia → penutup yang mengundang refleksi. Teks kinetik + sinematik tenang + voiceover pelan. Vertikal 9:16."
        boleh:
          - "Kutip langsung dari sumber asli (Meditations, Letters to Lucilius, Enchiridion) dengan terjemahan natural"
          - "Terapkan konsep Stoik ke situasi spesifik Indonesia — bukan hanya konteks Barat"
          - "Akui bahwa Stoikisme bukan kesempurnaan — penerapannya bertahap dan tidak sempurna"
          - "Gunakan footage sinematik yang terasa abadi — arsitektur kuno, alam terbuka, waktu berlalu"
        hindari:
          - "Jangan jadikan Stoikisme sebagai alasan untuk menekan emosi alih-alih mengolahnya"
          - "Jangan frame Stoikisme sebagai superior dari filosofi atau tradisi lokal lain"
          - "Jangan oversimplifikasi konsep yang kompleks — lebih baik satu konsep dalam satu video"
          - "Jangan pakai musik yang terlalu dramatis atau epic — ketenangan adalah tone khasnya"
        pola_hook: "Detik 0: kutipan singkat tokoh Stoik (3–7 kata) dalam teks besar. Pause. Konteks siapa yang mengatakannya dan dalam kondisi apa di detik 4."
        contoh_judul:
          - "Marcus Aurelius menulis ini saat memimpin kerajaan yang hampir hancur"
          - "Filosofi ini ditemukan 2000 tahun lalu dan masih lebih relevan dari self-help modern"
          - "Satu prinsip Stoik yang mengubah cara aku merespons kritik dan kegagalan"
      micro:
        - slug: stoicism-kontrol-vs-tidak
          name: "Dikotomi Kontrol — Apa yang Benar-benar dalam Kuasamu"
          description: Penjelasan mendalam konsep dikotomi kontrol Stoik yang diterapkan pada situasi sehari-hari Indonesia — kemacetan, drama kantor, dan ketidakpastian karir.
          example_hook: "Marcus Aurelius hadapi wabah dan perang dengan prinsip ini yang bisa kamu pakai hari ini..."
          guide:
            audience: "Penonton 20–33 yang sering menghabiskan energi untuk hal yang tidak bisa mereka kontrol — pendapat orang, keputusan atasan, kemacetan, ekonomi; mencari cara berpikir yang membantu mereka fokus ke tempat yang tepat."
            tone: "Filosofis tapi sangat praktis. Konsep abstrak Stoik didaratkan ke situasi yang sangat konkret dan familiar. Penonton harus pergi dengan satu pertanyaan yang bisa langsung mereka terapkan hari ini."
            format: "60–80 detik. Hook dengan situasi stres yang sangat familiar → perkenalan konsep dikotomi kontrol dengan bahasa sederhana → dua kolom konkret (dalam kontrol / di luar kontrol) untuk situasi tersebut → cara menggeser fokus secara praktis → penutup reflektif. Vertikal 9:16."
            boleh:
              - "Gunakan situasi yang sangat Indonesia dan relatable (macet Jakarta, drama kantor, seleksi CPNS)"
              - "Tampilkan dua kolom visual 'yang bisa dikontrol' vs 'yang tidak bisa dikontrol' untuk kejelasan"
              - "Referensi Marcus Aurelius atau Epictetus dengan konteks kehidupan mereka yang berat"
              - "Akhiri dengan satu pertanyaan yang membantu penonton mengidentifikasi situasi mereka sendiri"
            hindari:
              - "Jangan frame dikotomi kontrol sebagai 'pasrah' atau 'tidak peduli' — itu salah kaprah berbahaya"
              - "Jangan abaikan bahwa beberapa hal di luar kontrol tetap layak diperjuangkan secara kolektif"
              - "Jangan oversimplifikasi situasi kompleks dengan 'itu di luar kontrolmu jadi lupakan'"
              - "Jangan gunakan contoh yang terasa terlalu Barat tanpa menyesuaikan konteks Indonesia"
            pola_hook: "Detik 0: kutipan Epictetus 'Beberapa hal dalam kontrol kita, beberapa tidak.' + pause + 'Ini prinsip yang dipakai Marcus Aurelius saat menghadapi wabah dan perang — dan bisa kamu pakai hari ini'."
            contoh_judul:
              - "Marcus Aurelius pegang prinsip ini saat wabah dan perang — kamu bisa pakai sekarang"
              - "Kenapa kamu capek bukan karena banyak pekerjaan tapi karena ini"
              - "Dua kolom yang mengubah cara aku merespons kemacetan dan drama kantor"
              - "Stoik ajarkan ini 2000 tahun lalu dan otak modernmu masih butuh belajar ini"
              - "Pertanyaan Epictetus ini bikin aku berhenti khawatir tentang hal yang tidak bisa aku ubah"
            content_runway: "Setiap area kehidupan — karir, hubungan, kesehatan, finansial, sosial media — memiliki dimensi dikotomi kontrol yang berbeda untuk dieksplorasi; ditambah konteks spesifik Indonesia yang sangat kaya, topik ini tidak akan habis."

        - slug: stoicism-memento-mori-produktif
          name: Ingat Kematian sebagai Motivasi Hidup
          description: Penjelasan konsep Memento Mori Stoik bukan sebagai pemikiran gelap tapi sebagai tools untuk menentukan prioritas dan menghentikan kekhawatiran atas hal yang tidak penting.
          example_hook: "Seneca menulis ini dari penjara, dan kalimatnya ini membuat semua keluhanku terasa kecil..."
          guide:
            audience: "Penonton 22–35 yang sering merasa tenggelam dalam kekhawatiran kecil sehari-hari; yang mengeluh hal remeh tapi lupa perspektif besar; atau yang terlalu lama menunda sesuatu yang penting karena sibuk dengan yang urgent."
            tone: "Serius tapi tidak depresif — justru sebaliknya, menyegarkan. Mengingat kematian dalam konteks Stoik bukan tentang kesedihan tapi tentang menemukan kembali apa yang benar-benar penting. Ada kesadaran dan kelegaan, bukan ketakutan."
            format: "60–80 detik. Hook dengan kutipan Seneca atau Marcus Aurelius tentang kefanaan → penjelasan Memento Mori bukan sebagai morbid tapi sebagai filter prioritas → dua atau tiga pertanyaan konkret yang bisa langsung dipakai → penutup tentang kebebasan yang datang dari menerima kefanaan. Vertikal 9:16."
            boleh:
              - "Referensi kondisi nyata Seneca saat menulis — diasingkan, dipenjara, diperintah bunuh diri — untuk konteks"
              - "Gunakan 'the last time' experiment sebagai tools konkret yang bisa langsung dicoba"
              - "Hubungkan dengan perspektif lokal Indonesia tentang kematian yang lebih terbuka dari budaya Barat"
              - "Frame sebagai pembebasan dari kecemasan trivial, bukan sebagai beban baru"
            hindari:
              - "Jangan frame Memento Mori dengan cara yang bisa memicu anxiety atau pikiran gelap berlebihan"
              - "Jangan abaikan bahwa sebagian penonton mungkin baru kehilangan orang dekat — nada harus sensitif"
              - "Jangan jadikan ini alasan untuk nihilisme atau 'tidak ada yang penting jadi kenapa berusaha'"
              - "Jangan pakai visual yang terlalu gelap atau simbol kematian yang eksplisit"
            pola_hook: "Detik 0: kutipan Seneca pendek + 'dia menulis ini dari penjara menunggu eksekusi.' Pause. 'Dan kalimat ini membuat semua keluhanku hari ini terasa sangat kecil'."
            contoh_judul:
              - "Seneca menulis ini dari penjara sambil menunggu kematian — baca kalimat ini"
              - "Ingat kematian bukan tentang kesedihan — ini cara Stoik menemukannya membebaskan"
              - "Satu pertanyaan ini setiap pagi mengubah apa yang aku anggap penting hari ini"
              - "Kenapa orang yang paling produktif sering berpikir tentang kematian lebih dari kita"
              - "Memento Mori bukan filosofi gelap — ini filter paling jujur untuk prioritas hidupmu"
            content_runway: "Konsep Memento Mori bisa diterapkan ke berbagai konteks kehidupan modern Indonesia — kekhawatiran karir, perselisihan hubungan, ketakutan pendapat orang — setiap konteks menghasilkan video dengan sudut pandang baru."

        - slug: stoicism-amor-fati-indonesia
          name: "Amor Fati — Cintai Apa yang Terjadi"
          description: Penerapan konsep Amor Fati Nietzsche dan Stoik dalam konteks kehidupan Indonesia — gagal CPNS, ditolak kerja, dan rencana yang berantakan — membalik perspektif tentang kegagalan.
          example_hook: "Filosofi ini mengajarkan untuk tidak sekadar menerima hal buruk, tapi mencintainya, dan ini kenapa..."
          guide:
            audience: "Penonton 20–33 yang sedang menghadapi kegagalan atau hasil yang berlawanan dengan rencana; yang lelah dengan mental 'terima saja' tapi belum menemukan cara yang lebih aktif dan sehat untuk menghadapi kenyataan buruk."
            tone: "Provocatif tapi hangat. Konsep 'mencintai kegagalan' terdengar aneh dan perlu dijelaskan dengan hati-hati. Bukan toxic positivity — tapi cara aktif untuk mengubah relasi dengan hal-hal yang tidak bisa diubah."
            format: "65–85 detik. Hook paradoks ('mencintai kegagalan, bukan hanya menerimanya') → penjelasan perbedaan antara acceptance pasif dan amor fati aktif → satu atau dua contoh konkret di konteks Indonesia → cara mulai mempraktikkannya hari ini. Vertikal 9:16."
            boleh:
              - "Jelaskan perbedaan krusial antara 'pasrah' dan 'amor fati' — ini yang membuat konsep ini bukan kelemahan"
              - "Gunakan contoh sangat spesifik Indonesia (gagal CPNS, kena PHK, ditolak investor) untuk relevansi"
              - "Referensi cara atlet atau tokoh nyata menggunakan amor fati bukan sebagai teori tapi praktik"
              - "Akui bahwa ini butuh latihan dan tidak instan — kejujuran membangun kepercayaan"
            hindari:
              - "Jangan frame sebagai 'semua yang terjadi pasti bagus' — itu toxic positivity, bukan Stoikisme"
              - "Jangan abaikan bahwa beberapa kegagalan memang membutuhkan waktu berduka"
              - "Jangan gunakan terminologi akademik tanpa penjelasan — 'amor fati' harus dijelaskan, tidak diasumsikan"
              - "Jangan buat ini terasa seperti alasan untuk tidak berusaha mengubah keadaan"
            pola_hook: "Detik 0: 'Bukan sekadar menerima hal yang buruk...' + pause + '...tapi mencintainya. Dan ini kenapa itu bukan kelemahan.' Langsung ke penjelasan di detik 8."
            contoh_judul:
              - "Bukan sekadar terima gagal — amor fati mengajarkan untuk mencintainya dan ini kenapa"
              - "Gagal CPNS, ditolak kerja, rencana berantakan — cara Nietzsche memandang ini berbeda"
              - "Filosofi yang membuat atlet terbaik dunia tidak takut kalah lagi"
              - "Perbedaan antara pasrah dan amor fati yang mengubah segalanya"
              - "Cara aktif mengubah relasi dengan hal buruk yang tidak bisa kamu ubah"
            content_runway: "Amor Fati bisa diterapkan ke hampir semua jenis kegagalan atau situasi tidak terduga yang relevan di Indonesia — karir, pendidikan, hubungan, finansial, kesehatan — setiap konteks menghasilkan video baru dengan nuansa berbeda."
