# ═══════════════════════════════════════════════════════════════
# Nginx reverse proxy config for general-creation.xyz
#
# Routes:
#   general-creation.xyz/           → analytics dashboard
#   general-creation.xyz/api/*      → pipeline-api (port 8000)
#   general-creation.xyz/n8n/*      → n8n (port 5678)
#   general-creation.xyz/arcreel/*  → ArcReel (port 1241)
#   general-creation.xyz/openclaw/* → OpenClaw (port 18789)
#
# SSL via Certbot (Let's Encrypt) — run after setup
# ═══════════════════════════════════════════════════════════════

server {
    listen 80;
    server_name general-creation.xyz www.general-creation.xyz;

    # Redirect HTTP → HTTPS (uncomment after certbot setup)
    # return 301 https://$host$request_uri;

    # ── Analytics Dashboard ─────────────────────────────
    location / {
        root /var/www/content-automation;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── Pipeline API ────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
        client_max_body_size 500m;
    }

    # ── n8n ─────────────────────────────────────────────
    location /n8n/ {
        proxy_pass         http://127.0.0.1:5678/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }

    # ── ArcReel ─────────────────────────────────────────
    location /arcreel/ {
        proxy_pass         http://127.0.0.1:1241/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 300;
        client_max_body_size 500m;
    }

    # ── OpenClaw ────────────────────────────────────────
    location /openclaw/ {
        proxy_pass         http://127.0.0.1:18789/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_read_timeout 300;
    }
}

