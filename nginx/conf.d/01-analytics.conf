# ── analytics.general-creation.xyz ───────────────────────────
# Serves the analytics dashboard (static HTML)
# + proxies /api/* to pipeline-api for live data
server {
    listen 443 ssl;
    server_name analytics.general-creation.xyz;

    ssl_certificate     /etc/letsencrypt/live/general-creation.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/general-creation.xyz/privkey.pem;
    include             /etc/nginx/conf.d/ssl-params.conf;

    # ── Static dashboard ──────────────────────────────
    root  /var/www/analytics;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Live data from pipeline-api ───────────────────
    # Dashboard JS calls /api/* → proxied to pipeline-api
    location /api/ {
        proxy_pass         http://pipeline-api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 60s;

        # Allow dashboard JS to call this
        add_header Access-Control-Allow-Origin "https://analytics.general-creation.xyz";
    }
}
