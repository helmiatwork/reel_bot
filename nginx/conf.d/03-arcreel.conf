# ── arcreel.general-creation.xyz ─────────────────────────────
# ArcReel video workspace — needs large upload support + WebSocket
server {
    listen 443 ssl;
    server_name arcreel.general-creation.xyz;

    ssl_certificate     /etc/letsencrypt/live/general-creation.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/general-creation.xyz/privkey.pem;
    include             /etc/nginx/conf.d/ssl-params.conf;

    # Video uploads can be large
    client_max_body_size 2g;

    location / {
        proxy_pass         http://arcreel:1241;
        proxy_http_version 1.1;

        # WebSocket for real-time project updates
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
