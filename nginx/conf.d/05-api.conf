# ── api.general-creation.xyz ─────────────────────────────────
# Pipeline REST API — voiceover, quality check, publish, analytics
server {
    listen 443 ssl;
    server_name api.general-creation.xyz;

    ssl_certificate     /etc/letsencrypt/live/general-creation.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/general-creation.xyz/privkey.pem;
    include             /etc/nginx/conf.d/ssl-params.conf;

    # Video file uploads
    client_max_body_size 2g;

    # HTTP Basic Auth — protects pipeline API endpoints
    auth_basic "Reelbot API";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://pipeline-api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        limit_req zone=api burst=20 nodelay;
    }
}
