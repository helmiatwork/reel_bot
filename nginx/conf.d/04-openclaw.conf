# ── openclaw.general-creation.xyz ────────────────────────────
server {
    listen 443 ssl;
    server_name openclaw.general-creation.xyz;

    ssl_certificate     /etc/letsencrypt/live/general-creation.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/general-creation.xyz/privkey.pem;
    include             /etc/nginx/conf.d/ssl-params.conf;

    # HTTP Basic Auth — protects OpenClaw agent UI
    auth_basic "Reelbot OpenClaw";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass         http://openclaw:18789;
        proxy_http_version 1.1;

        # WebSocket for real-time agent communication
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_read_timeout 300s;
    }
}
