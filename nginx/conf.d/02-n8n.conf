# ── n8n.general-creation.xyz ──────────────────────────────────
# n8n requires WebSocket support for its editor
server {
    listen 443 ssl;
    server_name n8n.general-creation.xyz;

    ssl_certificate     /etc/letsencrypt/live/general-creation.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/general-creation.xyz/privkey.pem;
    include             /etc/nginx/conf.d/ssl-params.conf;

    # Increase for large workflow imports
    client_max_body_size 16m;

    location / {
        proxy_pass         http://n8n:5678;
        proxy_http_version 1.1;

        # WebSocket headers (required for n8n editor)
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
