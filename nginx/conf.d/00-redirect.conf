# ── HTTP → HTTPS redirect for all subdomains ──────────────────
server {
    listen 80;
    server_name
        general-creation.xyz
        www.general-creation.xyz
        analytics.general-creation.xyz
        arcreel.general-creation.xyz
        openclaw.general-creation.xyz
        api.general-creation.xyz;

    # Let's Encrypt ACME challenge (certbot needs this)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
