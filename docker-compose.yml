# ═══════════════════════════════════════════════════════════════════
# CONTENT AUTOMATION STACK — docker-compose.yml
#
# Subdomains (configure DNS A records → your VPS IP):
#   analytics.general-creation.xyz  → analytics dashboard
#   arcreel.general-creation.xyz     → ArcReel video workspace
#   openclaw.general-creation.xyz    → OpenClaw agent UI
#   api.general-creation.xyz         → pipeline REST API
#
# Internal ports (not exposed publicly — Nginx proxies them):
#   cliproxy   :8317    AI proxy
#   openclaw   :18789   AI agent
#   arcreel    :1241    video gen
#   pipeline-api :8000  REST API
#
# Quick start:
#   cp .env.example .env && nano .env
#   docker compose build
#   docker compose up -d
# ═══════════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # NGINX — reverse proxy + subdomain routing + SSL termination
  # Handles all public traffic and routes to internal services
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./analytics-dashboard:/var/www/analytics:ro
      - ./certs:/etc/letsencrypt:ro
      - ./webroot:/var/www/certbot:ro
    depends_on:
      arcreel:
        condition: service_healthy
      openclaw:
        condition: service_healthy
      pipeline-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - stack-network

  # ─────────────────────────────────────────────────────────────
  # CERTBOT — auto SSL certificate management
  # Runs once on start then sleeps, renews every 12 hours
  # ─────────────────────────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: certbot
    volumes:
      - ./certs:/etc/letsencrypt
      - ./webroot:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do
               certbot renew --webroot -w /var/www/certbot --quiet;
               sleep 12h & wait $${!};
             done"
    restart: unless-stopped

  # ─────────────────────────────────────────────────────────────
  # SHARED POSTGRESQL
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_MULTIPLE_DATABASES: arcreel
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    mem_limit: 256m
    cpus: "0.4"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stack-network

  # ─────────────────────────────────────────────────────────────
  # CLIPROXY — CLIProxyAPI → Sumopod (internal only)
  # ─────────────────────────────────────────────────────────────
  cliproxy:
    build:
      context: ./cliproxy
      dockerfile: Dockerfile
    image: content-stack/cliproxy:latest
    container_name: cliproxy
    expose:
      - "8317"              # internal only — not mapped to host
    mem_limit: 256m
    cpus: "0.3"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8317"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    networks:
      - stack-network

  # ─────────────────────────────────────────────────────────────
  # OPENCLAW — AI agent + Telegram
  # Accessible at openclaw.general-creation.xyz
  # ─────────────────────────────────────────────────────────────
  openclaw:
    build:
      context: ./openclaw
      dockerfile: Dockerfile
    image: content-stack/openclaw:latest
    container_name: openclaw
    expose:
      - "18789"
    volumes:
      - openclaw_data:/root/.openclaw
      - shared_videos:/videos
      - ./openclaw/agents:/root/.openclaw/agents
      - ./openclaw/cron:/root/.openclaw/cron
      - shared_output:/output
    environment:
      - OPENCLAW_GATEWAY_PORT=18789
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - CLIPROXY_URL=http://cliproxy:8317/v1
      - CLIPROXY_KEY=${CLIPROXY_KEY:-local-proxy-key}
      - PIPELINE_API_URL=http://pipeline-api:8000
    mem_limit: 512m
    cpus: "0.5"
    depends_on:
      cliproxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    networks:
      - stack-network

  # ─────────────────────────────────────────────────────────────
  # ARCREEL — AI video generation workspace
  # Accessible at arcreel.general-creation.xyz
  # ─────────────────────────────────────────────────────────────
  arcreel:
    image: ghcr.io/arcreel/arcreel:latest
    container_name: arcreel
    expose:
      - "1241"
    environment:
      - DATABASE_URL=postgresql://admin:${POSTGRES_PASSWORD}@postgres:5432/arcreel
      - AUTH_SECRET_KEY=${ARCREEL_PASSWORD:-admin}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - GROK_API_KEY=${GROK_API_KEY:-}
      - CUSTOM_OPENAI_BASE_URL=http://cliproxy:8317/v1
      - CUSTOM_OPENAI_KEY=${CLIPROXY_KEY:-local-proxy-key}
      - CUSTOM_OPENAI_MODEL=gemini/gemini-2.5-flash
    volumes:
      - arcreel_data:/app/data
      - arcreel_projects:/app/projects
      - shared_output:/app/exports
    mem_limit: 512m
    cpus: "0.5"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1241"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    networks:
      - stack-network

  # ─────────────────────────────────────────────────────────────
  # PIPELINE API — voiceover + quality check + publish + analytics
  # Accessible at api.general-creation.xyz
  # ─────────────────────────────────────────────────────────────
  pipeline-api:
    build:
      context: .
      dockerfile: pipeline-api/Dockerfile
    image: content-stack/pipeline-api:latest
    container_name: pipeline-api
    expose:
      - "8000"
    volumes:
      - shared_videos:/videos
      - shared_output:/output
      - ./credentials:/app/credentials:ro
    environment:
      - CLIPROXY_URL=http://cliproxy:8317/v1
      - CLIPROXY_KEY=${CLIPROXY_KEY:-local-proxy-key}
      - ARCREEL_URL=http://arcreel:1241
      - ARCREEL_TOKEN=${ARCREEL_TOKEN:-}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
      - TIKTOK_ACCESS_TOKEN=${TIKTOK_ACCESS_TOKEN:-}
      - IG_USER_ID=${IG_USER_ID:-}
      - IG_ACCESS_TOKEN=${IG_ACCESS_TOKEN:-}
      - YOUTUBE_CREDENTIALS=/app/credentials/client_secrets.json
      - STORAGE_TYPE=${STORAGE_TYPE:-supabase}
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_KEY=${SUPABASE_KEY:-}
      - SUPABASE_BUCKET=${SUPABASE_BUCKET:-videos}
      - S3_ENDPOINT=${S3_ENDPOINT:-}
      - S3_KEY=${S3_KEY:-}
      - S3_SECRET=${S3_SECRET:-}
      - S3_BUCKET=${S3_BUCKET:-content-videos}
      - VPS_HOST=${DOMAIN:-general-creation.xyz}
      - ANALYTICS_DB=/output/analytics.json
    mem_limit: 512m
    cpus: "0.5"
    depends_on:
      cliproxy:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - stack-network

  # ─────────────────────────────────────────────────────────────
  # ON-DEMAND TOOLS (--profile tools)
  # ─────────────────────────────────────────────────────────────
  video-analyzer:
    build:
      context: ./video-analyzer
      dockerfile: Dockerfile
    image: content-stack/video-analyzer:latest
    container_name: video-analyzer
    volumes:
      - shared_videos:/videos
      - shared_output:/output
    environment:
      - CLIPROXY_URL=http://cliproxy:8317/v1
      - CLIPROXY_KEY=${CLIPROXY_KEY:-local-proxy-key}
      - MODEL=gemini/gemini-2.5-flash-lite
      - WHISPER_MODEL=base
    mem_limit: 1g
    cpus: "1.5"
    profiles: [tools]
    depends_on: [cliproxy]
    networks:
      - stack-network

  video-splitter:
    build:
      context: ./video-splitter
      dockerfile: Dockerfile
    image: content-stack/video-splitter:latest
    container_name: video-splitter
    volumes:
      - shared_videos:/videos
    mem_limit: 512m
    cpus: "1.0"
    profiles: [tools]
    networks:
      - stack-network

  yt-pipeline:
    build:
      context: ./yt-pipeline
      dockerfile: Dockerfile
    image: content-stack/yt-pipeline:latest
    container_name: yt-pipeline
    volumes:
      - shared_videos:/videos
      - shared_output:/output
    environment:
      - CLIPROXY_URL=http://cliproxy:8317/v1
      - CLIPROXY_KEY=${CLIPROXY_KEY:-local-proxy-key}
      - PEXELS_API_KEY=${PEXELS_API_KEY:-}
      - FREESOUND_API_KEY=${FREESOUND_API_KEY:-}
    mem_limit: 1.5g
    cpus: "1.5"
    profiles: [tools]
    depends_on: [cliproxy]
    networks:
      - stack-network

# ═══════════════════════════════════════════════════════════════
volumes:
  postgres_data:     { name: content-stack-postgres }
  openclaw_data:     { name: content-stack-openclaw }
  arcreel_data:      { name: content-stack-arcreel }
  arcreel_projects:  { name: content-stack-arcreel-projects }
  shared_videos:     { name: content-stack-videos }
  shared_output:     { name: content-stack-output }

networks:
  stack-network:
    driver: bridge
    name: content-stack-network
