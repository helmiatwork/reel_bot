# Configuration for recurring jobs in Solid Queue
# Read more at https://github.com/rails/solid_queue

production:
  fetch_analytics_job:
    class: FetchAnalyticsJob
    schedule: every hour
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

development:
  fetch_analytics_job:
    class: FetchAnalyticsJob
    schedule: every hour
